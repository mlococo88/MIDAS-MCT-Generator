                    <div style={{fontSize:'10px',fontFamily:'monospace',color:'#7e22ce',fontWeight:'600',marginBottom:'6px'}}>
                      💜 FATIGUE Cat.{fatCat} — N{govAsdFat.node} @ {govAsdFat.pos.toFixed(2)} ft
                    </div>
                    <div style={{display:'flex',gap:'14px',alignItems:'baseline'}}>
                      <div><div style={{fontSize:'9px',color:'#6b7280',fontFamily:'monospace'}}>RF Fatigue</div>
                        <div style={{fontSize:'26px',fontWeight:'800',color:rfColor(govAsdFat.rfFat),fontFamily:'monospace'}}>{rfFmt(govAsdFat.rfFat)}</div></div>
                      <div style={{fontSize:'9px',fontFamily:'monospace',color:'#374151',lineHeight:'1.8'}}>
                        SFT={SFT} ksi<br/>
                        Sx_net={govAsdFat.sec?.SxBotN.toFixed(1)} in³<br/>
                        AREMA §1.7
                      </div>
                    </div>
                    <div style={{marginTop:'5px',fontSize:'9px',fontFamily:'monospace',fontWeight:'600',color:govAsdFat.rfFat>=1?'#7e22ce':'#dc2626'}}>
                      {govAsdFat.rfFat>=1?'✅ PASS':'❌ STRESS RANGE EXCEEDED'}
                    </div>
                    {govAsdFat.fatAlphaFlag&&(
                      <div style={{marginTop:'4px',fontSize:'8.5px',fontFamily:'monospace',color:'#b45309',fontWeight:'600'}}>
                        ⚠ α applied but SR_no_α = {govAsdFat.SR_no_alpha?.toFixed(2)} ksi &gt; 12 ksi — verify α condition
                      </div>
                    )}
                    {(()=>{
                      const _cx=aremaCalcX!==''&&aremaCalcX!=null?parseFloat(aremaCalcX):null;
                      if(_cx==null||!aremaAsdData.length) return null;
                      const _d=aremaAsdData;
                      let li=_d.length-1;
                      for(let i=0;i<_d.length;i++){if(_d[i].pos>_cx){li=i-1;break;}}
                      li=Math.max(0,Math.min(li,_d.length-2));
                      const L=_d[li],R=_d[li+1]||_d[li];
                      const t=R.pos===L.pos?0:(_cx-L.pos)/(R.pos-L.pos);
                      const lp=(a,b)=>(a==null||b==null)?(a??b):a+t*(b-a);
                      const near=Math.abs(L.pos-_cx)<Math.abs(R.pos-_cx)?L:R;
                      const rf='rfFat';
                      const rfv=Math.abs(L.pos-_cx)<0.1?L[rf]:Math.abs(R.pos-_cx)<0.1?R[rf]:lp(L[rf],R[rf]);
                      if(rfv==null) return null;
                      return (
                        <div style={{marginTop:'8px',paddingTop:'8px',borderTop:'1px dashed #f59e0b',
                          display:'flex',alignItems:'center',gap:'8px'}}>
                          <span style={{fontSize:'9px',fontFamily:'monospace',color:'#b45309',fontWeight:'600'}}>
                            📍 @ {_cx.toFixed(2)} ft:
                          </span>
                          <span style={{fontSize:'18px',fontWeight:'800',fontFamily:'monospace',
                            color:rfv>=1?'#7e22ce':'#dc2626'}}>{rfv.toFixed(3)}</span>
                          <span style={{fontSize:'8px',fontFamily:'monospace',fontWeight:'700',
                            color:rfv>=1?'#7e22ce':'#dc2626'}}>{rfv>=1?'PASS':'FAIL'}</span>
                        </div>
                      );
                    })()}
                    <div style={{marginTop:'4px',fontSize:'8px',fontFamily:'monospace',color:'#9ca3af'}}>
                      α={+(R2.arema_fatAlpha??0.85).toFixed(2)} · β={+(R2.arema_fatBeta??0.15).toFixed(2)} · I_fat={(1+(+(R2.arema_fatBeta??0.15))*(iBase+I_rock)).toFixed(4)}
                    </div>
                  </div>
                  )}
                </div>
                )}
                {/* ═══ BREAKDOWN OF BRIDGE RATING – STRESS ═══════════════════════════════ */}
                {aremaMultiData.length>0&&(()=>{
                  const {n_gird,S_gird} = _aremaParams;
                  const totalLen = (cfg?.spans||[]).reduce((a,b)=>a+b,0);
                  // Use AREMA span (most accurate) → geometry spans → max node position
                  const maxNodePos = aremaAsdData.length ? Math.max(...aremaAsdData.map(d=>d.pos)) : 0;
                  const aSpan = _aremaParams?.span || totalLen || maxNodePos;
                  const midPos = aSpan / 2;
                  const flt = v=>v!=null&&isFinite(v)&&v>-9999;
                  const f1 = v=>flt(v)?v.toFixed(1):'—';

                  // Interpolate allNodeRes at any position x
                  const interpVeh = (allNodeRes, x) => {
                    if (!allNodeRes?.length) return null;
                    const srt = [...allNodeRes].sort((a,b)=>a.pos-b.pos);
                    const ex  = srt.find(r=>Math.abs(r.pos-x)<0.005);
                    if (ex) return ex;
                    const lo  = [...srt].reverse().find(r=>r.pos<=x);
                    const hi  = srt.find(r=>r.pos>=x);
                    if (!lo) return hi; if (!hi) return lo;
                    const t   = (x-lo.pos)/(hi.pos-lo.pos);
                    const lp  = (a,b)=>a!=null&&b!=null?a+t*(b-a):(a??b);
                    return {pos:x,
                      rfcN:lp(lo.rfcN,hi.rfcN), rftN:lp(lo.rftN,hi.rftN), rfvN:lp(lo.rfvN,hi.rfvN),
                      rfcX:lp(lo.rfcX,hi.rfcX), rftX:lp(lo.rftX,hi.rftX), rfvX:lp(lo.rfvX,hi.rfvX),
                      rfcM:lp(lo.rfcM,hi.rfcM), rftM:lp(lo.rftM,hi.rftM), rfvM:lp(lo.rfvM,hi.rfvM),
                      rfFat:lp(lo.rfFat,hi.rfFat)};
                  };

                  // Auto-generate summary locations from section zones + defaults
                  const zoneBounds = [];
                  const zSrc = [...(cfg?.aremaSection?.sectionZones||[]), ...(cfg?.sectionZones||[])];
                  const seen = new Set();
                  zSrc.forEach(z=>{
                    [+(z.startX||0),+(z.endX||0)].forEach(x=>{
                      const k=x.toFixed(3);
                      if(x>0.01&&x<totalLen-0.01&&!seen.has(k)){seen.add(k);zoneBounds.push(x);}
                    });
                  });
                  zoneBounds.sort((a,b)=>a-b);

                  // Locations: support (shear), midspan, each zone boundary
                  // Each zone boundary shows as BOTH flexure and shear
                  const summaryLocs = (()=>{
                    const base = cfg?.rating?.arema_summary_locs?.length
                      ? [...cfg.rating.arema_summary_locs]
                      : [
                          {id:'sup', label:'SHEAR AT SUPPORT', pos:0,      mechs:['SHEAR']},
                          ...zoneBounds.map((x,i)=>({
                            id:'z'+i, label:`COVER PL. ${i+1}`, pos:x,
                            mechs:['FLEXURE'],
                          })),
                        ];
                    // Always include midspan — use AREMA span for accuracy
                    const hasMid = midPos>0.5 && base.some(l=>Math.abs(l.pos-midPos)<0.5);
                    if (midPos>0.5 && !hasMid) {
                      base.push({id:'mid', label:`0.5L (MIDSPAN @ ${midPos.toFixed(2)} ft)`,
                                 pos:midPos, mechs:['FLEXURE']});
                      base.sort((a,b)=>a.pos-b.pos);
                    }
                    return base;
                  })();

                  // Vehicles: exclude longitudinal (refSpan defined — used only for long. load component)
                  const isLong = v => ALL_VEHICLES.find(av=>av.name===v.name)?.refSpan !== undefined;
                  const vehicles = aremaMultiData.filter(v => !isLong(v));
                  const isE80 = v=>/E[-_]?80/i.test(v.name)&&!/long/i.test(v.name);
                  const nG = n_gird||2;
                  const girderLabel = `GIRDER NOS. 1-${nG}`;

                  // Build all rows: one row per location×mech
                  const allRows = summaryLocs.flatMap(loc=>{
                    return (loc.mechs||['FLEXURE']).map(mech=>{
                      const isShear = mech==='SHEAR';
                      // Component description
                      const posLabel = loc.id==='sup'
                        ? `@ SHEAR AT SUPPORT`
                        : `@ ${loc.pos.toFixed(2)}ft (${loc.label})`;
                      const desc = `${girderLabel} ${posLabel} (${mech})`;
                      // Per-vehicle values
                      const vals = vehicles.map(veh=>{
                        const r = interpVeh(veh.allNodeRes, loc.pos);
                        if (!r) return {rfN:null,rfX:null,rfM:null,rfFat:null,gvwKips:veh.gvwKips,e80:isE80(veh)};
                        const rfFlexN=Math.min(...[r.rfcN,r.rftN].filter(flt));
                        const rfFlexX=Math.min(...[r.rfcX,r.rftX].filter(flt));
                        const rfFlexM=Math.min(...[r.rfcM,r.rftM].filter(flt));
                        return {
                          gvwKips:veh.gvwKips, e80:isE80(veh), name:veh.name,
                          rfN: isShear?r.rfvN:rfFlexN,
                          rfX: isShear?r.rfvX:rfFlexX,
                          rfM: isShear?r.rfvM:rfFlexM,
                          rfFat: isShear?null:r.rfFat,  // fatigue is moment-based only
                        };
                      });
                      return {desc, mech, pos:loc.pos, vals};
                    });
                  });

                  // Format a single cell value: E-80 → "E-{RF×80}", others → "{RF×GVW} kips"
                  const fmtVal = (rf, gvwKips, e80) => {
                    if (!flt(rf)) return '—';
                    if (e80) return `E-${(rf*80).toFixed(1)}`;
                    return (rf*gvwKips).toFixed(1);
                  };

                  const mkSummaryTable = (title, bg, rfKey, defaultOpen=true) => {
                    const flt2 = v=>v!=null&&isFinite(v)&&v>-999;

                    // Find controlling row = row with the lowest RF across all vehicles
                    const rowMinRFs = allRows.map(row=>{
                      const rfs = row.vals.map(v=>v[rfKey]).filter(flt2);
                      return rfs.length ? Math.min(...rfs) : Infinity;
                    });
                    const overallMinRF = Math.min(...rowMinRFs.filter(v=>v<Infinity));
                    const ctrlIdx = rowMinRFs.indexOf(overallMinRF);

                    return (
                    <details open={defaultOpen} style={{marginBottom:'10px',border:'1px solid #e5e7eb',borderRadius:'6px',overflow:'hidden'}}>
                      <summary style={{
                        fontWeight:'600',fontSize:'11px',fontFamily:'monospace',
                        color:'#374151',padding:'7px 12px',background:bg||'#f3f4f6',
                        cursor:'pointer',userSelect:'none',listStyle:'none',
                        display:'flex',alignItems:'center',gap:'8px',
                      }}>
                        <span style={{fontSize:'10px',color:'#6b7280'}}>▼</span>
                        {title}
                        {ctrlIdx>=0&&overallMinRF<Infinity&&(
                          <span style={{marginLeft:'auto',fontSize:'9px',fontWeight:'500',
                            color:overallMinRF<1?'#713f12':'#14532d',
                            background:overallMinRF<1?'#fef08a':'#86efac',
                            padding:'1px 6px',borderRadius:'3px'}}>
                            Governing: {allRows[ctrlIdx]?.desc?.split('(')[0]?.trim() || '—'}
                            {' '}({overallMinRF<1?'E-':'E-'}{(overallMinRF*80).toFixed(1)} for E-80)
                          </span>
                        )}
                      </summary>
                      <div style={{overflowX:'auto'}}>
                      <table style={{borderCollapse:'collapse',width:'100%',minWidth:'600px',
                        fontSize:'9.5px',fontFamily:'monospace'}}>
                        <thead>
                          <tr style={{background:'#f9fafb'}}>
                            <th style={{border:'1px solid #9ca3af',padding:'5px 8px',
                              textAlign:'left',fontWeight:'600',minWidth:'220px'}}>
                              BRIDGE COMPONENT
                            </th>
                            {vehicles.map(v=>(
                              <th key={v.name} style={{border:'1px solid #9ca3af',
                                padding:'5px 6px',textAlign:'center',fontWeight:'600',minWidth:'80px',
                                background:isE80(v)?'#fffbeb':undefined}}>
                                {isE80(v)
                                  ? <><div>AREMA Cooper</div><div>E-80</div></>
                                  : <><div style={{fontSize:'8.5px'}}>{v.label}</div>
                                     <div style={{fontSize:'8px',color:'#6b7280'}}>({(v.gvwKips||0).toLocaleString()} kips)</div></>
                                }
                              </th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {allRows.map((row,ri)=>{
                            const isCtrl = ri === ctrlIdx;
                            return (
                              <tr key={ri} style={{background:ri%2===0?'#fff':'#fafafa'}}>
                                <td style={{border:'1px solid #d1d5db',padding:'4px 8px',
                                  fontWeight: isCtrl?'700':'500',
                                  color: isCtrl?'#111827':'#374151',
                                  fontSize:'9px',
                                  background: isCtrl?'#f8faff':undefined}}>
                                  {isCtrl && <span style={{marginRight:'4px',color:'#6366f1'}}>▶</span>}
                                  {row.desc}
                                </td>
                                {row.vals.map((v,vi)=>{
                                  const rf = v[rfKey];
                                  const display = fmtVal(rf, v.gvwKips, v.e80);
                                  const hasVal  = flt2(rf);
                                  const fail    = hasVal && rf < 1.0;
                                  const cellBg = isCtrl
                                    ? (fail ? '#fef08a' : '#86efac')
                                    : (v.e80 ? '#fffbeb' : undefined);
                                  const cellColor = isCtrl
                                    ? (fail ? '#713f12' : '#14532d')
                                    : (fail ? '#b45309' : '#111827');
                                  return (
                                    <td key={vi} style={{
                                      border:'1px solid #d1d5db',padding:'4px 6px',
                                      textAlign:'center',background:cellBg,
                                      color:cellColor,fontWeight:(isCtrl||fail)?'700':'600',
                                    }}>
                                      {display}
                                    </td>
                                  );
                                })}
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                      </div>
                      <div style={{display:'flex',gap:'14px',alignItems:'center',flexWrap:'wrap',
                        fontSize:'8px',fontFamily:'monospace',color:'#6b7280',
                        padding:'4px 8px',background:'#fafafa',borderTop:'1px solid #e5e7eb'}}>
                        <span><span style={{display:'inline-block',width:'9px',height:'9px',
                          background:'#86efac',border:'1px solid #aaa',marginRight:'3px'}}/>Controlling · RF ≥ 1.0</span>
                        <span><span style={{display:'inline-block',width:'9px',height:'9px',
                          background:'#fef08a',border:'1px solid #aaa',marginRight:'3px'}}/>Controlling · RF &lt; 1.0</span>
                        <span style={{color:'#b45309',fontWeight:'700'}}>Amber = non-controlling RF &lt; 1.0</span>
                        <span style={{marginLeft:'auto'}}>E-XX.X = E-rating (RF×80) · others in kips (RF × GVW)</span>
                      </div>
                    </details>);
                  };

                  return (
                  <div style={{marginBottom:'16px',border:'2px solid #374151',borderRadius:'8px',
                    padding:'14px 16px',background:'#fff'}}>
                    <div style={{textAlign:'center',fontWeight:'700',fontSize:'13px',
                      fontFamily:'monospace',letterSpacing:'0.08em',color:'#111827',
                      marginBottom:'4px',textTransform:'uppercase'}}>
                      Breakdown of Bridge Rating — Stress
                    </div>
                    <div style={{textAlign:'center',fontSize:'9.5px',fontFamily:'monospace',
                      color:'#6b7280',marginBottom:'12px'}}>
                      Normal (Table 15-1-11) · Maximum (Table 15-7-1, K=0.80F<sub>y</sub>) · Fatigue (§1.7)
                    </div>
                    {mkSummaryTable('Normal Rating — Allowable Stress (Kips)',  '#f0fdf4', 'rfN')}
                    {mkSummaryTable('Maximum Rating — Allowable Stress (Kips)', '#fffbeb', 'rfX')}
                    {mkSummaryTable('Fatigue — Allowable Stress (Kips)',        '#fdf4ff', 'rfFat')}
                  </div>);
                })()}

                {/* Multi-vehicle table */}
                {aremaMultiData.length>0&&(
                <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'12px 16px',marginBottom:'12px',overflowX:'auto'}}>
                  <div style={{fontSize:'11px',fontWeight:'600',color:'#374151',marginBottom:'8px'}}>🚛 Multi-Vehicle AREMA ASD Rating</div>
                  <table style={{borderCollapse:'collapse',fontSize:'10.5px',fontFamily:'monospace',width:'100%',minWidth:'540px'}}>
                    <thead>
                      <tr style={{background:'#f3f4f6'}}>
                        {['Vehicle','Load Case','RF Normal','RF Max',...(showMod?['RF Mod']:[]),'RF Fat','Gov. Node N'].map(h=>(
                          <th key={h} style={{padding:'5px 8px',border:'1px solid #e5e7eb',
                            textAlign:h==='Vehicle'?'left':'center',
                            background:h==='RF Fat'?'#fdf4ff':h.includes('Max')?'#fffbeb':h.includes('Norm')?'#f0fdf4':undefined}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {aremaMultiData.map(v=>(
                        <tr key={v.name} style={{background:'#fff'}}>
                          <td style={{padding:'4px 8px',border:'1px solid #e5e7eb',fontWeight:'600'}}>{v.label}</td>
                          <td style={{padding:'4px 8px',border:'1px solid #e5e7eb',color:'#6b7280',fontSize:'9.5px',textAlign:'center'}}>{v.posLC}</td>
                          <td style={{padding:'4px 8px',border:'1px solid #e5e7eb',textAlign:'center',background:'#f0fdf4',fontWeight:'700',color:rfColor(v.rfN)}}>{rfFmt(v.rfN)}</td>
                          <td style={{padding:'4px 8px',border:'1px solid #e5e7eb',textAlign:'center',background:'#fff7ed',fontWeight:'700',color:rfColor(v.rfX)}}>{rfFmt(v.rfX)}</td>
                          {showMod&&<>
                            <td style={{padding:'4px 8px',border:'1px solid #e5e7eb',textAlign:'center',background:'#fffbeb',fontWeight:'700',color:rfColor(v.rfM)}}>{rfFmt(v.rfM)}</td>
                          </>}
                          <td style={{padding:'4px 8px',border:'1px solid #e5e7eb',textAlign:'center',background:'#fdf4ff',fontWeight:'700',color:rfColor(v.rfFat)}}>{rfFmt(v.rfFat)}</td>
                          <td style={{padding:'4px 8px',border:'1px solid #e5e7eb',color:'#6b7280',fontSize:'9.5px',textAlign:'center'}}>N{v.nodeN}@{v.posN?.toFixed(1)}ft</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                )}
                {/* ── Node-by-Node Rating Tables ── */}
                {aremaAsdData.length>0&&(()=>{
                  const rfC  = rf=>rf!=null&&isFinite(rf)?(rf>=1?'#059669':rf>=0.5?'#d97706':'#dc2626'):'#9ca3af';
                  const f1   = v=>v!=null&&isFinite(v)?v.toFixed(1):'—';
                  const f3   = v=>v!=null&&isFinite(v)?v.toFixed(3):'—';
                  const f2s  = v=>v!=null&&isFinite(v)?v.toFixed(2):'—';
                  const fS   = (M,Sx)=>(M&&Sx&&isFinite(M)&&isFinite(Sx))?f2s(M*12/Sx):'—';
                  const flt  = v=>v!=null&&isFinite(v)&&v>-9999;
                  const THdr = ({cols,bg,tc}) => (
                    <thead><tr style={{background:bg||'#f3f4f6'}}>
                      {cols.map(([lbl,right])=>(
                        <th key={lbl} style={{padding:'4px 7px',border:'1px solid #e5e7eb',
                          fontSize:'8.5px',fontFamily:'monospace',whiteSpace:'nowrap',
                          textAlign:right?'right':'left',color:tc||'#374151'}}>{lbl}</th>
                      ))}
                    </tr></thead>
                  );
                  const THdr2 = ({groups,bg,tc}) => {
                    const thG=(t,span,gbg,gtc)=>`<th colSpan="${span}" style="padding:3px 7px;border:1px solid #e5e7eb;font-size:8pt;font-family:monospace;font-weight:800;background:${gbg||bg};color:${gtc||tc};text-align:center;border-bottom:2px solid #cbd5e1">${t}</th>`;
                    const thC=(t,cbg)=>`<th style="padding:3px 6px;border:1px solid #e5e7eb;font-size:7.5px;font-family:monospace;font-weight:700;background:${cbg||bg};color:${tc};text-align:center;white-space:nowrap">${t}</th>`;
                    return (
                      <thead dangerouslySetInnerHTML={{__html:
                        '<tr>'+groups.map(g=>thG(g.label,g.cols.length,g.bg,g.tc)).join('')+'</tr>'+
                        '<tr>'+groups.flatMap(g=>g.cols.map(col=>thC(col,g.colBg))).join('')+'</tr>'
                      }}/>
                    );
                  };
                  const SecHdr = ({icon,title,sub,color,bg,id}) => (
                    <div onClick={id?()=>setCollapsedTbls(prev=>({...prev,[id]:!prev[id]})):undefined}
                      style={{padding:'7px 14px',background:bg,display:'flex',
                        alignItems:'center',gap:'8px',borderBottom:'1px solid #e5e7eb',
                        cursor:id?'pointer':'default',userSelect:'none'}}>
                      {id&&<span style={{fontSize:'10px',color,minWidth:'10px'}}>{collapsedTbls[id]?'▸':'▾'}</span>}
                      <span style={{fontSize:'11px',fontWeight:'700',color,fontFamily:'monospace'}}>{icon} {title}</span>
                      {sub&&<span style={{fontSize:'8.5px',fontFamily:'monospace',color:'#9ca3af'}}>{sub}</span>}
                    </div>
                  );
                  const wrap = (ch,border,id) => {
                    const kids  = React.Children.toArray(ch.props.children);
                    const hdr   = kids[0];
                    const body  = kids.slice(1);
                    return (
                      <div style={{marginBottom:'10px',border:`1px solid ${border}`,borderRadius:'8px',overflow:'hidden'}}>
                        {id ? React.cloneElement(hdr,{id}) : hdr}
                        {(!id || !collapsedTbls[id]) && body}
                      </div>
                    );
                  };

                  // ── Calc-sheet location: interpolated node ──────────────────
                  const _xVal2 = aremaCalcX!==''&&aremaCalcX!=null ? parseFloat(aremaCalcX) : null;
                  const _lerp = (a,b,t) => (a==null||b==null) ? (a??b) : a+t*(b-a);
                  const calcXData = (()=>{
                    if (_xVal2==null||!aremaAsdData.length) return null;
                    const sorted = aremaAsdData;  // already sorted by pos
                    // Find bounding nodes
                    let li = sorted.length-1;
                    for(let i=0;i<sorted.length;i++){if(sorted[i].pos>_xVal2){li=i-1;break;}}
                    li = Math.max(0, Math.min(li, sorted.length-2));
                    const L=sorted[li], R=sorted[li+1]||sorted[li];
                    const t = R.pos===L.pos ? 0 : (_xVal2-L.pos)/(R.pos-L.pos);
                    // If very close to an existing node, use it directly
                    if(Math.abs(L.pos-_xVal2)<0.1) return {...L, _isCalcX:true};
                    if(Math.abs(R.pos-_xVal2)<0.1) return {...R, _isCalcX:true};
                    // Interpolate all numeric fields
                    const flds=['MDL','VDL','dM','denomN','denomX','denomM','dV',
                      'rfcN','rftN','gN','rfcX','rftX','gX','rfcM','rftM','gM',
                      'rfvN','rfvX','rfvM','rfFat','dM_fat','SR_no_alpha',
                      'McN','MtN','McX','MtX','VnN','VnX'];
                    const nd = {pos:_xVal2, node:null, interpolated:true, _isCalcX:true};
                    flds.forEach(f=>{nd[f]=_lerp(L[f],R[f],t);});
                    const useL = Math.abs(L.pos-_xVal2)<Math.abs(R.pos-_xVal2);
                    nd.sec=useL?L.sec:R.sec; nd.allo=useL?L.allo:R.allo;
                    nd.fatAlphaFlag=useL?L.fatAlphaFlag:R.fatAlphaFlag;
                    return nd;
                  })();
                  // Build augmented data array with interpolated row inserted
                  const augmentedData = (()=>{
                    if(!calcXData||!calcXData.interpolated) return aremaAsdData;
                    const out=[];

                        ['Sx_top (gross)',sec.SxTopG.toFixed(2)+' in³'],

                        ['Sx_bot_gross',sec.SxBotG.toFixed(2)+' in³'],
                        ['Aw (web)',sec.Aw.toFixed(3)+' in²'],
                        ['r_yc',allo.ryc.toFixed(3)+'"'],
                        ['L/r_yc',allo.LRyc.toFixed(2)],
                      ].map(([lbl,val])=>(
                        <div key={lbl} style={{padding:'4px 7px',background:'#f9fafb',borderRadius:'4px',
                          border:'1px solid #e5e7eb',fontSize:'8.5px',fontFamily:'monospace'}}>
                          <div style={{color:'#9ca3af',marginBottom:'1px'}}>{lbl}</div>
                          <div style={{fontWeight:'700',color:'#374151'}}>{val}</div>
                        </div>
                      ))}
                    </div>

                    {/* Allowable Stresses — Normal */}
                    <Hdr color="#15803d" bg="#f0fdf4">ALLOWABLE STRESSES — NORMAL (AREMA Table 15-1-11)</Hdr>
                    <Row label="Tension Ft_N = 0.55 × Fy"
                         formula={`0.55 × ${allo.Fy} ksi`}
                         value={`${fmt(allo.Ft_N)} ksi`} color="#15803d"/>
                    <Row label="Compression Fb_N (with LTB)"
                         formula={`0.55Fy − (0.55×${allo.Fy}²/1.8×10⁶)×(${fmt(allo.LRyc)})² = ${fmt(allo.Ft_N)} − ${fmt(allo.Fb_N_ltb,4)}`}
                         value={`${fmt(allo.Fb_N)} ksi`} color="#15803d"
                         note={allo.Fb_N<allo.Ft_N-0.01?'LTB governs':'=0.55Fy'}/>
                    <Row label="Shear Fs_N = 0.35 × Fy"
                         formula={`0.35 × ${allo.Fy} ksi`}
                         value={`${fmt(allo.Fs_N)} ksi`} color="#15803d"/>

                    {/* Capacities — Normal */}
                    <Hdr color="#15803d" bg="#f0fdf4">MOMENT &amp; SHEAR CAPACITY — NORMAL</Hdr>
                    <Row label="Compression: Mc_N = Fb_N × Sx_top / 12"
                         formula={`${fmt(allo.Fb_N)} × ${sec.SxTopG.toFixed(2)} / 12`}
                         value={`${fmt(p.McN)} ft-kips`} bg="#f0fdf4" bold/>
                    <Row label="Tension: Mt_N = Ft_N × Sx_bot_net / 12"
                         formula={`${fmt(allo.Ft_N)} × ${sec.SxBotN.toFixed(2)} / 12`}
                         value={`${fmt(p.MtN)} ft-kips`} bg="#f0fdf4" bold/>
                    <Row label="Shear: Vn_N = Fs_N × Aw"
                         formula={`${fmt(allo.Fs_N)} × ${sec.Aw.toFixed(3)}`}
                         value={`${fmt(p.VnN)} kips`} bg="#f0fdf4" bold/>

                    {/* Applied Loads */}
                    <Hdr color="#374151" bg="#f3f4f6">APPLIED LOADS</Hdr>
                    <Row label="Dead Load moment MDL"
                         formula={`from ${aremaDcLC||'DC'} load case`}
                         value={`${fmt(p.MDL)} ft-kips`}/>
                    <Row label="Dead Load shear VDL"
                         formula={`from ${aremaDcLC||'DC'} load case`}
                         value={`${fmt(p.VDL)} kips`}/>
                    <Row label="Live Load moment MLL"
                         formula={`from ${aremaLlLC||'LL'} (unfactored)`}
                         value={`${fmt(p.MLL)} ft-kips`}/>
                    <Row label="Impact factor I"
                         formula={span<80?`(40−3×${span}²/1600)/100`:`(16+600/(${span}−30))/100`}
                         value={`${((f1pI-1)*100).toFixed(1)}%  →  (1+I) = ${fmt(f1pI,3)}`}/>
                    <Row label="Distribution factor DF"
                         formula="user-entered"
                         value={`${DF}`}/>
                    <Row label="Factored LL: dM = MLL × (1+I) × DF"
                         formula={`${fmt(p.MLL)} × ${fmt(f1pI,3)} × ${DF}`}
                         value={`${fmt(dM)} ft-kips`} bold bg="#f9fafb"/>
                    {M_CF>0&&<Row label="CF moment: M_CF"
                         formula={`0.00117×${curveV}²/${curveR}×${axle}×8/12`}
                         value={`${fmt(M_CF)} ft-kips`}/>}
                    <Row label={`Denom_N = dM + M_CF = ${fmt(dM)} + ${fmt(M_CF)}`}
                         formula="LL+I+CF — Normal & Maximum denominator"
                         value={`${fmt(p.denomN)} ft-kips`} bold bg="#f0fdf4"/>

                    {/* Rating — Normal */}
                    <Hdr color="#15803d" bg="#dcfce7">RATING FACTORS — NORMAL (DL + LL+I only)</Hdr>
                    <Row label="RF_comp = (Mc_N − MDL) / denomN"
                         formula={`(${fmt(p.McN)} − ${fmt(p.MDL)}) / ${fmt(p.denomN)}`}
                         value={`${fmt(p.rfcN,3)}`}
                         color={rfCol(p.rfcN)} bg={p.govN==='Comp'?'#dcfce7':undefined}
                         note={p.govN==='Comp'?'← governs':''}/>
                    <Row label="RF_tens = (Mt_N − MDL) / denomN"
                         formula={`(${fmt(p.MtN)} − ${fmt(p.MDL)}) / ${fmt(p.denomN)}`}
                         value={`${fmt(p.rftN,3)}`}
                         color={rfCol(p.rftN)} bg={p.govN==='Tens'?'#dcfce7':undefined}
                         note={p.govN==='Tens'?'← governs':''}/>
                    {p.rfvN!=null&&<Row label="RF_shear = (Vn_N − VDL) / dV"
                         formula={`(${fmt(p.VnN)} − ${fmt(p.VDL)}) / ${fmt(p.dV)}`}
                         value={`${fmt(p.rfvN,3)}`}
                         color={rfCol(p.rfvN)} bg={p.govN==='Shear'?'#dcfce7':undefined}
                         note={p.govN==='Shear'?'← governs':''}/>}
                    <Row label="RF_N = min(RF_comp, RF_tens, RF_shear)"
                         formula={`min(${fmt(p.rfcN,3)}, ${fmt(p.rftN,3)}, ${p.rfvN!=null?fmt(p.rfvN,3):'—'})`}
                         value={`${fmt(p.gN,3)}  [${p.govN}]`}
                         color={rfCol(p.gN)} bold bg="#dcfce7"/>
                    <div style={{padding:'3px 8px',fontSize:'8px',fontFamily:'monospace',color:'#9ca3af'}}>
                      denomN = MLL×(1+I)×DF + M_CF = {fmt(dM)} + {fmt(M_CF)} = {fmt(p.denomN)} ft-kips · Only MDL subtracted from capacity
                    </div>

                    {/* Rating — Modified */}
                    {showMod&&govAsdM&&(<>
                    <Hdr color="#92400e" bg="#fef3c7">ALLOWABLE STRESSES — MAXIMUM &amp; MODIFIED (AREMA Table 15-7-1 · K = {fmt(allo.K)} ksi = 0.80×{allo.Fy})</Hdr>
                    <Row label="Tension Ft_X = K"
                         formula={`0.80 × ${allo.Fy} ksi`}
                         value={`${fmt(allo.Ft_X)} ksi`} color="#92400e"/>
                    <Row label="Compression Fb_X = K − LTB"
                         formula={`K − (K×${allo.Fy}/1.8×10⁶)×(${fmt(allo.LRyc)})² = ${fmt(allo.K)} − ${fmt(allo.Fb_X_ltb,4)}`}
                         value={`${fmt(allo.Fb_X)} ksi`} color="#92400e"/>
                    <Row label="Shear Fs_X = 0.75 × K"
                         formula={`0.75 × ${fmt(allo.K)}`}
                         value={`${fmt(allo.Fs_X)} ksi`} color="#92400e"/>
                    <Hdr color="#c2410c" bg="#fff7ed">RATING FACTORS — MAXIMUM (DL + LL+I + CF, K-factor allowables)</Hdr>
                    <Row label="Denom_N = dM + M_CF"
                         formula={`${fmt(dM)} + ${fmt(M_CF)} (same denominator as Normal)`}
                         value={`${fmt(p.denomN)} ft-kips`} bold bg="#fff7ed"/>
                    <Row label="Mc_X = Fb_X × Sx_top / 12"
                         formula={`${fmt(allo.Fb_X)} × ${sec.SxTopG.toFixed(2)} / 12`}
                         value={`${fmt(p.McX)} ft-kips`} bg="#fff7ed"/>
                    <Row label="Mt_X = Ft_X × Sx_bot_net / 12"
                         formula={`${fmt(allo.Ft_X)} × ${sec.SxBotN.toFixed(2)} / 12`}
                         value={`${fmt(p.MtX)} ft-kips`} bg="#fff7ed"/>
                    <Row label="RF_comp = (Mc_X − MDL) / denomN"
                         formula={`(${fmt(p.McX)} − ${fmt(p.MDL)}) / ${fmt(p.denomN)}`}
                         value={`${fmt(p.rfcX,3)}`}
                         color={rfCol(p.rfcX)} bg={p.govX==='Comp'?'#fed7aa':undefined}
                         note={p.govX==='Comp'?'← governs':''}/>
                    <Row label="RF_tens = (Mt_X − MDL) / denomN"
                         formula={`(${fmt(p.MtX)} − ${fmt(p.MDL)}) / ${fmt(p.denomN)}`}
                         value={`${fmt(p.rftX,3)}`}
                         color={rfCol(p.rftX)} bg={p.govX==='Tens'?'#fed7aa':undefined}
                         note={p.govX==='Tens'?'← governs':''}/>
                    {p.rfvX!=null&&<Row label="RF_shear = (Vn_X − VDL) / dV"
                         formula={`(${fmt(p.VnX)} − ${fmt(p.VDL)}) / ${fmt(p.dV)}`}
                         value={`${fmt(p.rfvX,3)}`}
                         color={rfCol(p.rfvX)} bg={p.govX==='Shear'?'#fed7aa':undefined}
                         note={p.govX==='Shear'?'← governs':''}/>}
                    <Row label="RF_X = min(RF_comp, RF_tens, RF_shear)"
                         formula={`min(${fmt(p.rfcX,3)}, ${fmt(p.rftX,3)}, ${p.rfvX!=null?fmt(p.rfvX,3):'—'})`}
                         value={`${fmt(p.gX,3)}  [${p.govX}]`}
                         color={rfCol(p.gX)} bold bg="#fed7aa"/>

                    <Hdr color="#92400e" bg="#fef3c7">RATING FACTORS — MODIFIED (lateral effects in denominator)</Hdr>
                    <Row label="Denom_Mod = dM + M_mod"
                         formula={`${fmt(dM)} + ${fmt(M_mod)} (CF + Wind + Long + Rock all in denominator)`}
                         value={`${fmt(p.denomMod)} ft-kips`} bold bg="#fff7ed"/>
                    <Row label="RF_comp = (Mc_X − MDL) / denomMod"
                         formula={`(${fmt(p.McX)} − ${fmt(p.MDL)}) / ${fmt(p.denomMod)}`}
                         value={`${fmt(p.rfcM,3)}`}
                         color={rfCol(p.rfcM)} bg={govAsdM.govM==='Comp'?'#fef3c7':undefined}
                         note={p.govM==='Comp'?'← governs':''}/>
                    <Row label="RF_tens = (Mt_X − MDL) / denomMod"
                         formula={`(${fmt(p.MtX)} − ${fmt(p.MDL)}) / ${fmt(p.denomMod)}`}
                         value={`${fmt(p.rftM,3)}`}
                         color={rfCol(p.rftM)} bg={govAsdM.govM==='Tens'?'#fef3c7':undefined}
                         note={p.govM==='Tens'?'← governs':''}/>
                    <Row label="RF_M = min(RF_comp, RF_tens, RF_shear)"
                         formula={`min(${fmt(p.rfcM,3)}, ${fmt(p.rftM,3)}, ${p.rfvM!=null?fmt(p.rfvM,3):'—'})`}
                         value={`${fmt(p.gM,3)}  [${p.govM}]`}
                         color={rfCol(p.gM)} bold bg="#fef3c7"/>
                    </>)}

                    {/* Fatigue */}
                    {govAsdFat&&(<>
                    <Hdr color="#7e22ce" bg="#faf5ff">FATIGUE RATING — AREMA §1.7 · Category {_aremaParams.fatCat} · SFT = {_aremaParams.SFT} ksi</Hdr>
                    <Row label="RF_Fat = SFT × Sx_bot_net/12 / dM"
                         formula={`${_aremaParams.SFT} × ${sec.SxBotN.toFixed(2)} / 12 / ${fmt(dM)}`}
                         value={`${fmt(govAsdFat.rfFat,3)}`}
                         color={rfCol(govAsdFat.rfFat)} bold bg="#faf5ff"
                         note="stress-range only"/>
                    </>)}

                    <div style={{padding:'6px 10px',background:'#f8fafc',borderTop:'1px solid #e5e7eb',
                      fontSize:'8px',fontFamily:'monospace',color:'#9ca3af'}}>
                      AREMA Manual for Railway Engineering Ch.15 §7.3 · ASD · Net section per §1.5.8 ·
                      LTB per §1.12.3 · Fatigue per §1.7 · Normal=Table 15-1-11 · Modified=Table 15-7-1
                    </div>
                  </div>);
                })()}
                {hasAremaZone&&!aremaAsdData.length&&(
                  <div style={{padding:'18px',textAlign:'center',background:'#f9fafb',border:'1px dashed #e5e7eb',
                    borderRadius:'8px',fontSize:'12px',color:'#6b7280'}}>
                    Select a <strong>Live Load</strong> case above to compute AREMA ASD ratings.
                  </div>
                )}
                <div style={{padding:'7px 12px',background:'#f8fafc',border:'1px solid #e5e7eb',
                  borderRadius:'6px',fontSize:'9px',fontFamily:'monospace',color:'#9ca3af',lineHeight:'1.7'}}>
                  AREMA Ch.15 §7.3 · Normal: Ft=0.55Fy · Fb per LTB (L/ryc) · Fs=0.35Fy ·
                  Maximum: K=0.80Fy · Fs_M=0.75K · Impact §1.3.1 · Net section §1.5.8
                </div>
              </div>);
            })()}

            {ratingSubTab==='card'&&(<div>
              {(()=>{
                const now = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
                const govInv = govRating;
                const govOp  = govOperating;
                const cardStyle = {background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',
                  padding:'32px 40px',maxWidth:'720px',margin:'0 auto',fontFamily:"'IBM Plex Sans',sans-serif"};
                const lineStyle = {display:'flex',justifyContent:'space-between',alignItems:'flex-end',
                  borderBottom:'1px solid #e5e7eb',paddingBottom:'5px',marginBottom:'10px'};
                const fieldL = {fontSize:'11px',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.07em'};
                const fieldV = {fontSize:'13px',fontWeight:'600',color:'#111827',fontFamily:'monospace'};
                const rfColor = rf=>rf>=1?'#059669':rf>=0.3?'#d97706':'#dc2626';

                return (
                  <div>
                    {/* Print button */}
                    <div style={{display:'flex',justifyContent:'flex-end',marginBottom:'12px',gap:'8px'}}>
                      <button onClick={()=>{
                        const el=document.getElementById('rating-report-card');
                        const w=window.open('','_blank');
                        w.document.write(`<html><head><title>Rating Report Card</title>
                          <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
                          <style>*{box-sizing:border-box}body{font-family:'IBM Plex Sans',sans-serif;padding:20px;max-width:780px;margin:0 auto}
                          @media print{body{padding:0}button{display:none}}</style></head><body>
                          ${el.innerHTML}
                          <button onclick="window.print()" style="margin-top:16px;background:#1d4ed8;color:#fff;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;font-size:14px">🖨 Print</button>
                          </body></html>`);
                        w.document.close();
                      }} style={{background:'#1d4ed8',border:'none',borderRadius:'6px',color:'#fff',
                        padding:'7px 18px',cursor:'pointer',fontSize:'12.5px',fontWeight:'600'}}>
                        🖨 Print / Export
                      </button>
                    </div>

                    <div id="rating-report-card" style={cardStyle}>
                      {/* Header */}
                      <div style={{textAlign:'center',marginBottom:'24px',paddingBottom:'18px',borderBottom:'3px solid #1d4ed8'}}>
                        <div style={{fontSize:'11px',fontFamily:'monospace',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:'4px'}}>
                          BRIDGE LOAD RATING — SUMMARY
                        </div>
                        <div style={{fontSize:'20px',fontWeight:'700',color:'#111827',marginBottom:'4px'}}>
                          {cfg?.projectName||'Unnamed Bridge'}
                        </div>
                        <div style={{fontSize:'13px',color:'#6b7280'}}>
                          {cfg?.projectBridgeId||''}{cfg?.projectBridgeId&&cfg?.projectClient?' · ':''}{cfg?.projectClient||''}
                        </div>
                      </div>

                      {/* Project info grid */}
                      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0',marginBottom:'20px'}}>
                        {[
                          ['Engineer',     cfg?.projectUser||'—'],
                          ['Date',         now],
                          ['Revision',     cfg?.projectRevision||'0'],
                          ['Bridge ID',    cfg?.projectBridgeId||'—'],
                          ['Method',       `${ratingMethod} · ${ratingLimitState}`],
                          ['Category',     `${ratingCategory} · ${ratingLevel}`],
                          ['Dead Load DC', ratingDcLC||'—'],
                          ['Dead Load DW', ratingDwLC||'(none)'],
                          ['Live Load',    ratingLLposLC||'—'],
                        ].map(([l,v])=>(
                          <div key={l} style={{padding:'7px 10px',border:'1px solid #f3f4f6',background:'#fafafa'}}>
                            <div style={fieldL}>{l}</div>
                            <div style={{...fieldV,fontSize:'12px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v}</div>
                          </div>
                        ))}
                      </div>

                      {/* Rating factors summary */}
                      <div style={{fontSize:'11px',fontFamily:'monospace',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'8px'}}>
                        Load Factors & Modifiers
                      </div>
                      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'8px',marginBottom:'20px'}}>
                        {[['γ_DC',gamDC],['γ_DW',gamDW],['γ_LL (Inv)',gamLL],['γ_LL (Op)',gamLL_op.toFixed(2)],['LL Scale',ratingLLScale.toFixed(4)],
                          ['φ_c',phiC],['φ_s',phiS],['φ_f',ratingPhiF],['φ_v',ratingPhiV],['η',ratingEta]
                        ].map(([l,v])=>(
                          <div key={l} style={{background:'#f8fafc',border:'1px solid #e5e7eb',borderRadius:'5px',padding:'6px 8px',textAlign:'center'}}>
                            <div style={{fontSize:'9.5px',color:'#6b7280',fontFamily:'monospace',textTransform:'uppercase'}}>{l}</div>
                            <div style={{fontSize:'14px',fontWeight:'700',fontFamily:'monospace',color:'#111827'}}>{v}</div>
                          </div>
                        ))}
                      </div>

                      {/* THE RATING BOX */}
                      <div style={{border:'2px solid #e5e7eb',borderRadius:'8px',overflow:'hidden',marginBottom:'20px'}}>
                        {/* Column headers */}
                        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr 1fr',background:'#1d4ed8',color:'#fff',
                          padding:'8px 12px',fontSize:'10.5px',fontWeight:'600',textTransform:'uppercase',letterSpacing:'0.06em',gap:'0',textAlign:'center'}}>
                          <div style={{textAlign:'left'}}>Rating Level</div>
                          <div>RF</div>
                          <div>Rating<br/>Tons</div>
                          <div>RF M⁺</div>
                          <div>RF M⁻</div>
                          <div>Controls</div>
                        </div>
                        {[
                          {label:'Inventory', rf:govInv?.rfGov, tons:govInv?+(govInv.rfGov*ratingVehicleTon).toFixed(1):null,
                           rfMpos:govInv?.rfMpos, rfMneg:govInv?.rfMneg, governs:govInv?.governs},
                          {label:'Operating', rf:govOp?.rfGov,  tons:govOp?+(govOp.rfGov*ratingVehicleTon).toFixed(1):null,
                           rfMpos:govOp?.rfMpos,  rfMneg:govOp?.rfMneg,  governs:govOp?.governs},
                        ].map((row,ri)=>(
                          <div key={row.label} style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr 1fr',
                            padding:'12px 12px',textAlign:'center',gap:'0',
                            background:ri===0?'#fff':'#fafafa',borderTop:'1px solid #e5e7eb'}}>
                            <div style={{textAlign:'left',fontWeight:'600',fontSize:'13px',color:'#374151'}}>{row.label}</div>
                            <div style={{fontSize:'20px',fontWeight:'800',fontFamily:'monospace',color:row.rf!=null?rfColor(row.rf):'#9ca3af'}}>
                              {row.rf!=null?row.rf.toFixed(3):'—'}
                            </div>
                            <div style={{fontSize:'16px',fontWeight:'700',fontFamily:'monospace',color:row.rf!=null?rfColor(row.rf):'#9ca3af'}}>
                              {row.tons!=null?row.tons+' T':'—'}
                            </div>
                            <div style={{fontSize:'13px',fontFamily:'monospace',color:'#374151'}}>{row.rfMpos?.toFixed(3)??'—'}</div>
                            <div style={{fontSize:'13px',fontFamily:'monospace',color:'#374151'}}>{row.rfMneg?.toFixed(3)??'—'}</div>
                            <div style={{fontSize:'12px',color:'#6b7280'}}>
                              {row.governs==='M+'?'M⁺ Flexure':row.governs==='M-'?'M⁻ Flexure':'Shear'}
                            </div>
                          </div>
                        ))}
                        {/* Status bar */}
                        <div style={{background:govInv?.rfGov>=1?'#d1fae5':'#fee2e2',padding:'8px 14px',
                          display:'flex',alignItems:'center',gap:'10px',borderTop:'1px solid #e5e7eb'}}>
                          <span style={{fontSize:'16px'}}>{govInv?.rfGov>=1?'✅':'❌'}</span>
                          <span style={{fontSize:'13px',fontWeight:'700',color:govInv?.rfGov>=1?'#065f46':'#991b1b'}}>
                            {govInv?.rfGov>=1 ? 'ADEQUATE — No Posting Required' : 'POSTING REQUIRED — See Below'}
                          </span>
                          <span style={{fontSize:'11px',fontFamily:'monospace',color:'#6b7280',marginLeft:'auto'}}>
                            Gov. node: N{govInv?.node} · {govInv?.pos?.toFixed(2)} ft
                          </span>
                        </div>
                      </div>

                      {/* Vehicle being rated */}
                      <div style={{display:'flex',gap:'10px',alignItems:'center',marginBottom:'20px',
                        padding:'8px 14px',background:'#f8fafc',border:'1px solid #e5e7eb',borderRadius:'6px'}}>
                        <span style={{fontSize:'11px',color:'#6b7280'}}>Rated Vehicle:</span>
                        <span style={{fontSize:'13px',fontWeight:'600',color:'#111827'}}>{ratingVehicleName}</span>
                        <span style={{fontSize:'12px',fontFamily:'monospace',color:'#6b7280'}}>{ratingVehicleTon} T GVW</span>
                        <span style={{fontSize:'10.5px',fontFamily:'monospace',color:'#9ca3af',marginLeft:'auto'}}>
                          {ratingMethod} · MBE Table 6A.4.2.2-1
                        </span>
                      </div>

                      {/* AREMA ASD results (shown when AREMA zones exist) */}
                      {(govAsdN||govAsdM)&&(
                      <div style={{marginBottom:'20px',paddingBottom:'16px',borderBottom:'2px solid #fde68a'}}>
                        <div style={{fontSize:'11px',fontFamily:'monospace',color:'#6b7280',
                          textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'8px'}}>
                          🚂 AREMA Chapter 15 — Allowable Stress Design (ASD)
                        </div>
                        <div style={{border:'2px solid #fde68a',borderRadius:'8px',overflow:'hidden'}}>
                          <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr',background:'#d97706',
                            color:'#fff',padding:'7px 12px',fontSize:'10px',fontWeight:'600',
                            textTransform:'uppercase',letterSpacing:'0.06em',textAlign:'center'}}>
                            <div style={{textAlign:'left'}}>Rating Case</div>
                            <div>RF (gov.)</div>
                            <div>Controls</div>
                            <div>Gov. Node</div>
                          </div>
                          {[
                            govAsdN && {
                              label:'Normal (Standard)',
                              rf: govAsdN.gN, ctrl: govAsdN.govN,
                              node: `N${govAsdN.node} @ ${govAsdN.pos.toFixed(1)} ft`, bg:'#fff'
                            },

        const ts = parseFloat(lldfTs)||8;
        const n  = parseFloat(lldfN)||8;
        const I  = parseFloat(lldfI)||0;
        const A  = parseFloat(lldfA)||0;
        const eg = parseFloat(lldfEg)||0;
        const Kg = n*(I + A*eg*eg);   // longitudinal stiffness param (in^4)
        const KgTerm = Kg>0 ? Math.pow(Kg/(12*L*Math.pow(ts,3)),0.1) : null;

        // AASHTO 4.6.2.2 — concrete deck on steel beams, interior girder
        const gM1  = 0.06 + Math.pow(S/14,0.4)*Math.pow(S/L,0.3)*(KgTerm||1);
        const gM2p = 0.075+ Math.pow(S/9.5,0.6)*Math.pow(S/L,0.2)*(KgTerm||1);
        const gV1  = 0.36 + S/25;
        const gV2p = 0.2  + S/12 - Math.pow(S/35,2);
        const govM = Math.max(gM1,gM2p);
        const govV = Math.max(gV1,gV2p);

        // Range check AASHTO Table 4.6.2.2.2b-1
        const inRange = S>=3.5&&S<=16 && L>=20&&L<=240 && ts>=4.5&&ts<=12 && n>=4&&n<=12;

              </Field>
              <Field label="Span Length L (ft)" hint="Span for DF calculation (0 = use longest span from geometry) · Range: 20–240 ft">
                <input type="number" step="1" style={INP2} value={lldfL} onChange={e=>setLldfL(e.target.value)}
                  placeholder={`0 = auto (${(cfg?.spans?.length?Math.max(...cfg.spans):40).toFixed(2)} ft)`}/>
              </Field>
              <Field label="Deck Slab Thickness ts (in)" hint="Structural thickness of concrete deck · Range: 4.5–12 in">
                <input type="number" step="0.25" style={INP2} value={lldfTs} onChange={e=>setLldfTs(e.target.value)}/>
              </Field>
            </div>

            <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'16px',flex:'1',minWidth:'280px'}}>
              <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151',marginBottom:'4px'}}>Longitudinal Stiffness Parameter K<sub>g</sub></div>
              <div style={{fontSize:'10.5px',color:'#9ca3af',fontFamily:'monospace',marginBottom:'10px'}}>
                K<sub>g</sub> = n(I + A·e<sub>g</sub>²) · Optional — uses 1.0 if omitted
              </div>

              {/* Auto-populate from W_SHAPE_PROPS */}
              <div style={{marginBottom:'12px',padding:'8px 10px',background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:'6px'}}>
                <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:'6px'}}>
                  Auto-fill from W-Shape
                </div>
                <div style={{display:'flex',gap:'6px',alignItems:'center'}}>
                  <select style={{...INP2,flex:1}} defaultValue=""
                    onChange={e=>{
                      const p=W_SHAPE_PROPS[e.target.value];
                      if(!p) return;
                      const [d,tw,Zx,Sx]=p;
                      // Ix ≈ Sx * d/2 (approx from Sx and d)
                      // A ≈ d*tw + 2*bf*tf but we only have d,tw — use Ix=Sx*(d/2)
                      // Better: use Sx and d to estimate Ix = Sx*(d/2)
                      const dIn=d, AwApprox=dIn*tw;
                      const IxApprox=+(Sx*(dIn/2)).toFixed(1);
                      // Area rough: Zx/Sx gives a shape factor ~1.12, area from weight not available
                      // Use Ix and depth: A ≈ 2*Ix/d (thin-web approx)
                      const AApprox=+(2*IxApprox/dIn).toFixed(2);
                      setLldfI(IxApprox);
                      setLldfA(AApprox);
                    }}>
                    <option value="">— pick a section —</option>
                    {W_SHAPES.map(s=>{
                      const p=W_SHAPE_PROPS[s];
                      return p?<option key={s} value={s}>{s} (Ix≈{(p[3]*(p[0]/2)).toFixed(0)} in⁴)</option>:null;
                    })}
                  </select>
                  <button onClick={()=>{setLldfI(0);setLldfA(0);setLldfEg(0);}}
                    title="Clear section properties"
                    style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'5px',
                      padding:'5px 8px',cursor:'pointer',fontSize:'11px',color:'#6b7280',flexShrink:0}}>
                    Clear
                  </button>
                </div>
                <div style={{fontSize:'9.5px',color:'#9ca3af',fontFamily:'monospace',marginTop:'4px'}}>
                  Ix estimated from Sx×(d/2). Enter eg manually based on deck geometry.
                </div>
              </div>

              <Field label="Modular Ratio n = Es/Ec" hint="Typically 8 for f'c=4ksi, 7 for f'c=5ksi · Range: 4–12">
                <input type="number" step="1" style={INP2} value={lldfN} onChange={e=>setLldfN(e.target.value)}/>
              </Field>
              <Field label="Moment of Inertia I (in⁴)" hint="Non-composite steel section">
                <input type="number" step="1" style={INP2} value={lldfI} onChange={e=>setLldfI(e.target.value)}/>
              </Field>
              <Field label="Cross-Section Area A (in²)">
                <input type="number" step="0.1" style={INP2} value={lldfA} onChange={e=>setLldfA(e.target.value)}/>
              </Field>
              <Field label="Eccentricity eg (in)" hint="Distance from centroid of steel to centroid of deck">
                <input type="number" step="0.25" style={INP2} value={lldfEg} onChange={e=>setLldfEg(e.target.value)}/>
              </Field>
              {Kg>0&&<div style={{padding:'8px 12px',background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:'5px',fontSize:'11.5px',fontFamily:'monospace',color:'#166534'}}>
                K<sub>g</sub> = {n.toFixed(0)} × ({I.toFixed(0)} + {A.toFixed(1)} × {eg.toFixed(2)}²) = <strong>{Kg.toFixed(0)} in⁴</strong>
                {KgTerm&&<> &nbsp;·&nbsp; (K<sub>g</sub>/12Lt<sub>s</sub>³)^0.1 = <strong>{KgTerm.toFixed(4)}</strong></>}
              </div>}
            </div>
          </div>

          {!inRange&&<div style={{padding:'8px 14px',background:'#fffbeb',border:'1px solid #fde68a',borderRadius:'6px',fontSize:'12px',color:'#92400e',marginBottom:'14px'}}>
            ⚠ One or more inputs are outside AASHTO Table 4.6.2.2.2b-1 applicability limits (S: 3.5–16 ft, L: 20–240 ft, ts: 4.5–12 in, n: 4–12). Results shown for reference only.
          </div>}

          {/* Results */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:'12px',marginBottom:'16px'}}>
            {[
              {label:'g_M (1 lane)',  formula:'0.06+(S/14)^0.4(S/L)^0.3·Kg^0.1', val:gM1,  gov:gM1>=gM2p, color:'#1d4ed8'},
              {label:'g_M (2+ lanes)',formula:'0.075+(S/9.5)^0.6(S/L)^0.2·Kg^0.1',val:gM2p, gov:gM2p>gM1,  color:'#1d4ed8'},
              {label:'g_V (1 lane)',  formula:'0.36 + S/25',                        val:gV1,  gov:gV1>=gV2p, color:'#dc2626'},
              {label:'g_V (2+ lanes)',formula:'0.2 + S/12 − (S/35)²',              val:gV2p, gov:gV2p>gV1,  color:'#dc2626'},
            ].map(({label,formula,val,gov,color})=>(
              <div key={label} style={{background:'#fff',border:`1px solid ${gov?color+'40':'#e5e7eb'}`,borderRadius:'8px',
                padding:'12px 14px',borderTop:`3px solid ${gov?color:'#e5e7eb'}`}}>
                <div style={{fontSize:'10.5px',fontFamily:'monospace',color:'#6b7280',marginBottom:'2px'}}>{label}</div>
                <div style={{fontSize:'22px',fontWeight:'700',color:gov?color:'#374151',fontFamily:'monospace'}}>{val.toFixed(4)}</div>
                <div style={{fontSize:'9px',color:'#9ca3af',fontFamily:'monospace',marginTop:'4px'}}>{formula}</div>
                {gov&&<div style={{fontSize:'9.5px',color:color,fontWeight:'600',marginTop:'4px'}}>▶ Governs</div>}
              </div>
            ))}
          </div>

          {/* Governing summary + apply button */}
          <div style={{background:'#1d4ed8',borderRadius:'8px',padding:'16px 20px',color:'#fff',display:'flex',alignItems:'center',gap:'24px',flexWrap:'wrap'}}>
            <div>
              <div style={{fontSize:'10px',opacity:0.7,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'2px'}}>Governing DF — Moment</div>
              <div style={{fontSize:'28px',fontWeight:'700',fontFamily:'monospace'}}>{govM.toFixed(4)}</div>
            </div>
            <div>
              <div style={{fontSize:'10px',opacity:0.7,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'2px'}}>Governing DF — Shear</div>
              <div style={{fontSize:'28px',fontWeight:'700',fontFamily:'monospace'}}>{govV.toFixed(4)}</div>
            </div>
            <div style={{marginLeft:'auto',display:'flex',flexDirection:'column',gap:'8px'}}>
              <button onClick={()=>{
                const newF=factors.map(f=>f.id==='df'?{...f,value:+govM.toFixed(4),enabled:true}:f);
                setFactors(newF); setViewTab('charts');
              }} style={{background:'#fff',color:'#1d4ed8',border:'none',borderRadius:'6px',
                padding:'9px 18px',cursor:'pointer',fontSize:'12.5px',fontWeight:'600'}}>
                ↑ Apply g_M={govM.toFixed(4)} to Scale Factors
              </button>
              <div style={{fontSize:'10px',opacity:0.7,textAlign:'center',fontFamily:'monospace'}}>
                AASHTO LRFD 4.6.2.2 · Interior girder · Concrete deck on steel beams
              </div>
            </div>
          </div>

          <div style={{marginTop:'12px'}}>
            <InfoBox>
              These distribution factors apply to interior girders with a cast-in-place concrete deck on steel beams (Table 4.6.2.2.2b-1).
              For exterior girders, use the lever rule for one design lane and apply the e correction factor for multiple lanes.
              The K<sub>g</sub> term may be conservatively taken as 1.0 when section properties are not available.
            </InfoBox>
          </div>
        </div>;
      })()}
    </div>
  );
}
