                  {queryDist!==''&&<button onClick={()=>setQueryDist('')} title="Clear query point" style={{background:'none',border:'none',color:'#9ca3af',cursor:'pointer',fontSize:'12px'}}>✕</button>}
                </div>
                {queryResult&&(
                  <div>
                    <div style={{fontSize:'10.5px',color:'#6b7280',fontFamily:'monospace',marginBottom:'8px'}}>
                      Interpolated between Node {queryResult.n1} ({queryResult.x1} ft) and Node {queryResult.n2} ({queryResult.x2} ft) · t={queryResult.t.toFixed(4)}
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:'8px'}}>
                      {CHANNELS.map(ch=>{
                        const r=queryResult[ch.key]; const showSc=Math.abs(effectiveScale-1)>0.001;
                        return <div key={ch.key} style={{padding:'8px 12px',background:'#f9fafb',border:`1px solid ${activeChannels.includes(ch.key)?ch.color+'40':'#e5e7eb'}`,borderRadius:'6px'}}>
                          <div style={{fontSize:'10px',fontFamily:'monospace',color:ch.color,fontWeight:'600',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:'2px'}}>{ch.label}</div>
                          <div style={{fontSize:'14px',fontWeight:'700',color:'#111827',fontFamily:'monospace'}}>{showSc?r.scaled.toFixed(3):r.raw.toFixed(3)}</div>
                          {showSc&&<div style={{fontSize:'10px',color:'#9ca3af',fontFamily:'monospace'}}>raw: {r.raw.toFixed(3)}</div>}
                          <div style={{fontSize:'10px',color:'#9ca3af',fontFamily:'monospace'}}>{ch.unit}</div>
                        </div>;
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {/* Charts */}
        <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
          {CHANNELS.filter(ch=>activeChannels.includes(ch.key)).map(ch=>{
            const cid=`lc_${ch.key}`;
            const vals=rows.filter(r=>r.load===selectedLoad).map(r=>r[ch.key]*effectiveScale);
            const maxV=vals.length?Math.max(...vals.map(Math.abs)):0;
            return <ChartCard key={ch.key} title={ch.label} unit={ch.unit} color={ch.color}
              isPrimary={ch.primary} load={selectedLoad} chartId={cid}
              onCsvClick={()=>downloadResultsCSV(rows,selectedLoad,nodePositions,[ch],effectiveScale)}>
              {maxV>0&&<div style={{fontSize:'10px',fontFamily:'monospace',color:ch.color,fontWeight:'500',
                marginBottom:'4px',textAlign:'right'}}>peak: {maxV.toFixed(2)}</div>}
              <BeamChart rows={rows} load={selectedLoad} field={ch.key} label={`${ch.label} (${ch.unit})`}
                unit={ch.unit} color={ch.color} scaleVal={effectiveScale} nodePositions={nodePositions}/>
            </ChartCard>;
          })}
        </div>

        {/* Summary stats */}
        {selectedLoad&&(
          <div style={{marginTop:'16px'}}>
            <div style={{fontSize:'10px',fontFamily:'monospace',color:'#9ca3af',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'8px'}}>
              Summary — {selectedLoad} {Math.abs(effectiveScale-1)>0.001?`(×${effectiveScale.toFixed(3)})`:''}</div>
            <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
              {CHANNELS.filter(ch=>activeChannels.includes(ch.key)).map(ch=>{
                const vals=rows.filter(r=>r.load===selectedLoad).map(r=>r[ch.key]*effectiveScale);
                if(!vals.length) return null;
                return <div key={ch.key} style={{background:'#fff',border:`1px solid ${ch.color}30`,borderRadius:'7px',
                  padding:'8px 12px',minWidth:'130px',boxShadow:'0 1px 3px rgba(0,0,0,0.04)',borderTop:`3px solid ${ch.color}`}}>
                  <div style={{fontSize:'9.5px',fontFamily:'monospace',color:ch.color,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:'4px',fontWeight:'600'}}>{ch.label}</div>
                  <div style={{fontSize:'12px',fontWeight:'700',color:'#111827',fontFamily:'monospace'}}>↑ {Math.max(...vals).toFixed(2)}</div>
                  <div style={{fontSize:'12px',fontWeight:'700',color:'#374151',fontFamily:'monospace'}}>↓ {Math.min(...vals).toFixed(2)}</div>
                  <div style={{fontSize:'9px',color:'#9ca3af',fontFamily:'monospace',marginTop:'2px'}}>{ch.unit}</div>
                </div>;
              })}
            </div>
          </div>
        )}
      </div>)}

      {/* ── TAB: ENVELOPE ──────────────────────────────────────────────────── */}
      {viewTab==='envelope'&&(<div>
        <div style={{display:'flex',gap:'16px',flexWrap:'wrap',marginBottom:'16px'}}>
          {/* LC selector */}
          <div style={{flex:'1',minWidth:'320px',background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px'}}>
            <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151',marginBottom:'10px'}}>
              Select Load Cases for Envelope
              <span style={{marginLeft:'8px',fontSize:'10px',fontFamily:'monospace',color:'#9ca3af'}}>{envelopeLCs.length} selected</span>
            </div>
            {Object.entries(groupedLCs).map(([grp,lcs])=>
              lcs.length>0?<LcCheckGrid key={grp} lcs={lcs} selected={envelopeLCs} toggle={toggleEnvLC} label={grp}/>:null
            )}
            <div style={{display:'flex',gap:'6px',marginTop:'6px'}}>
              <button onClick={()=>setEnvelopeLCs(movingMaxLCs)} style={{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:'4px',padding:'4px 10px',cursor:'pointer',fontSize:'11px',color:'#1d4ed8'}}>All Moving(max)</button>
              <button onClick={()=>setEnvelopeLCs(loadCases)} style={{background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:'4px',padding:'4px 10px',cursor:'pointer',fontSize:'11px',color:'#374151'}}>All LCs</button>
              <button onClick={()=>setEnvelopeLCs([])} style={{background:'none',border:'none',padding:'4px 8px',cursor:'pointer',fontSize:'11px',color:'#9ca3af'}}>Clear</button>
            </div>
          </div>
          {/* Channel selector */}
          <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px',minWidth:'220px'}}>
            <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151',marginBottom:'10px'}}>Channels</div>
            <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
              {CHANNELS.map(ch=>(
                <label key={ch.key} style={{display:'flex',alignItems:'center',gap:'8px',cursor:'pointer'}}>
                  <input type="checkbox" checked={envelopeCh.includes(ch.key)} onChange={()=>toggleEnvCh(ch.key)}
                    style={{accentColor:ch.color,width:'14px',height:'14px'}}/>
                  <span style={{fontSize:'12px',color:envelopeCh.includes(ch.key)?ch.color:'#6b7280',fontWeight:envelopeCh.includes(ch.key)?'600':'400'}}>{ch.label}</span>
                  <span style={{fontSize:'10px',fontFamily:'monospace',color:'#9ca3af'}}>{ch.unit}</span>
                </label>
              ))}
            </div>
          </div>
        </div>

        {envelopeLCs.length===0&&(
          <div style={{padding:'32px',textAlign:'center',color:'#9ca3af',fontSize:'13px',background:'#f9fafb',borderRadius:'8px',border:'1px dashed #e5e7eb'}}>
            Select load cases above to generate envelope diagrams.
          </div>
        )}

        {/* Envelope charts */}
        <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
          {CHANNELS.filter(ch=>envelopeCh.includes(ch.key)).map(ch=>{
            const envPts=envelopeData[ch.key];
            if (!envPts?.length) return null;
            const cid=`env_${ch.key}`;
            const pkMax=Math.max(...envPts.map(p=>p.max));
            const pkMin=Math.min(...envPts.map(p=>p.min));
            return <ChartCard key={ch.key} title={`${ch.label} Envelope`} unit={ch.unit} color={ch.color}
              isPrimary={ch.primary} chartId={cid}
              onCsvClick={()=>{
                const headers=['Node','Position (ft)','Max '+ch.label,'Min '+ch.label];
                const data=envPts.map(p=>[p.node,nodePositions[p.node]??'',p.max.toFixed(4),p.min.toFixed(4)]);
                const csv=[headers,...data].map(r=>r.join(',')).join('\n');
                const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
                a.download=`envelope_${ch.label}.csv`;a.click();
              }}>
              <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',marginBottom:'4px',textAlign:'right'}}>
                {envelopeLCs.length} LCs · ↑{pkMax.toFixed(2)} ↓{pkMin.toFixed(2)} {ch.unit}
              </div>
              <EnvelopeChart envData={envPts} unit={ch.unit} nodePositions={nodePositions}/>
            </ChartCard>;
          })}
        </div>
      </div>)}

      {/* ── TAB: DEAD LOAD SUM ─────────────────────────────────────────────── */}
      {viewTab==='deadload'&&(<div>
        <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px',marginBottom:'16px'}}>
          <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151',marginBottom:'10px'}}>
            Select Dead Load Cases to Accumulate
            <span style={{marginLeft:'8px',fontSize:'10px',fontFamily:'monospace',color:'#9ca3af'}}>{dlLCs.length} selected</span>
          </div>
          <LcCheckGrid lcs={staticLCs} selected={dlLCs} toggle={toggleDlLC} label="Static / Dead Loads"/>
          <LcCheckGrid lcs={groupedLCs.Combinations||[]} selected={dlLCs} toggle={toggleDlLC} label="Combinations"/>
          <div style={{display:'flex',gap:'6px',marginTop:'4px'}}>
            <button onClick={()=>setDlLCs(staticLCs)} style={{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:'4px',padding:'4px 10px',cursor:'pointer',fontSize:'11px',color:'#1d4ed8'}}>All Static</button>
            <button onClick={()=>setDlLCs([])} style={{background:'none',border:'none',padding:'4px 8px',cursor:'pointer',fontSize:'11px',color:'#9ca3af'}}>Clear</button>
          </div>
        </div>

        {dlLCs.length===0&&(
          <div style={{padding:'32px',textAlign:'center',color:'#9ca3af',fontSize:'13px',background:'#f9fafb',borderRadius:'8px',border:'1px dashed #e5e7eb'}}>
            Select dead load cases above to see their cumulative sum diagram.
          </div>
        )}

        <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
          {CHANNELS.filter(ch=>activeChannels.includes(ch.key)).map(ch=>{
            const pts=dlSumData[ch.key];
            if(!pts?.length) return null;
            const cid=`dl_${ch.key}`;
            const pkMax=Math.max(...pts.map(p=>p.val));
            const pkMin=Math.min(...pts.map(p=>p.val));
            return <ChartCard key={ch.key} title={`${ch.label} — Cumulative DL (${dlLCs.length} cases)`}
              unit={ch.unit} color={ch.color} isPrimary={ch.primary} chartId={cid}
              onCsvClick={()=>{
                const headers=['Node','Position (ft)',`Sum ${ch.label} (${ch.unit})`];
                const data=pts.map(p=>[p.node,nodePositions[p.node]??'',p.val.toFixed(4)]);
                const csv=[headers,...data].map(r=>r.join(',')).join('\n');
                const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
                a.download=`DL_sum_${ch.label}.csv`;a.click();
              }}>
              <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',marginBottom:'4px',textAlign:'right'}}>
                ↑{pkMax.toFixed(2)} ↓{pkMin.toFixed(2)} {ch.unit}
              </div>
              <DirectChart pts={pts} label={`${ch.label} DL Sum`} unit={ch.unit} color={ch.color} nodePositions={nodePositions}/>
            </ChartCard>;
          })}
        </div>
        {dlLCs.length>0&&<InfoBox>Showing channels currently active in the Per Load Case tab. Toggle channels there to change what's displayed here.</InfoBox>}
      </div>)}

      {/* ── TAB: RATING FACTOR ─────────────────────────────────────────────── */}
      {viewTab==='rating'&&(<div>
        {/* ── Row 1: Method / Level / Limit State ── */}
        <div style={{display:'flex',gap:'10px',flexWrap:'wrap',marginBottom:'12px'}}>
          {/* Method */}
          <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'12px 16px',minWidth:'200px',flex:'1'}}>
            <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:'8px'}}>Rating Method</div>
            <div style={{display:'flex',gap:'4px'}}>
              {['LRFR','LFR'].map(m=>(
                <button key={m} onClick={()=>setRatingMethod(m)} style={{flex:1,padding:'7px',borderRadius:'5px',border:'none',cursor:'pointer',fontSize:'12.5px',fontWeight:'600',
                  background:ratingMethod===m?'#1d4ed8':'#f3f4f6',color:ratingMethod===m?'#fff':'#6b7280'}}>
                  {m}
                </button>
              ))}
            </div>
            <div style={{fontSize:'9.5px',color:'#9ca3af',fontFamily:'monospace',marginTop:'5px'}}>
              {ratingMethod==='LRFR'?'MBE Section 6A':'MBE Section 6B'}
            </div>
          </div>
          {/* Limit State */}
          <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'12px 16px',minWidth:'260px',flex:'2'}}>
            <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:'8px'}}>Limit State</div>
            <div style={{display:'flex',gap:'4px',flexWrap:'wrap'}}>
              {(ratingMethod==='LRFR'
                ?['Strength I','Service II','Fatigue I','Fatigue II']
                :['Strength I']
              ).map(ls=>(
                <button key={ls} onClick={()=>setRatingLimitState(ls)} style={{padding:'6px 12px',borderRadius:'5px',border:'none',cursor:'pointer',fontSize:'12px',
                  background:ratingLimitState===ls?'#dc2626':'#f3f4f6',color:ratingLimitState===ls?'#fff':'#6b7280',fontWeight:ratingLimitState===ls?'600':'400'}}>
                  {ls}
                </button>
              ))}
            </div>
          </div>
          {/* Level + Category */}
          <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'12px 16px',minWidth:'240px',flex:'2'}}>
            <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:'8px'}}>Rating Level · Category</div>
            <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
              {['Inventory','Operating'].map(lv=>(
                <button key={lv} onClick={()=>setRatingLevel(lv)} style={{padding:'6px 12px',borderRadius:'5px',border:'none',cursor:'pointer',fontSize:'12px',
                  background:ratingLevel===lv?'#7c3aed':'#f3f4f6',color:ratingLevel===lv?'#fff':'#6b7280',fontWeight:ratingLevel===lv?'600':'400'}}>
                  {lv}
                </button>
              ))}
            </div>
            {ratingMethod==='LRFR'&&ratingLimitState==='Strength I'&&(
              <div style={{display:'flex',gap:'4px',marginTop:'6px'}}>
                {['Design','Legal','Permit'].map(cat=>(
                  <button key={cat} onClick={()=>setRatingCategory(cat)} style={{padding:'4px 10px',borderRadius:'5px',border:`1px solid ${ratingCategory===cat?'#7c3aed':'#e5e7eb'}`,cursor:'pointer',fontSize:'11px',
                    background:ratingCategory===cat?'#f5f3ff':'#fff',color:ratingCategory===cat?'#7c3aed':'#9ca3af',fontWeight:ratingCategory===cat?'600':'400'}}>
                    {cat}
                  </button>
                ))}
                {ratingCategory==='Legal'&&(
                  <div style={{display:'flex',alignItems:'center',gap:'5px',marginLeft:'6px'}}>
                    <span style={{fontSize:'10px',color:'#9ca3af',fontFamily:'monospace'}}>ADTT:</span>
                    <input type="number" style={{...INP,width:'70px',padding:'4px 6px',fontSize:'12px'}}
                      value={ratingAdtt} onChange={e=>setRatingAdtt(parseInt(e.target.value)||0)}/>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>

        {/* ── Row 2: Load Factors ── */}
        <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px',marginBottom:'12px'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px'}}>
            <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151'}}>Dead & Live Load Factors (γ)</div>
            <label style={{display:'flex',alignItems:'center',gap:'5px',fontSize:'11px',color:'#6b7280',cursor:'pointer',marginLeft:'auto'}}>
              <input type="checkbox" checked={ratingCustomFact} onChange={e=>setRatingCustomFact(e.target.checked)} style={{accentColor:'#1d4ed8'}}/>
              Override auto values
            </label>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:'10px',marginBottom:'12px'}}>
            {[
              {label:'γ_DC (struct. DC)',val:gamDC,set:setRatingGamDC,hint:'MBE Table 6A.4.2.2-1'},
              {label:'γ_DW (wearing surf.)',val:gamDW,set:setRatingGamDW,hint:'Future overlay / utilities'},
              {label:'γ_LL (live load)',val:gamLL,set:setRatingGamLL,hint:ratingCategory==='Legal'?`Legal @ ADTT ${ratingAdtt}`:`${ratingMethod} ${ratingLevel}`},
              {label:'η Load Modifier',val:ratingEta,set:setRatingEta,hint:'MBE 6A.4.1 — typically 1.0'},
            ].map(({label,val,set:setter,hint})=>(
              <div key={label} style={{background:'#f9fafb',borderRadius:'6px',padding:'8px 10px',border:'1px solid #e5e7eb'}}>
                <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',marginBottom:'3px'}}>{label}</div>
                <input type="number" step="0.01" style={{...INP,padding:'4px 6px',fontSize:'13px',fontFamily:'monospace',
                  fontWeight:'700',color:'#111827',background:ratingCustomFact?'#fff':'#f3f4f6'}}
                  value={val} disabled={!ratingCustomFact&&label!=='η Load Modifier'}
                  onChange={e=>setter(parseFloat(e.target.value)||0)}/>
                <div style={{fontSize:'9px',color:'#9ca3af',fontFamily:'monospace',marginTop:'2px'}}>{hint}</div>
              </div>
            ))}
          </div>

          {/* ── LL Scale Factors (LLDF, IM, MPF, User) ── */}
          <div style={{borderTop:'1px solid #e5e7eb',paddingTop:'12px'}}>
            <button onClick={()=>setRatingLLOpen(v=>!v)}
              style={{width:'100%',display:'flex',alignItems:'center',gap:'8px',background:'none',border:'none',cursor:'pointer',padding:'0',textAlign:'left',marginBottom:'8px'}}>
              <span style={{fontSize:'11.5px',fontWeight:'600',color:'#374151'}}>⚙ Live Load Scale Factors</span>
              <span style={{fontSize:'10px',fontFamily:'monospace',background:'#eff6ff',color:'#1d4ed8',
                padding:'1px 6px',borderRadius:'99px',border:'1px solid #bfdbfe'}}>
                {Math.abs(ratingLLScale-1)>0.001 ? `×${ratingLLScale.toFixed(4)} applied` : `${ratingLLFactors.filter(f=>f.enabled).length} enabled`}
              </span>
              <span style={{marginLeft:'auto',fontSize:'12px',color:'#9ca3af'}}>{ratingLLOpen?'▲':'▼'}</span>
            </button>
            {ratingLLOpen&&(
              <div>
                <div style={{fontSize:'10.5px',color:'#6b7280',marginBottom:'10px',fontFamily:'monospace'}}>
                  These multiply the LL result before the RF denominator — LL_effective = LL × g × (1+IM/100) × m × F₁ × F₂
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))',gap:'8px',marginBottom:'10px'}}>
                  {ratingLLFactors.map(f=>(
                    <div key={f.id} style={{display:'flex',gap:'8px',alignItems:'center',padding:'8px 10px',
                      background:f.enabled?'#eff6ff':'#f9fafb',border:`1px solid ${f.enabled?'#bfdbfe':'#e5e7eb'}`,borderRadius:'6px'}}>
                      <input type="checkbox" checked={f.enabled}
                        onChange={e=>setRatingLLFactors(prev=>prev.map(x=>x.id===f.id?{...x,enabled:e.target.checked}:x))}
                        style={{cursor:'pointer',accentColor:'#1d4ed8',width:'14px',height:'14px'}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:'11.5px',fontWeight:'500',color:'#111827'}}>{f.label}</div>
                        <div style={{fontSize:'9.5px',color:'#9ca3af',fontFamily:'monospace'}}>{f.hint}</div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:'3px'}}>
                        <input type="number" step={f.isPercent?1:0.01} min="0"
                          style={{...INP,width:'65px',padding:'4px 6px',fontSize:'12px',textAlign:'right',
                            opacity:f.enabled?1:0.4,fontFamily:'monospace',fontWeight:'600'}}
                          value={f.value} disabled={!f.enabled}
                          onChange={e=>setRatingLLFactors(prev=>prev.map(x=>x.id===f.id?{...x,value:parseFloat(e.target.value)||0}:x))}/>
                        <span style={{fontSize:'10px',color:'#9ca3af',fontFamily:'monospace',minWidth:'16px'}}>
                          {f.isPercent?'%':'×'}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
                <div style={{display:'flex',gap:'16px',padding:'7px 12px',background:'#f0f9ff',borderRadius:'5px',border:'1px solid #bfdbfe',fontSize:'11.5px',fontFamily:'monospace',color:'#1e40af',alignItems:'center'}}>
                  <span>LL scale:</span>
                  <strong>×{ratingLLScale.toFixed(4)}</strong>
                  <span style={{color:'#93c5fd'}}>= {ratingLLFactors.filter(f=>f.enabled).map(f=>f.id==='im'?`(1+${f.value}/100)`:f.value).join(' × ')||'1'}</span>
                  <button onClick={()=>setRatingLLFactors(DEFAULT_RATING_LL_FACTORS)}
                    style={{marginLeft:'auto',background:'none',border:'none',color:'#9ca3af',cursor:'pointer',fontSize:'11px'}}>
                    reset
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* Rating equation preview */}
          <div style={{marginTop:'12px',padding:'8px 12px',background:'#f0f9ff',border:'1px solid #bfdbfe',borderRadius:'5px',fontSize:'11.5px',fontFamily:'monospace',color:'#1e40af'}}>
            RF = (φ_c·φ_s·φ·Rn − {gamDC}·DC − {gamDW}·DW) / ({gamLL} · LL · ×{ratingLLScale.toFixed(4)}) · η={ratingEta}
          </div>
        </div>

        {/* ── Row 3: Resistance Factors + Load Cases side by side ── */}
        <div style={{display:'flex',gap:'12px',flexWrap:'wrap',marginBottom:'12px'}}>
          {/* Load cases */}
          <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px',flex:'1',minWidth:'260px'}}>
            <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151',marginBottom:'12px'}}>Load Cases</div>
            {[
              {label:'Dead Load DC (structural)',hint:'Self-weight, diaphragms, haunch…',val:ratingDcLC,set:setRatingDcLC,color:'#374151'},
              {label:'Dead Load DW (wearing surface)',hint:'Future overlay, utilities — use 0 if none',val:ratingDwLC,set:setRatingDwLC,color:'#6b7280',optional:true},
              {label:'Live Load — max (pos. moment)',hint:'Moving load (max) case',val:ratingLLposLC,set:setRatingLLposLC,color:'#1d4ed8'},
              {label:'Live Load — min (neg. moment)',hint:'Moving load (min) case — for continuous spans',val:ratingLLnegLC,set:setRatingLLnegLC,color:'#7c3aed',optional:true},
            ].map(({label,hint,val,set:setter,color,optional})=>(
              <div key={label} style={{marginBottom:'10px'}}>
                <div style={{fontSize:'10px',fontFamily:'monospace',color,marginBottom:'3px',fontWeight:'500'}}>{label}{optional&&<span style={{color:'#d1d5db'}}> (optional)</span>}</div>
                <select style={{...INP,fontSize:'12px'}} value={val} onChange={e=>setter(e.target.value)}>
                  <option value="">{optional?'— none —':'— select —'}</option>
                  {Object.entries(groupedLCs).map(([grp,lcs])=>lcs.length>0?(
                    <optgroup key={grp} label={grp}>{lcs.map(lc=><option key={lc} value={lc}>{lc}</option>)}</optgroup>
                  ):null)}
                </select>
                <div style={{fontSize:'9.5px',color:'#9ca3af',fontFamily:'monospace',marginTop:'1px'}}>{hint}</div>
              </div>
            ))}
          </div>

          {/* Resistance factors */}
          <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px',flex:'1',minWidth:'280px'}}>
            <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151',marginBottom:'12px'}}>Resistance Factors</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'10px'}}>
              {/* Condition factor */}
              <div style={{gridColumn:'1/-1'}}>
                <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',marginBottom:'3px'}}>φ_c — Condition Factor (MBE Table 6A.4.2.3-2)</div>
                <select style={{...INP,fontSize:'12px'}} value={ratingCondKey} onChange={e=>setRatingCondKey(e.target.value)}>
                  {Object.entries(PHI_CONDITION).map(([k,v])=>(
                    <option key={k} value={k}>{k} → φ_c = {v}</option>
                  ))}
                </select>
              </div>
              {/* System factor */}
              <div style={{gridColumn:'1/-1'}}>
                <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',marginBottom:'3px'}}>φ_s — System Factor (MBE Table 6A.4.2.3-1)</div>
                <select style={{...INP,fontSize:'12px'}} value={ratingSysKey} onChange={e=>setRatingSysKey(e.target.value)}>
                  {Object.entries(PHI_SYSTEM).map(([k,v])=>(
                    <option key={k} value={k}>{k}{v!==null?' → φ_s = '+v:''}</option>
                  ))}
                </select>
                {ratingSysKey==='Custom'&&(
                  <input type="number" step="0.05" style={{...INP,marginTop:'4px',fontSize:'13px'}}
                    value={ratingPhiSCustom} onChange={e=>setRatingPhiSCustom(parseFloat(e.target.value)||1)}
                    placeholder="Enter φ_s"/>
                )}
              </div>
              <div>
                <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',marginBottom:'3px'}}>φ_f — Flexure</div>
                <input type="number" step="0.05" style={{...INP,fontSize:'12px'}} value={ratingPhiF} onChange={e=>setRatingPhiF(parseFloat(e.target.value)||1)}/>
              </div>
              <div>
                <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',marginBottom:'3px'}}>φ_v — Shear</div>
                <input type="number" step="0.05" style={{...INP,fontSize:'12px'}} value={ratingPhiV} onChange={e=>setRatingPhiV(parseFloat(e.target.value)||1)}/>
              </div>
            </div>
            <div style={{padding:'7px 10px',background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:'5px',fontSize:'11px',fontFamily:'monospace',color:'#166534'}}>
              φ_c={phiC} · φ_s={phiS} · φ_f={ratingPhiF} · φ_v={ratingPhiV}
              {capZones.length===1&&<> → C_M+={CmnPosPreview.toFixed(1)} ft·k &nbsp; C_M−={CmnNegPreview.toFixed(1)} ft·k &nbsp; C_V={CvnPreview.toFixed(1)} kips</>}
              {capZones.length>1&&<> · {capZones.length} capacity zones defined</>}
            </div>
          </div>
        </div>

        {/* ── Capacity Zones Editor ── */}
        <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px',marginBottom:'12px'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px',flexWrap:'wrap'}}>
            <div>
              <div style={{fontSize:'11.5px',fontWeight:'600',color:'#111827'}}>Capacity Zones</div>
              <div style={{fontSize:'11px',color:'#9ca3af',fontFamily:'monospace',marginTop:'1px'}}>
                Assign Mn⁺, Mn⁻, Vn along the span — zones don't need to match section zones
              </div>
            </div>
            <div style={{marginLeft:'auto',display:'flex',gap:'6px',flexWrap:'wrap'}}>
              {cfg?.sectionZones?.length>0&&(
                <button onClick={syncCapToSecZones} title="Create one capacity zone per section zone"
                  style={{background:'#f5f3ff',border:'1px solid #ddd6fe',borderRadius:'5px',
                    color:'#7c3aed',padding:'5px 12px',cursor:'pointer',fontSize:'11.5px'}}>
                  ⇄ Match Section Zones
                </button>
              )}
              <button onClick={addCapZone}
                style={{background:'#1d4ed8',border:'none',borderRadius:'5px',
                  color:'#fff',padding:'5px 14px',cursor:'pointer',fontSize:'12px',fontWeight:'600'}}>
                + Add Zone
              </button>
            </div>
          </div>

          {/* Zone layout bar */}
          {totalBridgeForCap>0&&capZones.length>0&&(
            <div style={{marginBottom:'12px'}}>
              <div style={{position:'relative',height:'28px',background:'#f3f4f6',borderRadius:'5px',overflow:'hidden',border:'1px solid #e5e7eb',marginBottom:'4px'}}>
                {capZones.map((z,i)=>{
                  const s=parseFloat(z.startX)/totalBridgeForCap*100;
                  const w=(parseFloat(z.endX)-parseFloat(z.startX))/totalBridgeForCap*100;
                  const colors=['#dc2626','#1d4ed8','#059669','#7c3aed','#ea580c','#0891b2'];
                  const col=colors[i%colors.length];
                  const cap=capAt((parseFloat(z.startX)+parseFloat(z.endX))/2);
                  return <div key={z.id} style={{position:'absolute',left:`${s}%`,width:`${w}%`,height:'100%',
                    background:col+'22',borderRight:'2px solid '+col,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
                    <span style={{fontSize:'9px',fontFamily:'monospace',color:col,fontWeight:'600',padding:'0 3px',whiteSpace:'nowrap'}}>
                      M+:{cap.MnPos.toFixed(0)} M−:{cap.MnNeg.toFixed(0)} V:{cap.Vn.toFixed(0)}
                    </span>
                  </div>;
                })}
              </div>
              <div style={{fontSize:'9px',fontFamily:'monospace',color:'#9ca3af',textAlign:'right'}}>
                {totalBridgeForCap.toFixed(2)} ft total · {capZones.length} zone{capZones.length!==1?'s':''}
              </div>
            </div>
          )}

          {capZones.length===0&&(
            <div style={{padding:'24px',textAlign:'center',color:'#9ca3af',fontSize:'12.5px',background:'#f9fafb',borderRadius:'6px',border:'1px dashed #e5e7eb'}}>
              No capacity zones defined. Click "+ Add Zone" or "Match Section Zones" to get started.
            </div>
          )}

          <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
            {capZones.map((z,i)=>{
              const colors=['#dc2626','#1d4ed8','#059669','#7c3aed','#ea580c','#0891b2'];
              const col=colors[i%colors.length];
              const cap=capAt((parseFloat(z.startX)+parseFloat(z.endX))/2);
              const effMnPos=phiC*phiS*ratingPhiF*cap.MnPos;
              const effMnNeg=phiC*phiS*ratingPhiF*cap.MnNeg;
              const effVn   =phiC*phiS*ratingPhiV*cap.Vn;
              // Find overlapping section zone
              const mid=(parseFloat(z.startX)+parseFloat(z.endX))/2;
              const matchSec=cfg?.sectionZones?.find(sz=>mid>=parseFloat(sz.startX)&&mid<parseFloat(sz.endX));
              return (
                <div key={z.id} style={{border:`1px solid ${col}40`,borderRadius:'7px',
                  borderLeft:`4px solid ${col}`,padding:'12px 14px',background:'#fafafa'}}>
                  {/* Zone header */}
                  <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px',flexWrap:'wrap'}}>
                    <span style={{fontSize:'11px',fontFamily:'monospace',fontWeight:'700',color:col}}>
                      Zone {i+1}
                    </span>
                    {/* X range */}
                    <div style={{display:'flex',alignItems:'center',gap:'5px'}}>
                      <input type="number" step="0.25" min="0" max={totalBridgeForCap}
                        style={{...INP2,width:'84px',textAlign:'right'}}
                        value={z.startX} onChange={e=>updateCapZone(z.id,'startX',parseFloat(e.target.value)||0)}/>
                      <span style={{fontSize:'11px',color:'#9ca3af',fontFamily:'monospace'}}>→</span>
                      <input type="number" step="0.25" min="0" max={totalBridgeForCap}
                        style={{...INP2,width:'84px',textAlign:'right'}}
                        value={z.endX} onChange={e=>updateCapZone(z.id,'endX',parseFloat(e.target.value)||totalBridgeForCap)}/>
                      <span style={{fontSize:'10px',color:'#9ca3af',fontFamily:'monospace'}}>ft</span>
                    </div>
                    {/* Type toggle */}
                    <div style={{display:'flex',borderRadius:'5px',overflow:'hidden',border:'1px solid #e5e7eb'}}>
                      {['manual','quickcalc'].map(t=>(
                        <button key={t} onClick={()=>updateCapZone(z.id,'type',t)} style={{
                          padding:'4px 10px',border:'none',cursor:'pointer',fontSize:'11px',
                          background:z.type===t?col:'#fff',color:z.type===t?'#fff':'#6b7280',fontWeight:z.type===t?'600':'400'}}>
                          {t==='manual'?'Manual':'Quick Calc'}
                        </button>
                      ))}
                    </div>
                    {/* Section zone indicator */}
                    {matchSec&&<span style={{fontSize:'9.5px',fontFamily:'monospace',color:'#9ca3af',
                      background:'#f3f4f6',padding:'2px 7px',borderRadius:'99px'}}>
                      {matchSec.name}
                    </span>}
                    {/* Import from section props button */}
                    {matchSec&&W_SHAPE_PROPS[matchSec.name]&&z.type==='quickcalc'&&(
                      <button onClick={()=>importFromSectionProps(z.id)}
                        title={`Import Zx and Aw from ${matchSec.name}`}
                        style={{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:'4px',
                          color:'#1d4ed8',padding:'3px 9px',cursor:'pointer',fontSize:'10.5px'}}>
                        ↓ From {matchSec.name}
                      </button>
                    )}
                    {capZones.length>1&&(
                      <button onClick={()=>removeCapZone(z.id)} title="Remove zone"
                        style={{marginLeft:'auto',background:'none',border:'none',color:'#d1d5db',
                          cursor:'pointer',fontSize:'16px',lineHeight:1,padding:'0 4px'}}
                        onMouseEnter={e=>e.target.style.color='#dc2626'}
                        onMouseLeave={e=>e.target.style.color='#d1d5db'}>×</button>
                    )}
                  </div>

                  {/* Capacity inputs */}
                  {z.type==='manual'?(
                    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px'}}>
                      {[['Mn⁺ (ft·k)','MnPos'],['Mn⁻ (ft·k)','MnNeg'],['Vn (kips)','Vn']].map(([lbl,field])=>(
                        <div key={field}>
                          <div style={{fontSize:'9.5px',fontFamily:'monospace',color:'#6b7280',marginBottom:'3px'}}>{lbl}</div>
                          <input type="number" step="1" style={{...INP2,fontFamily:'monospace',fontWeight:'600',fontSize:'13px'}}
                            value={z[field]||''} onChange={e=>updateCapZone(z.id,field,parseFloat(e.target.value)||0)}/>
                        </div>
                      ))}
                    </div>
                  ):(
                    <div>
                      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'6px',marginBottom:'6px'}}>
                        {[['Fy (ksi)','Fy'],['Zx⁺ (in³)','ZxPos'],['Zx⁻ (in³)','ZxNeg'],['Aw (in²)','Aw']].map(([lbl,field])=>(
                          <div key={field}>
                            <div style={{fontSize:'9.5px',fontFamily:'monospace',color:'#6b7280',marginBottom:'3px'}}>{lbl}</div>
                            <input type="number" step="0.1" style={{...INP2,fontFamily:'monospace',fontWeight:'600',fontSize:'12px'}}
                              value={z[field]||''} onChange={e=>updateCapZone(z.id,field,parseFloat(e.target.value)||0)}/>
                          </div>
                        ))}
                      </div>
                      <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280'}}>
                        → Mn⁺ = {(z.ZxPos>0?z.Fy*(z.ZxPos||0)/12:z.MnPos||0).toFixed(1)} ft·k &nbsp;
                           Mn⁻ = {(z.ZxNeg>0?z.Fy*(z.ZxNeg||0)/12:z.MnNeg||0).toFixed(1)} ft·k &nbsp;
                           Vn = {(z.Aw>0?0.6*(z.Fy||0)*(z.Aw||0):z.Vn||0).toFixed(1)} kips
                      </div>
                    </div>
                  )}

                  {/* Effective capacity after φ */}
                  <div style={{marginTop:'8px',padding:'5px 10px',background:'#f0fdf4',border:'1px solid #bbf7d0',
                    borderRadius:'4px',fontSize:'10.5px',fontFamily:'monospace',color:'#166534'}}>
                    φC → M⁺={effMnPos.toFixed(1)} &nbsp; M⁻={effMnNeg.toFixed(1)} &nbsp; V={effVn.toFixed(1)} &nbsp;
                    <span style={{color:'#9ca3af'}}>(ft·k / ft·k / kips)</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* ── Vehicle Tonnage Config ── */}
        <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'12px 16px',marginBottom:'12px',display:'flex',alignItems:'center',gap:'14px',flexWrap:'wrap'}}>
          <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151'}}>Vehicle for Rating Tonnage</div>
          <div style={{flex:'1',minWidth:'200px'}}>

            // Per MBE §6A.8: posting RF for each vehicle must use that vehicle's own LL demands.
            // Since we only have one LL result case (from the rated vehicle), we scale LL demand
            // proportionally by gross weight: LL_v ≈ LL_rated × (W_v / W_rated).
            // RF_v = (C − γDC·DC − γDW·DW) / (γLL · LL_v · LLscale)
            // This is an approximation valid when vehicle geometry is similar; note accordingly.
            const POSTING_VEHICLES = [

            // RF_rated = num / (gamLL * LL_rated * LLscale)  → num = RF_rated * gamLL * LL_rated * LLscale
            // RF_v = num / (gamLL * LL_v * LLscale) = RF_rated * LL_rated / LL_v = RF_rated * W_rated / W_v
            // → posting tons = RF_v * W_v = RF_rated * W_rated  (same for all! — the constant is C-DC-DW work)
            // More accurately for individual vehicles, also recompute per-node worst:
            const computePostRF = (W_v) => {
              if (!ratingData.length || W_rated<=0) return null;
              // Scale LL demands by weight ratio at each node, find governing RF
              const scaled = ratingData.map(p=>{
                const ratio = W_v / W_rated;
                const MllposV = p.Mllpos * ratio;
                const MllnegV = p.Mllneg * ratio;
                const VllV    = p.Vll    * ratio;
                const rfMpos = MllposV>0.001 ? (p.CmnPos - gamDC*Math.abs(p.Mdc) - gamDW*Math.abs(p.Mdw)) / (gamLL*MllposV*ratingLLScale) : null;
                const rfMneg = MllnegV>0.001 ? (p.CmnNeg - gamDC*Math.abs(p.Mdc) - gamDW*Math.abs(p.Mdw)) / (gamLL*MllnegV*ratingLLScale) : null;
                const rfV    = VllV>0.001    ? (p.Cvn    - gamDC*Math.abs(p.Vdc||0) - gamDW*Math.abs(p.Vdw||0)) / (gamLL*VllV*ratingLLScale) : null;
                return Math.min(...[rfMpos,rfMneg,rfV].filter(v=>v!==null&&isFinite(v)));
              }).filter(isFinite);
              return scaled.length ? Math.min(...scaled) : null;
            };

            return (

                      <td style={{padding:'6px 10px',color:p.rfV!==null?(p.rfV<1?'#dc2626':'#059669'):'#d1d5db'}}>{p.rfV?.toFixed(3)??'—'}</td>

                  {isReady&&<span style={{fontSize:'10.5px',fontFamily:'monospace',background:'#f0fdf4',

                    <span>Load Case</span><span style={{textAlign:'center'}}>Factor</span><span/>

                              <optgroup key={grp} label={grp}>
                                {lcs.map(lc=><option key={lc} value={lc}>{lc}</option>)}
                              </optgroup>

                        </select>
                        <input type="number" step="0.05" value={term.factor}
                          onChange={e=>updateTerm(combo.id,tKey,'factor',parseFloat(e.target.value)||0)}
                          style={{...INP,padding:'5px 8px',fontSize:'13px',fontFamily:'monospace',

                            background:Math.abs(term.factor)===1?'#fff':term.factor===0?'#f9fafb':'#fffbeb'}}/>
                        <button onClick={()=>removeTerm(combo.id,tKey)} disabled={combo.terms.length<=1}
                          style={{background:'none',border:'none',color:combo.terms.length<=1?'#e5e7eb':'#9ca3af',

                      </div>
                    );
                  })}
                </div>

                {/* Quick-add presets + add term */}
                <div style={{display:'flex',gap:'6px',flexWrap:'wrap',alignItems:'center'}}>

                  </button>

                  {[['All DC × 1.25',groupedLCs.Static||[],1.25],

                  {(groupedLCs['Moving (max)']||[]).length>0&&(

                {/* Formula preview */}
                {combo.terms.some(t=>t.lc)&&(
                  <div style={{marginTop:'10px',padding:'7px 10px',background:'#f9fafb',border:'1px solid #e5e7eb',
                    borderRadius:'5px',fontSize:'10.5px',fontFamily:'monospace',color:'#6b7280',lineHeight:'1.7',overflowX:'auto',whiteSpace:'nowrap'}}>
                    <strong style={{color:'#111827'}}>{combo.name}</strong> = {combo.terms.filter(t=>t.lc).map(t=>`${t.factor>0?'+':''}${t.factor}×[${t.lc.replace(/_[^_]+$/,'').slice(0,30)}]`).join(' ')}

        {combos.length>0&&computedRows.length>0&&(
          <div style={{marginTop:'12px'}}>
            <InfoBox>
              <strong>{computedRows.length} computed rows</strong> across {combos.filter(c=>computedRows.some(r=>r.load===c.name)).length} combination{combos.length>1?'s':''}

              Combo LCs are grouped under <em>Computed Combos</em> in all selectors.
            </InfoBox>
          </div>
        )}
      </div>)}

      {viewTab==='overlay'&&(<div>
        {/* Controls */}
        <div style={{display:'flex',gap:'14px',flexWrap:'wrap',marginBottom:'16px'}}>
          {/* LC selector */}
          <div style={{flex:'1',minWidth:'300px',background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px'}}>
            <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151',marginBottom:'10px'}}>
              Select Load Cases to Compare
              <span style={{marginLeft:'8px',fontSize:'10px',fontFamily:'monospace',color:'#9ca3af'}}>{overlayLCs.length} selected</span>
            </div>
            {Object.entries(groupedLCs).map(([grp,lcs])=>lcs.length>0?(
              <LcCheckGrid key={grp} lcs={lcs} selected={overlayLCs}
                toggle={lc=>setOverlayLCs(p=>p.includes(lc)?p.filter(x=>x!==lc):[...p,lc])} label={grp}/>
            ):null)}
            <div style={{display:'flex',gap:'6px',marginTop:'6px'}}>
              <button onClick={()=>setOverlayLCs(loadCases)} style={{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:'4px',padding:'4px 10px',cursor:'pointer',fontSize:'11px',color:'#1d4ed8'}}>All LCs</button>
              <button onClick={()=>setOverlayLCs([])} style={{background:'none',border:'none',padding:'4px 8px',cursor:'pointer',fontSize:'11px',color:'#9ca3af'}}>Clear</button>
            </div>
          </div>
          {/* Channel selector */}
          <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px',minWidth:'200px'}}>
            <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151',marginBottom:'10px'}}>Channel</div>
            <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
              {CHANNELS.map(ch=>(
                <label key={ch.key} style={{display:'flex',alignItems:'center',gap:'8px',cursor:'pointer',padding:'4px 6px',
                  borderRadius:'5px',background:overlayCh===ch.key?ch.color+'12':'transparent',
                  border:`1px solid ${overlayCh===ch.key?ch.color+'40':'transparent'}`}}>
                  <input type="radio" name="overlayCh" checked={overlayCh===ch.key}
                    onChange={()=>setOverlayCh(ch.key)} style={{accentColor:ch.color}}/>
                  <span style={{fontSize:'12px',color:overlayCh===ch.key?ch.color:'#6b7280',fontWeight:overlayCh===ch.key?'600':'400'}}>{ch.label}</span>
                  <span style={{fontSize:'10px',fontFamily:'monospace',color:'#9ca3af',marginLeft:'auto'}}>{ch.unit}</span>
                </label>
              ))}
            </div>
          </div>
        </div>

        {overlayLCs.length===0&&(
          <div style={{padding:'32px',textAlign:'center',color:'#9ca3af',fontSize:'13px',background:'#f9fafb',borderRadius:'8px',border:'1px dashed #e5e7eb'}}>
            Select two or more load cases above to overlay them on a single chart.
          </div>
        )}

        {overlayLCs.length>0&&(()=>{
          const ch = CHANNELS.find(c=>c.key===overlayCh)||CHANNELS[0];
          const OVERLAY_COLORS=['#1d4ed8','#dc2626','#7c3aed','#059669','#ea580c','#0891b2','#be123c','#b45309'];
          const cid=`overlay_${ch.key}`;
          // Peak table per LC
          const peaks = overlayLCs.map((lc,i)=>{
            const vals=rows.filter(r=>r.load===lc).map(r=>r[ch.key]);
            return {lc,color:OVERLAY_COLORS[i%OVERLAY_COLORS.length],
              max:vals.length?Math.max(...vals):0, min:vals.length?Math.min(...vals):0};
          });
          return <div>
            <ChartCard title={`${ch.label} — ${overlayLCs.length} Load Cases`} unit={ch.unit} color={ch.color}
              isPrimary chartId={cid}
              onCsvClick={()=>{
                const nodeList=[...new Set(rows.filter(r=>overlayLCs.includes(r.load)).map(r=>r.node).filter(Boolean))].sort((a,b)=>a-b);
                const headers=['Node','Position (ft)',...overlayLCs];
                const data=nodeList.map(node=>{
                  const row=overlayLCs.map(lc=>{const r=rows.find(x=>x.load===lc&&x.node===node);return r?r[ch.key].toFixed(3):'';});
                  return [node,nodePositions[node]??'',...row];
                });
                const csv=[headers,...data].map(r=>r.join(',')).join('\n');
                const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`overlay_${ch.label}.csv`;a.click();
              }}>
              <MultiOverlayChart rows={rows} loadCases={overlayLCs} field={ch.key}
                label={ch.label} unit={ch.unit} colors={OVERLAY_COLORS} nodePositions={nodePositions}/>
            </ChartCard>
            {/* Peak summary table */}
            <div style={{marginTop:'14px',background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',overflow:'hidden'}}>
              <div style={{padding:'9px 14px',background:'#f9fafb',borderBottom:'1px solid #e5e7eb',fontSize:'11.5px',fontWeight:'600',color:'#374151'}}>
                Peak Values — {ch.label} ({ch.unit})
              </div>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:'12px',fontFamily:'monospace'}}>
                <thead><tr style={{background:'#f9fafb'}}>
                  {['Load Case','Max ↑','Min ↓','Range'].map(h=><th key={h} style={{padding:'6px 14px',textAlign:'left',fontWeight:'500',color:'#6b7280',fontSize:'10px',borderBottom:'1px solid #e5e7eb'}}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {peaks.map(p=><tr key={p.lc} style={{borderBottom:'1px solid #f3f4f6'}}>
                    <td style={{padding:'7px 14px',display:'flex',alignItems:'center',gap:'7px'}}>
                      <span style={{width:'8px',height:'8px',borderRadius:'50%',background:p.color,display:'inline-block',flexShrink:0}}/>
                      <span style={{color:'#111827'}}>{p.lc.replace(/_[^_]+$/,'')}</span>
                    </td>
                    <td style={{padding:'7px 14px',color:'#059669',fontWeight:'600'}}>{p.max.toFixed(3)}</td>
                    <td style={{padding:'7px 14px',color:'#dc2626',fontWeight:'600'}}>{p.min.toFixed(3)}</td>
                    <td style={{padding:'7px 14px',color:'#6b7280'}}>{(p.max-p.min).toFixed(3)}</td>
                  </tr>)}
                </tbody>
              </table>
            </div>
          </div>;
        })()}
      </div>)}

      {/* ── TAB: LLDF CALCULATOR ───────────────────────────────────────────── */}
      {viewTab==='lldf'&&(()=>{
        const S  = parseFloat(lldfS)||8;
        const L  = parseFloat(lldfL)||0 || (cfg?.spans?.length ? Math.max(...cfg.spans) : 40);
        const ts = parseFloat(lldfTs)||8;
        const n  = parseFloat(lldfN)||8;
        const I  = parseFloat(lldfI)||0;
        const A  = parseFloat(lldfA)||0;
        const eg = parseFloat(lldfEg)||0;
        const Kg = n*(I + A*eg*eg);   // longitudinal stiffness param (in^4)
        const KgTerm = Kg>0 ? Math.pow(Kg/(12*L*Math.pow(ts,3)),0.1) : null;

        // AASHTO 4.6.2.2 — concrete deck on steel beams, interior girder
        const gM1  = 0.06 + Math.pow(S/14,0.4)*Math.pow(S/L,0.3)*(KgTerm||1);
        const gM2p = 0.075+ Math.pow(S/9.5,0.6)*Math.pow(S/L,0.2)*(KgTerm||1);
        const gV1  = 0.36 + S/25;
        const gV2p = 0.2  + S/12 - Math.pow(S/35,2);
        const govM = Math.max(gM1,gM2p);
        const govV = Math.max(gV1,gV2p);

        // Range check AASHTO Table 4.6.2.2.2b-1
        const inRange = S>=3.5&&S<=16 && L>=20&&L<=240 && ts>=4.5&&ts<=12 && n>=4&&n<=12;

        return <div>
          <div style={{display:'flex',gap:'16px',flexWrap:'wrap',marginBottom:'16px'}}>
            {/* Inputs */}
            <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'16px',flex:'1',minWidth:'280px'}}>
              <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151',marginBottom:'14px'}}>Bridge Geometry</div>
              <Field label="Beam Spacing S (ft)" hint="Center-to-center girder spacing · AASHTO range: 3.5–16 ft">
                <input type="number" step="0.25" style={INP2} value={lldfS} onChange={e=>setLldfS(e.target.value)}/>
              </Field>
              <Field label="Span Length L (ft)" hint="Span for DF calculation (0 = use longest span from geometry) · Range: 20–240 ft">
                <input type="number" step="1" style={INP2} value={lldfL} onChange={e=>setLldfL(e.target.value)}
                  placeholder={`0 = auto (${(cfg?.spans?.length?Math.max(...cfg.spans):40).toFixed(2)} ft)`}/>
              </Field>
              <Field label="Deck Slab Thickness ts (in)" hint="Structural thickness of concrete deck · Range: 4.5–12 in">
                <input type="number" step="0.25" style={INP2} value={lldfTs} onChange={e=>setLldfTs(e.target.value)}/>
              </Field>
            </div>

            <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'16px',flex:'1',minWidth:'280px'}}>
              <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151',marginBottom:'4px'}}>Longitudinal Stiffness Parameter K<sub>g</sub></div>
              <div style={{fontSize:'10.5px',color:'#9ca3af',fontFamily:'monospace',marginBottom:'10px'}}>
                K<sub>g</sub> = n(I + A·e<sub>g</sub>²) · Optional — uses 1.0 if omitted
              </div>

              {/* Auto-populate from W_SHAPE_PROPS */}
              <div style={{marginBottom:'12px',padding:'8px 10px',background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:'6px'}}>
                <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:'6px'}}>
                  Auto-fill from W-Shape
                </div>
                <div style={{display:'flex',gap:'6px',alignItems:'center'}}>
                  <select style={{...INP2,flex:1}} defaultValue=""
                    onChange={e=>{
                      const p=W_SHAPE_PROPS[e.target.value];
                      if(!p) return;
                      const [d,tw,Zx,Sx]=p;
                      // Ix ≈ Sx * d/2 (approx from Sx and d)
                      // A ≈ d*tw + 2*bf*tf but we only have d,tw — use Ix=Sx*(d/2)
                      // Better: use Sx and d to estimate Ix = Sx*(d/2)
                      const dIn=d, AwApprox=dIn*tw;
                      const IxApprox=+(Sx*(dIn/2)).toFixed(1);
                      // Area rough: Zx/Sx gives a shape factor ~1.12, area from weight not available
                      // Use Ix and depth: A ≈ 2*Ix/d (thin-web approx)
                      const AApprox=+(2*IxApprox/dIn).toFixed(2);
                      setLldfI(IxApprox);
                      setLldfA(AApprox);
                    }}>
                    <option value="">— pick a section —</option>
                    {W_SHAPES.map(s=>{
                      const p=W_SHAPE_PROPS[s];
                      return p?<option key={s} value={s}>{s} (Ix≈{(p[3]*(p[0]/2)).toFixed(0)} in⁴)</option>:null;
                    })}
                  </select>
                  <button onClick={()=>{setLldfI(0);setLldfA(0);setLldfEg(0);}}
                    title="Clear section properties"
                    style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'5px',
                      padding:'5px 8px',cursor:'pointer',fontSize:'11px',color:'#6b7280',flexShrink:0}}>
                    Clear
                  </button>
                </div>
                <div style={{fontSize:'9.5px',color:'#9ca3af',fontFamily:'monospace',marginTop:'4px'}}>
                  Ix estimated from Sx×(d/2). Enter eg manually based on deck geometry.
                </div>
              </div>

              <Field label="Modular Ratio n = Es/Ec" hint="Typically 8 for f'c=4ksi, 7 for f'c=5ksi · Range: 4–12">
                <input type="number" step="1" style={INP2} value={lldfN} onChange={e=>setLldfN(e.target.value)}/>
              </Field>
              <Field label="Moment of Inertia I (in⁴)" hint="Non-composite steel section">
                <input type="number" step="1" style={INP2} value={lldfI} onChange={e=>setLldfI(e.target.value)}/>
              </Field>
              <Field label="Cross-Section Area A (in²)">
                <input type="number" step="0.1" style={INP2} value={lldfA} onChange={e=>setLldfA(e.target.value)}/>
              </Field>
              <Field label="Eccentricity eg (in)" hint="Distance from centroid of steel to centroid of deck">
                <input type="number" step="0.25" style={INP2} value={lldfEg} onChange={e=>setLldfEg(e.target.value)}/>
              </Field>
              {Kg>0&&<div style={{padding:'8px 12px',background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:'5px',fontSize:'11.5px',fontFamily:'monospace',color:'#166534'}}>
                K<sub>g</sub> = {n.toFixed(0)} × ({I.toFixed(0)} + {A.toFixed(1)} × {eg.toFixed(2)}²) = <strong>{Kg.toFixed(0)} in⁴</strong>
                {KgTerm&&<> &nbsp;·&nbsp; (K<sub>g</sub>/12Lt<sub>s</sub>³)^0.1 = <strong>{KgTerm.toFixed(4)}</strong></>}
              </div>}
            </div>
          </div>

          {!inRange&&<div style={{padding:'8px 14px',background:'#fffbeb',border:'1px solid #fde68a',borderRadius:'6px',fontSize:'12px',color:'#92400e',marginBottom:'14px'}}>
            ⚠ One or more inputs are outside AASHTO Table 4.6.2.2.2b-1 applicability limits (S: 3.5–16 ft, L: 20–240 ft, ts: 4.5–12 in, n: 4–12). Results shown for reference only.
          </div>}

          {/* Results */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:'12px',marginBottom:'16px'}}>
            {[
              {label:'g_M (1 lane)',  formula:'0.06+(S/14)^0.4(S/L)^0.3·Kg^0.1', val:gM1,  gov:gM1>=gM2p, color:'#1d4ed8'},
              {label:'g_M (2+ lanes)',formula:'0.075+(S/9.5)^0.6(S/L)^0.2·Kg^0.1',val:gM2p, gov:gM2p>gM1,  color:'#1d4ed8'},
              {label:'g_V (1 lane)',  formula:'0.36 + S/25',                        val:gV1,  gov:gV1>=gV2p, color:'#dc2626'},
              {label:'g_V (2+ lanes)',formula:'0.2 + S/12 − (S/35)²',              val:gV2p, gov:gV2p>gV1,  color:'#dc2626'},
            ].map(({label,formula,val,gov,color})=>(
              <div key={label} style={{background:'#fff',border:`1px solid ${gov?color+'40':'#e5e7eb'}`,borderRadius:'8px',
                padding:'12px 14px',borderTop:`3px solid ${gov?color:'#e5e7eb'}`}}>
                <div style={{fontSize:'10.5px',fontFamily:'monospace',color:'#6b7280',marginBottom:'2px'}}>{label}</div>
                <div style={{fontSize:'22px',fontWeight:'700',color:gov?color:'#374151',fontFamily:'monospace'}}>{val.toFixed(4)}</div>
                <div style={{fontSize:'9px',color:'#9ca3af',fontFamily:'monospace',marginTop:'4px'}}>{formula}</div>
                {gov&&<div style={{fontSize:'9.5px',color:color,fontWeight:'600',marginTop:'4px'}}>▶ Governs</div>}
              </div>
            ))}
          </div>

          {/* Governing summary + apply button */}
          <div style={{background:'#1d4ed8',borderRadius:'8px',padding:'16px 20px',color:'#fff',display:'flex',alignItems:'center',gap:'24px',flexWrap:'wrap'}}>
            <div>
              <div style={{fontSize:'10px',opacity:0.7,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'2px'}}>Governing DF — Moment</div>
              <div style={{fontSize:'28px',fontWeight:'700',fontFamily:'monospace'}}>{govM.toFixed(4)}</div>
            </div>
            <div>
              <div style={{fontSize:'10px',opacity:0.7,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'2px'}}>Governing DF — Shear</div>
              <div style={{fontSize:'28px',fontWeight:'700',fontFamily:'monospace'}}>{govV.toFixed(4)}</div>
            </div>
            <div style={{marginLeft:'auto',display:'flex',flexDirection:'column',gap:'8px'}}>
              <button onClick={()=>{
                const newF=factors.map(f=>f.id==='df'?{...f,value:+govM.toFixed(4),enabled:true}:f);
                setFactors(newF); setViewTab('charts');
              }} style={{background:'#fff',color:'#1d4ed8',border:'none',borderRadius:'6px',
                padding:'9px 18px',cursor:'pointer',fontSize:'12.5px',fontWeight:'600'}}>
                ↑ Apply g_M={govM.toFixed(4)} to Scale Factors
              </button>
              <div style={{fontSize:'10px',opacity:0.7,textAlign:'center',fontFamily:'monospace'}}>
                AASHTO LRFD 4.6.2.2 · Interior girder · Concrete deck on steel beams
              </div>
            </div>
          </div>

          <div style={{marginTop:'12px'}}>
            <InfoBox>
              These distribution factors apply to interior girders with a cast-in-place concrete deck on steel beams (Table 4.6.2.2.2b-1).
              For exterior girders, use the lever rule for one design lane and apply the e correction factor for multiple lanes.
              The K<sub>g</sub> term may be conservatively taken as 1.0 when section properties are not available.
            </InfoBox>
          </div>
        </div>;
      })()}
    </div>
  );
}

    ratingDcLC, ratingDwLC, ratingLLposLC, ratingLLnegLC,
    ratingMethod, ratingLimitState, ratingLevel, ratingEta, chartImages }) {

  const loadCases = [...new Set((rows||[]).map(r=>r.load))];

  const css = `
