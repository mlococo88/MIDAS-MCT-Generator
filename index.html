      background:#1e293b;color:#94a3b8;padding:14px;border-radius:6px;
      white-space:pre-wrap;word-break:break-all;line-height:1.55;margin-bottom:12px;max-height:none}
    .mct-cmd{color:#60a5fa} .mct-cmt{color:#475569} .mct-val{color:#a3e635}
    .zone-bar{display:flex;height:20px;border-radius:4px;overflow:hidden;border:1px solid #e5e7eb;margin-bottom:6px}
    .section{margin-bottom:8px}
    .kv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
    .kv{background:#f8fafc;border:1px solid #e2e8f0;border-radius:5px;padding:7px 10px}
    .kv-label{font-size:8pt;color:#6b7280;text-transform:uppercase;letter-spacing:0.05em}
    .kv-val{font-size:13pt;font-weight:700;font-family:monospace;color:#1a1a1a;margin-top:1px}
    .rf-ok{color:#166534;font-weight:700} .rf-warn{color:#92400e;font-weight:700} .rf-fail{color:#991b1b;font-weight:700}
    .footer{margin-top:24px;padding-top:10px;border-top:1px solid #e5e7eb;font-size:8.5pt;color:#9ca3af;text-align:center}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .info-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:5px;padding:8px 12px;font-size:9.5pt;color:#1e40af;margin-bottom:10px}
  `;

  // ── MCT colorize helper ──
  const colorizeMCT = text => text.split('\n').map(line => {
    const esc = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (esc.startsWith(';')) return `<span class="mct-cmt">${esc}</span>`;
    if (esc.startsWith('*')) return `<span class="mct-cmd">${esc}</span>`;
    return `<span class="mct-val">${esc}</span>`;
  }).join('\n');

  // ── Node position sorted array ──
  const sortedNodes = Object.entries(nodePositions||{})
    .sort((a,b)=>a[1]-b[1])
    .map(([node,pos])=>({node:parseInt(node),pos}));

  // ── SECTION: Project Info ──
  const secProject = `
    <div class="cover">
      <h1>Bridge Rating & MCT Report</h1>
      <div style="font-size:14pt;color:#374151;margin-top:4px">${cfg.projectName||'(unnamed project)'}</div>
      ${cfg.projectBridgeId?`<div style="font-size:11pt;color:#6b7280">${cfg.projectBridgeId}</div>`:''}
      <div class="meta">
        ${[
          ['Client / Owner',  cfg.projectClient||'—'],
          ['Engineer',        cfg.projectUser||'—'],
          ['Date',            cfg.projectDate||'—'],
          ['Revision',        cfg.projectRevision||'0'],
          ['Address',         cfg.projectAddress||'—'],
          ['MIDAS Version',   cfg.version||'—'],
          ['Report Generated',now],
          ['Rating Method',   `${ratingMethod||'LRFR'} · ${ratingLimitState||'Strength I'} · ${ratingLevel||'Inventory'}`],
        ].map(([l,v])=>`<div class="meta-item"><span class="meta-label">${l}</span><span class="meta-value">${v}</span></div>`).join('')}
      </div>
      ${cfg.projectDesc?`<div style="margin-top:12px;padding:10px;background:#f8fafc;border-radius:5px;font-size:10pt;color:#374151;border-left:3px solid #1d4ed8">${cfg.projectDesc}</div>`:''}
    </div>`;

  // ── SECTION: Model Inputs ──
  const secGeometry = `
    <h2>1. Bridge Geometry</h2>
    <div class="kv-grid">
      ${[
        ['Spans',            cfg.spans?.length||0],
        ['Total Length',     totalLen.toFixed(2)+' ft'],
        ['Elements/Span',    cfg.elemsPerSpan||10],
        ['Material',         cfg.materialGrade||'A36'],
        ['Moving Load Code', cfg.movingLoadCode||'AASHTO LRFD'],
        ['Lane Name',        cfg.laneName||'—'],
        ['Lane Width',       (cfg.laneWidth||10)+' ft'],
        ['Wheel Spacing',    (cfg.laneWheelSpacing||6)+' ft'],
      ].map(([l,v])=>`<div class="kv"><div class="kv-label">${l}</div><div class="kv-val">${v}</div></div>`).join('')}
    </div>
    <table>
      <thead><tr><th>#</th><th>Span Length (ft)</th><th>Start (ft)</th><th>End (ft)</th></tr></thead>
      <tbody>
        ${(cfg.spans||[]).map((sp,i)=>{
          const s=(cfg.spans||[]).slice(0,i).reduce((a,b)=>a+b,0);
          return `<tr><td>${i+1}</td><td class="mono">${sp.toFixed(4)}</td><td class="mono">${s.toFixed(4)}</td><td class="mono">${(s+sp).toFixed(4)}</td></tr>`;
        }).join('')}
      </tbody>
    </table>`;

  const secSections = `
    <h2>2. Section Zones</h2>
    <table>
      <thead><tr><th>Zone</th><th>Start (ft)</th><th>End (ft)</th><th>Section</th><th>Type</th><th>Dimensions</th></tr></thead>
      <tbody>
        ${(cfg.sectionZones||[]).map((z,i)=>`<tr>
          <td>${i+1}</td>
          <td class="mono">${parseFloat(z.startX).toFixed(4)}</td>
          <td class="mono">${parseFloat(z.endX).toFixed(4)}</td>
          <td><strong>${z.name}</strong></td>
          <td>${z.type==='catalog'?'Catalog':'Custom Plate Girder'}</td>
          <td class="mono" style="font-size:8.5pt">${z.type==='custom'?
            `H=${z.H}" tw=${z.tw}" B1=${z.B1}" tf1=${z.tf1}" B2=${z.B2}" tf2=${z.tf2}"`:
            z.name}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;

  const secLoads = `
    <h2>3. Dead Loads</h2>
    <table>
      <thead><tr><th>Load Case Name</th><th>Type</th><th>Value (kips/ft)</th></tr></thead>
      <tbody>
        <tr><td><strong>Selfweight</strong></td><td class="mono">DC</td><td class="mono">Auto (*SELFWEIGHT)</td></tr>
        ${(cfg.deadLoads||[]).map(d=>`<tr>
          <td><strong>${d.name}</strong></td>
          <td class="mono">${d.type}</td>
          <td class="mono">${d.value>0?d.value.toFixed(6):'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;

  // Moving loads
  const secMoving = `
    <h2>4. Moving Loads</h2>
    <h3>Selected Vehicles (${(cfg.selectedVehicles||[]).length})</h3>
    <table>
      <thead><tr><th>Vehicle Name</th><th>MCT Code</th><th>DLA (%)</th><th>Group</th></tr></thead>
      <tbody>
        ${(cfg.selectedVehicles||[]).map(vn=>{
          const veh = ALL_VEHICLES.find(v=>v.name===vn);
          const dla = cfg.useGlobalDLA ? cfg.globalDLA : (cfg.vehicleDLA?.[vn]??veh?.defaultDLA??0);
          return `<tr><td>${veh?.label||vn}</td><td class="mono">${vn}</td><td class="mono">${dla}%</td><td>${veh?.group||''}</td></tr>`;
        }).join('')}
      </tbody>
    </table>`;

  // Load combos
  const secCombos = `
    <h2>5. Load Combinations</h2>
    <table>
      <thead><tr><th>Name</th><th>Kind</th><th>Active</th><th>γ_DC</th><th>γ_DW</th><th>γ_LL</th><th>Note</th></tr></thead>
      <tbody>
        ${(cfg.loadCombos||[]).map(c=>`<tr>
          <td><strong>${c.name}</strong></td>
          <td class="mono">${c.kind}</td>
          <td>${c.active?'<span class="badge badge-green">✓ Active</span>':'<span class="badge" style="background:#f3f4f6;color:#9ca3af">—</span>'}</td>
          <td class="mono">${c.dcFactor??'—'}</td>
          <td class="mono">${c.dwFactor??'—'}</td>
          <td class="mono">${c.llFactor??'—'}</td>
          <td style="font-size:9pt;color:#6b7280">${c.note||''}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;

  // ── SECTION: MCT File ──
  const secMCT = `
    <div class="page-break"></div>
    <h2>6. Generated MCT File</h2>
    <div style="font-size:9pt;color:#6b7280;margin-bottom:6px">${mctOutput.split('\n').length} lines · KIPS / FT · Generated ${now}</div>
    <div class="mct-block">${colorizeMCT(mctOutput)}</div>`;

  // ── SECTION: Results ──
  const hasResults = rows && rows.length > 0;

  const secResultsSummary = hasResults ? `
    <div class="page-break"></div>
    <h2>7. Analysis Results Overview</h2>
    <div class="kv-grid">
      ${[
        ['Total Result Rows',  rows.length],
        ['Load Cases',         loadCases.length],
        ['Nodes with Data',    Object.keys(nodePositions||{}).length],
        ['Post-Proc Combos',   (resultsCombos||[]).length],
      ].map(([l,v])=>`<div class="kv"><div class="kv-label">${l}</div><div class="kv-val">${v}</div></div>`).join('')}
    </div>
    <h3>Load Cases Present in Results</h3>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px">
      ${loadCases.map(lc=>`<span class="badge badge-blue">${lc}</span>`).join('')}
    </div>` : '';

  // Peak values table per LC
  const secPeaks = hasResults ? `
    <h3>Peak Moment (Moment-Y) and Shear (Shear-Z) by Load Case</h3>
    <table>
      <thead><tr><th>Load Case</th><th>Max M+ (ft·k)</th><th>Node</th><th>Pos (ft)</th><th>Min M− (ft·k)</th><th>Node</th><th>Pos (ft)</th><th>Max |V| (kips)</th></tr></thead>
      <tbody>
        ${loadCases.map(lc=>{
          const lcRows = rows.filter(r=>r.load===lc);
          if (!lcRows.length) return '';
          const mxM=lcRows.reduce((b,r)=>r.momentY>b.momentY?r:b,lcRows[0]);
          const mnM=lcRows.reduce((b,r)=>r.momentY<b.momentY?r:b,lcRows[0]);
          const mxV=lcRows.reduce((b,r)=>Math.abs(r.shearZ)>Math.abs(b.shearZ)?r:b,lcRows[0]);
          const pos=n=>nodePositions[n]!==undefined?nodePositions[n].toFixed(2)+'ft':'—';
          return `<tr>
            <td>${lc}</td>
            <td class="mono" style="color:#059669">${mxM.momentY.toFixed(2)}</td><td class="mono">${mxM.node||'—'}</td><td class="mono">${pos(mxM.node)}</td>
            <td class="mono" style="color:#dc2626">${mnM.momentY.toFixed(2)}</td><td class="mono">${mnM.node||'—'}</td><td class="mono">${pos(mnM.node)}</td>
            <td class="mono">${Math.abs(mxV.shearZ).toFixed(2)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>` : '';

  // Nodal results table (every node, governing LC for M and V)
  const secNodalTable = hasResults ? `
    <div class="page-break"></div>
    <h2>8. Nodal Results — All Nodes</h2>
    <p style="font-size:9pt;color:#6b7280;margin-bottom:8px">Envelope (max/min) across all loaded load cases.</p>
    <table>
      <thead><tr><th>Node</th><th>Pos (ft)</th>
        ${loadCases.slice(0,6).map(lc=>`<th colspan="2" style="text-align:center">${lc.slice(0,18)}</th>`).join('')}
        <th>Env M+ (ft·k)</th><th>Env M− (ft·k)</th><th>Env |V| (kips)</th>
      </tr>
      <tr><th></th><th></th>${loadCases.slice(0,6).map(()=>'<th>M (ft·k)</th><th>V (kips)</th>').join('')}<th></th><th></th><th></th></tr>
      </thead>
      <tbody>
        ${sortedNodes.slice(0,80).map(({node,pos})=>{
          const envMpos = Math.max(...loadCases.map(lc=>{const r=rows.find(x=>x.load===lc&&x.node===node);return r?r.momentY:-Infinity}));
          const envMneg = Math.min(...loadCases.map(lc=>{const r=rows.find(x=>x.load===lc&&x.node===node);return r?r.momentY:Infinity}));
          const envV    = Math.max(...loadCases.map(lc=>{const r=rows.find(x=>x.load===lc&&x.node===node);return r?Math.abs(r.shearZ):0}));
          return `<tr>
            <td class="mono">${node}</td>
            <td class="mono">${pos.toFixed(3)}</td>
            ${loadCases.slice(0,6).map(lc=>{
              const r=rows.find(x=>x.load===lc&&x.node===node);
              return `<td class="mono">${r?r.momentY.toFixed(2):'—'}</td><td class="mono">${r?r.shearZ.toFixed(2):'—'}</td>`;
            }).join('')}
            <td class="mono" style="color:#059669;font-weight:600">${isFinite(envMpos)?envMpos.toFixed(2):'—'}</td>
            <td class="mono" style="color:#dc2626;font-weight:600">${isFinite(envMneg)?envMneg.toFixed(2):'—'}</td>
            <td class="mono" style="font-weight:600">${envV.toFixed(2)}</td>
          </tr>`;
        }).join('')}
        ${sortedNodes.length>80?`<tr><td colspan="${6+loadCases.slice(0,6).length*2+2}" style="text-align:center;color:#9ca3af;font-style:italic;font-size:9pt">… ${sortedNodes.length-80} more nodes — export CSV from the app for full data …</td></tr>`:''}
      </tbody>
    </table>` : '';

  // ── SECTION: Rating ──
  const hasRating = ratingData && ratingData.length > 0;
  const govRating = hasRating ? ratingData.reduce((a,b)=>a.rfGov<b.rfGov?a:b, ratingData[0]) : null;

  const secRatingInputs = (ratingCapZones&&ratingCapZones.length>0) ? `
    <div class="page-break"></div>
    <h2>9. Rating — Inputs & Method</h2>
    <div class="two-col">
      <div>
        <h3>Method & Load Factors</h3>
        <table>
          <tbody>
            <tr><td>Method</td><td class="mono">${ratingMethod||'LRFR'}</td></tr>
            <tr><td>Limit State</td><td class="mono">${ratingLimitState||'Strength I'}</td></tr>
            <tr><td>Rating Level</td><td class="mono">${ratingLevel||'Inventory'}</td></tr>
            <tr><td>γ_DC</td><td class="mono">${gamDC}</td></tr>
            <tr><td>γ_DW</td><td class="mono">${gamDW}</td></tr>
            <tr><td>γ_LL</td><td class="mono">${gamLL}</td></tr>
            <tr><td>LL Scale (LLDF·IM·MPF·…)</td><td class="mono">×${(ratingLLScale||1).toFixed(4)}</td></tr>
            <tr><td>η Load Modifier</td><td class="mono">${ratingEta||1.0}</td></tr>
            <tr><td>φ_c (condition)</td><td class="mono">${phiC}</td></tr>
            <tr><td>φ_s (system)</td><td class="mono">${phiS}</td></tr>
            <tr><td>φ_f (flexure)</td><td class="mono">${ratingPhiF}</td></tr>
            <tr><td>φ_v (shear)</td><td class="mono">${ratingPhiV}</td></tr>
          </tbody>
        </table>
      </div>
      <div>
        <h3>Load Cases</h3>
        <table>
          <tbody>
            <tr><td>Dead Load DC</td><td class="mono">${ratingDcLC||'—'}</td></tr>
            <tr><td>Dead Load DW</td><td class="mono">${ratingDwLC||'(none)'}</td></tr>
            <tr><td>Live Load (pos. M)</td><td class="mono">${ratingLLposLC||'—'}</td></tr>
            <tr><td>Live Load (neg. M)</td><td class="mono">${ratingLLnegLC||'(same as max)'}</td></tr>
            <tr><td>Rating Vehicle</td><td>${ratingVehicleName||'—'}</td></tr>
            <tr><td>Vehicle Weight</td><td class="mono">${ratingVehicleTon||36} tons</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <h3>Capacity Zones</h3>
    <table>
      <thead><tr><th>Zone</th><th>Start (ft)</th><th>End (ft)</th><th>Type</th><th>Mn⁺ (ft·k)</th><th>Mn⁻ (ft·k)</th><th>Vn (kips)</th><th>φMn⁺</th><th>φMn⁻</th><th>φVn</th></tr></thead>
      <tbody>
        ${(ratingCapZones||[]).map((z,i)=>{
          const cap = capAt ? capAt((parseFloat(z.startX)+parseFloat(z.endX))/2) : {MnPos:z.MnPos,MnNeg:z.MnNeg,Vn:z.Vn};
          const pMnP=(phiC*phiS*ratingPhiF*cap.MnPos).toFixed(1);
          const pMnN=(phiC*phiS*ratingPhiF*cap.MnNeg).toFixed(1);
          const pVn=(phiC*phiS*ratingPhiV*cap.Vn).toFixed(1);
          return `<tr>
            <td>${i+1}</td>
            <td class="mono">${parseFloat(z.startX).toFixed(3)}</td>
            <td class="mono">${parseFloat(z.endX).toFixed(3)}</td>
            <td>${z.type==='quickcalc'?`Fy=${z.Fy}ksi Zx+=${z.ZxPos} Zx-=${z.ZxNeg} Aw=${z.Aw}`:'Manual'}</td>
            <td class="mono">${cap.MnPos.toFixed(1)}</td>
            <td class="mono">${cap.MnNeg.toFixed(1)}</td>
            <td class="mono">${cap.Vn.toFixed(1)}</td>
            <td class="mono" style="color:#1d4ed8"><strong>${pMnP}</strong></td>
            <td class="mono" style="color:#7c3aed"><strong>${pMnN}</strong></td>
            <td class="mono" style="color:#dc2626"><strong>${pVn}</strong></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>` : '';

  const rfCol = rf => rf>=1?'rf-ok':rf>=0.3?'rf-warn':'rf-fail';

  const secRatingResults = hasRating ? `
    <h2>${(ratingCapZones&&ratingCapZones.length>0)?'10':'9'}. Rating Factor Results</h2>
    ${govRating?`
    <div class="kv-grid">
      ${[
        ['Governing Node',    `Node ${govRating.node}`],
        ['Position',          `${govRating.pos.toFixed(2)} ft`],
        ['Controls',          govRating.governs==='M+'?'M⁺ Flexure':govRating.governs==='M-'?'M⁻ Flexure':'Shear'],
        ['Rating Factor RF',  govRating.rfGov.toFixed(3)],
        ['Rating Tonnage',    `${govRating.rfTons.toFixed(1)} tons`],
        ['Status',            govRating.rfGov>=1?'✓ Adequate':'❌ Posting Required'],
        ['φMn⁺ at gov.',      `${govRating.CmnPos} ft·k`],
        ['φVn at gov.',       `${govRating.Cvn} kips`],
        ['φ_c · φ_s',         `${phiC} · ${phiS}`],
      ].map(([l,v])=>`<div class="kv"><div class="kv-label">${l}</div><div class="kv-val ${l==='Rating Factor RF'?rfCol(govRating.rfGov):''}">${v}</div></div>`).join('')}
    </div>
    ${govRating.rfGov<1?`
    <div style="margin-bottom:14px;padding:10px 14px;background:#fee2e2;border:1px solid #fca5a5;border-radius:6px">
      <strong style="color:#991b1b">⚠ Load Posting Required — MBE §6A.8</strong><br/>
      <div style="margin-top:6px;display:flex;gap:16px;font-size:9.5pt">
        ${[['Type 3',25],['Type 3-3',40],['Type 3S2',36],[ratingVehicleName||'Rated Vehicle',ratingVehicleTon||36]]
          .filter((v,i,a)=>a.findIndex(x=>x[0]===v[0])===i)
          .map(([v,w])=>`<span><strong>${(govRating.rfGov*w).toFixed(1)} T</strong> — ${v}</span>`).join('')}
      </div>
    </div>`:''}` : ''}
    ${chartImages?.rating?`<img src="${chartImages.rating}" class="chart-img" alt="RF Diagram"/>`:''}
    <h3>Critical Locations — All Nodes by RF (Governing)</h3>
    <table>
      <thead><tr><th>Node</th><th>Pos (ft)</th><th>φMn⁺</th><th>φMn⁻</th><th>φVn</th><th>RF M⁺</th><th>RF M⁻</th><th>RF Shear</th><th>RF Gov</th><th>Tons</th><th>Controls</th><th>Status</th></tr></thead>
      <tbody>
        ${[...ratingData].sort((a,b)=>a.rfGov-b.rfGov).map(p=>{
          const col=p.rfGov>=1?'rf-ok':p.rfGov>=0.3?'rf-warn':'rf-fail';
          return `<tr>
            <td class="mono">${p.node}</td>
            <td class="mono">${p.pos.toFixed(2)}</td>
            <td class="mono" style="color:#1d4ed8">${p.CmnPos}</td>
            <td class="mono" style="color:#7c3aed">${p.CmnNeg}</td>
            <td class="mono" style="color:#dc2626">${p.Cvn}</td>
            <td class="mono ${p.rfMpos!==null&&p.rfMpos<1?'rf-fail':p.rfMpos!==null?'rf-ok':''}">${p.rfMpos?.toFixed(3)??'—'}</td>
            <td class="mono ${p.rfMneg!==null&&p.rfMneg<1?'rf-fail':p.rfMneg!==null?'rf-ok':''}">${p.rfMneg?.toFixed(3)??'—'}</td>
            <td class="mono ${p.rfV!==null&&p.rfV<1?'rf-fail':p.rfV!==null?'rf-ok':''}">${p.rfV?.toFixed(3)??'—'}</td>
            <td class="mono ${col}" style="font-weight:700">${p.rfGov.toFixed(3)}</td>
            <td class="mono ${col}">${p.rfTons.toFixed(1)}</td>
            <td class="mono">${p.governs==='M+'?'M⁺':p.governs==='M-'?'M⁻':'V'}</td>
            <td><span class="badge ${p.rfGov>=1?'badge-green':p.rfGov>=0.3?'badge-amber':'badge-red'}">${p.rfGov>=1?'✓ OK':p.rfGov>=0.3?'⚠ Post':'❌ Crit.'}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>` : '<div class="info-box">No rating data available — paste results and configure rating inputs to include rating in this report.</div>';

  const footer = `<div class="footer">Generated by MCT File Generator · ${now} · ${cfg.projectName||''} ${cfg.projectBridgeId||''}</div>`;

  // Chart images section
  const secCharts = chartImages && Object.keys(chartImages).length > 0 ? `
    <div class="page-break"></div>
    <h2>Charts</h2>
    ${chartImages.rating?`<h3>Rating Factor Diagram</h3><img src="${chartImages.rating}" class="chart-img" alt="RF Diagram"/>`:'' }
    ${Object.entries(chartImages).filter(([k])=>k!=='rating').map(([k,src])=>`
      <h3>${k}</h3><img src="${src}" class="chart-img" alt="${k}"/>`).join('')}
  ` : '';

  return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
    <title>Report — ${cfg.projectName||cfg.projectBridgeId||'Bridge'}</title>
    <style>${css}</style>
  </head><body>
    ${secProject}
    ${secGeometry}
    ${secSections}
    ${secLoads}
    ${secMoving}
    ${secCombos}
    ${secMCT}
    ${secResultsSummary}
    ${secPeaks}
    ${secNodalTable}
    ${secRatingInputs}
    ${secRatingResults}
    ${footer}
    <div class="no-print" style="position:fixed;top:12px;right:12px;display:flex;gap:8px">
      <button onclick="window.print()" style="background:#1d4ed8;color:#fff;border:none;border-radius:6px;padding:9px 20px;cursor:pointer;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.2)">🖨 Print / Save as PDF</button>
      <button onclick="window.close()" style="background:#fff;color:#374151;border:1px solid #d1d5db;border-radius:6px;padding:9px 16px;cursor:pointer;font-size:13px">✕ Close</button>
    </div>
  </body></html>`;
}

const SAVES_KEY = 'mct_saves_v1';

function loadSaves() {
  try { const s=localStorage.getItem(SAVES_KEY); return s?JSON.parse(s):[]; } catch(e){ return []; }
}
function writeSaves(saves) {
  try { localStorage.setItem(SAVES_KEY,JSON.stringify(saves)); return true; } catch(e){ return false; }
}

function SavesModal({ cfg, onLoad, onClose,
    resultsRows, setResultsRows,
    resultsCombos, setResultsCombos,
    ratingCapZones, setRatingCapZones }) {
  const [saves,          setSaves]          = useState(()=>loadSaves());
  const [saveName,       setSaveName]       = useState(cfg.projectName
    ? `${cfg.projectName}${cfg.projectBridgeId?' — '+cfg.projectBridgeId:''}`
    : cfg.projectUser ? `${cfg.projectUser} — ${cfg.spans.length} spans` : '');
  const [msg,            setMsg]            = useState('');
  const [confirmDel,     setConfirmDel]     = useState(null);
  const [confirmOverwrite, setConfirmOverwrite] = useState(null);

  const flash = m => { setMsg(m); setTimeout(()=>setMsg(''),2500); };

  const buildEntry = (existing) => {
    const entry = {
      id: existing?.id || Date.now().toString(36),
      name: existing?.name || saveName.trim(),
      savedAt: new Date().toLocaleString(),
      spans: cfg.spans.length,
      totalLen: cfg.spans.reduce((a,b)=>a+b,0).toFixed(1),
      vehicles: cfg.selectedVehicles.length,
      sections: (cfg.sectionZones||[]).length,
      hasResults: (resultsRows||[]).length>0,
      resultRows: (resultsRows||[]).length,
      projectName: cfg.projectName||'',
      bridgeId: cfg.projectBridgeId||'',
      cfg: JSON.parse(JSON.stringify(cfg)),
      resultsRows:    JSON.parse(JSON.stringify(resultsRows||[])),
      resultsCombos:  JSON.parse(JSON.stringify(resultsCombos||[])),
      ratingCapZones: JSON.parse(JSON.stringify(ratingCapZones||[])),
    };
    return entry;
  };

  const doSave = () => {
    if (!saveName.trim()) { flash('Enter a name first'); return; }
    const existing = saves.find(s=>s.name===saveName.trim());
    if (existing && !window.confirm(`"${saveName.trim()}" already exists. Overwrite?`)) return;
    let entry;
    try {
      entry = buildEntry(existing);
      // Test serialization size — fall back to cfg-only if too large
      const test = JSON.stringify([entry, ...saves.filter(s=>s.name!==saveName.trim())]);
      if (test.length > 4_500_000) throw new Error('too large');
    } catch(e) {
      // Results too large — save cfg only
      try {
        entry = {...buildEntry(existing), resultsRows:[], resultsCombos:[], ratingCapZones:[], hasResults:false, resultRows:0};
      } catch(e2) { flash('⚠ Save failed — config too large'); return; }
      flash('⚠ Results omitted (too large for browser storage) — config saved');
      const updated = [entry, ...saves.filter(s=>s.name!==saveName.trim())];
      if (writeSaves(updated)) setSaves(updated);
      return;
    }
    const updated = [entry, ...saves.filter(s=>s.name!==saveName.trim())];
    if (writeSaves(updated)) {
      setSaves(updated);
      flash(`✓ Saved "${entry.name}"${entry.hasResults ? ` · ${entry.resultRows} result rows` : ' · no results'}`);
    } else flash('⚠ localStorage full — delete old saves to free space');
  };

  const doOverwrite = (entry) => {
    let newEntry;
    try {
      newEntry = buildEntry(entry);
      const test = JSON.stringify(saves.map(s=>s.id===entry.id?newEntry:s));
      if (test.length > 4_500_000) throw new Error('too large');
    } catch(e) {
      newEntry = {...buildEntry(entry), resultsRows:[], resultsCombos:[], ratingCapZones:[], hasResults:false, resultRows:0};
    }
    const updated = saves.map(s=>s.id===entry.id ? newEntry : s);
    if (writeSaves(updated)) {
      setSaves(updated);
      setConfirmOverwrite(null);
      flash(`✓ Updated "${newEntry.name}"${newEntry.hasResults?` · ${newEntry.resultRows} rows`:''}`);
    } else flash('⚠ localStorage full');
  };

  const doLoad = (entry) => {
    if (window.confirm(`Load "${entry.name}"? Unsaved changes to the current config will be lost.`)) {
      onLoad({...DEFAULT_CFG, ...entry.cfg});
      // Restore results if they were saved
      if (entry.resultsRows && setResultsRows)     setResultsRows(entry.resultsRows);
      if (entry.resultsCombos && setResultsCombos) setResultsCombos(entry.resultsCombos);
      if (entry.ratingCapZones && setRatingCapZones) setRatingCapZones(entry.ratingCapZones);
      onClose();
    }
  };

  const doDelete = (id) => {
    const updated = saves.filter(s=>s.id!==id);
    writeSaves(updated);
    setSaves(updated);
    setConfirmDel(null);
  };

  const doExport = (entry) => {
    const blob = new Blob([JSON.stringify(entry.cfg,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${entry.name.replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'_')}_config.json`;
    a.click(); URL.revokeObjectURL(a.href);
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:'#fff',borderRadius:'12px',width:'min(700px,96vw)',maxHeight:'88vh',
        display:'flex',flexDirection:'column',boxShadow:'0 20px 60px rgba(0,0,0,0.25)',overflow:'hidden'}}>

        {/* Modal header */}
        <div style={{display:'flex',alignItems:'center',gap:'12px',padding:'18px 22px',borderBottom:'1px solid #e5e7eb',flexShrink:0}}>
          <span style={{fontSize:'20px'}}>🗂</span>
          <div>
            <div style={{fontSize:'15px',fontWeight:'600',color:'#111827'}}>Saved Configurations</div>
            <div style={{fontSize:'11px',color:'#9ca3af',fontFamily:'monospace'}}>{saves.length} save{saves.length!==1?'s':''} in browser storage</div>
          </div>
          <button onClick={onClose} title="Close" style={{marginLeft:'auto',background:'none',border:'none',
            fontSize:'20px',color:'#9ca3af',cursor:'pointer',lineHeight:1,padding:'4px'}}>×</button>
        </div>

        {/* Save current */}
        <div style={{padding:'16px 22px',borderBottom:'1px solid #e5e7eb',background:'#f9fafb',flexShrink:0}}>
          <div style={{fontSize:'11px',fontFamily:'monospace',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:'8px'}}>
            Save Current Config as New
          </div>
          <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
            <input value={saveName} onChange={e=>setSaveName(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&doSave()}
              placeholder="Enter a name for this configuration…"
              style={{flex:1,background:'#fff',border:'1px solid #d1d5db',borderRadius:'6px',padding:'8px 12px',
                fontSize:'13px',fontFamily:"'IBM Plex Sans',sans-serif",outline:'none'}}/>
            <button onClick={doSave} style={{background:'#1d4ed8',border:'none',borderRadius:'6px',
              color:'#fff',padding:'8px 18px',cursor:'pointer',fontSize:'13px',fontWeight:'600',whiteSpace:'nowrap',
              boxShadow:'0 1px 4px rgba(29,78,216,0.3)'}}>
              💾 Save
            </button>
          </div>
          {msg&&<div style={{marginTop:'7px',fontSize:'12px',fontFamily:'monospace',
            color:msg.startsWith('✓')?'#059669':msg.startsWith('⚠')?'#d97706':'#dc2626'}}>{msg}</div>}
          {/* Results status */}
          <div style={{marginTop:'8px',display:'flex',alignItems:'center',gap:'10px',flexWrap:'wrap'}}>
            {(resultsRows||[]).length>0 ? (
              <span style={{fontSize:'11px',color:'#059669',fontFamily:'monospace',display:'flex',alignItems:'center',gap:'5px'}}>
                ✓ Results will be saved &nbsp;
                <span style={{background:'#d1fae5',color:'#065f46',borderRadius:'99px',fontSize:'9.5px',padding:'1px 7px',border:'1px solid #a7f3d0'}}>
                  {resultsRows.length} rows
                </span>
                {(resultsCombos||[]).length>0&&<span style={{color:'#6b7280',fontSize:'10px'}}>· {resultsCombos.length} post-proc combo{resultsCombos.length!==1?'s':''}</span>}
                {(ratingCapZones||[]).length>0&&<span style={{color:'#6b7280',fontSize:'10px'}}>· {ratingCapZones.length} cap. zone{ratingCapZones.length!==1?'s':''}</span>}
              </span>
            ) : (
              <span style={{fontSize:'11px',color:'#9ca3af',fontFamily:'monospace'}}>
                No results loaded — paste results in Step 8 to include them
              </span>
            )}
          </div>
        </div>

        {/* Saved list */}
        <div style={{flex:1,overflowY:'auto'}}>
          {saves.length===0?(
            <div style={{padding:'40px',textAlign:'center',color:'#9ca3af',fontSize:'13px'}}>
              No saved configurations yet. Enter a name above and click Save.
            </div>
          ):(
            saves.map(entry=>(
              <div key={entry.id} style={{display:'flex',alignItems:'center',gap:'10px',
                padding:'12px 22px',borderBottom:'1px solid #f3f4f6',
                background:confirmDel===entry.id?'#fef2f2':confirmOverwrite===entry.id?'#fffbeb':'#fff',
                transition:'background 0.15s'}}>
                {/* Info */}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:'13.5px',fontWeight:'600',color:'#111827',
                    overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {entry.name}
                    {entry.hasResults&&<span style={{marginLeft:'6px',background:'#eff6ff',color:'#1d4ed8',
                      borderRadius:'99px',fontSize:'9px',padding:'1px 6px',border:'1px solid #bfdbfe',
                      fontFamily:'monospace',fontWeight:'500'}}>
                      {entry.resultRows||'?'} rows
                    </span>}
                  </div>
                  <div style={{fontSize:'10.5px',fontFamily:'monospace',color:'#9ca3af',marginTop:'2px',display:'flex',gap:'8px',flexWrap:'wrap'}}>
                    <span>{entry.spans} span{entry.spans!==1?'s':''} · {entry.totalLen} ft</span>
                    <span>·</span>
                    <span>{entry.sections} zone{entry.sections!==1?'s':''}</span>
                    <span>·</span>
                    <span>{entry.vehicles} vehicle{entry.vehicles!==1?'s':''}</span>
                    <span>·</span>
                    <span>{entry.savedAt}</span>
                  </div>
                </div>

                {/* Actions — delete confirm */}
                {confirmDel===entry.id ? (
                  <div style={{display:'flex',gap:'6px',flexShrink:0,alignItems:'center'}}>
                    <span style={{fontSize:'11.5px',color:'#dc2626'}}>Delete?</span>
                    <button onClick={()=>doDelete(entry.id)} style={{background:'#dc2626',border:'none',borderRadius:'5px',
                      color:'#fff',padding:'5px 12px',cursor:'pointer',fontSize:'12px',fontWeight:'600'}}>Yes</button>
                    <button onClick={()=>setConfirmDel(null)} style={{background:'#fff',border:'1px solid #d1d5db',borderRadius:'5px',
                      color:'#374151',padding:'5px 10px',cursor:'pointer',fontSize:'12px'}}>No</button>
                  </div>

                /* Actions — overwrite confirm */
                ) : confirmOverwrite===entry.id ? (
                  <div style={{display:'flex',gap:'6px',flexShrink:0,alignItems:'center'}}>
                    <span style={{fontSize:'11px',color:'#92400e'}}>Replace with current?</span>
                    <button onClick={()=>doOverwrite(entry)} style={{background:'#d97706',border:'none',borderRadius:'5px',
                      color:'#fff',padding:'5px 12px',cursor:'pointer',fontSize:'12px',fontWeight:'600'}}>Yes, Update</button>
                    <button onClick={()=>setConfirmOverwrite(null)} style={{background:'#fff',border:'1px solid #d1d5db',borderRadius:'5px',
                      color:'#374151',padding:'5px 10px',cursor:'pointer',fontSize:'12px'}}>Cancel</button>
                  </div>

                /* Normal action buttons */
                ) : (
                  <div style={{display:'flex',gap:'5px',flexShrink:0}}>
                    <button onClick={()=>doLoad(entry)}
                      title="Load this config into the app"
                      style={{background:'#1d4ed8',border:'none',borderRadius:'5px',
                        color:'#fff',padding:'6px 14px',cursor:'pointer',fontSize:'12px',fontWeight:'500'}}>
                      ↑ Load
                    </button>
                    <button onClick={()=>setConfirmOverwrite(entry.id)}
                      title="Overwrite this save with the current config"
                      style={{background:'#fff',border:'1px solid #d97706',borderRadius:'5px',
                        color:'#d97706',padding:'6px 10px',cursor:'pointer',fontSize:'12px',fontWeight:'500'}}>
                      ↺
                    </button>
                    <button onClick={()=>doExport(entry)} title="Export as JSON file"
                      style={{background:'#fff',border:'1px solid #d1d5db',borderRadius:'5px',
                        color:'#374151',padding:'6px 10px',cursor:'pointer',fontSize:'12px'}}>
                      ↓
                    </button>
                    <button onClick={()=>setConfirmDel(entry.id)} title="Delete this save"
                      style={{background:'#fff',border:'1px solid #fecaca',borderRadius:'5px',
                        color:'#dc2626',padding:'6px 10px',cursor:'pointer',fontSize:'12px'}}>
                      ✕
                    </button>
                  </div>
                )}
              </div>
            ))
          )}
        </div>

        {/* Footer */}
        <div style={{padding:'12px 22px',borderTop:'1px solid #e5e7eb',background:'#f9fafb',
          display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
          <div style={{fontSize:'10.5px',fontFamily:'monospace',color:'#9ca3af'}}>
            Saves store config + results in browser localStorage. Use ↓ Export for permanent JSON backup.
          </div>
          <button onClick={onClose} style={{background:'#fff',border:'1px solid #d1d5db',borderRadius:'6px',
            color:'#374151',padding:'6px 16px',cursor:'pointer',fontSize:'12.5px'}}>Close</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [step,setStep]=useState(0);
  const [cfg,setCfg]=useState(()=>{
    const migrateDC = cfg => {
      // Remap any legacy type:'DC' loads to 'DC1'
      if (!cfg.deadLoads) return cfg;
      const deadLoads = cfg.deadLoads.map(d=>d.type==='DC'?{...d,type:'DC1'}:d);
      return {...cfg, deadLoads, loadCombos: buildDefaultCombos(deadLoads)};
    };
    try{
      const s=localStorage.getItem('mct_cfg_v3');
      if(s) return migrateDC({...DEFAULT_CFG,...JSON.parse(s)});
      // Migrate from v2
      const v2=localStorage.getItem('mct_cfg_v2');
      if(v2) return migrateDC({...DEFAULT_CFG,...JSON.parse(v2)});
    }catch(e){}
    return DEFAULT_CFG;
  });
  const [savedMsg,setSavedMsg]=useState('');
  const [showSaves,setShowSaves]=useState(false);
  // ── Lifted Results state (survives step navigation) ───────────────────────
  const [resultsRows,       setResultsRows]       = useState(()=>{
    try { const s=localStorage.getItem('mct_results_v1'); return s?JSON.parse(s):[]; } catch(e){ return []; }
  });
  const [resultsRawText,    setResultsRawText]     = useState('');
  const [resultsMode,       setResultsMode]        = useState(()=>{ try { const s=localStorage.getItem('mct_results_v1'); return s?'view':'paste'; } catch(e){ return 'paste'; }});
  const [resultsSelectedLC, setResultsSelectedLC]  = useState('');
  const [resultsCfgSnap,    setResultsCfgSnap]     = useState(()=>{ try { return localStorage.getItem('mct_results_snap_v1')||null; } catch(e){ return null; }});
  const [resultsCombos,     setResultsCombos]      = useState(()=>{ try { const s=localStorage.getItem('mct_results_combos_v1'); return s?JSON.parse(s):[]; } catch(e){ return []; }});
  const [ratingCapZones,    setRatingCapZones]      = useState(()=>{ try { const s=localStorage.getItem('mct_cap_zones_v1'); return s?JSON.parse(s):[]; } catch(e){ return []; }});
  const [reportState,       setReportState]         = useState(null);
  const set=(k,v)=>setCfg(p=>({...p,[k]:v}));
  const loadCfg = newCfg => { setCfg({...DEFAULT_CFG,...newCfg}); setSavedMsg('Loaded!'); setTimeout(()=>setSavedMsg(''),2000); };

  // Auto-sync dlc_* combos whenever dead loads change (name, type, add, remove)
  // Keeps AASHTO presets and custom combos intact — only replaces dlc_* entries
  const deadLoadsKey = JSON.stringify((cfg.deadLoads||[]).map(d=>({id:d.id,name:d.name,type:d.type})));
  useEffect(()=>{
    setCfg(prev=>{
      // Remap any legacy type:'DC' to 'DC1' before rebuilding combos
      const deadLoads = (prev.deadLoads||[]).map(d=>d.type==='DC'?{...d,type:'DC1'}:d);
      const currentCombos = prev.loadCombos || [];
      const freshDL = buildDeadLoadCombos(deadLoads);
      const kept = currentCombos.filter(c=>!c.id?.startsWith('dlc_'));
      return {...prev, deadLoads, loadCombos:[...freshDL, ...kept]};
    });
  }, [deadLoadsKey]);

  useEffect(()=>{
    try{localStorage.setItem('mct_cfg_v3',JSON.stringify(cfg));}catch(e){}
  },[cfg]);

  // Auto-save results state to localStorage so they survive page refresh
  useEffect(()=>{
    try {
      if (resultsRows.length > 0) {
        localStorage.setItem('mct_results_v1', JSON.stringify(resultsRows));
      } else {
        localStorage.removeItem('mct_results_v1');
      }
    } catch(e) {
      // Results too large for localStorage — silently skip (still saved in named saves)
      console.warn('Results too large for auto-save:', e);
    }
  },[resultsRows]);

  useEffect(()=>{
    try {
      if (resultsCombos.length > 0)
        localStorage.setItem('mct_results_combos_v1', JSON.stringify(resultsCombos));
      else
        localStorage.removeItem('mct_results_combos_v1');
    } catch(e) {}
  },[resultsCombos]);

  useEffect(()=>{
    try {
      if (ratingCapZones.length > 0)
        localStorage.setItem('mct_cap_zones_v1', JSON.stringify(ratingCapZones));
      else
        localStorage.removeItem('mct_cap_zones_v1');
    } catch(e) {}
  },[ratingCapZones]);

  useEffect(()=>{
    try {
      if (resultsCfgSnap)
        localStorage.setItem('mct_results_snap_v1', resultsCfgSnap);
      else
        localStorage.removeItem('mct_results_snap_v1');
    } catch(e) {}
  },[resultsCfgSnap]);

  const loadDefault=()=>{if(window.confirm('Reset all inputs to defaults?'))setCfg(DEFAULT_CFG);};
  const exportJSON=()=>{
    const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=`${cfg.projectUser}_mct_config.json`;a.click();URL.revokeObjectURL(url);
  };
  const importJSON=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();reader.onload=ev=>{
      try{const loaded=JSON.parse(ev.target.result);setCfg({...DEFAULT_CFG,...loaded});setSavedMsg('Loaded!');}
      catch(err){alert('Invalid JSON file');}
    };reader.readAsText(file);
    e.target.value='';
  };
  const mctOutput=useMemo(()=>generateMCT(cfg),[cfg]);
  const downloadMCT=()=>{
    const blob=new Blob([mctOutput],{type:'text/plain'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;
    a.download=`${cfg.projectUser.replace(/\s+/g,'_')}_Bridge_Model.mct`;a.click();
    URL.revokeObjectURL(url);
  };

  // Collect chart canvas images from the DOM
  const captureCharts = () => {
    const images = {};
    // Rating chart
    const ratingCanvas = document.querySelector('[data-chartid="rating-chart"] canvas');
    if (ratingCanvas) {
      const chart = Chart.getChart(ratingCanvas);
      if (chart) images.rating = chart.toBase64Image();
    }
    // Any other visible charts (per load case, envelope, etc.)
    document.querySelectorAll('[data-chartid]').forEach(el => {
      const id = el.getAttribute('data-chartid');
      if (id === 'rating-chart') return;
      const canvas = el.querySelector('canvas');
      if (canvas) {
        const chart = Chart.getChart(canvas);
        if (chart) images[id] = chart.toBase64Image();
      }
    });
    return images;
  };

  const generateReport = () => {
    const chartImages = captureCharts();
    const rs = reportState || {};
    const html = generateReportHTML({
      cfg, mctOutput,
      rows: resultsRows,
      nodePositions:    rs.nodePositions    || {},
      ratingData:       rs.ratingData       || [],
      ratingCapZones,
      resultsCombos,
      capAt:            rs.capAt            || null,
      phiC:             rs.phiC             ?? 1,
      phiS:             rs.phiS             ?? 1,
      ratingPhiF:       rs.ratingPhiF       ?? 1,
      ratingPhiV:       rs.ratingPhiV       ?? 1,
      gamDC:            rs.gamDC            ?? 1.25,
      gamDW:            rs.gamDW            ?? 1.50,
      gamLL:            rs.gamLL            ?? 1.75,
      ratingLLScale:    rs.ratingLLScale    ?? 1,
      ratingEta:        rs.ratingEta        ?? 1,
      ratingVehicleTon: rs.ratingVehicleTon ?? 36,
      ratingVehicleName:rs.ratingVehicleName|| 'HL-93',
      ratingDcLC:       rs.ratingDcLC       || '',
      ratingDwLC:       rs.ratingDwLC       || '',
      ratingLLposLC:    rs.ratingLLposLC    || '',
      ratingLLnegLC:    rs.ratingLLnegLC    || '',
      ratingMethod:     rs.ratingMethod     || 'LRFR',
      ratingLimitState: rs.ratingLimitState || 'Strength I',
      ratingLevel:      rs.ratingLevel      || 'Inventory',
      chartImages,
    });
    const win = window.open('', '_blank');
    if (win) { win.document.write(html); win.document.close(); }
    else alert('Pop-up blocked — please allow pop-ups for this page and try again.');
  };
  const totalLen=cfg.spans.reduce((a,b)=>a+b,0);
  const steps=[<StepProject cfg={cfg} set={set}/>,<StepGeometry cfg={cfg} set={set}/>,
    <StepSections cfg={cfg} set={set}/>,<StepLoads cfg={cfg} set={set}/>,
    <StepMovingLoads cfg={cfg} set={set}/>,<StepCombos cfg={cfg} set={set}/>,
    <StepGenerate mctOutput={mctOutput} downloadMCT={downloadMCT} cfg={cfg}/>,
    <StepResults cfg={cfg}
      rows={resultsRows}         setRows={setResultsRows}
      rawText={resultsRawText}   setRawText={setResultsRawText}
      mode={resultsMode}         setMode={setResultsMode}
      selectedLoadProp={resultsSelectedLC} setSelectedLoadProp={setResultsSelectedLC}
      cfgSnap={resultsCfgSnap}   setCfgSnap={setResultsCfgSnap}
      resultsCombos={resultsCombos} setResultsCombos={setResultsCombos}
      ratingCapZones={ratingCapZones} setRatingCapZones={setRatingCapZones}
      onReportState={setReportState}
    />];

  return (
    <div style={{minHeight:'100vh',background:'#f0f2f5',fontFamily:"'IBM Plex Sans',system-ui,sans-serif",display:'flex',flexDirection:'column'}}>
      {/* Header */}
      <header style={{background:'#fff',borderBottom:'1px solid #e5e7eb',padding:'0 24px',
        display:'flex',alignItems:'center',gap:'16px',height:'56px',flexShrink:0,boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}}>
        <div style={{width:'36px',height:'36px',background:'#1d4ed8',borderRadius:'8px',
          display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px',flexShrink:0}}>⬡</div>
        <div>
          <div style={{fontSize:'15px',fontWeight:'600',color:'#111827',letterSpacing:'-0.01em'}}>MIDAS Civil · MCT File Generator</div>
          <div style={{fontSize:'10px',color:'#9ca3af',fontFamily:"'IBM Plex Mono',monospace"}}>
            {cfg.projectName||cfg.projectBridgeId
              ? `${cfg.projectName||''}${cfg.projectName&&cfg.projectBridgeId?' · ':''}${cfg.projectBridgeId||''}`
              : 'Bridge Beam Model Builder · v1.0'}
          </div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:'12px'}}>
          <div style={{display:'flex',gap:'12px',fontSize:'11.5px',fontFamily:'monospace',color:'#6b7280',
            background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:'6px',padding:'6px 14px'}}>
            <span>{cfg.spans.length} spans</span><span style={{color:'#d1d5db'}}>·</span>
            <span>{totalLen.toFixed(1)} ft</span><span style={{color:'#d1d5db'}}>·</span>
            <span>{cfg.spans.length*cfg.elemsPerSpan} elements</span><span style={{color:'#d1d5db'}}>·</span>
            <span>{cfg.selectedVehicles.length} vehicles</span>
          </div>
          <button onClick={downloadMCT} style={{background:'#1d4ed8',border:'none',borderRadius:'6px',
            color:'#fff',padding:'7px 16px',cursor:'pointer',fontSize:'12.5px',fontWeight:'500',
            boxShadow:'0 1px 4px rgba(29,78,216,0.3)'}}>↓ Download MCT</button>
        </div>
      </header>

      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        {/* Sidebar */}
        <nav style={{width:'196px',background:'#fff',borderRight:'1px solid #e5e7eb',padding:'16px 10px',
          display:'flex',flexDirection:'column',gap:'2px',flexShrink:0}}>
          <div style={{fontSize:'9.5px',fontFamily:'monospace',color:'#9ca3af',textTransform:'uppercase',
            letterSpacing:'0.1em',marginBottom:'8px',paddingLeft:'8px'}}>Configuration</div>
          {STEPS.map((label,idx)=>{
            const isActive=step===idx,isDone=step>idx;
            return (<button key={idx} onClick={()=>setStep(idx)} style={{
              background:isActive?'#eff6ff':'transparent',border:`1px solid ${isActive?'#bfdbfe':'transparent'}`,
              borderRadius:'6px',color:isActive?'#1d4ed8':isDone?'#059669':'#6b7280',
              padding:'8px 10px',textAlign:'left',cursor:'pointer',fontSize:'12.5px',
              fontFamily:"'IBM Plex Sans',sans-serif",fontWeight:isActive?'600':'400',
              display:'flex',alignItems:'center',gap:'9px',width:'100%',transition:'all 0.12s'}}>
              <span style={{width:'20px',height:'20px',borderRadius:'50%',flexShrink:0,
                background:isDone?'#059669':isActive?'#1d4ed8':'#f3f4f6',
                border:`1px solid ${isDone?'#059669':isActive?'#1d4ed8':'#e5e7eb'}`,
                display:'flex',alignItems:'center',justifyContent:'center',
                fontSize:'9px',color:isDone||isActive?'#fff':'#9ca3af'}}>
                {isDone?'✓':STEP_ICONS[idx]}
              </span>
              {label}
            </button>);
          })}
          <div style={{marginTop:'auto',paddingTop:'12px',borderTop:'1px solid #f3f4f6',display:'flex',flexDirection:'column',gap:'5px'}}>
            <div style={{fontSize:'10px',fontFamily:'monospace',color:'#9ca3af',marginBottom:'4px',paddingLeft:'2px'}}>
              {cfg.selectedVehicles.length} vehicle{cfg.selectedVehicles.length!==1?'s':''}&nbsp;·&nbsp;{mctOutput.split('\n').length} lines
            </div>
            <button onClick={downloadMCT} style={{background:'#1d4ed8',border:'none',borderRadius:'6px',
              color:'#fff',padding:'7px 10px',cursor:'pointer',fontSize:'12px',width:'100%',fontWeight:'500'}}>
              ↓ Download MCT
            </button>
            <button onClick={generateReport} style={{background:'#059669',border:'none',borderRadius:'6px',
              color:'#fff',padding:'7px 10px',cursor:'pointer',fontSize:'12px',width:'100%',fontWeight:'500'}}>
              📄 Generate Report
            </button>
            <button onClick={()=>setShowSaves(true)} style={{background:'#fff',border:'1px solid #d1d5db',
              borderRadius:'6px',color:'#374151',padding:'6px 10px',cursor:'pointer',
              fontSize:'11.5px',width:'100%',fontWeight:'500',display:'flex',alignItems:'center',justifyContent:'center',gap:'5px'}}>
              🗂 Saved Configs
              {loadSaves().length>0&&<span style={{background:'#1d4ed8',color:'#fff',borderRadius:'99px',
                fontSize:'9.5px',padding:'1px 5px',fontWeight:'700'}}>{loadSaves().length}</span>}
            </button>
            <div style={{display:'flex',gap:'4px'}}>
              <button onClick={exportJSON} style={{background:'#fff',border:'1px solid #d1d5db',borderRadius:'5px',
                color:'#374151',padding:'5px 0',cursor:'pointer',fontSize:'11px',flex:1}}>⬆ Export</button>
              <label style={{background:'#fff',border:'1px solid #d1d5db',borderRadius:'5px',
                color:'#374151',padding:'5px 0',cursor:'pointer',fontSize:'11px',flex:1,textAlign:'center',display:'block'}}>
                ⬇ Import<input type="file" accept=".json" onChange={importJSON} style={{display:'none'}}/>
              </label>
            </div>
            <button onClick={loadDefault} style={{background:'none',border:'none',color:'#d1d5db',
              padding:'4px',cursor:'pointer',fontSize:'10.5px',width:'100%',textAlign:'center'}}>
              reset to defaults
            </button>
          </div>
        </nav>

        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          {/* Schematic */}
          <div style={{background:'#fff',borderBottom:'1px solid #e5e7eb',padding:'10px 24px 6px',flexShrink:0}}>
            <div style={{display:'flex',alignItems:'baseline',gap:'10px',marginBottom:'4px'}}>
              <div style={{fontSize:'9.5px',fontFamily:'monospace',color:'#9ca3af',textTransform:'uppercase',letterSpacing:'0.1em'}}>Live Preview</div>
              {/* Zone color legend */}
              {(()=>{
                const zones = cfg.sectionZones||[];
                const secIdMap={[cfg.section1Name]:1};let nid=2;
                zones.forEach(z=>{if(!secIdMap[z.name])secIdMap[z.name]=nid++;});
                const unique=[...new Set(zones.map(z=>z.name))];
                return unique.length>0?(
                  <div style={{display:'flex',gap:'10px',flexWrap:'wrap',marginLeft:'8px'}}>
                    {unique.map(name=>{
                      const id=secIdMap[name]||2;
                      const col=SEC_COLORS[(id-1)%SEC_COLORS.length];
                      return <div key={name} style={{display:'flex',alignItems:'center',gap:'4px'}}>
                        <div style={{width:'10px',height:'5px',background:col,borderRadius:'1px',opacity:0.7}}/>
                        <span style={{fontSize:'9px',fontFamily:'monospace',color:'#6b7280'}}>{name}</span>
                      </div>;
                    })}
                  </div>
                ):null;
              })()}
            </div>
            <div style={{height:'88px'}}><BridgeSchematic spans={cfg.spans} elemsPerSpan={cfg.elemsPerSpan} sectionZones={cfg.sectionZones}/></div>
          </div>
          {/* Form */}
          <div style={{flex:1,overflowY:'auto',padding:'24px 32px'}}>{steps[step]}</div>
          {/* Footer */}
          <footer style={{background:'#fff',borderTop:'1px solid #e5e7eb',padding:'12px 32px',
            display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
            <button onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0} style={{
              background:'transparent',border:`1px solid ${step===0?'#f3f4f6':'#d1d5db'}`,
              borderRadius:'6px',color:step===0?'#d1d5db':'#374151',
              padding:'7px 18px',cursor:step===0?'default':'pointer',fontSize:'13px'}}>← Back</button>
            <div style={{display:'flex',gap:'5px',alignItems:'center'}}>
              {STEPS.map((_,i)=>(<div key={i} onClick={()=>setStep(i)} style={{
                width:i===step?'22px':'6px',height:'6px',borderRadius:'3px',
                background:i===step?'#1d4ed8':i<step?'#6ee7b7':'#e5e7eb',cursor:'pointer',transition:'all 0.2s'}}/>))}
            </div>
            {step<STEPS.length-1
              ?<button onClick={()=>setStep(s=>s+1)} style={{background:'#1d4ed8',border:'none',borderRadius:'6px',
                  color:'#fff',padding:'7px 22px',cursor:'pointer',fontSize:'13px',fontWeight:'500',
                  boxShadow:'0 1px 4px rgba(29,78,216,0.25)'}}>Next →</button>
              :<button onClick={downloadMCT} style={{background:'#059669',border:'none',borderRadius:'6px',
                  color:'#fff',padding:'7px 22px',cursor:'pointer',fontSize:'13px',fontWeight:'600',
                  boxShadow:'0 1px 4px rgba(5,150,105,0.3)'}}>↓ Download MCT</button>
            }
          </footer>
        </div>
      </div>
      {showSaves&&<SavesModal cfg={cfg} onLoad={loadCfg} onClose={()=>setShowSaves(false)}
        resultsRows={resultsRows}         setResultsRows={setResultsRows}
        resultsCombos={resultsCombos}     setResultsCombos={setResultsCombos}
        ratingCapZones={ratingCapZones}   setRatingCapZones={setRatingCapZones}
      />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
