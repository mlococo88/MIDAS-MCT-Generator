// Compute equivalent MIDAS H-section from AREMA built-up section.
//
// Goal: symmetric I-shape with tf1 = tf2 = tf (both equal), adjusted so that
//       the equivalent Ix matches the actual gross Ix of the built-up section.
//       Total depth D_total and web thickness tw are preserved exactly.
//
// MIDAS DBUSER H section MCT parameter order:
//   H_total, B1, tw, tf1, B2, tf2, r1, r2
//   where H_total = TOTAL section depth (tf1 + web_clear + tf2)
//   and web_clear = H_total - tf1 - tf2
//
// Binary-search variable: tf (both flanges equal).
//   With D and tw fixed:  hw_clear = D - 2*tf
//   Ix = tw*(D-2tf)³/12 + 2*(B*tf³/12 + B*tf*((D-tf)/2)²)
//   Ix is monotonically increasing in tf for typical girder proportions (B >> tw).
//
function computeEquivMCTSection(sec, zDef) {
  const D   = sec.totalDepth;   // total depth (in) — used as MIDAS H parameter
  const IxG = sec.IxG;          // target gross Ix (in⁴)

  const comps  = (zDef && zDef.aremaComps) ? zDef.aremaComps : defaultAremaComps();
  const webC   = comps.find(c => c.id === 'web') || {};
  const tcpC   = comps.find(c => c.id === 'tcp');
  const bcpC   = comps.find(c => c.id === 'bcp');
  const tanC   = comps.find(c => c.id === 'tan');
  const banC   = comps.find(c => c.id === 'ban');

  const tw_act = Math.max(+(webC.w || 0.5), 0.01);   // actual web plate thickness (in)

  const B_tcp = (tcpC?.on && +tcpC.w > 0) ? +tcpC.w : 0;
  const B_bcp = (bcpC?.on && +bcpC.w > 0) ? +bcpC.w : 0;
  const B_ang = Math.max((tanC?.on ? +tanC.w : 0), (banC?.on ? +banC.w : 0));
  const B_act = Math.max(B_tcp, B_bcp) || B_ang * 2 || D * 0.5;

  // Binary search: find tf so that Ix_equiv = IxG
  // hw_clear = D - 2*tf  (shrinks as tf grows)
  // Ix = tw*hw³/12 + 2*(B*tf³/12 + B*tf*((D-tf)/2)²)
  // For typical proportions (B >> tw), Ix increases with tf → standard bisection applies.
  const ixOf = (tf) => {
    const hw = Math.max(D - 2*tf, 0.01);
    return tw_act*hw**3/12 + 2*(B_act*tf**3/12 + B_act*tf*((D-tf)/2)**2);
  };
  let tfLo = 0.01, tfHi = Math.min((D - 0.1)/2, D/2 - 0.01);
  // If target is below minimum achievable (very thin flanges), clamp to minimum
  if (ixOf(tfLo) > IxG) tfHi = tfLo;
  else if (ixOf(tfHi) < IxG) tfLo = tfHi;
  else {
    for (let i = 0; i < 80; i++) {
      const tfMid = (tfLo + tfHi) / 2;
      if (ixOf(tfMid) < IxG) tfLo = tfMid; else tfHi = tfMid;
      if ((tfHi - tfLo) < 0.0001) break;
    }
  }
  const tf  = (tfLo + tfHi) / 2;
  const hw  = Math.max(D - 2*tf, 0.01);  // resulting clear web height

  const ft = v => (v / 12).toFixed(6);   // in → ft, 6 dp for MIDAS precision

  // Return using MIDAS H-section MCT parameter names:
  //   H = D_total (total section height)
  //   B1 = B2 = flange width
  //   tw = web thickness  (MCT position 3)
  //   tf1 = tf2 = tf      (MCT position 4/6)
  return {
    H:ft(D), B1:ft(B_act), tw:ft(tw_act), tf1:ft(tf), B2:ft(B_act), tf2:ft(tf),
    _D:D, _hw:hw, _tf:tf, _tw:tw_act, _B:B_act
  };
}

// AREMA LOAD RATING REPORT GENERATOR
// Opens a formatted engineering report in a new window for printing to PDF.
// ═══════════════════════════════════════════════════════════════════════════
function generateAremaReport({cfg, ap, data, govN, govX, govM, govFat}) {
  const f = (v,d=2)=>v!=null&&isFinite(v)?Number(v).toFixed(d):'—';
  const rfC = rf=>rf>=1?'#15803d':rf>=0.5?'#d97706':'#dc2626';
  const rfLbl = rf=>isFinite(rf)?(rf>=1?'PASS':'FAIL'):'—';
  const today = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const spans = cfg?.spans||[];
  const totalLen = spans.reduce((a,b)=>a+b,0);
  const sec  = govN?.sec;
  const allo = govN?.allo;

  // ── Bridge elevation SVG ──────────────────────────────────────────────────
  const W=680,H=80,PL=30,PR=30;
  const xPx=x=>PL+(x/totalLen)*(W-PL-PR);
  let cumX=0;
  const spanSegs=spans.map((s,i)=>{const x0=cumX;cumX+=s;return{i,x0,x1:cumX,L:s};});
  const bridgeSVG=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:680px">
    <line x1="${PL}" y1="40" x2="${W-PR}" y2="40" stroke="#374151" stroke-width="3"/>
    ${spanSegs.map(s=>`
      <rect x="${xPx(s.x0)+2}" y="36" width="${xPx(s.x1)-xPx(s.x0)-4}" height="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
      <text x="${(xPx(s.x0)+xPx(s.x1))/2}" y="33" text-anchor="middle" font-size="9" font-family="monospace" fill="#1d4ed8">Span ${s.i+1}: ${s.L} ft</text>
      <line x1="${xPx(s.x0)}" y1="36" x2="${xPx(s.x0)-8}" y2="56" stroke="#374151" stroke-width="2"/>
      <line x1="${xPx(s.x0)}" y1="36" x2="${xPx(s.x0)+8}" y2="56" stroke="#374151" stroke-width="2"/>
      <line x1="${xPx(s.x0)-10}" y1="56" x2="${xPx(s.x0)+10}" y2="56" stroke="#374151" stroke-width="2"/>
    `).join('')}
    <line x1="${xPx(totalLen)}" y1="36" x2="${xPx(totalLen)-8}" y2="56" stroke="#374151" stroke-width="2"/>
    <line x1="${xPx(totalLen)}" y1="36" x2="${xPx(totalLen)+8}" y2="56" stroke="#374151" stroke-width="2"/>
    <line x1="${xPx(totalLen)-10}" y1="56" x2="${xPx(totalLen)+10}" y2="56" stroke="#374151" stroke-width="2"/>
    ${data.map(p=>`<circle cx="${xPx(p.pos)}" cy="40" r="2" fill="#6b7280" opacity="0.6"/>`).join('')}
    <text x="${PL}" y="70" font-size="8" font-family="monospace" fill="#6b7280">0 ft</text>
    <text x="${W-PR}" y="70" font-size="8" font-family="monospace" fill="#6b7280" text-anchor="end">${f(totalLen,1)} ft</text>
    <text x="${W/2}" y="72" font-size="8" font-family="monospace" fill="#9ca3af" text-anchor="middle">Total: ${f(totalLen,2)} ft · ${data.length} nodes · ${spans.length} span(s)</text>
  </svg>`;

  // ── Cross-section SVG (from governing node) ───────────────────────────────
  const AS = cfg?.aremaSection||{};
  const lib = AS.sectionLibrary||[];
  const secSVGs = lib.map(libSec=>{
    try{
      const zDef={...AS,...libSec};
      const s=computeAremaSection(zDef, false);  // MCT: always nominal
      const secInsp = (libSec.sectionLossEnabled && aremaApplyLoss)
        ? computeAremaSection(zDef, true) : null;
      return {name:libSec.name||libSec.id, svg:aremaGirderSVG(zDef,s), sec:s,
              secInsp, allo:aremaAllowables(zDef,s), zDef};
    }catch(e){return null;}
  }).filter(Boolean);

  // ── RF Envelope SVG ───────────────────────────────────────────────────────
  const CW=620,CH=180,CPL=50,CPR=20,CPT=15,CPB=30;
  const cW=CW-CPL-CPR,cH=CH-CPT-CPB;
  const xs=data.map(p=>p.pos);
  const xMin=xs[0]||0,xMax=xs[xs.length-1]||1,xRng=xMax-xMin||1;
  const rfAll=data.flatMap(p=>[p.gN,p.gX,p.gM,p.rfFat].filter(v=>v!=null&&isFinite(v)));
  const rfMin=Math.min(0,...rfAll),rfMax=Math.max(2,...rfAll),rfRng=rfMax-rfMin||1;
  const cxPx=x=>CPL+(x-xMin)/xRng*cW, cyPx=r=>CPT+cH-(r-rfMin)/rfRng*cH;
  const mkPoly=(key,clr)=>{
    const pts=data.filter(p=>p[key]!=null&&isFinite(p[key])).map(p=>`${cxPx(p.pos).toFixed(1)},${cyPx(p[key]).toFixed(1)}`);
    return pts.length?`<polyline points="${pts.join(' ')}" fill="none" stroke="${clr}" stroke-width="2"/>`:'';
  };
  const y1=cyPx(1);
  const yTks=[]; for(let r=Math.ceil(rfMin*2)/2;r<=rfMax+0.01;r+=0.5) yTks.push(r);
  const envelopeSVG=`<svg viewBox="0 0 ${CW} ${CH}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:680px;background:#fff">
    ${yTks.map(r=>`<line x1="${CPL}" y1="${cyPx(r).toFixed(1)}" x2="${CW-CPR}" y2="${cyPx(r).toFixed(1)}" stroke="#f3f4f6" stroke-width="1"/>
      <text x="${CPL-4}" y="${cyPx(r).toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="8" font-family="monospace" fill="#9ca3af">${r.toFixed(1)}</text>`).join('')}
    ${y1>=CPT&&y1<=CH-CPB?`<line x1="${CPL}" y1="${y1.toFixed(1)}" x2="${CW-CPR}" y2="${y1.toFixed(1)}" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
      <text x="${CW-CPR+3}" y="${y1.toFixed(1)}" dominant-baseline="middle" font-size="8" font-family="monospace" fill="#dc2626" font-weight="bold">RF=1.0</text>`:''}
    ${y1>=CPT&&y1<=CH-CPB?`<rect x="${CPL}" y="${y1.toFixed(1)}" width="${cW}" height="${(CH-CPB-y1).toFixed(1)}" fill="#fee2e2" opacity="0.3"/>`:''}
    ${mkPoly('gN','#16a34a')}${mkPoly('gX','#c2410c')}${mkPoly('gM','#d97706')}${mkPoly('rfFat','#7e22ce')}
    ${data.map(p=>[['gN','#16a34a'],['gX','#c2410c'],['gM','#d97706'],['rfFat','#7e22ce']].map(([k,c])=>p[k]!=null&&isFinite(p[k])?`<circle cx="${cxPx(p.pos).toFixed(1)}" cy="${cyPx(p[k]).toFixed(1)}" r="2.5" fill="${c}" opacity="0.7"/>`:''  ).join('')).join('')}
    <line x1="${CPL}" y1="${CH-CPB}" x2="${CW-CPR}" y2="${CH-CPB}" stroke="#d1d5db" stroke-width="1"/>
    <text x="${CPL}" y="${CH-CPB+12}" font-size="8" font-family="monospace" fill="#9ca3af">${xMin.toFixed(1)} ft</text>
    <text x="${CW-CPR}" y="${CH-CPB+12}" font-size="8" font-family="monospace" fill="#9ca3af" text-anchor="end">${xMax.toFixed(1)} ft</text>
    <text x="${CW/2}" y="${CH-2}" text-anchor="middle" font-size="8" font-family="monospace" fill="#9ca3af">Position along span (ft)</text>
  </svg>`;

  // ── Helpers ───────────────────────────────────────────────────────────────
  const TH = (txt,{align='center',bg='#f3f4f6',color='#374151',span=1}={})=>
    `<th colspan="${span}" style="padding:4px 7px;border:1px solid #d1d5db;background:${bg};color:${color};text-align:${align};font-size:8pt;font-weight:600;white-space:nowrap">${txt}</th>`;
  const TD = (txt,{align='right',bg='',bold=false,color=''}={})=>
    `<td style="padding:3px 7px;border:1px solid #e5e7eb;text-align:${align};background:${bg||''};font-weight:${bold?700:400};color:${color||''};font-size:8pt">${txt}</td>`;
  const Row = (lbl,formula,value,{bg='',bold=false,color=''}={})=>`
    <tr style="background:${bg}">
      <td style="padding:3px 7px;border:1px solid #e5e7eb;font-size:8pt;color:#6b7280;font-family:monospace">${lbl}</td>
      <td style="padding:3px 7px;border:1px solid #e5e7eb;font-size:8pt;font-family:monospace">${formula}</td>
      <td style="padding:3px 7px;border:1px solid #e5e7eb;font-size:8pt;font-weight:${bold?700:400};color:${color||'#374151'};text-align:right;font-family:monospace">${value}</td>
    </tr>`;
  const Sec = (title,{color='#1d4ed8',bg='#eff6ff',br=false}={})=>
    `${br?'<div class="pb">':''}<h2 style="background:${bg};color:${color};padding:7px 14px;margin:18px 0 6px;border-left:4px solid ${color};font-size:11pt;font-family:monospace">${title}</h2>`;
  const Sub = (t,{color='#374151'}={})=>
    `<h3 style="color:${color};font-size:10pt;margin:14px 0 4px;font-family:monospace;border-bottom:1px solid #e5e7eb;padding-bottom:3px">${t}</h3>`;

  // ── Calc detail section for one governing node ────────────────────────────
  const mkCalcDetail=(p,caseLabel,caseColor,caseBg,mc,mt,vn,denom,dV_denom,govCtrl,rfC_,rft_,rfv_,gRF)=>{
    if(!p) return '';
    const s=p.sec, a=p.allo;
    return `
    ${Sub(caseLabel+` — Governing Node N${p.node} @ ${f(p.pos,2)} ft · Controls: ${govCtrl}`,{color:caseColor})}
    <table style="width:100%;border-collapse:collapse;margin-bottom:8px">
      <colgroup><col style="width:38%"><col style="width:40%"><col style="width:22%"></colgroup>
      <tbody>
      ${Row('Compression capacity','F_b × S_x_top / 12 = '+f(mc/s.SxTopG*12,2)+'×'+f(s.SxTopG,2)+'/12',f(mc)+' ft-k',{bg:caseBg})}
      ${Row('Tension capacity','F_t × S_x_bot_net / 12 = '+f(mt/s.SxBotN*12,2)+'×'+f(s.SxBotN,2)+'/12',f(mt)+' ft-k',{bg:caseBg})}
      ${Row('Shear capacity','F_s × A_w = '+f(vn/s.Aw,2)+'×'+f(s.Aw,3),f(vn)+' kips',{bg:caseBg})}
      ${Row('Dead load moment MDL','from DC load case × DL factor '+f(ap.dlFactor,2),f(p.MDL)+' ft-k'+(ap.dlFactor!==1?' [×'+f(ap.dlFactor,2)+' applied]':''))}
      ${Row('Live load moment MLL (unfactored)','from LL load case',f(p.MLL)+' ft-k')}
      ${Row('Factored LL: dM = MLL×(1+I)×DF',f(p.MLL)+'×'+f(ap.f1pI,3)+'×'+ap.DF,f(p.dM)+' ft-k')}
      ${Row('Moment denominator','dM + lateral effects',f(denom)+' ft-k',{bg:'#f9fafb',bold:true})}
      ${Row('RF_comp = (Mc − MDL) / denom','('+f(mc)+' − '+f(p.MDL)+') / '+f(denom),f(rfC_,3),{bg:govCtrl==='Comp'?caseBg:'',color:rfC(rfC_),bold:govCtrl==='Comp'})}
      ${Row('RF_tens = (Mt − MDL) / denom','('+f(mt)+' − '+f(p.MDL)+') / '+f(denom),f(rft_,3),{bg:govCtrl==='Tens'?caseBg:'',color:rfC(rft_),bold:govCtrl==='Tens'})}
      ${Row('RF_shear = (Vn − VDL) / dV_denom','('+f(vn)+' − '+f(p.VDL)+') / '+f(dV_denom),f(rfv_,3),{bg:govCtrl==='Shear'?caseBg:'',color:rfC(rfv_),bold:govCtrl==='Shear'})}
      </tbody>
    </table>
    <div style="padding:6px 12px;background:${caseColor};color:#fff;display:inline-block;border-radius:4px;margin-bottom:12px;font-family:monospace;font-size:10pt">
      RF = min(${f(rfC_,3)}, ${f(rft_,3)}, ${f(rfv_,3)}) = <strong>${f(gRF,3)}</strong> [${govCtrl}] — ${rfLbl(gRF)}
    </div>`;
  };

  // ─── NODE TABLES ───────────────────────────────────────────────────────────
  const nodeTableHeader=(cols)=>`<thead><tr>${cols.map(([t,bg])=>TH(t,{bg})).join('')}</tr></thead>`;
  const mkNodeTable=(title,color,bg,cols,rowFn)=>`
    ${Sub(title,{color})}
    <div style="overflow-x:auto;margin-bottom:12px">
    <table style="width:100%;border-collapse:collapse;font-size:7.5pt;font-family:monospace">
      ${nodeTableHeader([['Node','#f3f4f6'],['Pos(ft)','#f3f4f6'],['MDL(ft-k)','#f3f4f6'],...cols.map(c=>[c,bg])])}
      <tbody>${data.map((p,i)=>rowFn(p,i)).join('')}</tbody>
    </table></div>`;

  const nodeRow=(p,isG,cells)=>`<tr style="background:${isG?'#fffde7':'#fff'}">
    ${TD((isG?'★ ':'')+'N'+p.node,{align:'left',bold:isG})}${TD(f(p.pos,2))}${TD(f(p.MDL,1))}${cells}</tr>`;

  // ─── ASSEMBLE REPORT ───────────────────────────────────────────────────────
  return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
  <title>AREMA Load Rating Report</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;font-size:9pt;color:#1f2937;background:#fff;padding:0}
    @page{margin:0.75in;size:letter}
    @media print{.pb{page-break-before:always}.no-print{display:none}body{padding:0}}
    @media screen{body{max-width:850px;margin:0 auto;padding:20px}.no-print{margin-bottom:16px}}
    h1{font-size:16pt;margin-bottom:4px}h2{font-size:11pt}h3{font-size:10pt}
    table{border-collapse:collapse;width:100%}
    .cover{text-align:center;padding:60px 40px;border:3px double #1d4ed8;margin-bottom:40px}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:10px}
    .info-row{display:flex;border-bottom:1px solid #e5e7eb;padding:4px 8px;font-size:8.5pt}
    .info-label{color:#6b7280;width:200px;flex-shrink:0;font-weight:600}
    .pass{color:#15803d;font-weight:700}.fail{color:#dc2626;font-weight:700}
    .note{font-size:7.5pt;color:#9ca3af;margin-top:4px;font-style:italic}
    .sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
    .sum-card{padding:12px;border-radius:6px;border:1.5px solid}
    .legend{display:flex;gap:16px;font-size:8pt;font-family:monospace;margin-bottom:6px}
    .leg-item{display:flex;align-items:center;gap:4px}
    .leg-line{width:24px;height:3px;display:inline-block}
  </style>
  </head><body>

  <!-- Print button (screen only) -->
  <div class="no-print" style="padding:10px 0;display:flex;gap:10px">
    <button onclick="window.print()" style="padding:8px 20px;background:#1d4ed8;color:#fff;border:none;border-radius:4px;font-size:12px;cursor:pointer;font-weight:600">🖨 Print to PDF</button>
    <span style="font-size:11px;color:#6b7280;line-height:32px">Use browser Print → Save as PDF for best results. Recommend landscape if tables are wide.</span>
  </div>

  <!-- ═══════════════ COVER PAGE ═══════════════ -->
  <div class="cover">
    <div style="font-size:10pt;color:#6b7280;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">AREMA Manual for Railway Engineering</div>
    <h1 style="color:#1d4ed8;margin-bottom:4px">LOAD RATING REPORT</h1>
    <div style="font-size:12pt;color:#374151;margin-bottom:24px">Allowable Stress Design — Chapter 15</div>
    <hr style="border:1px solid #dbeafe;margin:16px 0">
    <div style="font-size:13pt;font-weight:700;color:#1f2937;margin:12px 0">${cfg?.projectUser||'Bridge Rating'}</div>
    <div style="font-size:10pt;color:#6b7280;margin-bottom:20px">${cfg?.projectDate||today}</div>
    <hr style="border:1px solid #dbeafe;margin:16px 0">
    <div style="font-size:9pt;color:#6b7280;margin-top:20px">
      Rating Standard: AREMA Ch.15 §7.3 · Normal (Table 15-1-11) · Maximum &amp; Modified (Table 15-7-1)<br>
      Method: Allowable Stress Design (ASD) · Net section per §1.5.8 · LTB per §1.12.3
    </div>
    <div style="margin-top:40px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;text-align:left;border:1px solid #dbeafe;padding:16px;border-radius:6px">
      <div><div style="font-size:8pt;color:#9ca3af">Prepared by</div><div style="height:40px;border-bottom:1px solid #374151;margin-top:8px"></div></div>
      <div><div style="font-size:8pt;color:#9ca3af">Reviewed by</div><div style="height:40px;border-bottom:1px solid #374151;margin-top:8px"></div></div>
      <div><div style="font-size:8pt;color:#9ca3af">Date</div><div style="height:40px;border-bottom:1px solid #374151;margin-top:8px">${today}</div></div>
    </div>
  </div>

  <!-- ═══════════════ SECTION 1: BRIDGE GEOMETRY ═══════════════ -->
  ${Sec('1. Bridge Geometry &amp; Configuration',{color:'#1d4ed8',bg:'#eff6ff',br:true})}
  <div class="info-grid">
    <div>
      ${[['Project / Bridge ID',cfg?.projectUser||'—'],['Date',cfg?.projectDate||today],
         ['Total Span',f(totalLen,2)+' ft'],['No. of Spans',spans.length],
         ['Elements per Span',cfg?.elemsPerSpan||10],['Total Nodes',data.length]].map(([l,v])=>`
      <div class="info-row"><span class="info-label">${l}</span><span>${v}</span></div>`).join('')}
    </div>
    <div>
      ${spans.map((s,i)=>`<div class="info-row"><span class="info-label">Span ${i+1}</span><span>${f(s,2)} ft</span></div>`).join('')}
      <div class="info-row"><span class="info-label">Material Grade</span><span>${cfg?.materialGrade||'A36'}</span></div>
      <div class="info-row"><span class="info-label">E (steel)</span><span>29,000 ksi</span></div>
    </div>
  </div>
  ${Sub('Bridge Elevation Schematic')}
  ${bridgeSVG}

  <!-- ═══════════════ SECTION 2: CROSS-SECTION PROPERTIES ═══════════════ -->
  ${Sec('2. Cross-Section Properties',{color:'#059669',bg:'#f0fdf4',br:true})}
  ${secSVGs.map(({name,svg,sec:s,secInsp,allo:a,zDef:z})=>`
  ${Sub(name+' — Built-Up Section Properties',{color:'#059669'})}
  <div style="display:grid;grid-template-columns:200px 1fr;gap:16px;margin-bottom:12px;align-items:start">
    <svg viewBox="0 0 200 380" xmlns="http://www.w3.org/2000/svg" style="width:180px;height:340px;border:1px solid #e5e7eb;border-radius:4px">
      ${svg}
    </svg>
    <div>
      <table style="border-collapse:collapse;width:100%;margin-bottom:8px">
        <thead><tr>${TH('Property',{align:'left'})}</tr></thead>
        <tbody>
        ${[['Total Depth D',f(s.totalDepth,3)+' in'],['Gross Ix',f(s.IxG,0)+' in⁴'],
           ['Net Ix',f(s.IxN,0)+' in⁴'],['Sx_top (gross)',f(s.SxTopG,2)+' in³'],
           ['Sx_bot (gross)',f(s.SxBotG,2)+' in³'],['Sx_bot (net)',f(s.SxBotN,2)+' in³'],
           ['Web area Aw',f(s.Aw,3)+' in²'],['Gross area Ag',f(s.totAg,3)+' in²'],
           ['r_yc',f(a.ryc,3)+' in'],['Unbraced L',f(a.L,0)+' in'],
           ['L/r_yc',f(a.LRyc,2)],['Fy',a.Fy+' ksi']].map(([l,v])=>`
        <tr><td style="padding:3px 7px;border:1px solid #e5e7eb;font-size:8pt;color:#6b7280">${l}</td>
            <td style="padding:3px 7px;border:1px solid #e5e7eb;font-size:8pt;font-weight:700;text-align:right;font-family:monospace">${v}</td></tr>`).join('')}
        </tbody>
      </table>
      ${(()=>{const eq=computeEquivMCTSection(s,z);return`<div style="padding:6px 8px;background:#fffbeb;border:1px solid #fde68a;border-radius:4px;font-size:7.5pt;font-family:monospace">
        MIDAS Equiv H-section: hw=${f(eq._hw,3)}" B=${f(eq._B,3)}" tf=${f(eq._tf,4)}" tw=${f(eq._tw,4)}"
      </div>`})()}
    </div>
  </div>

  <!-- Parallel Axis Theorem Detail — Nominal + As-Inspected when section loss active -->
  ${(()=>{
    function mkSecDetailHtml(s,isInsp){
    const TH2=(t,opts={})=>`<th style="padding:3px 6px;border:1px solid ${opts.bc||'#d1fae5'};font-size:7.5pt;font-family:monospace;font-weight:700;background:${opts.bg||'#f0fdf4'};color:${opts.c||'#065f46'};text-align:${opts.align||'right'};white-space:nowrap">${t}</th>`;
    const TD2=(t,opts={})=>`<td style="padding:2px 6px;border:1px solid ${opts.bc||'#e5e7eb'};font-size:7.5pt;font-family:monospace;text-align:${opts.align||'right'};font-weight:${opts.bold?'700':'400'};color:${opts.c||'#374151'};background:${opts.bg||'transparent'}">${t}</td>`;
    const n1=v=>(+v).toFixed(1), n2=v=>(+v).toFixed(2), n3=v=>(+v).toFixed(3);
    const cols=['Component','A (in²)','yc (in)','A·yc','Ixo self','d=yc−ȳ','A·d²','Ix contrib'];

    // Gross section table
    const gRows=s.items.map(it=>{const d=it.yc-s.ybG;return{...it,d,Ad2:it.grossA*d*d,contrib:it.Ixo+it.grossA*d*d};});
    const grossTable=`
    <div style="font-size:9pt;font-weight:700;color:#065f46;margin:10px 0 4px">① Gross Section — IxG (compression flange check)</div>
    <div style="overflow-x:auto;margin-bottom:10px">
    <table style="border-collapse:collapse;width:100%;font-size:7.5pt;font-family:monospace">
      <thead><tr>${cols.map((h,i)=>TH2(h,{align:i===0?'left':'right'})).join('')}</tr></thead>
      <tbody>
      ${gRows.map((r,i)=>`<tr style="background:${i%2===0?'#fff':'#f9fafb'}">
        ${TD2(r.label+(r.tension?' ★':''),{align:'left'})}
        ${TD2(n3(r.grossA))}${TD2(n3(r.yc))}${TD2(n2(r.grossA*r.yc))}
        ${TD2(n2(r.Ixo))}
        ${TD2(n3(r.d),{c:r.d>=0?'#1d4ed8':'#dc2626'})}
        ${TD2(n2(r.Ad2))}${TD2(n2(r.contrib),{bold:true})}</tr>`).join('')}
      </tbody>
      <tfoot>
        <tr style="background:#d1fae5">
          ${TD2('TOTAL',{align:'left',bold:true,bg:'#d1fae5',bc:'#6ee7b7'})}
          ${TD2(n3(s.totAg),{bold:true,bg:'#d1fae5',bc:'#6ee7b7'})}
          ${TD2('ȳ='+n3(s.ybG)+'"',{bold:true,bg:'#d1fae5',bc:'#6ee7b7',c:'#065f46'})}
          ${TD2(n2(gRows.reduce((a,r)=>a+r.grossA*r.yc,0)),{bg:'#d1fae5',bc:'#6ee7b7'})}
          ${TD2(n2(gRows.reduce((a,r)=>a+r.Ixo,0)),{bg:'#d1fae5',bc:'#6ee7b7'})}
          ${TD2('—',{bg:'#d1fae5',bc:'#6ee7b7'})}
          ${TD2(n2(gRows.reduce((a,r)=>a+r.Ad2,0)),{bg:'#d1fae5',bc:'#6ee7b7'})}
          ${TD2('IxG='+n1(s.IxG)+' in⁴',{bold:true,bg:'#d1fae5',bc:'#6ee7b7',c:'#065f46'})}</tr>
        <tr>
          ${TD2('ȳ='+n3(s.ybG)+'" · IxG='+n1(s.IxG)+' in⁴ · SxTop='+n2(s.SxTopG)+' in³ · SxBot(gross)='+n2(s.SxBotG)+' in³',
            {align:'left',bold:false,bg:'#ecfdf5',bc:'#6ee7b7',c:'#065f46',colspan:8})}
        </tr>
      </tfoot>
    </table></div>`;

    // Net section table
    const nRows=s.items.map(it=>{const d=it.yc-s.ybN;const Ixo_n=it.IxoNet??it.Ixo*it.nF;return{...it,item:it,d,Ixo_n,Ad2:it.netA*d*d,contrib:Ixo_n+it.netA*d*d};});
    const netCols=['Component','An (in²)','yc (in)','An·yc','Ixo_net','d=yc−ȳN','An·d²','Ix contrib'];
    const netTable=`
    <div style="font-size:9pt;font-weight:700;color:#991b1b;margin:10px 0 4px">② Net Section — IxN (tension flange check · ★ = holes deducted · †85 = 0.85×gross floor governs)</div>
    <div style="overflow-x:auto;margin-bottom:10px">
    <table style="border-collapse:collapse;width:100%;font-size:7.5pt;font-family:monospace">
      <thead><tr>${netCols.map((h,i)=>TH2(h,{align:i===0?'left':'right',bg:'#fee2e2',c:'#991b1b',bc:'#fca5a5'})).join('')}</tr></thead>
      <tbody>
      ${nRows.map((r,i)=>`<tr style="background:${r.tension?'#fff7f7':i%2===0?'#fff':'#f9fafb'}">
        ${TD2(r.label+(r.tension?' ★':''),{align:'left'})}
        ${TD2(n3(r.netA)+(r.net85?' …85':''))}${TD2(n3(r.yc))}${TD2(n2(r.netA*r.yc))}
        ${TD2(n2(r.Ixo_n))}
        ${TD2(n3(r.d),{c:r.d>=0?'#1d4ed8':'#dc2626'})}
        ${TD2(n2(r.Ad2))}${TD2(n2(r.contrib),{bold:true})}</tr>`).join('')}
      </tbody>
      <tfoot>
        <tr>
          ${TD2('ȳN='+n3(s.ybN)+'" · IxN='+n1(s.IxN)+' in⁴ · SxBot_net='+n2(s.SxBotN)+' in³ — governs tension rating',
            {align:'left',bold:true,bg:'#fee2e2',bc:'#fca5a5',c:'#991b1b',colspan:8})}</tr>
      </tfoot>
    </table></div>`;

      TD(fsk(p.MDL,p.sec?.SxTopG))+TD(fsk(p.denomN,p.sec?.SxTopG))+TD(f(p.allo?.Fb_X,2),{bold:true})+
      TD(fsk(p.MDL,p.sec?.SxBotN))+TD(fsk(p.denomN,p.sec?.SxBotN))+TD(f(p.allo?.Ft_X,2),{bold:true}));
    })}
  ${mkNodeTable('9.3 Modified Flexure (K-factor, all lateral in denom)','#92400e','#fffbeb',
    ['denom_Mod (ft-k)','Mc_X (ft-k)','RF_comp_M','Mt_X (ft-k)','RF_tens_M','RF_M','fDL_top(ksi)','fLL_top(ksi)','Fb_X(ksi)','fDL_bot(ksi)','fLL_bot(ksi)','Ft_X(ksi)'],
    (p)=>{const fsk=(M,S)=>(M&&S&&isFinite(M)&&isFinite(S))?(M*12/S).toFixed(2):'—';
     return nodeRow(p,govM?.node===p.node,
      TD(f(p.denomMod,1))+TD(f(p.McX,1),{bg:'#fffbeb'})+TD(f(p.rfcM,3),{color:rfC(p.rfcM)})+
      TD(f(p.MtX,1),{bg:'#fffbeb'})+TD(f(p.rftM,3),{color:rfC(p.rftM)})+
      TD(f(p.gM,3),{bg:'#fef3c7',bold:true,color:rfC(p.gM)})+
      TD(fsk(p.MDL,p.sec?.SxTopG))+TD(fsk(p.denomMod,p.sec?.SxTopG))+TD(f(p.allo?.Fb_X,2),{bold:true})+
      TD(fsk(p.MDL,p.sec?.SxBotN))+TD(fsk(p.denomMod,p.sec?.SxBotN))+TD(f(p.allo?.Ft_X,2),{bold:true}));
    })}

  ${mkNodeTable('9.4 Shear — All Cases','#374151','#f3f4f6',
    ['VDL (k)','dV_N (k)','Vn_N (k)','RF_shear_N','Vn_X (k)','RF_shear_X','dV_mod (k)','RF_shear_M'],
    (p)=>nodeRow(p,false,
      TD(f(p.VDL,1))+TD(f(p.dV_N,1),{bg:'#f9fafb'})+TD(f(p.VnN,1),{bg:'#f0fdf4'})+TD(f(p.rfvN,3),{color:rfC(p.rfvN)})+
      TD(f(p.VnX,1),{bg:'#fff7ed'})+TD(f(p.rfvX,3),{color:rfC(p.rfvX)})+
      TD(f(p.dV_mod,1),{bg:'#fffbeb'})+TD(f(p.rfvM,3),{color:rfC(p.rfvM)})))}

  ${mkNodeTable('9.5 Fatigue — Stress Range (AREMA §1.7)','#7e22ce','#fdf4ff',
    ['dM_fat (ft-k)','Sx_bot_net (in³)','Mf=SFT×Sx/12 (ft-k)','RF_Fat','⚠'],
    (p)=>nodeRow(p,govFat?.node===p.node,
      TD(f(p.dM_fat,2),{bg:'#f9fafb'})+TD(f(p.sec?.SxBotN,2),{bg:'#fdf4ff'})+
      TD(f(ap.SFT*(p.sec?.SxBotN||0)/12,1),{bg:'#fdf4ff'})+
      TD(f(p.rfFat,3),{bg:'#f3e8ff',bold:true,color:rfC(p.rfFat)})+
      TD(p.fatAlphaFlag?'⚠ SR>12':'',{color:'#dc2626',bold:true})))}

  <!-- Footer -->
  <div style="margin-top:24px;padding:10px 14px;border-top:2px solid #e5e7eb;font-size:7.5pt;color:#9ca3af;font-family:monospace">
    AREMA Manual for Railway Engineering Ch.15 §7.3 · ASD · Normal=Table 15-1-11 · Maximum&amp;Modified=Table 15-7-1 ·
    Net section §1.5.8 · LTB §1.12.3 · Impact §1.3.1 · Lateral §1.3.4/6/7 · Fatigue §1.7<br>
    Generated: ${today} · Spans: ${spans.map((s,i)=>`Span ${i+1}=${s}ft`).join(', ')} · Nodes: ${data.length}
  </div>
  </body></html>`;
}

function generateMCT(cfg) {
  const { projectUser,projectDate,version,spans,elemsPerSpan,materialGrade,
    section1Name,
    movingLoadCode,selectedVehicles,vehicleDLA,useGlobalDLA,globalDLA,
    laneName,laneWidth,laneWheelSpacing,sectionZones,
    projectName,projectBridgeId,projectClient,projectDesc,projectRevision,projectAddress } = cfg;

  // Resolve dead loads — support both new deadLoads array and legacy fields
  const deadLoads = (() => {
    if (cfg.deadLoads && cfg.deadLoads.length) return cfg.deadLoads.filter(d=>d.value>0);
    // Migrate legacy fields
    const DLL = cfg.deadLoadLabels||{deckSlab:'Deck Slab',haunch:'Haunch',barrier:'Movable Barrier',diaphragm:'Diaphragm'};
    const out = [];
    if (cfg.deckSlabLoad>0)  out.push({id:'dl_ds',name:DLL.deckSlab||'Deck Slab',type:'DC1',value:cfg.deckSlabLoad});
    if (cfg.haunchLoad>0)    out.push({id:'dl_h', name:DLL.haunch||'Haunch',type:'DC1',value:cfg.haunchLoad});
    if (cfg.diaphragmLoad>0) out.push({id:'dl_di',name:DLL.diaphragm||'Diaphragm',type:'DC1',value:cfg.diaphragmLoad});
    if (cfg.barrierLoad>0)   out.push({id:'dl_b', name:DLL.barrier||'Movable Barrier',type:'DW',value:cfg.barrierLoad});
    return out;
  })();
  const lines=[];
  const p=(...s)=>s.forEach(l=>lines.push(l));
  const getDLA=n=>useGlobalDLA?globalDLA:(vehicleDLA[n]??ALL_VEHICLES.find(v=>v.name===n)?.defaultDLA??0);
  const totalLen=spans.reduce((a,b)=>a+b,0);
  const TOL=0.0005; // ft snap tolerance

  // ── AREMA library — declared early so both *ELEMENT and *SECTION blocks can use ──
  const aremaLib   = cfg.aremaSection?.enabled ? (cfg.aremaSection.sectionLibrary||[]) : [];
  const aremaEquiv = {};   // libSec.id → equiv MCT dims {H,B1,tf1,tw,B2,tf2} in ft
  aremaLib.forEach(libSec => {
    const def = {...(cfg.aremaSection||{}), ...libSec};
    const sec = computeAremaSection(def, false);  // MCT: always nominal
    aremaEquiv[libSec.id] = computeEquivMCTSection(sec, def);
  });
  // IDs assigned now so *ELEMENT block can reference them (filled after secIdMap is built below)
  const aremaSecMCTId = new Map();  // libSec.id → integer MCT section id
  // Helper: which library section applies at a given span position?
  const aremaSecAtX = (midX) => {
    if (!aremaLib.length) return null;
    const as = cfg.aremaSection;
    let ls = aremaLib[0];
    if (as.zonesEnabled && as.sectionZones?.length) {
      const zone = as.sectionZones.find(z => midX>=+(z.startX||0) && midX<=+(z.endX||0));
      if (zone?.sectionId) { const zs=aremaLib.find(s=>s.id===zone.sectionId); if(zs) ls=zs; }
    }
    return ls;
  };

  // ── Section zones ─────────────────────────────────────────────────────────
  const zones = (sectionZones&&sectionZones.length)
    ? sectionZones
    : [{id:'z0',startX:0,endX:totalLen,type:'catalog',name:cfg.section2Name||'W21X55'}];

  // Section ID map: reference = 1, zone sections start at 2
  const secIdMap = {[section1Name]:1};
  let nextSecId=2;
  zones.forEach(z=>{if(!secIdMap[z.name]) secIdMap[z.name]=nextSecId++;});
  const allSecEntries=Object.entries(secIdMap).sort((a,b)=>a[1]-b[1]);
  // Assign AREMA section MCT IDs now (after catalog ids are known, before elements loop)
  let aremaIdNext = allSecEntries.length + 1;
  aremaLib.forEach(libSec => {
    if (!aremaSecMCTId.has(libSec.id)) aremaSecMCTId.set(libSec.id, aremaIdNext++);
  });
  // Name→zone object (for custom dim lookup)
  const zoneByName={};
  zones.forEach(z=>{if(!zoneByName[z.name]) zoneByName[z.name]=z;});

  // ── Build node X positions — uniform mesh + zone transition nodes ──────────
  // Zone boundaries are added as required nodes so sections start/end exactly.
  // Elements between boundaries are uniformly spaced within each sub-span.
  const requiredXs = new Set();
  let cumX = 0;
  for (let s=0; s<spans.length; s++) {
    requiredXs.add(+(cumX).toFixed(6));
    requiredXs.add(+(cumX+spans[s]).toFixed(6));
    cumX += spans[s];
  }
  // Add zone transition boundaries
  const zoneSrcs = [
    ...(sectionZones||[]).flatMap(z=>[+(z.startX||0), +(z.endX||0)]),
    ...(cfg.aremaSection?.zonesEnabled && cfg.aremaSection?.sectionZones?.length
        ? cfg.aremaSection.sectionZones.flatMap(z=>[+(z.startX||0), +(z.endX||0)])
        : []),
  ];
  zoneSrcs.forEach(x=>{ if(x>0 && x<totalLen) requiredXs.add(+x.toFixed(6)); });
  const reqArr = [...requiredXs].sort((a,b)=>a-b);

  // Fill in uniform nodes between each pair of required positions
  const regularXs = new Set(reqArr);
  for (let i=0; i<reqArr.length-1; i++) {
    const x0=reqArr[i], x1=reqArr[i+1], segLen=x1-x0;
    if (segLen < 1e-6) continue;
    // n = number of elements in this segment (proportional to elemsPerSpan)
    const n = Math.max(1, Math.round(segLen / (totalLen/(spans.length*elemsPerSpan))));
    for (let j=1; j<n; j++) regularXs.add(+(x0 + j*segLen/n).toFixed(6));
  }
  const finalXs=[...regularXs].filter(x=>x>=-TOL&&x<=totalLen+TOL)
    .map(x=>Math.max(0,Math.min(+totalLen.toFixed(6),x)))
    .sort((a,b)=>a-b);

  const totalElems=finalXs.length-1;

  // Node ID: 101 + index in finalXs
  const nidOf=x=>{
    const idx=finalXs.findIndex(fx=>Math.abs(fx-x)<TOL);
    return 101+(idx>=0?idx:0);
  };

  // Span boundary Xs (for constraints + lane starts)
  const spanBndSet=new Set();
  cumX=0; spanBndSet.add(+cumX.toFixed(6));
  for(let s=0;s<spans.length;s++){cumX+=spans[s];spanBndSet.add(+cumX.toFixed(6));}
  const isSpanBnd=x=>spanBndSet.has(+x.toFixed(6))||[...spanBndSet].some(b=>Math.abs(b-x)<TOL);

  // Find zone for element midpoint
  const zoneAt=midX=>{
    for(const z of zones){
      const s=parseFloat(z.startX),e=parseFloat(z.endX);
      if(midX>=s-TOL&&midX<e+TOL) return z;
    }
    return zones[zones.length-1];
  };

  // ── Header ────────────────────────────────────────────────────────────────
  p(`;---------------------------------------------------------------------------`,
    `;  MIDAS/Civil Text(MCT) File.`,
    `;  Project : ${projectName||'(unnamed)'}`,
    `;  Bridge  : ${projectBridgeId||''}`,
    `;  Client  : ${projectClient||''}`,
    `;  Date    : ${projectDate}`,
    `;  Engineer: ${projectUser}`,
    `;  Generated by MCT Generator v1.0`,
    `;---------------------------------------------------------------------------`,
    ``,`*VERSION`,`   ${version}`,``,
    `*UNIT    ; Unit System`,`; FORCE, LENGTH, HEAT, TEMPER`,`   KIPS , FT, BTU, F`,``,
    `*PROJINFO    ; Project Information`,
    `; PROJECT, REVISION, USER, EMAIL, ADDRESS, TEL, FAX, CLIENT, TITLE, ENGINEER, EDATE`,
    `   PROJECT=${projectName||''}`,
    `   REVISION=${projectRevision||'0'}`,
    `   USER=${projectUser}`,
    `   ADDRESS=${projectAddress||''}`,
    `   CLIENT=${projectClient||''}`,
    `   TITLE=${projectBridgeId||''}`,
    `   ENGINEER=${projectUser}`,
    ``);


  // ── Nodes ────────────────────────────────────────────────────────────────
  p(`*NODE    ; Nodes`,`; iNO, X, Y, Z`);
  finalXs.forEach((x,i)=>p(`   ${101+i}, ${x.toFixed(6)}, 100, 0`));
  p(``);

  // ── Elements ─────────────────────────────────────────────────────────────
  p(`*ELEMENT    ; Elements`,`; iEL, TYPE, iMAT, iPRO, iN1, iN2, ANGLE, iSUB,`);
  for(let e=0;e<totalElems;e++){
    const midX=(finalXs[e]+finalXs[e+1])/2;
    const z=zoneAt(midX);
    let secId = secIdMap[z.name]||2;
    // If AREMA library sections are active, override with the equivalent section id
    if (aremaLib.length) {
      const ls = aremaSecAtX(midX);
      if (ls && aremaSecMCTId.has(ls.id)) secId = aremaSecMCTId.get(ls.id);
    }
    p(`   ${101+e}, BEAM  ,    1,     ${secId},   ${101+e},   ${101+e+1},     0,     0`);
  }
  p(``);

  // ── Material ──────────────────────────────────────────────────────────────
  const matCode=materialGrade==="A572-50"?"A572Gr50":materialGrade;
  p(`*MATERIAL    ; Material`,
    `; iMAT, TYPE, MNAME, SPHEAT, HEATCO, PLAST, TUNIT, bMASS, DAMPRATIO, [DATA1]`,
    `    1, STEEL, ${materialGrade.padEnd(20)}, 0, 0, , F, NO, 0.02, 1, ASTM09(S)   ,            , ${matCode.padEnd(14)}, NO, 4.176e+06`,``,
    `*MATL-COLOR`,`; iMAT, W_R, W_G, W_B, HF_R, HF_G, HF_B, HE_R, HE_G, HE_B, bBLEND, FACT`,
    `    1, 255,   0,   0,    0, 255,   0,    0,   0, 255,  NO, 0.5`,``);

  // ── Sections ──────────────────────────────────────────────────────────────
  p(`*SECTION    ; Section`,`; iSEC, TYPE, SNAME, [OFFSET], bSD, bWE, SHAPE, [DATA1]`);

  allSecEntries.forEach(([name,id])=>{
    const z=zoneByName[name];
    if(z&&z.type==='custom'){
      // User-defined plate girder dimensions (inches→feet)
      // MIDAS H-section MCT order: H_total, B1, tw, tf1, B2, tf2
      const {H=36,B1=14,tf1=1,tw=0.5,B2=14,tf2=1}=z;
      const ft=v=>(v/12).toFixed(6);
      p(`    ${id}, DBUSER    , ${name.padEnd(20)}, CC, 0, 0, 0, 0, 0, 0, YES, NO, H  , 2, ${ft(H)}, ${ft(B1)}, ${ft(tw)}, ${ft(tf1)}, ${ft(B2)}, ${ft(tf2)}, 0, 0, 0, 0`);
    } else {
      // AISC catalog section
      p(`    ${id}, DBUSER    , ${name.padEnd(20)}, CC, 0, 0, 0, 0, 0, 0, YES, NO, H  , 1, AISC10(US), ${name}`);
    }
  });

  // AREMA library sections → equivalent H-sections
  aremaLib.forEach(libSec => {
    const mctId = aremaSecMCTId.get(libSec.id);
    const eq    = aremaEquiv[libSec.id];
    if (!eq) return;
    const sname = (libSec.name||libSec.id).replace(/[^A-Za-z0-9_-]/g,'_').slice(0,20).padEnd(20);
    // MIDAS H-section MCT order: H_total, B1, tw, tf1, B2, tf2
    p(`    ${mctId}, DBUSER    , ${sname}, CC, 0, 0, 0, 0, 0, 0, YES, NO, H  , 2, ${eq.H}, ${eq.B1}, ${eq.tw}, ${eq.tf1}, ${eq.B2}, ${eq.tf2}, 0, 0, 0, 0`);
  });
  p(``);
  p(`*SECT-COLOR`,`; iSEC, W_R, W_G, W_B, HF_R, HF_G, HF_B, HE_R, HE_G, HE_B, bBLEND, FACT`);
  allSecEntries.forEach(([,id])=>p(`    ${id}, 255,   0,   0,    0, 255,   0,    0,   0, 255,  NO, 0.5`));
  p(``);

  // ── Constraints ──────────────────────────────────────────────────────────
  p(`*CONSTRAINT    ; Supports`,`; NODE_LIST, CONST(Dx,Dy,Dz,Rx,Ry,Rz), GROUP`);
  p(`   ${nidOf(0)}, 111100, `);
  cumX=0;
  for(let s=0;s<spans.length-1;s++){cumX+=spans[s];p(`   ${nidOf(+cumX.toFixed(6))}, 011000, `);}
  p(`   ${nidOf(+totalLen.toFixed(6))}, 011000, `,``);

  // ── Static load cases ─────────────────────────────────────────────────────
  const activeLCs = ['Selfweight', ...deadLoads.map(d=>d.name)];
  p(`*STLDCASE    ; Static Load Cases`,`; LCNAME, LCTYPE, DESC`);
  p(`   Selfweight, DC, `);
  // MIDAS only accepts DC and DW as LCTYPE — map DC1/DC2 → DC
  deadLoads.forEach(d=>p(`   ${d.name}, ${d.type==='DW'?'DW':'DC'}, `));
  p(``);

  p(`*USE-STLD, Selfweight`,``,`*SELFWEIGHT    ; Self Weight`,`; X, Y, Z, GROUP`,`0, 0, -1, `,``,`; End of data for load case [Selfweight] -------------------------`,``);

  const writeBeam=(lcName,mag)=>{
    if(!mag||mag<=0) return;
    p(`*USE-STLD, ${lcName}`,``,`*BEAMLOAD    ; Element Beam Loads`,`; ELEM_LIST, CMD, TYPE, DIR, bPROJ, [ECCEN], [VALUE], GROUP`);
    const w=(-Math.abs(mag)).toFixed(7);
    for(let e=0;e<totalElems;e++) p(`   ${101+e}, BEAM   , UNILOAD, GZ, NO , NO, LY, , , , 0, ${w}, 1, ${w}, 0, 0, 0, 0, , NO, 0, 0, NO, `);
    p(``,`; End of data for load case [${lcName}] -------------------------`,``);
  };
  deadLoads.forEach(d=>writeBeam(d.name,d.value));

  // ── Moving loads ──────────────────────────────────────────────────────────
  p(`*MVLDCODE    ; Moving Load Code`,`; CODE=CODE`,`   CODE=${movingLoadCode}`,``);
  p(`*LINELANE    ; Traffic Line Lanes`,
    `; NAME=NAME, LDIST, GROUP, SKEWS, SKEWE, MOVING, LW, WS, bLANEOPT, ALLOWWIDTH`,
    `   NAME=${laneName}, LANE, , 0, 0, BOTH, ${laneWidth}, ${laneWheelSpacing}, NO, ${laneWidth}`);
  const le=[];
  for(let e=0;e<totalElems;e++){
    const bStart=isSpanBnd(finalXs[e])?'YES':'NO';
    le.push(`${101+e}, 0, 0, ${bStart}, 0, 0.5`);
  }
  for(let i=0;i<le.length;i+=2){
    if(i+1<le.length) p(`          ${le[i]},   ${le[i+1]}`);
    else p(`          ${le[i]}`);
  }
  p(``);

  const activeVehicles  = ALL_VEHICLES.filter(v=>selectedVehicles.includes(v.name));
  const mctVehicles     = activeVehicles.filter(v=>v.code!=='TRAIN');
  const trainVehicles   = activeVehicles.filter(v=>v.code==='TRAIN');
  
  // Write all vehicles in *VEHICLE — highway vehicles use library reference,
  // railroad vehicles use MIDAS train load format (2, YES, W1, D1, W2, PLV, NDIST)
  if(activeVehicles.length>0){
    p(`*VEHICLE    ; Vehicles`);
    p(`; NAME=NAME, 1, TYPE-NAME, DLA, CODE, bFATI, bTDM                   ; standard`);
    p(`; NAME=NAME, 2, bTRAIN, W(W1), PL(D1), PLM(W2), PLV(D2), NDIST     ; user train`);
    p(`;      LOAD1, DIST1(spacing to next), LOAD2, DIST2, ..., LOADn, 0  ; axle pairs`);

    // Standard highway vehicles
    mctVehicles.forEach(v=>{
      p(`   NAME=${v.name}, 1, ${v.name}, ${getDLA(v.name)}, ${v.code}, NO, NO`);
    });

    // Railroad / train vehicles — MIDAS user train format
    trainVehicles.forEach(v=>{
      const trailing = v.trailingLoad || 0;
      // Build spacing sequence from cumulative distances
      const spacings = v.axles.map((a,i)=>
        i < v.axles.length-1
          ? +(v.axles[i+1].dist - a.dist).toFixed(4)
          : 0  // 0 terminates the last axle
      );
      // Format: load, spacing_to_next for each axle
      const axlePairs = v.axles.map((a,i)=>
        `${a.load % 1 === 0 ? a.load.toFixed(0) : a.load.toFixed(3)}, ${spacings[i]}`
      ).join(', ');
      // Header: NAME, 2, YES(train), W1(leading uniform=0), D1(0), W2(trailing), 2, 0
      p(`   NAME=${v.name}, 2, YES, 0, 0, ${trailing}, 2, 0`);
      p(`        ${axlePairs}`);
    });
    p(``);

  // *MVLDCASE — all vehicles including longitudinal moving load
    p(`*MVLDCASE   ; Moving Load Cases`);
    activeVehicles.forEach(v=>{
      p(`   NAME=${v.name}_${laneName}, 0, 1, 1, 1, 1, 1, 1, INDEPENDENT, , 0, NO, 0`);
      p(`        1, 1, 1, 1, 1, 0.5, 0.25`);
      p(`        VL, ${v.name}, 1, 0, 1, ${laneName}`);
    });
    p(``);
    const mvColors=["255, 0, 192","148, 87, 255","210, 210, 210","255, 192, 87","0, 192, 128","192, 0, 255","255, 87, 0","0, 128, 255","128, 0, 255","255, 128, 0"];
    const stColors=["0, 128, 57","192, 0, 192","255, 87, 128","0, 128, 255","163, 160, 255"];
    p(`*LC-COLOR    ; Diagram Color for Load Case`);
    activeLCs.forEach((lc,i)=>{const c=stColors[i]||"128,128,128";p(` ST, ${lc}, ${c}, ${c}, ${c}`);});
    activeVehicles.forEach((v,i)=>{const c=mvColors[i%mvColors.length];p(` MV, ${v.name}_${laneName}, ${c}, ${c}, ${c}`);});
    p(``);
    p(`*MOVE-CTRL    ; Moving Load Analysis Control`,
      `; METHOD, POINT, iIGP, iIGPN/DIST, MATTYPE, BRIDGETYPE, AKMATTYPE, AKBRIDGETYPE, MINFACTS2, PLATE, bSTRCALC, bCONCURRENT, bCONCLINK, FRAME, bCSTRCALC, bREAC, bRG, RGN, bDISP, bDG, DGN, bFM, bFG, FGN, bL, bLG, LGN, MAXV, INCV, MAXSPACE`,
      `   EXACT, INF, 0, 10, 1, 0, 1, 0, 0.8, NODAL, YES, YES, YES, AXIAL, YES,   YES, NO, ,   YES, NO, ,   YES, NO, ,   YES, NO, ,   10, 1, 10, NO`,``);
  }

  // ── Load combinations ─────────────────────────────────────────────────────
  const combos = (cfg.loadCombos||[]).filter(c=>c.active);
  const defaultCombo = { name: 'Service Dead Load', dcFactor:1, dwFactor:1, llFactor:1, kind:'SERVICE' };
  const combosToWrite = combos.length ? combos : [defaultCombo];
  // Valid MIDAS ACTIVE values
  // MIDAS only accepts SERVICE and STRENGTH as ACTIVE values — FATIGUE maps to SERVICE
  const validKinds = {'STRENGTH':'STRENGTH','SERVICE':'SERVICE','FATIGUE':'SERVICE','CODESTRENGTH':'STRENGTH'};

  p(`*LOADCOMB    ; Combinations`,
    `; NAME=NAME, KIND, ACTIVE, bES, iTYPE, DESC, iSERV-TYPE, nLCOMTYPE, nSEISTYPE, LcomFactor`);
  combosToWrite.forEach(combo=>{
    const dcF  = +(combo.dcFactor  ?? 1);
    const dwF  = +(combo.dwFactor  ?? combo.dcFactor ?? 1);
    const llF  = +(combo.llFactor  ?? 1);
    const kind = validKinds[combo.kind] || 'SERVICE';
    let allParts = [];

    if (Array.isArray(combo.terms) && combo.terms.length > 0) {
      // Term-based: individual load cases with per-case factors
      // Guard: only include ST terms whose load case was actually written to *STLDCASE,
      // and MV terms whose vehicle case was actually written to *MVLDCASE.
      const activeMVNames = new Set(activeVehicles.map(v=>`${v.name}_${laneName}`));
      allParts = combo.terms
        .filter(t => t.lc && t.factor !== 0 && (
          t.type === 'MV'
            ? activeMVNames.has(t.lc)
            : activeLCs.includes(t.lc)
        ))
        .map(t=>`${t.type==='MV'?'MV':'ST'}, ${t.lc}, ${t.factor}`);
    } else {
      // Factor-based (AASHTO presets): apply global DC/DW/LL to all active LCs
      const stParts = activeLCs
        .map(lc=>{
          const dl = deadLoads.find(d=>d.name===lc);
          const f = dl?.type==='DW' ? dwF : dcF;
          return {lc,f};
        })
        .filter(({f})=>f!==0)
        .map(({lc,f})=>`ST, ${lc}, ${f}`);
      const mvParts = llF!==0 && activeVehicles.length
        ? activeVehicles.map(v=>`MV, ${v.name}_${laneName}, ${llF}`)
        : [];
      allParts = [...stParts, ...mvParts];
    }

    if (!allParts.length) return;
    p(`   NAME=${combo.name}, STEEL, ${kind}, 0, 0, , 0, 0, 0, 1`);
    p(`        ${allParts.join(', ')}`, ``);
  });
  p(`*ENDDATA`);
  return lines.join('\n');
}

function BridgeSchematic({spans, elemsPerSpan, sectionZones}) {
  const W=620, H=108;
  const totalLen = spans.reduce((a,b)=>a+b, 0);
  if (totalLen===0) return null;
  const ML=40, MR=40, drawW=W-ML-MR;
  const beamY=48, groundY=86;
  const toX = ft => ML+(ft/totalLen)*drawW;
  const TOL = 0.0005;

  // Support positions
  const supX=[0]; let cum=0;
  for(let s=0;s<spans.length-1;s++){cum+=spans[s];supX.push(cum);}
  supX.push(totalLen);

  // Build merged node positions (same logic as generateMCT)
  const regularXs=new Set();
  cum=0;
  for(let s=0;s<spans.length;s++){
    const dx=spans[s]/elemsPerSpan;
    for(let j=0;j<=elemsPerSpan;j++) regularXs.add(+(cum+j*dx).toFixed(6));
    cum+=spans[s];
  }
  // Pure uniform mesh — no zone boundary insertions
  const finalXs=[...regularXs].filter(x=>x>=-TOL&&x<=totalLen+TOL).sort((a,b)=>a-b);

  // Section zone color map
  const zoneSecNames=[...new Set((sectionZones||[]).map(z=>z.name))];
  const secColorMap={};
  let cIdx=0;
  (sectionZones||[]).forEach(z=>{ if(!secColorMap[z.name]) secColorMap[z.name]=SEC_COLORS[cIdx++%SEC_COLORS.length]; });

  const extraNodes = finalXs.length - 1 - spans.length*elemsPerSpan;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'100%'}}>
      {/* Grid */}
      {Array.from({length:31}).map((_,i)=>(<line key={`v${i}`} x1={i*21} y1={0} x2={i*21} y2={H} stroke="#e8edf4" strokeWidth="0.5"/>))}
      {Array.from({length:6}).map((_,i)=>(<line key={`h${i}`} x1={0} y1={i*20} x2={W} y2={i*20} stroke="#e8edf4" strokeWidth="0.5"/>))}
      {/* Ground */}
      <line x1={ML-16} y1={groundY} x2={W-MR+16} y2={groundY} stroke="#94a3b8" strokeWidth="1.5"/>
      {/* Zone color bands on beam */}
      {(sectionZones||[]).map((z,i)=>{
        const col = secColorMap[z.name]||'#1d4ed8';
        const x1=toX(Math.max(0,parseFloat(z.startX)));
        const x2=toX(Math.min(totalLen,parseFloat(z.endX)));
        return <rect key={z.id} x={x1} y={beamY-3} width={x2-x1} height={6} fill={col} opacity="0.25"/>;
      })}
      {/* Beam shadow + main line */}
      <line x1={toX(0)+1} y1={beamY+2} x2={toX(totalLen)+1} y2={beamY+2} stroke="#c8d4e8" strokeWidth="5"/>
      <line x1={toX(0)} y1={beamY} x2={toX(totalLen)} y2={beamY} stroke="#1d4ed8" strokeWidth="4"/>
      {/* Zone boundary marks on beam */}
      {(sectionZones||[]).slice(0,-1).map(z=>{
        const bx=parseFloat(z.endX);
        if(bx<=0||bx>=totalLen) return null;
        return <line key={z.id} x1={toX(bx)} y1={beamY-6} x2={toX(bx)} y2={beamY+6} stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="2,1"/>;
      })}
      {/* Nodes — all uniform spacing, drawn as circles */}
      {finalXs.map((nx,i)=>(
        <circle key={i} cx={toX(nx)} cy={beamY} r="2.5" fill="#fff" stroke="#1d4ed8" strokeWidth="1.5"/>
      ))}
      {/* Supports */}
      {supX.map((sx,i)=>{
        const svgX=toX(sx), isPin=i===0;
        return (<g key={i}>
          <line x1={svgX} y1={beamY+4} x2={svgX} y2={groundY-7} stroke="#475569" strokeWidth="1.5"/>
          <polygon points={`${svgX},${beamY+4} ${svgX-10},${groundY-7} ${svgX+10},${groundY-7}`}
            fill={isPin?"#475569":"#fff"} stroke="#475569" strokeWidth="1.5"/>
          {!isPin&&<ellipse cx={svgX} cy={groundY-3} rx="4.5" ry="3.5" fill="#475569"/>}
          <line x1={svgX-13} y1={groundY} x2={svgX+13} y2={groundY} stroke="#475569" strokeWidth="1.5"/>
          {[-10,-5,0,5,10].map(d=>(<line key={d} x1={svgX+d} y1={groundY} x2={svgX+d-5} y2={groundY+8} stroke="#94a3b8" strokeWidth="0.8"/>))}
        </g>);
      })}
      {/* Span dimension lines */}
      {spans.map((sp,s)=>{
        const x0=spans.slice(0,s).reduce((a,b)=>a+b,0), mid=x0+sp/2;
        return (<g key={s}>
          <line x1={toX(x0)+3} y1={beamY-12} x2={toX(x0+sp)-3} y2={beamY-12} stroke="#cbd5e1" strokeWidth="0.8"/>
          <text x={toX(mid)} y={beamY-16} textAnchor="middle" fill="#64748b" fontSize="8.5" fontFamily="'IBM Plex Mono',monospace">{sp} ft</text>
        </g>);
      })}
      <text x={W/2} y={H-5} textAnchor="middle" fill="#94a3b8" fontSize="8" fontFamily="'IBM Plex Mono',monospace">
        {spans.length} spans · {totalLen.toFixed(2)} ft · {finalXs.length-1} elements · {finalXs.length} nodes{extraNodes>0?` (+${extraNodes} zone nodes)`:''}
      </text>
    </svg>
  );
}

function AremaLibraryEditor({AS, setAS, totalLen}) {
  const [editIdx, setEditIdx] = React.useState(0);
  const [showDetail, setShowDetail] = React.useState(false);

  const library  = AS.sectionLibrary || [];
  const zones    = AS.sectionZones   || [];
  const baseComps = AS.aremaComps || defaultAremaComps();

  // ── library helpers ────────────────────────────────────────────────────────
  const newId = () => 'sl' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);

  const addSection = () => {
    const ns = {
      id: newId(), name: 'Section ' + (library.length + 1),
      aremaComps: JSON.parse(JSON.stringify(baseComps)),
      outToOut: AS.outToOut||42,
      holeDiam: AS.holeDiam??0, holePitch: AS.holePitch??3,
      holeGage: AS.holeGage??1.5, holesInChain: AS.holesInChain??0,
      webHoleDiam: 0, webHolePitch: 3, webHoleGage: 1.5, webHolesInChain: 0,
      Fy: AS.Fy||36, unbracedL: AS.unbracedL||240,
      ryc: AS.ryc||0, autoRyc: AS.autoRyc!==false,
      sectionLossEnabled: false,  // per-section loss: enable to enter face losses
    };
    const newLib = [...library, ns];
    setAS({sectionLibrary: newLib});
    setEditIdx(newLib.length - 1);
  };

  const updLib = (idx, patch) =>
    setAS({sectionLibrary: library.map((s,i) => i===idx ? {...s,...patch} : s)});

  const updLibComp = (idx, cid, field, val) => {
    const comps = (library[idx]?.aremaComps || JSON.parse(JSON.stringify(baseComps)));
    const next  = comps.map(c => c.id===cid ? {...c,[field]:val} : c);
    updLib(idx, {aremaComps: next});
  };

  const removeSection = (idx) => {
    const secId = library[idx]?.id;
    const newLib = library.filter((_,i) => i!==idx);
    const newZones = zones.map(z => z.sectionId===secId ? {...z,sectionId:''} : z);
    setAS({sectionLibrary: newLib, sectionZones: newZones});
    setEditIdx(Math.max(0, Math.min(editIdx, newLib.length - 1)));
  };

  // ── zone helpers ───────────────────────────────────────────────────────────
  const addZone = () => {
    const nz = {id: newId(), label: 'Zone ' + (zones.length+1),
                startX: 0, endX: totalLen||50, sectionId: library[0]?.id||''};
    setAS({sectionZones: [...zones, nz]});
  };
  const updZone = (idx, patch) =>
    setAS({sectionZones: zones.map((z,i) => i===idx ? {...z,...patch} : z)});
  const removeZone = (idx) =>
    setAS({sectionZones: zones.filter((_,i) => i!==idx)});

  // ── current section being edited ───────────────────────────────────────────
  const curIdx  = Math.min(editIdx, library.length - 1);
  const cur     = library[curIdx];
  const curComps= cur?.aremaComps || JSON.parse(JSON.stringify(baseComps));
  const curDef  = cur ? {...AS, ...cur} : null;
  const curSec  = curDef ? computeAremaSection(curDef, false) : null;              // nominal
  const curSecInsp = (curDef && cur?.sectionLossEnabled)
    ? computeAremaSection(curDef, true) : null;   // as-inspected (with section loss)
  const curAllo = (curDef && curSec) ? aremaAllowables(curDef, curSec) : null;

  const COMP_ROWS = [
    {id:'tcp',fixedQty:false,type:'plate'},
    {id:'tan',fixedQty:true, type:'angle'},
    {id:'twl',fixedQty:true, type:'wsp'},
    {id:'twr',fixedQty:true, type:'wsp'},
    {id:'web',fixedQty:true, type:'web'},
    {id:'bwl',fixedQty:true, type:'wsp'},
    {id:'bwr',fixedQty:true, type:'wsp'},
    {id:'ban',fixedQty:true, type:'angle'},
    {id:'bcp',fixedQty:false,type:'plate'},
  ];


  // ── Inline loss input with label (shown directly in dimension cell) ─────────
  const lossInp = (cid, field, curVal, label) => {
    const LI = {width:'100%',padding:'2px 4px',textAlign:'right',fontFamily:'monospace',
      fontSize:'9.5px',fontWeight:'600',background:'#fffbeb',border:'1px solid #fde68a',
      borderRadius:'2px',color:'#92400e',display:'block'};

      <div style={{marginTop:'3px',borderTop:'1px dashed #fde68a',paddingTop:'2px'}}>
        <div style={{fontSize:'7px',fontFamily:'monospace',color:'#b45309',marginBottom:'1px',
          fontWeight:'700',letterSpacing:'0.02em'}}>{label||'loss (in)'}</div>

          key={`loss-${curIdx}-${cid}-${field}`}

          placeholder="0"
          onBlur={e=>updLibComp(curIdx,cid,field,parseFloat(e.target.value)||0)}/>
      </div>

        textAlign:'right',marginTop:'2px',fontWeight:'700'}}>
        → eff: {eff.toFixed(3)}"
      </div>
    );

  // ── Detail calc table helper ────────────────────────────────────────────────
  const SecDetailTable = ({sec, label, accent, bg}) => {

    const {items,ybG,ybN,IxG,IxN,SxTopG,SxBotG,SxBotN,totAg,Aw,ryc,
           Iyc,Ac,h_wc,Iyc_wc,Ac_wc,Iyc_flange,Ac_flange,hw} = sec;
    const th = {padding:'2px 4px',border:`1px solid ${accent}44`,fontSize:'7.5px',

                fontSize:'7.5px',fontFamily:'monospace',textAlign:right?'right':'left'});
    const ft = {...th, background:accent+'22', color:accent};
    const n1=v=>v.toFixed(1), n2=v=>v.toFixed(2), n3=v=>v.toFixed(3);
    const gRows = items.map(it => {const d=it.yc-ybG; return {label:it.label,A:it.grossA,yc:it.yc,Ayc:it.grossA*it.yc,Ixo:it.Ixo,d,Ad2:it.grossA*d**2,note:it.note};});
    const nRows = items.map(it => {const d=it.yc-ybN; const Ixo_n=it.IxoNet??it.Ixo*it.nF; return {label:it.label,tension:it.tension,A:it.netA,yc:it.yc,Ayc:it.netA*it.yc,Ixo:Ixo_n,d,Ad2:it.netA*d**2};});
    return (
      <div style={{marginBottom:'12px'}}>
        <div style={{fontWeight:'700',fontSize:'9.5px',fontFamily:'monospace',color:accent,
          marginBottom:'6px',padding:'3px 8px',background:bg,borderRadius:'4px',border:`1px solid ${accent}44`}}>
          {label}
        </div>

        <div style={{fontSize:'7.5px',fontFamily:'monospace',fontWeight:'700',color:accent,marginBottom:'2px'}}>
          ① Gross Section — IxG (compression check)
        </div>
        <div style={{overflowX:'auto',marginBottom:'8px'}}>
          <table style={{borderCollapse:'collapse',width:'100%'}}>
            <thead><tr>
              {['Component','A (in²)','yc (in)','A·yc','Ixo self','d=yc−ȳ','A·d²','Ix contrib'].map((h,i)=>(
                <th key={i} style={{...th,textAlign:i===0?'left':'right',whiteSpace:'nowrap'}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {gRows.map((r,i)=>(
                <tr key={i} style={{background:i%2===0?'#fff':'#f9fafb'}}>
                  <td style={{...td(false),fontSize:'7px'}}>{r.label}<br/><span style={{color:'#9ca3af',fontSize:'6.5px'}}>{r.note}</span></td>
                  <td style={td()}>{n3(r.A)}{r.item?.net85&&<span title='0.85×gross floor governs' style={{color:'#f59e0b',fontWeight:700,fontSize:'7px',marginLeft:'2px'}}>†85</span>}</td>
                  <td style={td()}>{n3(r.yc)}</td>
                  <td style={td()}>{n2(r.Ayc)}</td>
                  <td style={td()}>{n2(r.Ixo)}</td>
                  <td style={{...td(),color:r.d>=0?'#1d4ed8':'#dc2626'}}>{n3(r.d)}</td>
                  <td style={td()}>{n2(r.Ad2)}</td>
                  <td style={{...td(),fontWeight:'700'}}>{n2(r.Ixo+r.Ad2)}</td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr>
                <td style={{...ft,textAlign:'left'}}>TOTAL</td>
                <td style={ft}>{n3(totAg)}</td>
                <td style={{...ft,color:accent}}>ȳ={n3(ybG)}"</td>
                <td style={ft}>{n2(gRows.reduce((s,r)=>s+r.Ayc,0))}</td>
                <td style={ft}>{n2(gRows.reduce((s,r)=>s+r.Ixo,0))}</td>
                <td style={ft}>—</td>
                <td style={ft}>{n2(gRows.reduce((s,r)=>s+r.Ad2,0))}</td>
                <td style={{...ft,fontSize:'8px'}}>IxG={n1(IxG)}</td>
              </tr>
              <tr>
                <td colSpan="8" style={{...ft,textAlign:'left',fontSize:'7.5px'}}>
                  ȳ={n3(ybG)}" · IxG={n1(IxG)} in⁴ · SxTop={n2(SxTopG)} in³ · SxBot(gross)={n2(SxBotG)} in³
                </td>
              </tr>
            </tfoot>
          </table>
        </div>

        <div style={{fontSize:'7.5px',fontFamily:'monospace',fontWeight:'700',color:'#dc2626',marginBottom:'2px'}}>
          ② Net Section — IxN (tension check · ★ = holes deducted)
        </div>
        <div style={{overflowX:'auto',marginBottom:'8px'}}>
          <table style={{borderCollapse:'collapse',width:'100%'}}>
            <thead><tr>
              {['Component','An (in²)','yc (in)','An·yc','Ixo_net','d=yc−ȳN','An·d²','Ix contrib'].map((h,i)=>(
                <th key={i} style={{...th,textAlign:i===0?'left':'right',background:'#fee2e2',color:'#dc2626',border:'1px solid #fca5a544',whiteSpace:'nowrap'}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {nRows.map((r,i)=>(
                <tr key={i} style={{background:r.tension?'#fff7f7':'#f9fafb'}}>
                  <td style={{...td(false),fontSize:'7px'}}>{r.label}{r.tension?' ★':''}</td>
                  <td style={td()}>{n3(r.A)}</td>
                  <td style={td()}>{n3(r.yc)}</td>
                  <td style={td()}>{n2(r.Ayc)}</td>
                  <td style={td()}>{n2(r.Ixo)}</td>
                  <td style={{...td(),color:r.d>=0?'#1d4ed8':'#dc2626'}}>{n3(r.d)}</td>
                  <td style={td()}>{n2(r.Ad2)}</td>
                  <td style={{...td(),fontWeight:'700'}}>{n2(r.Ixo+r.Ad2)}</td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr>
                <td colSpan="8" style={{...ft,textAlign:'left',background:'#fee2e2',color:'#dc2626',border:'1px solid #fca5a544',fontSize:'7.5px'}}>
                  ȳN={n3(ybN)}" · IxN={n1(IxN)} in⁴ · SxBot_net={n2(SxBotN)} in³ — governs tension rating
                </td>
              </tr>
            </tfoot>
          </table>
        </div>

        <div style={{fontSize:'7.5px',fontFamily:'monospace',fontWeight:'700',color:'#7c3aed',marginBottom:'2px'}}>
          ③ Shear Area and Lateral-Torsional Buckling (ryc)
        </div>
        <table style={{borderCollapse:'collapse',width:'100%',marginBottom:'4px'}}>
          <tbody>
            <tr style={{background:'#faf5ff'}}>
              <td style={{...td(false),fontWeight:'700',color:'#7c3aed',width:'170px'}}>Shear area Aw</td>
              <td style={td()}>tw_eff x hw = {n3(Aw/Math.max(hw,0.01))}" x {n3(hw)}"</td>
              <td style={{...td(),fontWeight:'700'}}>Aw = {n3(Aw)} in²</td>
            </tr>
            <tr>
              <td style={{...td(false),fontWeight:'700',color:'#7c3aed'}}>Iyc flange only</td>
              <td style={td()}>TCP + WSP + top angles</td>
              <td style={{...td(),fontWeight:'700'}}>Iyc_fl={n2(Iyc_flange)} in⁴, Ac_fl={n3(Ac_flange)} in²</td>
            </tr>
            <tr style={{background:'#faf5ff'}}>
              <td style={{...td(false),fontWeight:'700',color:'#7c3aed'}}>Web compression zone</td>
              <td style={td()}>h_wc={n3(h_wc)}" above NA (ybG={n3(ybG)}")</td>
              <td style={{...td(),fontWeight:'700'}}>Iyc_wc={n2(Iyc_wc)} in⁴, Ac_wc={n3(Ac_wc)} in²</td>
            </tr>
            <tr>
              <td style={{...td(false),fontWeight:'700',color:'#7c3aed'}}>Total Iyc / Ac</td>
              <td style={td()}>{n2(Iyc_flange)}+{n2(Iyc_wc)}={n2(Iyc)} / {n3(Ac_flange)}+{n3(Ac_wc)}={n3(Ac)}</td>
              <td style={{...td(),fontWeight:'700',color:'#7c3aed',fontSize:'8px'}}>ryc=sqrt(Iyc/Ac)={n3(ryc)}"</td>
            </tr>
          </tbody>
        </table>
      </div>
    );
  };

  return (<div style={{marginTop:'18px',borderTop:'2px solid #dbeafe',paddingTop:'16px'}}>

    {/* ── Section Library header ── */}
    <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px',flexWrap:'wrap'}}>
      <div style={{fontSize:'12px',fontWeight:'700',color:'#1d4ed8'}}>📚 Section Library</div>
      <span style={{fontSize:'9px',fontFamily:'monospace',color:'#9ca3af'}}>
        Define named sections — assign them to span zones below
      </span>
      <button onClick={addSection}
        style={{marginLeft:'auto',padding:'4px 12px',background:'#1d4ed8',color:'#fff',
          border:'none',borderRadius:'4px',fontSize:'10px',cursor:'pointer',fontWeight:'600'}}>
        + New Section
      </button>
    </div>

    {library.length === 0 && (
      <div style={{padding:'14px',textAlign:'center',background:'#eff6ff',border:'1px dashed #bfdbfe',
        borderRadius:'6px',fontSize:'11px',color:'#6b7280',marginBottom:'10px'}}>
        No sections defined. Click <strong>+ New Section</strong> to create one.
        <br/>The base section above is used everywhere by default.
      </div>
    )}

    {library.length > 0 && (<>
      {/* ── Tab strip ── */}
      <div style={{display:'flex',gap:'4px',marginBottom:'10px',flexWrap:'wrap',borderBottom:'2px solid #dbeafe',paddingBottom:'6px'}}>
        {library.map((s,i) => (
          <button key={s.id} onClick={()=>setEditIdx(i)}
            style={{padding:'4px 12px',border:'1px solid',borderRadius:'4px 4px 0 0',
              background:i===curIdx?'#1d4ed8':'#f8fafc',
              borderColor:i===curIdx?'#1d4ed8':'#e5e7eb',
              color:i===curIdx?'#fff':'#374151',
              fontSize:'10.5px',fontFamily:'monospace',fontWeight:i===curIdx?'700':'400',
              cursor:'pointer',position:'relative',bottom:'-2px'}}>
            {s.name||`Section ${i+1}`}
          </button>
        ))}
      </div>

      {/* ── Editor for selected section ── */}
      {cur && (
      <div style={{padding:'12px 14px',background:'#f8fafc',border:'1px solid #dbeafe',borderRadius:'0 6px 6px 6px',marginBottom:'12px'}}>
        {/* Section name + delete */}
        <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px'}}>
          <input value={cur.name||''} placeholder="Section name"
            style={{...INP,fontFamily:'monospace',fontWeight:'700',fontSize:'12px',flex:1}}
            onChange={e=>updLib(curIdx,{name:e.target.value})}/>
          <button onClick={()=>removeSection(curIdx)}
            style={{padding:'3px 10px',background:'#fee2e2',border:'1px solid #fca5a5',
              borderRadius:'4px',color:'#dc2626',fontSize:'10px',cursor:'pointer'}}>
            🗑 Delete
          </button>
          <button onClick={()=>updLib(curIdx,{aremaComps:JSON.parse(JSON.stringify(baseComps)),
            outToOut:AS.outToOut,Fy:AS.Fy,unbracedL:AS.unbracedL})}
            style={{padding:'3px 10px',background:'#f3f4f6',border:'1px solid #d1d5db',
              borderRadius:'4px',fontSize:'10px',cursor:'pointer',fontFamily:'monospace'}}>
            ← Copy from base
          </button>
          <label style={{display:'flex',alignItems:'center',gap:'4px',cursor:'pointer',
            padding:'3px 8px',borderRadius:'4px',
            background:cur.sectionLossEnabled?'#fffbeb':'#f9fafb',
            border:`1px solid ${cur.sectionLossEnabled?'#fcd34d':'#e5e7eb'}`,
            fontSize:'9.5px',fontFamily:'monospace',
            color:cur.sectionLossEnabled?'#b45309':'#9ca3af'}}>
            <input type="checkbox" checked={!!cur.sectionLossEnabled}
              onChange={e=>updLib(curIdx,{sectionLossEnabled:e.target.checked})}
              style={{accentColor:'#b45309',width:'11px',height:'11px'}}/>
            Apply section loss to rating
          </label>
        </div>

        {/* Params row */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'6px',marginBottom:'8px',
          padding:'8px 10px',background:'#fff',border:'1px solid #dbeafe',borderRadius:'4px'}}>
          {[['Out-to-out (in)','outToOut',42,'0.0625'],['Fy (ksi)','Fy',36,'1'],
            ['Unbraced L (in)','unbracedL',240,'1'],['L/r (0=auto)','ryc',0,'0.001']].map(([lbl,k,def,step])=>(
            <div key={k}>
              <div style={{fontSize:'8px',fontFamily:'monospace',color:'#6b7280',marginBottom:'2px'}}>{lbl}</div>
              <input type="number" step={step} style={{...INP,fontFamily:'monospace',fontWeight:'600'}}
                value={k==='ryc'?(cur.autoRyc!==false?'':(cur.ryc??'')):(cur[k]??def)}
                placeholder={k==='ryc'?(curSec?('auto '+curSec.ryc.toFixed(2)+'"'):'auto'):''}
                onChange={e=>{
                  const v=e.target.value;
                  if(v===''||v.endsWith('.'))return;
                  const n=parseFloat(v);
                  if(isNaN(n))return;
                  if(k==='ryc') updLib(curIdx,{autoRyc:n===0,ryc:n});
                  else updLib(curIdx,{[k]:n});
                }}/>
              {k==='outToOut'&&curSec&&<div style={{fontSize:'7.5px',color:'#9ca3af',marginTop:'1px',fontFamily:'monospace'}}>D={curSec.totalDepth.toFixed(2)}"</div>}
            </div>
          ))}
          {/* Net section bolt holes (AREMA §1.5.8) */}
          <div style={{gridColumn:'1/-1',padding:'6px 8px',background:'#fff7ed',
            border:'1px solid #fed7aa',borderRadius:'4px'}}>
            <div style={{fontSize:'8px',fontFamily:'monospace',color:'#ea580c',fontWeight:'700',marginBottom:'4px'}}>
              Net Section — Bolt Holes (AREMA §1.5.8) · 0 holes = gross section (tension flange)
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'5px'}}>
            {[['Hole diam (in)','holeDiam',0,'0.125'],['Pitch s (in)','holePitch',3,'0.25'],
              ['Gage g (in)','holeGage',1.5,'0.25'],['# in chain','holesInChain',0,'1']
            ].map(([lbl,field,def,step])=>(
              <div key={field}>
                <div style={{fontSize:'7.5px',fontFamily:'monospace',color:'#6b7280',marginBottom:'2px'}}>{lbl}</div>
                <input type="number" step={step} style={{...INP,fontFamily:'monospace',fontSize:'11px'}}
                  value={cur[field]??def}
                  onChange={e=>updLib(curIdx,{[field]:parseFloat(e.target.value)||0})}/>
              </div>
            ))}
            </div>
            {(cur.holesInChain>0)&&curSec&&(
              <div style={{fontSize:'7.5px',fontFamily:'monospace',color:'#92400e',marginTop:'3px'}}>
                net_w = gross − {cur.holesInChain}×{cur.holeDiam||0}" + {cur.holesInChain>1?(cur.holesInChain-1)+'×s²/(4g)':'0'}
                &nbsp;·&nbsp; SxBotN = {curSec.SxBotN.toFixed(2)} in³ (vs gross {curSec.SxBotG.toFixed(2)} in³)
              </div>
            )}
          </div>

          {/* ── Web Bolt Holes ── */}
          <div style={{padding:'6px 8px',background:'#f0fdf4',
            border:'1px solid #86efac',borderRadius:'4px',marginTop:'6px'}}>
            <div style={{fontSize:'8px',fontFamily:'monospace',color:'#15803d',fontWeight:'700',marginBottom:'4px'}}>
              Web Bolt Holes (AREMA §1.5.8) · connects angles, web side plates &amp; web plate · tension zone only · 0 holes = gross
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'5px'}}>
            {[['Hole diam (in)','webHoleDiam',0,'0.125'],['Pitch s (in)','webHolePitch',3,'0.25'],
              ['Gage g (in)','webHoleGage',1.5,'0.25'],['# in chain','webHolesInChain',0,'1']
            ].map(([lbl,field,def,step])=>(
              <div key={field}>
                <div style={{fontSize:'7.5px',fontFamily:'monospace',color:'#6b7280',marginBottom:'2px'}}>{lbl}</div>
                <input type="number" step={step} style={{...INP,fontFamily:'monospace',fontSize:'11px'}}
                  value={cur[field]??def}
                  onChange={e=>updLib(curIdx,{[field]:parseFloat(e.target.value)||0})}/>
              </div>
            ))}
            </div>
            {(cur.webHolesInChain>0)&&curSec&&(
              <div style={{fontSize:'7.5px',fontFamily:'monospace',color:'#166534',marginTop:'3px'}}>
                net_h = gross − {cur.webHolesInChain}×{cur.webHoleDiam||0}" + {cur.webHolesInChain>1?(cur.webHolesInChain-1)+'×s²/(4g)':'0'}
                &nbsp;·&nbsp; applied to BWL/BWR full height, BAN V-leg, web tension zone (below NA={curSec.ybG.toFixed(2)}")
              </div>
            )}
          </div>
        </div>{/* closes params+holes grid */}

        {/* Component table — section loss toggle lives in the colgroup header */}
        <div style={{overflowX:'auto',marginTop:'6px'}}>
          <table style={{borderCollapse:'collapse',fontSize:'10.5px',width:'100%'}}>
            <colgroup>
              <col style={{width:'10px'}}/><col style={{width:'16px'}}/>
              <col style={{width:'130px'}}/><col style={{width:'115px'}}/>
              <col style={{width:'115px'}}/><col style={{width:'88px'}}/><col style={{width:'36px'}}/>
            </colgroup>
            <thead>
              <tr style={{background:'#eff6ff'}}>
                {['','On','Component','W / Thick','H / t','Thick t','Qty'].map(h=>(
                  <th key={h} style={{padding:'2px 4px',border:'1px solid #dbeafe',fontSize:'8.5px',
                    fontFamily:'monospace',color:'#374151',textAlign:h==='Component'?'left':'center',
                    verticalAlign:'bottom'}}>{h}</th>
                ))}
              </tr>
              <tr style={{background:'#fefce8'}}>
                <th colSpan="3" style={{padding:'2px 6px',border:'1px solid #dbeafe',fontSize:'8px',
                  fontFamily:'monospace',color:'#b45309',textAlign:'left'}}>
                  {cur.sectionLossEnabled
                    ? <span style={{fontWeight:'700'}}>🔍 Section loss active
                        {curSecInsp&&<span style={{marginLeft:'8px',fontWeight:'400',color:'#92400e'}}>
                          As-insp: Ix={curSecInsp.IxG.toFixed(0)} in⁴ · Sx_bot={curSecInsp.SxBotN.toFixed(1)} in³ · Aw={curSecInsp.Aw.toFixed(2)} in²
                        </span>}
                      </span>
                    : <span style={{color:'#9ca3af',fontStyle:'italic'}}>Section loss off — check "Apply section loss to rating" above to enable</span>}
                </th>
                <th style={{padding:'2px 6px',border:'1px solid #fde68a',fontSize:'8px',
                  fontFamily:'monospace',color:'#b45309',textAlign:'center',background:'#fefce8',
                  lineHeight:'1.3'}}>
                  W / thickness loss<br/>
                  <span style={{fontSize:'7px',color:'#92400e',fontWeight:'400'}}>
                    plates→width · web/WSP→thickness · angles→H-leg
                  </span>
                </th>
                <th style={{padding:'2px 6px',border:'1px solid #fde68a',fontSize:'8px',
                  fontFamily:'monospace',color:'#b45309',textAlign:'center',background:'#fefce8',
                  lineHeight:'1.3'}}>
                  H / thickness loss<br/>
                  <span style={{fontSize:'7px',color:'#92400e',fontWeight:'400'}}>
                    plates→thickness · WSP→height · angles→V-leg · web: height never corrodes
                  </span>
                </th>
                <th style={{padding:'2px 6px',border:'1px solid #fde68a',fontSize:'7px',
                  fontFamily:'monospace',color:'#b45309',textAlign:'center',
                  background:'#fefce8',lineHeight:'1.3'}}>
                  Thick t loss<br/>
                  <span style={{fontSize:'6.5px',color:'#92400e',fontWeight:'400'}}>
                    angles: H-leg + V-leg
                  </span>
                </th>
                <th style={{padding:'2px 6px',border:'1px solid #dbeafe',fontSize:'7px',
                  fontFamily:'monospace',color:'#9ca3af',textAlign:'center'}}>—</th>
              </tr>
            </thead>
            <tbody>
              {COMP_ROWS.map(row=>{
                const c=curComps.find(x=>x.id===row.id)||{};
                const isAngle=c.type==='angle',isPlate=c.type==='plate';
                const disabled=!c.on;
                return (
                  <tr key={row.id} style={{background:c.on?c.color+'18':'#f9fafb',opacity:c.on?1:0.55}}>
                    <td style={{border:'1px solid #dbeafe',padding:'1px',textAlign:'center'}}>
                      <div style={{width:'8px',height:'8px',borderRadius:'1px',background:c.color||'#888',margin:'auto'}}/>
                    </td>
                    <td style={{border:'1px solid #dbeafe',padding:'1px',textAlign:'center'}}>
                      <input type="checkbox" checked={!!c.on}
                        onChange={e=>updLibComp(curIdx,row.id,'on',e.target.checked)}
                        style={{accentColor:c.color,width:'12px',height:'12px',cursor:'pointer'}}/>
                    </td>
                    <td style={{border:'1px solid #dbeafe',padding:'2px 4px',fontFamily:'monospace',fontSize:'9.5px',color:'#374151'}}>{c.label||row.id}</td>
                    <td style={{border:'1px solid #dbeafe',padding:'1px 2px',verticalAlign:'top'}}>
                      <input type="number" step="0.0625" disabled={disabled}
                        style={{...INP2,fontFamily:'monospace',fontWeight:'600',fontSize:'10.5px',width:'100%',padding:'2px 3px',textAlign:'right'}}
                        value={isPlate?(c.w??18):(c.w??0.5)}
                        onChange={e=>{const v=e.target.value;if(v===''||v.endsWith('.'))return;const n=parseFloat(v);if(!isNaN(n))updLibComp(curIdx,row.id,'w',n);}}/>
                      {lossInp(row.id, 'lossW', c.lossW,
                        isAngle?'H-leg loss (in)':isPlate?'Width loss (in)':'Thickness loss (in)')}
                      {effLabel(isPlate?(c.w??18):(c.w??0.5), c.lossW||0)}
                    </td>
                    <td style={{border:'1px solid #dbeafe',padding:'1px 2px',verticalAlign:'top'}}>
                      <input type="number" step="0.0625" disabled={disabled}
                        style={{...INP2,fontFamily:'monospace',fontWeight:'600',fontSize:'10.5px',width:'100%',padding:'2px 3px',textAlign:'right'}}
                        value={isPlate?(c.t??0.5):(c.h??6)}
                        onChange={e=>{const v=e.target.value;if(v===''||v.endsWith('.'))return;const n=parseFloat(v);if(!isNaN(n))isPlate?updLibComp(curIdx,row.id,'t',n):updLibComp(curIdx,row.id,'h',n);}}/>
                      {(row.type!=='web')&&lossInp(row.id, 'lossHt', c.lossHt,
                        isPlate?'Thickness loss (in)':isAngle?'V-leg loss (in)':'Height loss (in)')}
                      {(row.type!=='web')&&effLabel(isPlate?(c.t??0.5):(c.h??6), c.lossHt||0)}
                      {(row.type==='web')&&(
                        <div style={{marginTop:'3px',borderTop:'1px dashed #e5e7eb',paddingTop:'2px',
                          fontSize:'7px',fontFamily:'monospace',color:'#d1d5db',fontStyle:'italic'}}>
                          web height — no loss
                        </div>
                      )}
                    </td>
                    <td style={{border:'1px solid #dbeafe',padding:'1px 2px',verticalAlign:'top'}}>
                      {isAngle
                        ?<div>
                          <input type="number" step="0.0625" disabled={disabled}
                            style={{...INP2,fontFamily:'monospace',fontWeight:'600',fontSize:'10.5px',width:'100%',padding:'2px 3px',textAlign:'right'}}
                            value={c.t??0.75}
                            onChange={e=>{const v=e.target.value;if(v===''||v.endsWith('.'))return;const n=parseFloat(v);if(!isNaN(n))updLibComp(curIdx,row.id,'t',n);}}/>

        let cur=0;

          const sx=+(z.startX||0), ex=+(z.endX||0);

          cur=Math.max(cur,ex);

        const def={...AS,...sg.libSec};

      return (
        <div style={{marginTop:'16px',padding:'14px 16px',background:'#fff',

              <line x1={xPx(0)} y1={BY+BH/2} x2={xPx(TL)} y2={BY+BH/2} stroke="#94a3b8" strokeWidth="1"/>

                const x1=xPx(sg.startX), x2=xPx(sg.endX), col=colMap[sg.libSec.id]||'#6b7280';

                return (<g key={i}>
                  <rect x={x1} y={BY} width={w} height={BH}

                  {w>40&&(
                    <text x={midX} y={BY+BH/2+1} textAnchor="middle" dominantBaseline="middle"
                      fill="#fff" fontSize="8" fontFamily="monospace" fontWeight="600">
                      {sg.libSec.name||'Sec'}
                    </text>
                  )}
                </g>);
              })}
              {/* Span tick marks and labels */}
              {segData.map((sg,i)=>{
                const items=[];
                if(i===0){
                  items.push(<g key="s">
                    <line x1={xPx(sg.startX)} y1={BY-4} x2={xPx(sg.startX)} y2={BY+BH+4} stroke="#475569" strokeWidth="1.5"/>

                  </g>);
                }
                items.push(<g key={"e"+i}>
                  <line x1={xPx(sg.endX)} y1={BY-4} x2={xPx(sg.endX)} y2={BY+BH+4} stroke="#475569" strokeWidth="1.5"/>
                  <text x={xPx(sg.endX)} y={BY-7} textAnchor="middle" fill="#475569" fontSize="8" fontFamily="monospace">
                    {sg.endX} ft
                  </text>
                </g>);
                return items;
              })}
              {/* Dimension line underneath */}
              {segData.map((sg,i)=>{
                const x1=xPx(sg.startX),x2=xPx(sg.endX),col=colMap[sg.libSec.id]||'#6b7280';
                const midX=(x1+x2)/2,w=x2-x1;
                return (<g key={'d'+i}>
                  <line x1={x1+2} y1={BY+BH+12} x2={x2-2} y2={BY+BH+12} stroke={col} strokeWidth="1.5"

                    fontSize="7.5" fontFamily="monospace">

              <thead>
                <tr style={{background:'#f3f4f6'}}>
                  {['X Range (ft)','Section','Depth (in)','Ix gross (in⁴)','A gross (in²)','Aw (in²)',

                    <th key={h} style={{padding:'4px 6px',border:'1px solid #e5e7eb',

                        {sg.sec.totalDepth.toFixed(3)}

                        {sg.sec.IxG.toFixed(0)}

                        {sg.sec.totAg.toFixed(3)}

                        {sg.sec.Aw.toFixed(3)}
                      </td>
                      <td style={{padding:'3px 6px',border:'1px solid #e5e7eb',
                        color:'#92400e',background:'#fffbeb',fontWeight:'600'}}>
                        D={sg.sec.totalDepth.toFixed(2)}" · hw={sg.eq._hw.toFixed(2)}" · B={sg.eq._B.toFixed(2)}" · tf={sg.eq._tf.toFixed(3)}" · tw={sg.eq._tw.toFixed(3)}"
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* MCT note */}
          <div style={{marginTop:'6px',fontSize:'8px',fontFamily:'monospace',color:'#9ca3af'}}>
            Equivalent H-sections match depth, Ix, gross area, and shear area of each built-up section ·
            Written to *SECTION in MCT as DBUSER H-type · Elements reference section by zone position
          </div>
        </div>
      );
    })()}
  </div>);
}


// Standalone component so hooks are valid (Rules of Hooks)

        Ix={sec.IxG.toFixed(2)} in⁴ &nbsp;·&nbsp;

        <thead><tr style={{background:'#dbeafe'}}>
          {['Component','Dims','A_gross','yc (in)','A·yc','d=yc−ȳG','A·d²','Ixo','Ix contrib'].map(h=>(

              <td style={td()}><span style={{display:'inline-block',width:'7px',height:'7px',
