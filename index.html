function RatingChart({ ratingData, operatingData=[], nodePositions={}, yMax=null }) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);
  useEffect(()=>{
    if (!canvasRef.current || !ratingData?.length) return;
    if (chartRef.current) chartRef.current.destroy();
    const labels = ratingData.map(p=>nodePositions[p.node]!==undefined?nodePositions[p.node].toFixed(1)+' ft':`N${p.node}`);
    const limit  = ratingData.map(()=>1.0);
    const clip   = v => (v===null||v===undefined) ? null : (yMax!=null ? Math.min(v, yMax) : v);
    // Inventory series
    const govern = ratingData.map(p=>clip(p.rfGov));
    const mpos   = ratingData.map(p=>clip(p.rfMpos));
    const mneg   = ratingData.map(p=>clip(p.rfMneg));
    const shear  = ratingData.map(p=>clip(p.rfV));
    // Operating series (align by node)
    const opMap  = {};
    operatingData.forEach(p=>{ opMap[p.node]=p; });
    const opGovern = ratingData.map(p=>clip(opMap[p.node]?.rfGov ?? null));
    const hasOp    = operatingData.length > 0;

    const nClipped = yMax!=null ? ratingData.filter(p=>[p.rfMpos,p.rfMneg,p.rfV,p.rfGov].some(v=>v!=null&&v>yMax)).length : 0;

    chartRef.current = new Chart(canvasRef.current, {
      type:'line',
      data:{ labels, datasets:[
        // Inventory
        {label:'RF Gov (Inv)', data:govern, borderColor:'#1d4ed8', borderWidth:2.5, pointRadius:0, fill:false, tension:0},
        {label:'RF M⁺',        data:mpos,   borderColor:'#059669', borderWidth:1.5, pointRadius:0, borderDash:[4,2], fill:false, tension:0},
        {label:'RF M⁻',        data:mneg,   borderColor:'#7c3aed', borderWidth:1.5, pointRadius:0, borderDash:[4,2], fill:false, tension:0},
        {label:'RF Shear',     data:shear,  borderColor:'#dc2626', borderWidth:1.5, pointRadius:0, borderDash:[4,2], fill:false, tension:0},
        // Operating
        ...(hasOp ? [{label:'RF Gov (Op)', data:opGovern, borderColor:'#0891b2', borderWidth:2,
          borderDash:[8,3], pointRadius:0, fill:false, tension:0}] : []),
        // RF=1 line
        {label:'RF = 1.0', data:limit, borderColor:'#f59e0b', borderWidth:2, pointRadius:0, borderDash:[6,3], fill:false, tension:0},
      ]},
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{ mode:'index', intersect:false },
        plugins:{
          legend:{ display:true, labels:{ font:{family:'IBM Plex Mono',size:10}, boxWidth:14,
            filter:item=>!item.text.startsWith('_') }},
          tooltip:{ callbacks:{
            title:items=>{
              const p=ratingData[items[0]?.dataIndex];
              if (!p) return '';
              const anyClipped = yMax!=null && [p.rfMpos,p.rfMneg,p.rfV,p.rfGov].some(v=>v!=null&&v>yMax);
              return `Node ${p.node} · ${p.pos.toFixed(2)} ft${anyClipped?' (clipped)':''}`;
            },
            label:ctx=>{
              const v=ctx.parsed.y;
              if (v===null) return null;
              const p=ratingData[ctx.dataIndex];
              const opP = opMap[p?.node];
              const rawMap={
                'RF Gov (Inv)':p?.rfGov,'RF M⁺':p?.rfMpos,'RF M⁻':p?.rfMneg,
                'RF Shear':p?.rfV,'RF Gov (Op)':opP?.rfGov
              };
              const raw=rawMap[ctx.dataset.label];
              const isClipped=yMax!=null&&raw!=null&&raw>yMax;
              return isClipped ? `${ctx.dataset.label}: ${raw.toFixed(3)} (clipped)` : `${ctx.dataset.label}: ${v?.toFixed(3)}`;
            },
          }}
        },
        scales:{
          x:{ ticks:{maxTicksLimit:18,font:{family:'IBM Plex Mono',size:9.5},color:'#6b7280'}, grid:{color:'#f3f4f6'} },
          y:{ min:0,
              ...(yMax!=null ? {max:yMax} : {}),
              ticks:{font:{family:'IBM Plex Mono',size:9.5},color:'#6b7280'},
              grid:{color:'#f3f4f6'},
              title:{display:true,text:`Rating Factor RF${yMax!=null?` (capped at ${yMax})`:''}`,font:{family:'IBM Plex Mono',size:9},color:'#9ca3af'} },
        }
      }
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[ratingData, operatingData, yMax]);
  return <canvas ref={canvasRef} style={{width:'100%',height:'100%'}}/>;
}

// ── Demand vs. Capacity Overlay Chart ────────────────────────────────────────
function DemandCapacityChart({ ratingData, nodePositions={}, mode='moment',
    showInv=true, showOp=true,
    gamDC=1.25, gamDW=1.50, gamLL=1.75, gamLL_op=1.35, ratingLLScale=1 }) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);
  useEffect(()=>{
    if (!canvasRef.current || !ratingData?.length) return;
    if (chartRef.current) chartRef.current.destroy();

    const pts = [...ratingData].sort((a,b)=>a.pos-b.pos);
    const labels = pts.map(p=>p.pos.toFixed(1)+' ft');
    const isMoment = mode==='moment';

    const capPosPts  = pts.map(p=>+p.CmnPos.toFixed(1));
    const capNegPts  = pts.map(p=>-p.CmnNeg);
    const capVPts    = pts.map(p=>+p.Cvn.toFixed(1));
    const capVNegPts = pts.map(p=>-p.Cvn);

    const demMposInv = pts.map(p=>+(gamDC*Math.abs(p.Mdc)+gamDW*Math.abs(p.Mdw)+gamLL*p.Mllpos*ratingLLScale).toFixed(1));
    const demMnegInv = pts.map(p=>-(gamDC*Math.abs(p.Mdc)+gamDW*Math.abs(p.Mdw)+gamLL*p.Mllneg*ratingLLScale).toFixed(1));
    const demVInv    = pts.map(p=>+(gamDC*p.Vdc+gamDW*p.Vdw+gamLL*p.Vll*ratingLLScale).toFixed(1));
    const demMposOp  = pts.map(p=>+(gamDC*Math.abs(p.Mdc)+gamDW*Math.abs(p.Mdw)+gamLL_op*p.Mllpos*ratingLLScale).toFixed(1));
    const demMnegOp  = pts.map(p=>-(gamDC*Math.abs(p.Mdc)+gamDW*Math.abs(p.Mdw)+gamLL_op*p.Mllneg*ratingLLScale).toFixed(1));
    const demVOp     = pts.map(p=>+(gamDC*p.Vdc+gamDW*p.Vdw+gamLL_op*p.Vll*ratingLLScale).toFixed(1));

    const datasets = isMoment ? [
      {label:'φMn⁺ Capacity',    data:capPosPts, borderColor:'#059669',borderWidth:2.5,pointRadius:0,fill:false,tension:0},
      {label:'-φMn⁻ Capacity',   data:capNegPts, borderColor:'#7c3aed',borderWidth:2.5,pointRadius:0,fill:false,tension:0},
      ...(showInv?[
        {label:'Demand M⁺ (Inv)',data:demMposInv,borderColor:'#1d4ed8',borderWidth:2,borderDash:[6,3],pointRadius:0,fill:false,tension:0},
        {label:'Demand M⁻ (Inv)',data:demMnegInv,borderColor:'#3b82f6',borderWidth:2,borderDash:[6,3],pointRadius:0,fill:false,tension:0},
      ]:[]),
      ...(showOp?[
        {label:'Demand M⁺ (Op)', data:demMposOp, borderColor:'#dc2626',borderWidth:1.5,borderDash:[3,3],pointRadius:0,fill:false,tension:0},
        {label:'Demand M⁻ (Op)', data:demMnegOp, borderColor:'#f87171',borderWidth:1.5,borderDash:[3,3],pointRadius:0,fill:false,tension:0},
      ]:[]),
      {label:'_zero',data:pts.map(()=>0),borderColor:'#e5e7eb',borderWidth:1,pointRadius:0,fill:false},
    ] : [
      {label:'φVn Capacity',     data:capVPts,   borderColor:'#059669',borderWidth:2.5,pointRadius:0,fill:false,tension:0},
      {label:'-φVn Capacity',    data:capVNegPts,borderColor:'#059669',borderWidth:2.5,borderDash:[4,2],pointRadius:0,fill:false,tension:0},
      ...(showInv?[{label:'Demand V (Inv)',data:demVInv,borderColor:'#1d4ed8',borderWidth:2,borderDash:[6,3],pointRadius:0,fill:false,tension:0}]:[]),
      ...(showOp? [{label:'Demand V (Op)', data:demVOp, borderColor:'#dc2626',borderWidth:1.5,borderDash:[3,3],pointRadius:0,fill:false,tension:0}]:[]),
      {label:'_zero',data:pts.map(()=>0),borderColor:'#e5e7eb',borderWidth:1,pointRadius:0,fill:false},
    ];

    chartRef.current = new Chart(canvasRef.current, {
      type:'line', data:{labels, datasets},
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{display:true,labels:{font:{family:'IBM Plex Mono',size:10},boxWidth:14,filter:i=>!i.text.startsWith('_')}},
          tooltip:{callbacks:{
            title:items=>{const p=pts[items[0]?.dataIndex];return p?`Node ${p.node} · ${p.pos.toFixed(2)} ft`:'';}  ,
            label:ctx=>ctx.dataset.label.startsWith('_')?null:`${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(2)} ${isMoment?'ft·k':'kips'}`,
          }},
        },
        scales:{
          x:{ticks:{maxTicksLimit:18,font:{family:'IBM Plex Mono',size:9.5},color:'#6b7280'},grid:{color:'#f3f4f6'}},
          y:{ticks:{font:{family:'IBM Plex Mono',size:9.5},color:'#6b7280'},grid:{color:'#f3f4f6'},
            title:{display:true,text:isMoment?'Moment (ft·kips)':'Shear (kips)',font:{family:'IBM Plex Mono',size:9},color:'#9ca3af'}},
        }
      }
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[ratingData, mode, showInv, showOp, gamDC, gamDW, gamLL, gamLL_op, ratingLLScale]);
  return <canvas ref={canvasRef} style={{width:'100%',height:'100%'}}/>;
}

function computeComboRows(origRows, combo) {
  if (!combo?.terms?.length || !origRows.length) return [];
  const validTerms = combo.terms.filter(t=>t.lc && t.factor!==0 && origRows.some(r=>r.load===t.lc));
  if (!validTerms.length) return [];
  // Use first valid term's rows as the structural template (elem, end, node)
  const template = origRows.filter(r=>r.load===validTerms[0].lc);
  return template.map(tRow=>{
    const out = { elem:tRow.elem, load:combo.name, end:tRow.end, node:tRow.node,
                  axial:0, shearY:0, shearZ:0, torsion:0, momentY:0, momentZ:0 };
    validTerms.forEach(term=>{
      const src = origRows.find(r=>r.load===term.lc && r.elem===tRow.elem && r.end===tRow.end);
      if (!src) return;
      out.axial   += src.axial   * term.factor;
      out.shearY  += src.shearY  * term.factor;
      out.shearZ  += src.shearZ  * term.factor;
      out.torsion += src.torsion * term.factor;
      out.momentY += src.momentY * term.factor;
      out.momentZ += src.momentZ * term.factor;
    });
    return out;
  });
}

const AREMA_SFT = { A:14, B:10, C:8, D:6, E:4, F:3 };

// Legal LL factors by ADTT — MBE Table 6A.4.4.2.3a-1
// ── PS Concrete capacity helpers ─────────────────────────────────────────────
// γ_p factor based on fpy/fpu ratio — AASHTO 5.6.3.1.1
// ── Composite Steel Section Mn helpers ───────────────────────────────────────
// AASHTO 6.10.7.1.2 — plastic moment of composite section (PNA method)
// Inputs (all from zone): Fy, Fyr (rebar), fc, b_eff, ts, th (haunch), Zx, tw, d, tf
// Returns { MnPos, MnNeg, PNA, Ybar, a }

// Modular ratio n from fc (AASHTO Table 6.10.1.1.1b-1)
function compN(fc) {
  if (fc <= 4)  return 8;
  if (fc <= 6)  return 7;
  if (fc <= 8)  return 6;
  if (fc <= 10) return 5;
  return 4; // fc > 10 ksi
}

// Compute composite plastic moment Mnc (ft-kips) for positive moment
// Using the plastic neutral axis (PNA) iterative method
function computeCompositeMnPos(z) {
  const { Fy=50, fc=4, bEff=96, ts=8, th=0,
          ZxPos=0, d=21, tw=0.4,
          Asr=0, Fyr=60, dsr=0 } = z;
  if (!bEff || !ts || !Fy) return 0;

  // Steel plastic force — use ZxPos (Fy·Zx = Mp) if no explicit area given
  const Ps   = z.As_steel > 0 ? z.As_steel * Fy : (ZxPos > 0 ? Fy*ZxPos/12*12 : d*tw*Fy);
  const Pc   = bEff * ts * 0.85 * fc;   // concrete compression force capacity
  const Pr   = Asr * Fyr;               // rebar force

  if (Ps + Pr <= Pc) {
    // PNA in deck — full composite
    const a  = (Ps + Pr) / (0.85 * fc * bEff);
    const ds = d + th + ts - a/2;       // steel centroid to stress block midpoint
    const Mn = (Ps * (ds - a/2) + Pr * Math.abs((dsr||ts/2) - a/2)) / 12;
    return Math.max(0, +Mn.toFixed(1));
  }
  // PNA in steel — partial composite
  const a    = Math.min(ts, Pc / (0.85 * fc * bEff));
  const deckArm = d/2 + th + ts - a/2; // in
  const MpSt = ZxPos > 0 ? Fy * ZxPos / 12 : 0;
  const MnDk = Pc * deckArm / 12;
  return Math.max(0, +(MpSt + MnDk).toFixed(1));
}

// Negative moment: composite section uses steel + rebar only (deck in tension, ignored)
function computeCompositeMnNeg(z) {
  const { Fy=50, Zx=0, Asr=0, Fyr=60, dsr=0, d=21 } = z;
  const MpSteel = Fy * Zx / 12; // ft-kips
  // Add rebar contribution if continuous
  const MpRebar = Asr > 0 ? Fyr * Asr * Math.abs(dsr - d/2) / 12 : 0;
  return MpSteel + MpRebar;
}

function psGammaP(fpu, fpy) {
  const r = fpy / fpu;
  if (r >= 0.9)  return 0.28;
  if (r >= 0.85) return 0.38;
  return 0.55; // fpy/fpu ≥ 0.60
}

// β1 from f'c — AASHTO 5.6.2.2
function psBeta1(fc) {
  if (fc <= 4) return 0.85;
  return Math.max(0.65, 0.85 - 0.05*(fc - 4));
}

// Compute fps (stress in PS steel at nominal resistance) — AASHTO 5.6.3.1.1
function computePSfps(z) {
  const { Aps=0, fpu=270, fpy=243, dp=0, fc=5, b=48, bw=7,
          As=0, Asp=0, fy=60, ds=0, dsp=0 } = z;
  if (!Aps || !dp || !fc || !b) return { fps:0, a:0, c:0 };
  const beta1 = psBeta1(fc);
  const gamP  = psGammaP(fpu, fpy);
  const rhop  = Aps / (b * dp);
  const omg   = As  > 0 && ds  > 0 ? (As /(b*ds)) *(fy /fc) : 0;
  const omgp  = Asp > 0 && dsp > 0 ? (Asp/(b*dsp))*(fy /fc) : 0;
  const k     = gamP / beta1;
  const fps   = fpu * (1 - k * (rhop*(fpu/fc) + (ds/dp||0)*(omg - omgp)));
  // Depth of stress block
  const a = (Aps*fps + As*fy - Asp*fy) / (0.85 * fc * b);
  const c = a / beta1;
  return { fps: Math.max(0, Math.min(fps, fpu)), a: Math.max(0,a), c: Math.max(0,c) };
}

// Compute Mn (ft-kips) from PS zone — AASHTO 5.6.3.2
function computePSMn(z) {
  const { Aps=0, dp=0, As=0, fy=60, ds=0, Asp=0, dsp=0 } = z;
  const { fps, a } = computePSfps(z);
  const Mn = (Aps*fps*(dp - a/2) + As*fy*(ds - a/2) - Asp*fy*(dsp - a/2)) / 12;
  return Math.max(0, Mn); // ft-kips
}

// Compute Vn (kips) — AASHTO 5.7.3 simplified (MCFT β=user input, or 2.0 default)
function computePSVn(z) {
  const { fc=5, bw=7, dv=0, Av=0, fy=60, s=12,
          Aps=0, fpe=0, psi=0, beta=2.0, theta=45 } = z;
  if (!dv || !bw) return 0;
  const Vc  = 0.0316 * beta * Math.sqrt(fc) * bw * dv;
  const thr = theta * Math.PI / 180;
  const Vs  = Av > 0 && s > 0 ? Av * fy * dv * (1/Math.tan(thr)) / s : 0;
  const Vp  = Aps > 0 && fpe > 0 ? Aps * fpe * Math.sin(psi * Math.PI/180) : 0;
  const Vn  = Math.min(Vc + Vs + Vp, 0.25 * fc * bw * dv);
  return Math.max(0, Vn);
}

// ═══════════════════════════════════════════════════════════════════════════
// AREMA BUILT-UP GIRDER — Section Properties Calculator
// AREMA Manual for Railway Engineering, Chapter 15
// ═══════════════════════════════════════════════════════════════════════════

function defaultAremaComps() {
  return [
    { id:'tcp', label:'Top Cover Plates',     color:'#3b82f6', type:'plate', side:'top', on:true,  w:18,  t:0.5,  qty:2 },
    { id:'tan', label:'Top Angles',           color:'#22c55e', type:'angle', side:'top', on:true,  w:6,   h:6,    t:0.75, qty:2 },
    { id:'twl', label:'Top Web Side Plate L', color:'#a855f7', type:'wsp',   side:'top', on:false, w:0.5, h:12,   qty:1 },
    { id:'twr', label:'Top Web Side Plate R', color:'#a855f7', type:'wsp',   side:'top', on:false, w:0.5, h:12,   qty:1 },
    { id:'web', label:'Web Plate',            color:'#ef4444', type:'web',   side:'web', on:true,  w:0.5, h:42,   qty:1 },
    { id:'bwl', label:'Bot Web Side Plate L', color:'#a855f7', type:'wsp',   side:'bot', on:false, w:0.5, h:12,   qty:1 },
    { id:'bwr', label:'Bot Web Side Plate R', color:'#a855f7', type:'wsp',   side:'bot', on:false, w:0.5, h:12,   qty:1 },
    { id:'ban', label:'Bottom Angles',        color:'#22c55e', type:'angle', side:'bot', on:true,  w:6,   h:6,    t:0.75, qty:2 },
    { id:'bcp', label:'Bottom Cover Plates',  color:'#3b82f6', type:'plate', side:'bot', on:true,  w:18,  t:0.5,  qty:2 },
  ];
}

// Angle L-shape properties (two-rectangle decomposition)
// w=total outstanding leg, h=total connected leg, t=thickness
// Returns centroid measured from BOTTOM of angle (heel at origin)
function calcAngleProps(w, h, t, t_h, t_v) {
  // t_h = horizontal leg effective thickness (outstand leg, connects to cover plate)
  // t_v = vertical leg effective thickness (web leg, riveted to web)
  // Defaults to t if not provided (equal legs, no section loss)
  const th = (t_h != null && t_h >= 0) ? t_h : t;   // horizontal leg thickness
  const tv = (t_v != null && t_v >= 0) ? t_v : t;   // vertical leg thickness
  if (!w || !h || w<=0 || h<=0 || th<=0 || tv<=0) return {area:0,ixo:0,iyo:0,centY:0,centX:0};

  // Geometry: vertical leg = full height h, thickness tv (includes corner)
  //           horizontal leg = remaining width (w-tv), thickness th
  const Av = tv * h;           // vertical leg area (includes corner at junction)
  const Ah = (w - tv) * th;   // horizontal leg area (excludes corner)
  const A  = Av + Ah;
  if (A <= 0) return {area:0,ixo:0,iyo:0,centY:0,centX:0};

  // Centroids from lower-left corner (x=back of vert leg, y=bottom of angle)
  const cYv = h / 2;                    // vertical leg centroid-Y (from bottom)
  const cYh = th / 2;                   // horizontal leg centroid-Y (from bottom)
  const cY  = (Av*cYv + Ah*cYh) / A;

  const cXv = tv / 2;                   // vertical leg centroid-X (from back)
  const cXh = tv + (w - tv) / 2;       // horizontal leg centroid-X (from back)
  const cX  = (Av*cXv + Ah*cXh) / A;

  // Ix (about centroidal X-axis) — for flexural contribution of angle in built-up section
  const I1x = tv*h**3/12    + Av*(cYv - cY)**2;
  const I2x = (w-tv)*th**3/12 + Ah*(cYh - cY)**2;

  // Iy (about centroidal Y-axis) — for Iyc / ryc LTB calculation
  const I1y = h*tv**3/12    + Av*(cXv - cX)**2;
  const I2y = th*(w-tv)**3/12 + Ah*(cXh - cX)**2;

  return {area:A, ixo:I1x+I2x, iyo:I1y+I2y, centY:cY, centX:cX};
}

// Full section property computation — both gross (compression) and net (tension) sections.
// useInspected=true applies per-face section loss to each component (as-inspected condition).
// Caller controls the flag; computeAremaSection applies it unconditionally when true.
function computeAremaSection(z, useInspected) {
  const comps   = z.aremaComps || defaultAremaComps();
  const outToOut = +(z.outToOut || 42);
  const G = id => comps.find(c=>c.id===id) || {on:false};

  // ── Loss helpers — unified field names ────────────────────────────────────
  // lossW  = W column loss  (plates→width; web/WSP→thickness; angles→H-leg length from tip)
  // lossHt = H/t column loss(plates→thickness; WSP→height; angles→V-leg length from tip)
  // lossT  = Thick t column (angles only → leg thickness)
  const applyLoss = !!useInspected;
  const effDim  = (nom, loss) => applyLoss ? Math.max(0, nom - (+(loss)||0)) : nom;
  const pctLoss = (nom, eff) => {
    if (!applyLoss || !nom || nom<=0) return '';
    const p = (nom - eff) / nom * 100;
    return p > 0.05 ? ` (−${p.toFixed(0)}%)` : '';
  };

  // ── Component references ───────────────────────────────────────────────────
  const tcp=G('tcp'), tan_=G('tan'), twl=G('twl'), twr=G('twr'),
        web=G('web'),
        bwl=G('bwl'), bwr=G('bwr'), ban=G('ban'), bcp=G('bcp');

  // ── Basic geometry (nominal — section occupies its original envelope) ──────
  const h_bcp     = (bcp.on && bcp.t>0) ? bcp.t*(bcp.qty||1) : 0;
  const h_tcp     = (tcp.on && tcp.t>0) ? tcp.t*(tcp.qty||1) : 0;
  const totalDepth = h_bcp + outToOut + h_tcp;
  const hw        = (web.on && web.h>0) ? +web.h : 0;
  const tw        = (web.on && web.w>0) ? +web.w : 0;  // nominal web thickness
  const tw_eff    = effDim(tw, web.lossW);               // effective web thickness (lossW = W-col loss)
  const gap       = (outToOut - hw) / 2;               // flange assembly height each side
  // Web y-extents from section bottom (declared early — needed for web compression zone)
  const web_bot_y = h_bcp + gap;
  const web_top_y = h_bcp + gap + hw;

  // ── Hole deductions (AREMA §1.5.8) ────────────────────────────────────────
  const holeDiam  = +(z.holeDiam    ?? 0);
  const holePitch = +(z.holePitch   ?? 3);
  const holeGage  = +(z.holeGage    ?? 1.5);
  const holesN    =  (z.holesInChain ?? 0);
  function netWidth(gross) {      // flange bolt holes — applied to width of tension flange
    if (!holeDiam || !holesN) return gross;
    const deduct  = holesN * holeDiam;
    const stagger = (holesN>1 && holePitch>0 && holeGage>0)
      ? (holesN-1)*holePitch**2/(4*holeGage) : 0;
    return Math.max(gross - deduct + stagger, 0.85*gross);
  }
  const webHoleDiam  = +(z.webHoleDiam     ?? 0);
  const webHolePitch = +(z.webHolePitch    ?? 3);
  const webHoleGage  = +(z.webHoleGage     ?? 1.5);
  const webHolesN    =  (z.webHolesInChain ?? 0);
  function netWidthWeb(gross) {   // web bolt holes — applied to height of web-connected components
    if (!webHoleDiam || !webHolesN) return gross;
    const deduct  = webHolesN * webHoleDiam;
    const stagger = (webHolesN>1 && webHolePitch>0 && webHoleGage>0)
      ? (webHolesN-1)*webHolePitch**2/(4*webHoleGage) : 0;
    return Math.max(gross - deduct + stagger, 0.85*gross);
  }
  // 0.85x gross floor detection helpers
  const _raw=(gross,n,d,p,g)=>gross-n*d+(n>1&&p>0&&g>0?(n-1)*p**2/(4*g):0);
  const is85   =(gross)=>holeDiam&&holesN   ? _raw(gross,holesN,holeDiam,holePitch,holeGage)     < 0.85*gross : false;
  const is85Web=(gross)=>webHoleDiam&&webHolesN ? _raw(gross,webHolesN,webHoleDiam,webHolePitch,webHoleGage) < 0.85*gross : false;

  // ── Build item list ────────────────────────────────────────────────────────
  // Position (yc) always uses nominal geometry; area/Ixo use effective dimensions.
  const items = [];

  // Bottom cover plates — width (lossW) and thickness (lossHt) both corrode
  if (bcp.on && bcp.t>0) {
    const qty   = bcp.qty||1;
    const w_eff = effDim(+bcp.w, bcp.lossW);    // W col → width
    const h_nom = +bcp.t * qty;                  // total nominal height
    const h_eff = effDim(h_nom, bcp.lossHt);    // loss on TOTAL stack (outer plate only) → e.g. 3"−0.5"=2.5"
    const t_eff = h_eff / qty;                   // effective per-plate thickness for display
    const grossA = w_eff * h_eff;
    const netA   = netWidth(w_eff) * h_eff;
    const yc     = h_nom / 2;
    items.push({id:'bcp',label:'Bot Cover Plates',grossA,netA,yc,
                Ixo:w_eff*h_eff**3/12,tension:true,color:'#3b82f6',
                net85:is85(w_eff), nF:netA/Math.max(grossA,1e-9),
                note:`${qty}pl × ${w_eff.toFixed(3)}"×${h_eff.toFixed(3)}" total (${t_eff.toFixed(3)}" ea)`});
  }

  // Bottom angles — split into L and R items to support asymmetric section loss
  if (ban.on && ban.w>0 && ban.h>0 && ban.t>0) {
    // lossL/lossR on component: true (default) = this side gets section loss
    const makeBanItem_lossL = ban.lossL !== false;
    const makeBanItem_lossR = ban.lossR !== false;
    // Helper: build one angle item given whether loss is applied
    function makeBanItem(side, hasLoss) {
      const w_e  = hasLoss ? effDim(+ban.w, ban.lossW)  : +ban.w;
      const h_e  = hasLoss ? effDim(+ban.h, ban.lossHt) : +ban.h;
      const th_e = hasLoss ? effDim(+ban.t, ban.lossTH) : +ban.t;
      const tv_e = hasLoss ? effDim(+ban.t, ban.lossTV) : +ban.t;
      const ap   = calcAngleProps(w_e, h_e, +ban.t, th_e, tv_e);
      const grossA = ap.area;
      const A_vert     = tv_e * h_e;
      const b85H = is85(w_e - tv_e);
      const b85V = is85Web(h_e);
      const h_vnet     = netWidthWeb(h_e);
      const A_vert_net = tv_e * h_vnet;
      const nHW        = netWidth(w_e - tv_e);
      const nHoriz     = nHW * th_e;
      const netA       = A_vert_net + nHoriz;
      const yc_net     = netA>0 ? (A_vert_net*(h_vnet/2)+nHoriz*(th_e/2))/netA : 0;
      const I1n = tv_e*h_vnet**3/12 + A_vert_net*(h_vnet/2-yc_net)**2;
      const I2n = nHW*th_e**3/12    + nHoriz*(th_e/2-yc_net)**2;
      const lbl = hasLoss ? `Bot Angle ${side}` : `Bot Angle ${side} (nominal)`;
      return {id:`ban_${side.toLowerCase()}`,label:lbl,grossA,netA,
              yc:h_bcp+ap.centY, ycNet:h_bcp+yc_net,
              Ixo:ap.ixo, IxoNet:I1n+I2n, tension:true, color:'#22c55e',
              net85:b85H||b85V, net85H:b85H, net85V:b85V,
              nF:netA/Math.max(grossA,1e-9), hasLoss,
              note:`L${w_e.toFixed(3)}×${h_e.toFixed(3)}×(tH=${th_e.toFixed(3)},tV=${tv_e.toFixed(3)})"`,
              apData:ap};
    }
    items.push(makeBanItem('L', makeBanItem_lossL));
    items.push(makeBanItem('R', makeBanItem_lossR));
  }

  // Bottom web side plates — thickness (lossW) and height (lossHt); web holes on height
  for (const c of [bwl,bwr]) {
    if (c.on && c.w>0 && c.h>0) {
      const t_eff  = effDim(+c.w, c.lossW);
      const h_eff  = effDim(+c.h, c.lossHt);
      const h_net  = netWidthWeb(h_eff);        // web bolt holes reduce effective height
      const yc     = h_bcp + gap + h_eff/2;
      const nF     = h_net / Math.max(h_eff, 1e-9);
      items.push({id:c.id,label:c.id==='bwl'?'Bot WSP L':'Bot WSP R',
                  grossA:t_eff*h_eff, netA:t_eff*h_net, yc,
                  Ixo:t_eff*h_eff**3/12, IxoNet:t_eff*h_net**3/12,
                  tension:true, color:'#a855f7', net85:is85Web(h_eff), nF,
                  note:`${t_eff.toFixed(3)}"×${h_eff.toFixed(3)}" (net h=${h_net.toFixed(3)}")`});
    }
  }

  // Web plate
  if (web.on && tw_eff>0 && hw>0) {
    items.push({id:'web',label:'Web Plate',
                grossA:tw_eff*hw,netA:tw_eff*hw,yc:h_bcp+outToOut/2,
                Ixo:tw_eff*hw**3/12,tension:false,color:'#ef4444',nF:1,
                note:`${tw}"×${hw}"${pctLoss(tw,tw_eff)}`});
  }

  // Top web side plates — thickness (lossW) and height (lossHt) both corrode
  for (const c of [twl,twr]) {
    if (c.on && c.w>0 && c.h>0) {
      const t_eff = effDim(+c.w, c.lossW);
      const h_eff = effDim(+c.h, c.lossHt);
      const yc    = h_bcp + gap + hw - h_eff/2;
      items.push({id:c.id,label:c.id==='twl'?'Top WSP L':'Top WSP R',
                  grossA:t_eff*h_eff,netA:t_eff*h_eff,yc,
                  Ixo:t_eff*h_eff**3/12,tension:false,color:'#a855f7',nF:1,
                  note:`${t_eff.toFixed(3)}"×${h_eff.toFixed(3)}"`});
    }
  }

  // Top angles — split L/R for asymmetric section loss support
  if (tan_.on && tan_.w>0 && tan_.h>0 && tan_.t>0) {
    const tanLossL = tan_.lossL !== false;
    const tanLossR = tan_.lossR !== false;
    function makeTanItem(side, hasLoss) {
      const w_e  = hasLoss ? effDim(+tan_.w, tan_.lossW)  : +tan_.w;
      const h_e  = hasLoss ? effDim(+tan_.h, tan_.lossHt) : +tan_.h;
      const th_e = hasLoss ? effDim(+tan_.t, tan_.lossTH) : +tan_.t;
      const tv_e = hasLoss ? effDim(+tan_.t, tan_.lossTV) : +tan_.t;
      const ap   = calcAngleProps(w_e, h_e, +tan_.t, th_e, tv_e);
      return {id:`tan_${side.toLowerCase()}`,label:hasLoss?`Top Angle ${side}`:`Top Angle ${side} (nominal)`,
              grossA:ap.area, netA:ap.area, yc:totalDepth-h_tcp-ap.centY,
              Ixo:ap.ixo, tension:false, color:'#22c55e', nF:1, hasLoss,
              note:`L${w_e.toFixed(3)}×${h_e.toFixed(3)}×(tH=${th_e.toFixed(3)},tV=${tv_e.toFixed(3)})"`,
              apData:ap};
    }
    items.push(makeTanItem('L', tanLossL));
    items.push(makeTanItem('R', tanLossR));
  }

  // Top cover plates — width (lossW) and thickness (lossHt) may corrode
  if (tcp.on && tcp.t>0) {
    const qty   = tcp.qty||1;
    const w_eff = effDim(+tcp.w, tcp.lossW);
    const h_nom = +tcp.t * qty;                  // total nominal height
    const h_eff = effDim(h_nom, tcp.lossHt);    // loss on TOTAL stack (outer plate only)
    const t_eff = h_eff / qty;                   // effective per-plate for display
    items.push({id:'tcp',label:'Top Cover Plates',grossA:w_eff*h_eff,netA:w_eff*h_eff,
                yc:totalDepth-h_nom/2,Ixo:w_eff*h_eff**3/12,tension:false,
                color:'#3b82f6',nF:1,
                note:`${qty}pl × ${w_eff.toFixed(3)}"×${h_eff.toFixed(3)}" total (${t_eff.toFixed(3)}" ea)`});
  }

  // ── GROSS section ──────────────────────────────────────────────────────────
  const totAg = items.reduce((s,i)=>s+i.grossA, 0);
  const ybG   = totAg>0 ? items.reduce((s,i)=>s+i.grossA*i.yc,0)/totAg : 0;
  // Apply web hole deduction to web plate tension zone (below NA) — post-ybG
  const webItem = items.find(i=>i.id==='web');
  if (webItem && webHolesN > 0 && hw > 0) {
    const tens_h = Math.max(0, ybG - web_bot_y);     // tension zone height (below NA)
    const comp_h = hw - tens_h;                        // compression zone height (above NA)
    const net_tens_h = netWidthWeb(tens_h);            // net tension zone after hole deduction
    if (tens_h > 0) {
      webItem.netA = tw_eff * (comp_h + net_tens_h);
      // IxoNet about web gross centroid — two zones (comp full + tens net)
      const yc_w   = webItem.yc;
      const d_comp = (web_bot_y + tens_h + comp_h/2) - yc_w;
      const d_tens = (web_bot_y + tens_h/2) - yc_w;
      webItem.IxoNet = tw_eff*comp_h**3/12 + tw_eff*comp_h*d_comp**2
                     + tw_eff*net_tens_h**3/12 + tw_eff*net_tens_h*d_tens**2;
      webItem.nF = webItem.netA / Math.max(webItem.grossA, 1e-9);
    }
  }

  let IxG=0; items.forEach(i=>{const d=i.yc-ybG; IxG+=i.Ixo+i.grossA*d**2;});
  const cTopG=totalDepth-ybG, cBotG=ybG;
  const SxTopG=cTopG>0?IxG/cTopG:0, SxBotG=cBotG>0?IxG/cBotG:0;

  // ── NET section ───────────────────────────────────────────────────────────
  const totAn = items.reduce((s,i)=>s+i.netA, 0);
  // ybN: use net centroid (ycNet) for items where holes shift centroid (e.g. BAN)
  const ybN   = totAn>0 ? items.reduce((s,i)=>s+i.netA*(i.ycNet??i.yc),0)/totAn : 0;
  let IxN=0; items.forEach(i=>{
    // Use net centroid (ycNet) for parallel axis if available — bottom angles shift centroid with holes/loss
    const ycRef = i.ycNet ?? i.yc;
    const d=ycRef-ybN; IxN+=(i.IxoNet??i.Ixo*i.nF)+i.netA*d**2;
  });
  const cBotN=ybN, SxBotN=cBotN>0?IxN/cBotN:0;

  // ── Shear area ────────────────────────────────────────────────────────────
  const Aw = tw_eff * hw;

  // ── Weak-axis Iyc & Ac for LTB (AREMA Ch.15 §1.12.3) ─────────────────────
  // ryc = √(Iyc/Ac) — compression flange assembly + web zone above gross NA.
  // NOW that ybG is known, web compression zone height h_wc can be computed.
  let Iyc=0, Ac=0;

  if (tcp.on && tcp.t>0) {                       // Top cover plate — Iy about web CL
    const w_eff=effDim(+tcp.w,tcp.lossW), hS=effDim(+tcp.t*(tcp.qty||1),tcp.lossHt); // total height loss
    Iyc+=hS*w_eff**3/12; Ac+=w_eff*hS;
  }
  const twsp_eff = Math.max(
    (twl.on && twl.w>0) ? effDim(+twl.w,twl.lossW) : 0,
    (twr.on && twr.w>0) ? effDim(+twr.w,twr.lossW) : 0
  );
  for (const wsp of [twl,twr]) {                 // Top web side plates
    if (wsp.on&&wsp.w>0&&wsp.h>0) {
      const w_eff=effDim(+wsp.w,wsp.lossW), dCL=tw_eff/2+w_eff/2;
      Iyc+=wsp.h*w_eff**3/12+w_eff*wsp.h*dCL**2; Ac+=w_eff*wsp.h;
    }
  }
  if (tan_.on&&tan_.w>0&&tan_.h>0&&tan_.t>0) {   // Top angles — L and R computed independently for lossL/lossR
    const tanIycL = tan_.lossL !== false;
    const tanIycR = tan_.lossR !== false;
    for (const hasL of [tanIycL, tanIycR]) {  // iterate once per angle (L then R)
      const w_e  = hasL ? effDim(+tan_.w,tan_.lossW)  : +tan_.w;
      const h_e  = hasL ? effDim(+tan_.h,tan_.lossHt) : +tan_.h;
      const th_e = hasL ? effDim(+tan_.t,tan_.lossTH) : +tan_.t;
      const tv_e = hasL ? effDim(+tan_.t,tan_.lossTV) : +tan_.t;
      const ap   = calcAngleProps(w_e,h_e,+tan_.t,th_e,tv_e);
      const dCL  = tw_eff/2+twsp_eff+ap.centX;
      Iyc += ap.iyo+ap.area*dCL**2;
      Ac  += ap.area;
    }
  }
  const Iyc_flange=Iyc, Ac_flange=Ac;

  // Web compression zone — above gross NA, using effective tw
  // y=0 at section bottom; compression is at HIGH y (top). Web above NA is in compression.
  const h_wc   = ybG <= web_bot_y ? hw              // NA at/below web bottom → all web in compression
               : ybG >= web_top_y ? 0                // NA at/above web top    → no web in compression
               : web_top_y - ybG;                    // NA within web          → partial
  const Iyc_wc = h_wc*tw_eff**3/12;
  const Ac_wc  = h_wc*tw_eff;
  Iyc+=Iyc_wc; Ac+=Ac_wc;

  const ryc=(Iyc>0&&Ac>0)?Math.sqrt(Iyc/Ac):3.0;

  // ── Plastic section modulus Zx (gross) ───────────────────────────────────
  const halfA=totAg/2; let cum=0, PNA=ybG;
  for (const it of [...items].sort((a,b)=>a.yc-b.yc)) {
    cum+=it.grossA; if(cum>=halfA){PNA=it.yc;break;}
  }
  let Zx=0; items.forEach(i=>{Zx+=i.grossA*Math.abs(i.yc-PNA);});

  return {
    totalDepth, h_bcp, h_tcp, outToOut, gap, hw, tw,
    ybG, ybN, IxG, IxN,
    SxTopG, SxBotG, SxBotN,
    cTopG, cBotG, cBotN,
    Aw, Iyc, ryc, Ac, Zx, PNA,
    totAg, totAn, items,
    h_wc, Iyc_wc, Ac_wc, Iyc_flange, Ac_flange,
    web_bot_y, web_top_y,
  };
}

// AREMA Chapter 15 allowable stresses — Normal and Maximum rating
function aremaAllowables(z, sec) {
  const Fy = +(z.Fy  || 36);
  const E  = 29000;
  const L  = +(z.unbracedL || 240);
  // ryc: auto-compute from section, or manual override
  const ryc = (z.autoRyc!==false && sec?.ryc>0) ? sec.ryc : (+(z.ryc)||sec?.ryc||3);
  const LRyc = L/ryc;

  // NORMAL (Standard — DL + LL+I + CF, 100% allowable)
  // AREMA Table 15-1-11 / Ch.15 §7.3.2
  const Ft_N = 0.55*Fy;
  let   Fb_N = 0.55*Fy - (0.55*Fy**2)/(6.3*Math.PI**2*E)*LRyc**2;
  Fb_N = Math.min(Math.max(Fb_N, 0.10*Fy), 0.55*Fy);
  const Fs_N = 0.35*Fy;
  const Fb_N_ltb = (0.55*Fy**2/1.8e6)*LRyc**2;  // LTB term for display

  // MAXIMUM & MODIFIED — K-factor allowables (AREMA Table 15-7-1)
  // K = 0.80Fy. Same allowables for both cases; load combinations differ.
  // Note: K ≠ 1.25×Normal. For A36: K=28.8 ksi vs 1.25×19.8=24.75 ksi.
  const K        = 0.80 * Fy;
  const Ft_X     = K;                                     // tension = K
  const Fb_X_ltb = (K * Fy / 1.8e6) * LRyc**2;           // LTB uses K (not 0.55Fy)
  const Fb_X     = Math.max(K - Fb_X_ltb, 0);             // compression with LTB
  const Fs_X     = 0.75 * K;                              // shear = 0.75K

  return {Fy,E,L,ryc,LRyc, Ft_N,Fb_N,Fs_N,Fb_N_ltb, K,Ft_X,Fb_X,Fs_X,Fb_X_ltb};
}

// SVG cross-section diagram (returns SVG string)
function aremaGirderSVG(z, sec) {
  if (!sec || sec.totalDepth<=0) return '<text x="50" y="100" fill="#9ca3af" font-size="11" font-family="monospace" text-anchor="middle">Add components above</text>';
  const VW=200, VH=380, pad=18;
  const drawH=VH-2*pad;
  const sc=drawH/sec.totalDepth;
  const xc=VW/2;
  const toY=y=>VH-pad-y*sc;

  const comps=z.aremaComps||defaultAremaComps();
  const G=id=>comps.find(c=>c.id===id)||{on:false};
  const tcp=G('tcp'),tan_=G('tan'),twl=G('twl'),twr=G('twr'),
        web=G('web'),bwl=G('bwl'),bwr=G('bwr'),ban=G('ban'),bcp=G('bcp');
  const {h_bcp,h_tcp,outToOut,gap,hw,tw,ybG,web_bot_y,totalDepth}=sec;

  // ── Section loss helpers ──────────────────────────────────────────────────
  const lossSL = z.sectionLossEnabled === true;
  const effD = (nom, loss) => lossSL ? Math.max(0, nom-(+(loss)||0)) : nom;

  // ── Hole geometry ─────────────────────────────────────────────────────────
  const holeDiam    = +(z.holeDiam||0);
  const webHoleDiam = +(z.webHoleDiam||0);
  const holesN      = +(z.holesInChain||0);
  const webHolesN   = +(z.webHolesInChain||0);

  // Drawing layers: fills first, then dashed loss outlines, then holes on top
  const fills=[], dashes=[], holes=[];

  // Solid filled rectangle (physical inches, from CL)
  function R(xL,yB,wi,hi,fill) {
    const x=(xc+xL*sc).toFixed(1), y=toY(yB+hi).toFixed(1);
    const w=Math.max(1,Math.abs(wi*sc)).toFixed(1), h=Math.max(1,Math.abs(hi*sc)).toFixed(1);
    fills.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="#1e293b" stroke-width="0.6" opacity="0.9"/>`);
  }
  // Dashed outline of nominal (original) dimensions — shows section loss
  function DASH(xL,yB,wi,hi) {
    const x=(xc+xL*sc).toFixed(1), y=toY(yB+hi).toFixed(1);
    const w=Math.max(1,Math.abs(wi*sc)).toFixed(1), h=Math.max(1,Math.abs(hi*sc)).toFixed(1);
    dashes.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#ef4444" stroke-width="0.9" stroke-dasharray="3,2" opacity="0.7"/>`);
  }
  // Bolt hole — white rectangle in cross-section (centered on xC, yC in physical inches)
  function HOLE(xC,yC,hw_,hh_) {
    if (hw_<=0||hh_<=0) return;
    const x=(xc+(xC-hw_/2)*sc).toFixed(1), y=toY(yC+hh_/2).toFixed(1);
    const w=Math.max(2,Math.abs(hw_*sc)).toFixed(1), h=Math.max(2,Math.abs(hh_*sc)).toFixed(1);
    holes.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="white" stroke="#475569" stroke-width="0.5" rx="1"/>`);
  }

  // ── Pre-compute shared hole positions ────────────────────────────────────
  // All connected components share the same bolt line position
  // BAN dimensions needed for hole positions even if drawn later
  const ban_on = ban.on && ban.w>0 && ban.h>0 && ban.t>0;
  const ban_htw   = tw/2;
  const ban_wspOff= (bwl.on&&bwl.w>0)?+bwl.w:0;
  const ban_bwE   = ban_on ? effD(+ban.w, ban.lossW) : 0;  // effective (corroded) — used for loss side only
  const ban_bhE   = ban_on ? effD(+ban.h, ban.lossHt) : 0;
  const ban_thE   = ban_on ? effD(+ban.t, ban.lossTH) : 0;
  const ban_tvE   = ban_on ? effD(+ban.t, ban.lossTV) : 0;
  // Flange bolt x: centered in the outstanding leg of the angle (from CL)
  const x_flange  = ban_on ? (ban_htw + ban_wspOff + (ban_bwE + ban_tvE)/2) : 0;
  // Web bolt y: center of BWL/BWR height (reference plate for web connection)
  const bwl_hE    = (bwl.on&&bwl.h>0) ? effD(+bwl.h, bwl.lossHt) : 0;
  const y_web     = h_bcp + gap + bwl_hE/2;   // center of bottom WSP height
  // Web bolt x-span: from outer edge of left angle V-leg to right angle V-leg
  const x_web_L   = ban_on ? -(ban_htw + ban_wspOff + ban_tvE) : -tw/2;
  const x_web_R   = ban_on ?  (ban_htw + ban_wspOff + ban_tvE) :  tw/2;
  const web_span  = x_web_R - x_web_L;

  // ── Bottom cover plates ───────────────────────────────────────────────────
  if (bcp.on && bcp.t>0) {
    const wN=+(bcp.w||18), qty=bcp.qty||1;
    const wE=effD(wN, bcp.lossW);
    const hE=effD(h_bcp, bcp.lossHt);  // loss on total stack height, not per-plate
    if (lossSL && (wE<wN || hE<h_bcp)) DASH(-wN/2,0,wN,h_bcp);
    R(-wE/2, h_bcp-hE, wE, hE,'#3b82f6');  // inner(top) face fixed; outer(bottom) corrodes
    // Flange holes: n per side, evenly spaced across the outstanding leg
    // Use ceil(holesN/2) holes per side so total matches # in chain
    if (holeDiam>0 && ban_on) {
      const nPerSide = Math.max(1, Math.ceil(holesN/2));
      const combH = hE + ban_thE;  // BCP stack + angle H-leg combined height
      const outStandW = ban_bwE - ban_tvE;  // width of outstanding leg
      // Tip of outstanding leg (farthest from web CL)
      const tipL = -(ban_htw + ban_wspOff + ban_bwE);
      const tipR =  (ban_htw + ban_wspOff + ban_bwE);
      for (let k=1; k<=nPerSide; k++) {
        const frac = k / (nPerSide+1);  // 1/3, 2/3 etc.
        const xL = tipL + frac * outStandW;  // advance from tip toward inner face
        const xR = tipR - frac * outStandW;
        const flangeYc = (hE + ban_thE) / 2;  // center of combined BCP + angle H-leg
        HOLE(xL, flangeYc, holeDiam, combH);
        HOLE(xR, flangeYc, holeDiam, combH);
      }
    }
  }

  // ── Bottom angles — respect lossL/lossR flags for which side gets dashes ──
  if (ban_on) {
    const btN = +ban.t;
    const banLP_L = ban.lossL !== false;  // left angle gets loss
    const banLP_R = ban.lossR !== false;  // right angle gets loss
    // Nominal dims for non-corroded side
    const ban_bwN = +ban.w, ban_bhN = +ban.h;
    // Section loss dashes — only on the side(s) with loss
    const dashL = lossSL && banLP_L;
    const dashR = lossSL && banLP_R;
    if (dashL) {
      DASH(-ban_htw-ban_wspOff-btN,    h_bcp, -btN,           ban_bhN);
      DASH(-ban_htw-ban_wspOff-ban_bwN, h_bcp, -(ban_bwN-btN), btN);
    }
    if (dashR) {
      DASH( ban_htw+ban_wspOff,         h_bcp,  btN,           ban_bhN);
      DASH( ban_htw+ban_wspOff+btN,     h_bcp,  ban_bwN-btN,   btN);
    }
    // Effective fills — use effective dims for affected side, nominal for unaffected
    const bwL = banLP_L ? ban_bwE : ban_bwN;   // left side: effective if loss, nominal otherwise
    const bhL = banLP_L ? ban_bhE : ban_bhN;
    const thL = banLP_L ? ban_thE : btN;
    const tvL = banLP_L ? ban_tvE : btN;
    const bwR = banLP_R ? ban_bwE : ban_bwN;   // right side: effective if loss
    const bhR = banLP_R ? ban_bhE : ban_bhN;
    const thR = banLP_R ? ban_thE : btN;
    const tvR = banLP_R ? ban_tvE : btN;
    R(-ban_htw-ban_wspOff-tvL, h_bcp, -tvL,       bhL, '#22c55e');
    R(-ban_htw-ban_wspOff-bwL, h_bcp, -(bwL-tvL), thL, '#22c55e');
    R( ban_htw+ban_wspOff,     h_bcp,  tvR,        bhR, '#22c55e');
    R( ban_htw+ban_wspOff+tvR, h_bcp,  bwR-tvR,    thR, '#22c55e');
  }

  // ── Bottom web side plates ────────────────────────────────────────────────
  if (bwl.on&&bwl.w>0&&bwl.h>0) {
    const twN=+bwl.w, thN=+bwl.h;
    const twE=effD(twN,bwl.lossW), thE=effD(thN,bwl.lossHt);
    if (lossSL&&(twE<twN||thE<thN)) DASH(-tw/2-twN,h_bcp+gap,-twN,thN);
    R(-tw/2-twE, h_bcp+gap, -twE, thE, '#a855f7');
  }
  if (bwr.on&&bwr.w>0&&bwr.h>0) {
    const twN=+bwr.w, thN=+bwr.h;
    const twE=effD(twN,bwr.lossW), thE=effD(thN,bwr.lossHt);
    if (lossSL&&(twE<twN||thE<thN)) DASH(tw/2,h_bcp+gap,twN,thN);
    R(tw/2, h_bcp+gap, twE, thE, '#a855f7');
  }

  // ── Web plate ─────────────────────────────────────────────────────────────
  if (web.on&&tw>0&&hw>0) {
    const twE=effD(tw, web.lossW);
    if (lossSL&&twE<tw) DASH(-tw/2,h_bcp+gap,tw,hw);
    R(-twE/2, h_bcp+gap, twE, hw, '#ef4444');
  }

  // ── Web bolts — continuous horizontal slots, one per bolt line ────────────
  // Position: start 1" below the top of the angle V-leg, space 2" downward
  // This ensures holes are well within the angle V-leg, not at its edge
  if (webHoleDiam>0 && (ban_on || bwl.on || web.on)) {
    const nWebLines = Math.max(1, Math.min(6, webHolesN));
    // Reference: top of angle V-leg (or top of WSP if no angle)
    const yRef = ban_on ? (h_bcp + ban_bhE) : (h_bcp + gap + bwl_hE);
    for (let k=1; k<=nWebLines; k++) {
      const yLine = yRef - 1 - (k-1)*2;  // 1" from top, then 2" spacing downward
      HOLE(x_web_L + web_span/2, yLine, web_span, webHoleDiam);
    }
  }

  // ── Top web side plates ───────────────────────────────────────────────────
  if (twl.on&&twl.w>0&&twl.h>0) {
    const twN=+twl.w, thN=+twl.h;
    const twE=effD(twN,twl.lossW), thE=effD(thN,twl.lossHt);
    if (lossSL&&(twE<twN||thE<thN)) DASH(-tw/2-twN,h_bcp+gap+hw-thN,-twN,thN);
    R(-tw/2-twE, h_bcp+gap+hw-thE, -twE, thE, '#a855f7');
  }
  if (twr.on&&twr.w>0&&twr.h>0) {
    const twN=+twr.w, thN=+twr.h;
    const twE=effD(twN,twr.lossW), thE=effD(thN,twr.lossHt);
    if (lossSL&&(twE<twN||thE<thN)) DASH(tw/2,h_bcp+gap+hw-thN,twN,thN);
    R(tw/2, h_bcp+gap+hw-thE, twE, thE, '#a855f7');
  }

  // ── Top angles — respect lossL/lossR for asymmetric section loss ───────────
  if (tan_.on&&tan_.w>0&&tan_.h>0&&tan_.t>0) {
    const twN=+tan_.w, thN=+tan_.h, ttN=+tan_.t, htw=tw/2;
    const wsp_off=(twl.on&&twl.w>0)?+twl.w:0;
    const twE=effD(twN,tan_.lossW), thE=effD(thN,tan_.lossHt);
    const thHe=effD(ttN,tan_.lossTH), tvHe=effD(ttN,tan_.lossTV);
    const tanLossL = tan_.lossL !== false;
    const tanLossR = tan_.lossR !== false;
    const dashTL = lossSL && tanLossL;
    const dashTR = lossSL && tanLossR;
    // Left side: use effective if has loss, nominal otherwise
    const twEL = tanLossL ? twE : twN, thEL = tanLossL ? thE : thN;
    const thHL = tanLossL ? thHe : ttN, tvHL = tanLossL ? tvHe : ttN;
    // Right side
    const twER = tanLossR ? twE : twN, thER = tanLossR ? thE : thN;
    const thHR = tanLossR ? thHe : ttN, tvHR = tanLossR ? tvHe : ttN;
    if (dashTL) {
      DASH(-htw-wsp_off-ttN, totalDepth-h_tcp-thN, -ttN,      thN);
      DASH(-htw-wsp_off-twN, totalDepth-h_tcp-ttN, -(twN-ttN), ttN);
    }
    R(-htw-wsp_off-tvHL, totalDepth-h_tcp-thEL,       -tvHL,       thEL, '#22c55e');
    R(-htw-wsp_off-twEL, totalDepth-h_tcp-thHL, -(twEL-tvHL), thHL, '#22c55e');
    if (dashTR) {
      DASH(htw+wsp_off,     totalDepth-h_tcp-thN, ttN,       thN);
      DASH(htw+wsp_off+ttN, totalDepth-h_tcp-ttN, twN-ttN,   ttN);
    }
    R(htw+wsp_off,      totalDepth-h_tcp-thER,  tvHR,       thER, '#22c55e');
    R(htw+wsp_off+tvHR, totalDepth-h_tcp-thHR,  twER-tvHR,  thHR, '#22c55e');
  }

  // ── Top cover plates ──────────────────────────────────────────────────────
  if (tcp.on&&tcp.t>0) {
    const wN=+(tcp.w||18), qty=tcp.qty||1;
    const wE=effD(wN,tcp.lossW);
    const hE=effD(h_tcp, tcp.lossHt);  // loss on total stack height, not per-plate
    const yBot=totalDepth-h_tcp;
    if (lossSL&&(wE<wN||hE<h_tcp)) DASH(-wN/2, yBot, wN, h_tcp);
    R(-wE/2, yBot, wE, hE, '#3b82f6');  // inner(bottom) face fixed; outer(top) face corrodes
  }

  // ── Neutral axis ──────────────────────────────────────────────────────────
  const naY=toY(ybG).toFixed(1);
  const naLine=`<line x1="${pad}" y1="${naY}" x2="${VW-pad}" y2="${naY}" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>`;
  const naText=`<text x="${VW-pad-2}" y="${(+naY-3).toFixed(0)}" fill="#f59e0b" font-size="9" font-family="monospace" font-weight="700" text-anchor="end">NA</text>`;
  const depthTxt=`<text x="6" y="${(VH/2).toFixed(0)}" fill="#6b7280" font-size="8" font-family="monospace" text-anchor="middle" transform="rotate(-90,6,${(VH/2).toFixed(0)})">${sec.totalDepth.toFixed(2)}"</text>`;

  return [...fills, ...dashes, ...holes, naLine, naText, depthTxt].join('');
}

function legalLLfactor(adtt) {
  if (adtt == null || adtt < 0) return 1.45; // Unknown → 1.45
  if (adtt >= 5000) return 1.45;
  if (adtt <= 1000) return 1.30;
  return +(1.30 + (1.45 - 1.30) * (adtt - 1000) / (5000 - 1000)).toFixed(4);
}

// Determine MBE rating category for a vehicle based on its group
function defaultVehicleCategory(vehicleName) {
  const grp = VEHICLE_GROUPS.find(g=>g.vehicles.some(v=>v.name===vehicleName));
  if (!grp) return 'Design';
  if (grp.group.toLowerCase().includes('permit')) return 'Permit';
  if (grp.group.toLowerCase().includes('legal') || grp.group.toLowerCase().includes('posting')) return 'Legal';
  if (grp.group.toLowerCase().includes('operating')) return 'Legal'; // operating vehicles use legal factors
  return 'Design';
}

// Return { inv, op } γ_LL for a vehicle per MBE Table 6A.4.2.2-1
function vehicleGamLL(category, limitState, method, adtt) {
  if (method === 'LFR') {
    return { inv: 2.17, op: 1.30 };
  }
  const ls = LRFR_FACTORS.LRFR[limitState] || LRFR_FACTORS.LRFR['Strength I'];
  if (category === 'Legal') {
    const ll = legalLLfactor(adtt);
    return { inv: ll, op: ll }; // Legal: same factor, level expressed through RF interpretation
  }
  if (category === 'Permit') {
    return { inv: ls.Permit?.LL ?? 1.10, op: ls.Permit?.LL ?? 1.10 };
  }
  // Design
  return { inv: ls.Inventory?.LL ?? 1.75, op: ls.Operating?.LL ?? 1.35 };
}

function StepResults({ cfg, set, rows: origRows, setRows, rawText, setRawText, mode, setMode,
                       ratingMode='results',
    selectedLoadProp, setSelectedLoadProp, cfgSnap, setCfgSnap,
    resultsCombos, setResultsCombos,
    ratingCapZones, setRatingCapZones,
    onReportState }) {
  const [parseErr, setParseErr] = useState('');
  const [collapsedTbls, setCollapsedTbls] = React.useState({});  // tracks which node tables are collapsed
  const [selectedLoad, setSelectedLoadLocal] = useState(selectedLoadProp||'');
  const [staleAcknowledged, setStaleAcknowledged] = useState(false);

  // Combo state (local UI only — data lives in App via resultsCombos prop)
  const combos = resultsCombos || [];
  const setCombos = setResultsCombos || (()=>{});
  const comboUid = () => 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  // All combo helpers use functional updaters to avoid stale closure bugs
  const addCombo    = ()         => setCombos(prev=>[...prev, {id:comboUid(), name:'New Combination', terms:[{lc:'',factor:1}]}]);
  const removeCombo = id         => setCombos(prev=>prev.filter(c=>c.id!==id));
  const updateCombo = (id,f,val) => setCombos(prev=>prev.map(c=>c.id===id?{...c,[f]:val}:c));
  const addTerm     = id         => setCombos(prev=>prev.map(c=>c.id===id?{...c,terms:[...c.terms,{lc:'',factor:1,_key:Math.random().toString(36).slice(2)}]}:c));
  const removeTerm  = (id,key)   => setCombos(prev=>prev.map(c=>c.id===id?{...c,terms:c.terms.filter(t=>(t._key||t.lc)!==key)}:c));
  const updateTerm  = (id,key,field,val) => setCombos(prev=>prev.map(c=>c.id===id?{...c,terms:c.terms.map(t=>(t._key||t.lc)===key?{...t,[field]:val}:t)}:c));

  // Staleness: cfg changed after results were parsed — define BEFORE any useEffect that uses it
  const cfgSnapFields = cfg ? JSON.stringify({
    spans:cfg.spans, elemsPerSpan:cfg.elemsPerSpan,
    sectionZones:cfg.sectionZones,
    deadLoads:cfg.deadLoads,
    selectedVehicles:cfg.selectedVehicles, laneName:cfg.laneName,
  }) : null;

  // Compute combined rows from origRows + combos
  const computedRows = useMemo(()=>
    combos.flatMap(combo=>computeComboRows(origRows, combo)),
    [origRows, combos]
  );
  // Shadow `rows` so all existing code picks up combos automatically
  const rows = useMemo(()=>[...origRows, ...computedRows], [origRows, computedRows]);
  const comboNames = new Set(combos.map(c=>c.name));

  // Keep prop and local in sync
  const setSelectedLoad = val => { setSelectedLoadLocal(val); setSelectedLoadProp(val); };
  useEffect(()=>{ if(selectedLoadProp && selectedLoadProp!==selectedLoad) setSelectedLoadLocal(selectedLoadProp); },[selectedLoadProp]);

  // Reset acknowledgement whenever cfg changes (so warning reappears if they change again)
  useEffect(()=>{ if(staleAcknowledged) setStaleAcknowledged(false); },[cfgSnapFields]);

  const isStale = rows.length>0 && cfgSnap && cfgSnapFields && cfgSnap!==cfgSnapFields && !staleAcknowledged;
  const [activeChannels, setActiveChannels] = useState(['momentY','shearZ']);
  const [factors, setFactors] = useState(DEFAULT_FACTORS);
  const [factorsOpen, setFactorsOpen] = useState(false);
  const [queryDist, setQueryDist] = useState('');
  const [queryOpen, setQueryOpen] = useState(false);

  // ── computed ──────────────────────────────────────────────────────────────
  const loadCases = useMemo(() => [...new Set(origRows.map(r=>r.load))], [origRows]);

  const groupedLCs = useMemo(() => {
    const allLCs = [...new Set(rows.map(r=>r.load))]; // includes combos
    const g = { Static:[], 'Moving (max)':[], 'Moving (min)':[], 'Moving (all)':[], 'Computed Combos':[], Combinations:[] };
    const staticNames = ['Selfweight',
      ...((cfg?.deadLoads||[]).map(d=>d.name)),
      ...(cfg?.deadLoadLabels ? Object.values(cfg.deadLoadLabels) : []),
    ];
    allLCs.forEach(lc => {
      if      (comboNames.has(lc))              g['Computed Combos'].push(lc);
      else if (lc.includes('(max)'))            g['Moving (max)'].push(lc);
      else if (lc.includes('(min)'))            g['Moving (min)'].push(lc);
      else if (lc.includes('(all)'))            g['Moving (all)'].push(lc);
      else if (staticNames.some(n=>lc===n))     g.Static.push(lc);
      else                                      g.Combinations.push(lc);
    });
    return g;
  }, [rows, cfg, comboNames]);

  const effectiveScale = useMemo(() => factors.reduce((s,f) => {
    if (!f.enabled) return s;
    return f.id === 'im' ? s*(1+f.value/100) : s*f.value;
  }, 1.0), [factors]);

  const nodePositions = useMemo(() => {
    if (!rows.length || !cfg?.spans?.length) return {};
    const spans       = cfg.spans;
    const elemsPerSpan = cfg.elemsPerSpan || 10;
    const totalLen    = spans.reduce((a,b)=>a+b, 0);
    const TOL         = 0.0005;

    // ── Mirror generateMCT exactly: required positions + zone boundaries ──────
    const requiredXs = new Set();
    let cumX = 0;
    for (let s=0; s<spans.length; s++) {
      requiredXs.add(+cumX.toFixed(6));
      requiredXs.add(+(cumX+spans[s]).toFixed(6));
      cumX += spans[s];
    }
    // Zone boundaries from sectionZones and AREMA section zones
    const sectionZones = cfg.sectionZones || [];
    const zoneSrcs = [
      ...sectionZones.flatMap(z => [+(z.startX||0), +(z.endX||0)]),
      ...(cfg.aremaSection?.zonesEnabled && cfg.aremaSection?.sectionZones?.length
          ? cfg.aremaSection.sectionZones.flatMap(z => [+(z.startX||0), +(z.endX||0)])
          : []),
    ];
    zoneSrcs.forEach(x => { if (x>0 && x<totalLen) requiredXs.add(+x.toFixed(6)); });
    const reqArr = [...requiredXs].sort((a,b)=>a-b);

    // Fill uniform nodes between each pair of required positions
    const regularXs = new Set(reqArr);
    for (let i=0; i<reqArr.length-1; i++) {
      const x0=reqArr[i], x1=reqArr[i+1], segLen=x1-x0;
      if (segLen < 1e-6) continue;
      const n = Math.max(1, Math.round(segLen / (totalLen/(spans.length*elemsPerSpan))));
      for (let j=1; j<n; j++) regularXs.add(+(x0 + j*segLen/n).toFixed(6));
    }
    const finalXs = [...regularXs]
      .filter(x => x>=-TOL && x<=totalLen+TOL)
      .map(x => Math.max(0, Math.min(+totalLen.toFixed(6), x)))
      .sort((a,b) => a-b);

    // Map node ID (101, 102, …) → physical X position
    // Node IDs are assigned sequentially starting at 101 in generateMCT
    const pos = {};
    finalXs.forEach((x, i) => { pos[101+i] = +x.toFixed(4); });
    return pos;
  }, [rows, cfg]);

  const totalBridgeLen = useMemo(() =>
    cfg?.spans?.reduce((a,b)=>a+b,0) || 0, [cfg]);

  const queryResult = useMemo(() => {
    if (queryDist==='' || !rows.length || !selectedLoad || !Object.keys(nodePositions).length) return null;
    const dist = parseFloat(queryDist);
    if (isNaN(dist)) return null;
    const nodeList = [...new Set(rows.map(r=>r.node).filter(Boolean))]
      .filter(n => nodePositions[n]!==undefined)
      .sort((a,b)=>nodePositions[a]-nodePositions[b]);
    const cDist = Math.max(0, Math.min(totalBridgeLen||999, dist));
    let n1=nodeList[0], n2=nodeList[1];
    for (let i=0;i<nodeList.length-1;i++) {
      if (nodePositions[nodeList[i]]<=cDist && nodePositions[nodeList[i+1]]>=cDist) {
        n1=nodeList[i]; n2=nodeList[i+1]; break;
      }
    }
    const x1=nodePositions[n1], x2=nodePositions[n2];
    const t = x2>x1 ? (cDist-x1)/(x2-x1) : 0;
    const r1 = rows.find(r=>r.load===selectedLoad && r.node===n1);
    const r2 = rows.find(r=>r.load===selectedLoad && r.node===n2);
    if (!r1||!r2) return null;
    const result = { dist:cDist, n1, n2, t, x1:x1.toFixed(3), x2:x2.toFixed(3) };
    CHANNELS.forEach(ch => {
      const raw = r1[ch.key] + t*(r2[ch.key]-r1[ch.key]);
      result[ch.key] = { raw:+raw.toFixed(3), scaled:+(raw*effectiveScale).toFixed(3) };
    });
    return result;
  }, [queryDist, rows, selectedLoad, nodePositions, totalBridgeLen, effectiveScale]);

  // ── NEW state for features 1,3,4,5 ─────────────────────────────────────────
  const [viewTab,      setViewTab]      = useState('charts');
  const [envelopeLCs,  setEnvelopeLCs]  = useState([]);
  // Overlay mode
  const [overlayLCs,   setOverlayLCs]   = useState([]);
  const [overlayCh,    setOverlayCh]    = useState('momentY');
  // LLDF calculator
  const [lldfS,        setLldfS]        = useState(8.0);    // beam spacing ft
  const [lldfL,        setLldfL]        = useState(0);      // span length ft (0=auto)
  const [lldfTs,       setLldfTs]       = useState(8.0);    // deck thickness in
  const [lldfN,        setLldfN]        = useState(8);      // modular ratio
  const [lldfI,        setLldfI]        = useState(0);      // moment of inertia in4
  const [lldfA,        setLldfA]        = useState(0);      // area in2
  const [lldfEg,       setLldfEg]       = useState(0);      // eccentricity in
  const [envelopeCh,   setEnvelopeCh]   = useState(['momentY','shearZ']);
  const [dlLCs,        setDlLCs]        = useState([]);
  // ── Rating state (MBE-compliant) ──────────────────────────────────────────
  // ── Rating inputs — all persisted through cfg.rating ─────────────────────
  const R = cfg.rating || {};
  const setRating = (field, val) => {
    if (typeof set !== 'function') return; // guard
    // App's set() is a (key, value) setter — spread existing rating fields + update one
    set('rating', {...(cfg.rating||{}), [field]:val});
  };

  const ratingMethod     = R.method      ?? 'LRFR';
  const ratingLevel      = R.level       ?? 'Inventory';
  const ratingLimitState = R.limitState  ?? 'Strength I';
  const ratingCategory   = R.category    ?? 'Design';
  const ratingAdtt       = R.adtt        ?? 5000;
  const ratingDcLC       = R.dcLC        ?? '';
  const ratingDwLC       = R.dwLC        ?? '';
  const ratingLLposLC    = R.llposLC     ?? '';
  const ratingLLnegLC    = R.llnegLC     ?? '';
  const ratingCustomFact = R.customFact  ?? false;
  const ratingGamDC      = R.gamDC       ?? 1.25;
  const ratingGamDW      = R.gamDW       ?? 1.50;
  const ratingGamLL      = R.gamLL       ?? 1.75;
  const ratingCondKey    = R.condKey     ?? 'Good or Satisfactory (NBI ≥ 6)';
  const ratingSysKey     = R.sysKey      ?? 'Welded I-beam, multiple lanes';
  const ratingPhiSCustom = R.phiSCustom  ?? 1.0;
  const ratingPhiF       = R.phiF        ?? 1.0;
  const ratingPhiV       = R.phiV        ?? 1.0;
  const ratingEta        = R.eta         ?? 1.0;

  const DEFAULT_RATING_LL_FACTORS = [
    {id:'df',  label:'Distribution Factor',      symbol:'g',  value:1.0, enabled:false, hint:'AASHTO 4.6.2.2 — g',          isPercent:false},
    {id:'im',  label:'Dynamic Load Allowance',   symbol:'IM', value:33,  enabled:true,  hint:'Applied as (1+IM/100) to LL', isPercent:true },
    {id:'mpf', label:'Multiple Presence Factor', symbol:'m',  value:1.0, enabled:false, hint:'1-lane=1.20 · 2-lane=1.00',  isPercent:false},
    {id:'u1',  label:'User Factor 1',            symbol:'F₁', value:1.0, enabled:false, hint:'Custom LL multiplier',        isPercent:false},
    {id:'u2',  label:'User Factor 2',            symbol:'F₂', value:1.0, enabled:false, hint:'Custom LL multiplier',        isPercent:false},
  ];
  const ratingLLFactors  = R.llFactors   ?? DEFAULT_RATING_LL_FACTORS;
  const [ratingLLOpen, setRatingLLOpen]  = useState(false);

  const ratingVehicleTon  = R.vehicleTon  ?? 36;
  const ratingVehicleName = R.vehicleName ?? 'HL-93 Design Truck';
  const rfYMax            = R.rfYMax      ?? 3;
  const vehicleLCMap      = R.vehicleLCMap ?? {};

  // Structure type — governs which capacity zone type and which tabs show
  const structType  = R.structType ?? 'steel'; // 'steel' | 'psconc'

  // Service II inputs
  const serviceIIDcLC     = R.serviceIIDcLC    ?? '';
  const serviceIIDwLC     = R.serviceIIDwLC    ?? '';
  const serviceIILLposLC  = R.serviceIILLposLC ?? '';
  const serviceIILLnegLC  = R.serviceIILLnegLC ?? '';
  const serviceIIRh       = R.serviceIIRh      ?? 1.0;

  // Fatigue inputs
  const fatigueLCpos      = R.fatigueLCpos      ?? '';
  const fatigueLCneg      = R.fatigueLCneg      ?? '';
  const fatigueAdtt       = R.fatigueAdtt       ?? 5000;
  const fatigueLanes      = R.fatigueLanes       ?? 2;
  const fatigueCyclesN    = R.fatigueCyclesN     ?? 1;
  const fatigueCategory   = R.fatigueCategory    ?? 'C';
  const fatigueLimitState = R.fatigueLimitState  ?? 'I';
  const fatigueZoneCategories = R.fatigueZoneCategories ?? {};

  // PS Concrete — Service III inputs
  const ps3DcLC      = R.ps3DcLC      ?? '';
  const ps3DwLC      = R.ps3DwLC      ?? '';
  const ps3LLposLC   = R.ps3LLposLC   ?? '';
  const ps3LLnegLC   = R.ps3LLnegLC   ?? '';
  const ps3GamLL     = R.ps3GamLL     ?? 0.8;
  const ps3Exposure  = R.ps3Exposure  ?? 'moderate';

  // Setters — all write through to cfg.rating
  const setRatingMethod     = v => setRating('method',v);
  const setRatingLevel      = v => setRating('level',v);
  const setRatingLimitState = v => setRating('limitState',v);
  const setRatingCategory   = v => setRating('category',v);
  const setRatingAdtt       = v => setRating('adtt',v);
  const setRatingDcLC       = v => setRating('dcLC',v);
  const setRatingDwLC       = v => setRating('dwLC',v);
  const setRatingLLposLC    = v => setRating('llposLC',v);
  const setRatingLLnegLC    = v => setRating('llnegLC',v);
  const setRatingCustomFact = v => setRating('customFact',v);
  const setRatingGamDC      = v => setRating('gamDC',v);
  const setRatingGamDW      = v => setRating('gamDW',v);
  const setRatingGamLL      = v => setRating('gamLL',v);
  const setRatingCondKey    = v => setRating('condKey',v);
  const setRatingSysKey     = v => setRating('sysKey',v);
  const setRatingPhiSCustom = v => setRating('phiSCustom',v);
  const setRatingPhiF       = v => setRating('phiF',v);
  const setRatingPhiV       = v => setRating('phiV',v);
  const setRatingEta        = v => setRating('eta',v);
  const setRatingLLFactors  = v => setRating('llFactors', typeof v==='function' ? v(ratingLLFactors) : v);
  const setRatingVehicleTon  = v => setRating('vehicleTon',v);
  const setRatingVehicleName = v => setRating('vehicleName',v);
  const setRfYMax            = v => setRating('rfYMax',v);
  const setVehicleLCMap      = v => setRating('vehicleLCMap', typeof v==='function' ? v(vehicleLCMap) : v);
  // ── Capacity zone helpers ─────────────────────────────────────────────────
  const capZones = ratingCapZones && ratingCapZones.length ? ratingCapZones : [];
  const setCapZones = setRatingCapZones || (()=>{});
  const capUid = () => 'cap'+Date.now().toString(36)+Math.random().toString(36).slice(2,4);
  const totalBridgeForCap = cfg?.spans?.reduce((a,b)=>a+b,0) || 0;

  // Default single zone covering full bridge
  const defaultCapZone = () => ({
    id: capUid(), startX:0, endX:totalBridgeForCap||100,
    type:'manual', MnPos:500, MnNeg:500, Vn:150,
    Fy:50, ZxPos:0, ZxNeg:0, Aw:0,
    SxPos:0, SxNeg:0,
    // AREMA built-up girder fields
    aremaComps:null, outToOut:42,
    holeDiam:1, holePitch:3, holeGage:1.5, holesInChain:0,
    unbracedL:240, ryc:0, autoRyc:true,
  });

  const addCapZone = () => {
    const lastEnd = capZones.length ? parseFloat(capZones[capZones.length-1].endX) : 0;
    if (lastEnd >= totalBridgeForCap && totalBridgeForCap > 0) return;
    const z = defaultCapZone();
    z.startX = +lastEnd.toFixed(4);
    z.endX   = +(totalBridgeForCap||100).toFixed(4);
    setCapZones([...capZones, z]);
  };
  const removeCapZone = id => { if(capZones.length>1) setCapZones(capZones.filter(z=>z.id!==id)); };
  const updateCapZone = (id, field, val) => setCapZones(capZones.map(z=>z.id===id?{...z,[field]:val}:z));
  const syncCapToSecZones = () => {
    if (!cfg?.sectionZones?.length) return;
    const DLL = cfg.deadLoadLabels||{};
    setCapZones(cfg.sectionZones.map(sz=>({
      id: capUid(), startX:sz.startX, endX:sz.endX,
      type:'manual', MnPos:500, MnNeg:500, Vn:150,
      Fy:50, ZxPos:0, ZxNeg:0, Aw:0,
    })));
  };
  const importFromSectionProps = (zoneId) => {
    // Auto-fill Zx from W_SHAPE_PROPS for the section assigned to this zone's position
    const z = capZones.find(z=>z.id===zoneId);
    if (!z || !cfg?.sectionZones) return;
    const mid = (parseFloat(z.startX)+parseFloat(z.endX))/2;
    const secZone = cfg.sectionZones.find(sz=>mid>=parseFloat(sz.startX)&&mid<parseFloat(sz.endX));
    if (!secZone) return;
    const props = W_SHAPE_PROPS[secZone.name];
    if (!props) return;
    const [d,,Zx,Sx] = props;
    const Aw = +(d*props[1]).toFixed(2);
    updateCapZone(zoneId,'ZxPos',Zx);
    updateCapZone(zoneId,'ZxNeg',Zx);
    updateCapZone(zoneId,'SxPos',Sx);
    updateCapZone(zoneId,'SxNeg',Sx);
    updateCapZone(zoneId,'Aw',Aw);
  };

  // Resolve capacity at a given X position
  const capAt = (xPos) => {
    if (!capZones.length) return {MnPos:500,MnNeg:500,Vn:150};
    const z = capZones.find(z=>xPos>=parseFloat(z.startX)-0.001&&xPos<parseFloat(z.endX)+0.001)
           || capZones[capZones.length-1];
    if (z.type==='quickcalc') {
      return {
        MnPos: z.ZxPos>0 ? z.Fy*z.ZxPos/12 : z.MnPos,
        MnNeg: z.ZxNeg>0 ? z.Fy*z.ZxNeg/12 : z.MnNeg,
        Vn:    z.Aw>0    ? 0.6*z.Fy*z.Aw   : z.Vn,
        SxPos: z.SxPos||0, SxNeg: z.SxNeg||0,
      };
    }
    if (z.type==='composite') {
      const MnPos = computeCompositeMnPos(z);
      const MnNeg = z.useCompNeg ? computeCompositeMnNeg(z) : (z.ZxNeg>0 ? z.Fy*z.ZxNeg/12 : z.MnNeg||0);
      const Vn    = z.Aw>0 ? 0.6*z.Fy*z.Aw : z.Vn||0;
      return { MnPos, MnNeg, Vn, SxPos: z.SxPos||0, SxNeg: z.SxNeg||0, _zone:z };
    }
    if (z.type==='psconc') {
      const MnPos = computePSMn(z);
      const Vn    = z.dv>0 ? computePSVn(z) : (z.Vn||0);
      return { MnPos, MnNeg: z.MnNeg||MnPos*0.7, Vn,
               SbPos: z.Sb||0, StPos: z.St||0, fpe: z.fpe||0, fc: z.fc||5,
               _zone: z };
    }
    if (z.type==='arema') {
      const sec  = computeAremaSection(z, false);
      const allo = aremaAllowables(z, sec);
      // Use Normal (Standard) allowables for LRFR-compatible rating factor output
      const MnPos = sec.SxBotN  > 0 ? sec.SxBotN  * allo.Ft_N / 12 : (z.MnPos||0);
      const MnNeg = sec.SxTopG  > 0 ? sec.SxTopG  * allo.Fb_N / 12 : (z.MnNeg||0);
      const Vn    = sec.Aw      > 0 ? sec.Aw       * allo.Fs_N      : (z.Vn||0);
      return { MnPos, MnNeg, Vn,
               SxPos: sec.SxBotN, SxNeg: sec.SxTopG,
               _arema: sec, _allow: allo, _zone: z };
    }
    return { MnPos:z.MnPos||0, MnNeg:z.MnNeg||0, Vn:z.Vn||0,
             SxPos: z.SxPos||0, SxNeg: z.SxNeg||0 };
  };
  // Rating sub-tab and D/C chart state — must be at component level (Rules of Hooks)
  const [ratingSubTab, setRatingSubTab] = useState('inputs');
  const [dcMode,  setDcMode]  = useState('moment');
  const [showInv, setShowInv] = useState(true);
  const [showOp,  setShowOp]  = useState(true);
  const [aremaCalcX, setAremaCalcX] = useState('');  // user-specified rating location (ft)
  // Auto-populate vehicleLCMap when rows or selected vehicles change
  useEffect(()=>{
    if (!origRows.length || !(cfg?.selectedVehicles?.length)) return;
    const loadedLCs = [...new Set(origRows.map(r=>r.load))];
    setVehicleLCMap(prev=>{
      const next = {...prev};
      (cfg.selectedVehicles||[]).forEach(vn=>{
        const existing = next[vn]||{};
        // Auto-detect LCs if not already assigned
        const posLC = existing.posLC || (
          loadedLCs.find(lc=>lc.includes(vn)&&(lc.includes('(max)')||lc.includes('max')))
          || loadedLCs.find(lc=>lc.includes(vn))
        );
        const negLC = existing.negLC !== undefined ? existing.negLC : (
          loadedLCs.find(lc=>lc.includes(vn)&&(lc.includes('(min)')||lc.includes('min'))) || ''
        );
        // Auto-assign category and gamLL if not manually set
        const category = existing.category || defaultVehicleCategory(vn);
        const { inv: gamLLinv, op: gamLLop } = vehicleGamLL(
          category, ratingLimitState, ratingMethod, ratingAdtt
        );
        next[vn] = {
          posLC: posLC||'', negLC,
          category,
          gamLLinv:  existing.gamLLinv  !== undefined ? existing.gamLLinv  : +gamLLinv.toFixed(4),
          gamLLop:   existing.gamLLop   !== undefined ? existing.gamLLop   : +gamLLop.toFixed(4),
          customGam: existing.customGam || false,
        };
      });
      return next;
    });
  }, [origRows.length, JSON.stringify(cfg?.selectedVehicles), ratingLimitState, ratingMethod, ratingAdtt]);

  const envelopeData = useMemo(()=>{
    if (!envelopeLCs.length || !rows.length) return {};
    const out={};
    CHANNELS.filter(ch=>envelopeCh.includes(ch.key)).forEach(ch=>{
      out[ch.key]=buildEnvelope(rows,envelopeLCs,ch.key,effectiveScale,nodePositions);
    });
    return out;
  },[envelopeLCs,envelopeCh,rows,effectiveScale,nodePositions]);

  const dlSumData = useMemo(()=>{
    if (!dlLCs.length||!rows.length) return {};
    return computeDLSumPts(rows,dlLCs);
  },[dlLCs,rows]);

  // ── Rating derived data ───────────────────────────────────────────────────
  // Resolve load factors (auto or custom)
  const autoFactors = useMemo(()=>{
    if (ratingMethod==='LFR') return LRFR_FACTORS.LFR[ratingLevel]||{DC:1.3,DW:1.3,LL:2.17};
    const ls = LRFR_FACTORS.LRFR[ratingLimitState]||{};
    if (ratingCategory==='Legal') return {...(ls.Legal||{DC:1.25,DW:1.50}), LL:legalLLfactor(ratingAdtt)};
    return ls[ratingLevel]||ls.Any||{DC:1.25,DW:1.50,LL:1.75};
  },[ratingMethod,ratingLevel,ratingLimitState,ratingCategory,ratingAdtt]);

  const gamDC = ratingCustomFact ? ratingGamDC : (autoFactors.DC??1.25);
  const gamDW = ratingCustomFact ? ratingGamDW : (autoFactors.DW??1.50);
  const gamLL = ratingCustomFact ? ratingGamLL : (autoFactors.LL??1.75);
  // ratingLLScale combines LLDF × (1+IM/100) × MPF × U1 × U2 from ratingLLFactors
  // Combined LL multiplier from rating-specific factors (LLDF × IM × MPF × U1 × U2)
  const ratingLLScale = ratingLLFactors.reduce((acc,f)=>{
    if (!f.enabled) return acc;
    return f.id==='im' ? acc*(1+f.value/100) : acc*f.value;
  }, 1.0);

  const phiC = PHI_CONDITION[ratingCondKey]??1.0;
  const phiS = ratingSysKey==='Custom' ? ratingPhiSCustom : (PHI_SYSTEM[ratingSysKey]??1.0);

  // Effective capacity preview (for the first/only zone, or global)
  const firstZone = capAt(totalBridgeForCap/2);
  const CmnPosPreview = phiC * phiS * ratingPhiF * firstZone.MnPos;
  const CmnNegPreview = phiC * phiS * ratingPhiF * firstZone.MnNeg;
  const CvnPreview    = phiC * phiS * ratingPhiV * firstZone.Vn;

  const ratingData = useMemo(()=>{
    if ((!ratingDcLC&&!ratingDwLC)||!ratingLLposLC||!rows.length) return [];
    if (!capZones.length) return [];
    const nodeList=[...new Set(rows.map(r=>r.node).filter(Boolean))]
      .filter(n=>nodePositions[n]!==undefined).sort((a,b)=>nodePositions[a]-nodePositions[b]);

    // Helper: for a node + load case, collect ALL rows (I-end AND J-end from adjacent elements)
    // and return worst-case values. Shear is discontinuous at concentrated loads,
    // so we must take max |V| from both ends. Moment is taken as max |M|.
    const nodeVals = (load, node) => {
      const matches = rows.filter(r => r.load === load && r.node === node);
      if (!matches.length) return null;
      return {
        momentY: matches.reduce((m,r) => Math.abs(r.momentY||0) > Math.abs(m) ? (r.momentY||0) : m, 0),
        shearZ:  matches.reduce((m,r) => Math.abs(r.shearZ||0)  > m ? Math.abs(r.shearZ||0)  : m, 0),
      };
    };

    return nodeList.map(node=>{
      const xPos = nodePositions[node]??0;
      const dc  = ratingDcLC  ? nodeVals(ratingDcLC,  node) : null;
      const dw  = ratingDwLC  ? nodeVals(ratingDwLC,  node) : null;
      const llp = nodeVals(ratingLLposLC, node);
      const lln = ratingLLnegLC ? nodeVals(ratingLLnegLC, node) : llp;
      if (!llp) return null;

      const Mdc = Math.abs(dc?.momentY||0), Mdw = Math.abs(dw?.momentY||0);
      const Vdc = dc?.shearZ||0, Vdw = dw?.shearZ||0;
      const Mllpos = Math.max(0, llp?.momentY||0);
      const Mllneg = Math.abs(Math.min(0, -(lln?.momentY||0)));
      const Vll    = Math.max(llp?.shearZ||0, lln?.shearZ||0);

      // Get zone capacity at this node position
      const cap = capAt(xPos);
      const CmnPos = phiC * phiS * ratingPhiF * cap.MnPos;
      const CmnNeg = phiC * phiS * ratingPhiF * cap.MnNeg;
      const Cvn    = phiC * phiS * ratingPhiV * cap.Vn;

      // RF = (C - γDC*DC - γDW*DW) / (γLL * LL * LLscale)
      const rfMpos = Mllpos>0.001
        ? (CmnPos - gamDC*Math.abs(Mdc) - gamDW*Math.abs(Mdw)) / (gamLL*Mllpos*ratingLLScale) : null;
      const rfMneg = Mllneg>0.001
        ? (CmnNeg - gamDC*Math.abs(Mdc) - gamDW*Math.abs(Mdw)) / (gamLL*Mllneg*ratingLLScale) : null;
      const rfV = Vll>0.001
        ? (Cvn    - gamDC*Vdc           - gamDW*Vdw)           / (gamLL*Vll*ratingLLScale)    : null;

      const rfGov = Math.min(...[rfMpos,rfMneg,rfV].filter(v=>v!==null));
      const rfTons = rfGov * ratingVehicleTon;

      return {node, pos:xPos,
        Mdc, Mdw, Vdc, Vdw, Mllpos, Mllneg, Vll,
        CmnPos:+CmnPos.toFixed(1), CmnNeg:+CmnNeg.toFixed(1), Cvn:+Cvn.toFixed(1),
        rfMpos:rfMpos!==null?+rfMpos.toFixed(4):null,
        rfMneg:rfMneg!==null?+rfMneg.toFixed(4):null,
        rfV:rfV!==null?+rfV.toFixed(4):null,
        rfGov:+rfGov.toFixed(4), rfTons:+rfTons.toFixed(2),
        governs: rfMpos!==null&&rfMpos<=rfGov+0.001?'M+': rfMneg!==null&&rfMneg<=rfGov+0.001?'M-':'V',
      };
    }).filter(Boolean);
  },[ratingDcLC,ratingDwLC,ratingLLposLC,ratingLLnegLC,rows,nodePositions,
     capZones,phiC,phiS,ratingPhiF,ratingPhiV,gamDC,gamDW,gamLL,ratingLLScale,ratingVehicleTon]);

  const govRating = ratingData.length ? ratingData.reduce((a,b)=>a.rfGov<b.rfGov?a:b,ratingData[0]) : null;

  // ── Reusable single-node RF calculator ────────────────────────────────────
  const computeNodeRF = (p, gDC, gDW, gLL, llScale) => {
    const rfMpos = p.Mllpos>0.001 ? (p.CmnPos - gDC*Math.abs(p.Mdc) - gDW*Math.abs(p.Mdw)) / (gLL*p.Mllpos*llScale) : null;
    const rfMneg = p.Mllneg>0.001 ? (p.CmnNeg - gDC*Math.abs(p.Mdc) - gDW*Math.abs(p.Mdw)) / (gLL*p.Mllneg*llScale) : null;
    const rfV    = p.Vll>0.001    ? (p.Cvn    - gDC*Math.abs(p.Vdc) - gDW*Math.abs(p.Vdw)) / (gLL*p.Vll*llScale)    : null;
    const rfGov  = Math.min(...[rfMpos,rfMneg,rfV].filter(v=>v!==null&&isFinite(v)));
    return { rfMpos:rfMpos!=null?+rfMpos.toFixed(4):null, rfMneg:rfMneg!=null?+rfMneg.toFixed(4):null,
             rfV:rfV!=null?+rfV.toFixed(4):null, rfGov:+rfGov.toFixed(4),
             governs:rfMpos!=null&&rfMpos<=rfGov+0.001?'M+':rfMneg!=null&&rfMneg<=rfGov+0.001?'M-':'V' };
  };

  // ── Operating-level RF (same inputs, operating γ_LL) ─────────────────────
  const opFactors = useMemo(()=>{
    if (ratingMethod==='LFR') return LRFR_FACTORS.LFR['Operating']||{DC:1.3,DW:1.3,LL:1.30};
    const ls = LRFR_FACTORS.LRFR[ratingLimitState]||{};
    if (ratingCategory==='Legal') return {...(ls.Legal||{DC:1.25,DW:1.50}), LL:legalLLfactor(ratingAdtt)};
    return ls['Operating']||ls.Any||{DC:1.25,DW:1.50,LL:1.35};
  },[ratingMethod,ratingLimitState,ratingCategory,ratingAdtt]);

  const gamLL_op = ratingCustomFact ? ratingGamLL : (opFactors.LL??1.35);

  const operatingData = useMemo(()=>{
    if (!ratingData.length) return [];
    return ratingData.map(p=>({
      ...p,
      ...computeNodeRF(p, gamDC, gamDW, gamLL_op, ratingLLScale),
    }));
  },[ratingData, gamDC, gamDW, gamLL_op, ratingLLScale]);

  const govOperating = operatingData.length ? operatingData.reduce((a,b)=>a.rfGov<b.rfGov?a:b,operatingData[0]) : null;

  // ── Service II — AASHTO LRFD 6.10.4.2 ───────────────────────────────────
  // Stress check: f_DC + f_DW + 1.3·f_LL ≤ 0.95·Rh·Fyf
  // f = M·12 / Sx  (moment in ft·k, Sx in in³, stress in ksi)
  // Sx is taken from cap zone SxPos/SxNeg fields; Fyf from zone Fy field
  const serviceIIData = useMemo(()=>{
    if (!capZones.length || !origRows.length || (!serviceIIDcLC && !serviceIILLposLC)) return [];
    const nodeList = [...new Set(origRows.map(r=>r.node).filter(Boolean))]
      .filter(n=>nodePositions[n]!==undefined)
      .sort((a,b)=>nodePositions[a]-nodePositions[b]);

    return nodeList.map(node=>{
      const xPos = nodePositions[node]??0;
      const dc  = serviceIIDcLC  ? origRows.find(r=>r.load===serviceIIDcLC &&r.node===node) : null;
      const dw  = serviceIIDwLC  ? origRows.find(r=>r.load===serviceIIDwLC &&r.node===node) : null;
      const llp = serviceIILLposLC ? origRows.find(r=>r.load===serviceIILLposLC&&r.node===node) : null;
      const lln = serviceIILLnegLC ? origRows.find(r=>r.load===serviceIILLnegLC&&r.node===node) : llp;

      const z = capZones.find(z=>xPos>=parseFloat(z.startX)-0.001&&xPos<parseFloat(z.endX)+0.001)
             || capZones[capZones.length-1];
      const Fyf   = z?.Fy     || 50;
      const SxPos = z?.SxPos  || 0;
      const SxNeg = z?.SxNeg  || 0;
      const Rh    = serviceIIRh || 1.0;
      const limit = 0.95 * Rh * Fyf; // ksi

      const toStress = (M, Sx) => Sx>0 ? Math.abs(M)*12/Sx : null;

      const Mdc  = dc?.momentY  || 0;
      const Mdw  = dw?.momentY  || 0;
      const Mllp = llp?.momentY || 0;
      const Mlln = Math.min(0, lln?.momentY||0);

      // Bottom flange positive moment check
      const fDCpos  = toStress(Math.abs(Mdc), SxPos);
      const fDWpos  = toStress(Math.abs(Mdw), SxPos);
      const fLLpos  = toStress(Math.max(0,Mllp), SxPos);
      const demPos  = fDCpos!=null&&fLLpos!=null ? fDCpos+(fDWpos||0)+SERVICE_II_FACTORS.LL*fLLpos : null;
      const rfPos   = demPos!=null&&demPos>0 ? +(limit/demPos).toFixed(4) : null;

      // Top flange negative moment check
      const fDCneg  = toStress(Math.abs(Mdc), SxNeg);
      const fDWneg  = toStress(Math.abs(Mdw), SxNeg);
      const fLLneg  = toStress(Math.abs(Mlln), SxNeg);
      const demNeg  = fDCneg!=null&&fLLneg!=null&&fLLneg>0 ? fDCneg+(fDWneg||0)+SERVICE_II_FACTORS.LL*fLLneg : null;
      const rfNeg   = demNeg!=null&&demNeg>0 ? +(limit/demNeg).toFixed(4) : null;

      const rfGov = rfPos!=null||rfNeg!=null
        ? Math.min(...[rfPos,rfNeg].filter(v=>v!=null))
        : null;

      return {
        node, pos:xPos, SxPos, SxNeg, Fyf, Rh, limit:+limit.toFixed(2),
        fDCpos:fDCpos!=null?+fDCpos.toFixed(3):null,
        fDWpos:fDWpos!=null?+fDWpos.toFixed(3):null,
        fLLpos:fLLpos!=null?+fLLpos.toFixed(3):null,
        demPos:demPos!=null?+demPos.toFixed(3):null, rfPos,
        fDCneg:fDCneg!=null?+fDCneg.toFixed(3):null,
        fDWneg:fDWneg!=null?+fDWneg.toFixed(3):null,
        fLLneg:fLLneg!=null?+fLLneg.toFixed(3):null,
        demNeg:demNeg!=null?+demNeg.toFixed(3):null, rfNeg,
        rfGov, governs: rfNeg!=null&&(rfPos==null||rfNeg<=rfPos) ? 'M⁻' : 'M⁺',
      };
    }).filter(p=>p.rfGov!=null);
  },[origRows, capZones, nodePositions, serviceIIDcLC, serviceIIDwLC,
     serviceIILLposLC, serviceIILLnegLC, serviceIIRh]);

  const govServiceII = serviceIIData.length
    ? serviceIIData.reduce((a,b)=>a.rfGov<b.rfGov?a:b, serviceIIData[0])
    : null;

  // ── Fatigue — AASHTO MBE 6A.6.4 ─────────────────────────────────────────
  // Fatigue I: RF = (ΔF)_TH / (γ_I · Δf)   where γ_I = 1.5
  // Fatigue II: RF = (ΔF)_n / (γ_II · Δf)  where γ_II = 0.75
  // Δf = stress range from fatigue vehicle = ΔM·12/Sx  (ksi)
  // (ΔF)_n = (A/N)^(1/3), N = 365·75·n·p·ADTT_SL
  const fatigueData = useMemo(()=>{
    if (!capZones.length || !origRows.length || !fatigueLCpos) return [];
    const p_lanes = FATIGUE_P[Math.min(fatigueLanes,3)] ?? 0.80;
    const ADTT_SL  = fatigueAdtt * p_lanes;
    const N        = 365 * 75 * fatigueCyclesN * ADTT_SL;

    const nodeList = [...new Set(origRows.map(r=>r.node).filter(Boolean))]
      .filter(n=>nodePositions[n]!==undefined)
      .sort((a,b)=>nodePositions[a]-nodePositions[b]);

    return nodeList.map(node=>{
      const xPos = nodePositions[node]??0;
      const llp = origRows.find(r=>r.load===fatigueLCpos&&r.node===node);
      const lln = fatigueLCneg ? origRows.find(r=>r.load===fatigueLCneg&&r.node===node) : null;
      if (!llp) return null;

      const z = capZones.find(z=>xPos>=parseFloat(z.startX)-0.001&&xPos<parseFloat(z.endX)+0.001)
             || capZones[capZones.length-1];
      const SxPos  = z?.SxPos || 0;
      const SxNeg  = z?.SxNeg || 0;
      // Per-zone category overrides global default
      const cat    = fatigueZoneCategories[z?.id] || fatigueCategory;
      const catDef = FATIGUE_CATEGORIES[cat] || FATIGUE_CATEGORIES['C'];

      // Stress range: max positive moment minus min (most negative) moment
      const Mmax = llp?.momentY || 0;
      const Mmin = lln?.momentY ?? 0;
      const dM   = Math.abs(Mmax - Mmin); // moment range, ft-kips
      const Sx   = Mmax >= 0 ? SxPos : SxNeg; // use appropriate Sx
      const df   = Sx>0 ? dM*12/Sx : null;   // stress range, ksi

      if (df===null) return null;

      // Finite life
      const dFn  = N>0 ? +(Math.pow(catDef.A/N, 1/3)).toFixed(4) : null;
      // Infinite life threshold
      const dFth = catDef.threshold;
