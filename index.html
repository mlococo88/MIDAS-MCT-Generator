      const rfI  = df>0 ? +(dFth / (FATIGUE_GAMMA['I']  * df)).toFixed(4) : null;
      const rfII = df>0&&dFn!=null ? +(dFn  / (FATIGUE_GAMMA['II'] * df)).toFixed(4) : null;

      const rfGov = Math.min(...[rfI,rfII].filter(v=>v!=null));
      return {
        node, pos:xPos, cat, SxUsed:+Sx.toFixed(1),
        Mmax:+Mmax.toFixed(1), Mmin:+Mmin.toFixed(1), dM:+dM.toFixed(1),
        df:+df.toFixed(4), dFth, dFn:dFn!=null?+dFn.toFixed(4):null,
        rfI, rfII, rfGov:+rfGov.toFixed(4),
        governs: rfII!=null&&rfII<=rfI ? 'Finite' : 'Infinite',
      };
    }).filter(Boolean);
  },[origRows, capZones, nodePositions, fatigueLCpos, fatigueLCneg,
     fatigueAdtt, fatigueLanes, fatigueCyclesN, fatigueCategory,
     fatigueZoneCategories, fatigueLimitState]);

  const govFatigue = fatigueData.length
    ? fatigueData.reduce((a,b)=>a.rfGov<b.rfGov?a:b, fatigueData[0])
    : null;

  // ── PS Concrete Strength I rating ────────────────────────────────────────
  // Uses the same computeNodeRF formula — capAt() now returns PS Mn when type='psconc'
  // This useMemo is just ratingData re-used; capAt handles the capacity difference
  // ps3 = Service III — dedicated check per AASHTO MBE 6A.5.4.2
  // f_bot = MDC/Sb + MDW/Sb + γ_LL·MLL/Sb ≤ fr + fpe (compression positive)
  // RF = (fr + fpe - fDC - fDW) / (γ_LL · fLL)
  const psServiceIIIData = useMemo(()=>{
    if (!capZones.length || !origRows.length || !ps3LLposLC) return [];
    const hasPSzones = capZones.some(z=>z.type==='psconc');
    if (!hasPSzones) return [];

    const nodeList = [...new Set(origRows.map(r=>r.node).filter(Boolean))]
      .filter(n=>nodePositions[n]!==undefined)
      .sort((a,b)=>nodePositions[a]-nodePositions[b]);

    // Modulus of rupture — AASHTO 5.4.2.6
    // Moderate exposure: fr = 0.19·√f'c (ksi)
    // Severe exposure:   fr = 0.0948·√f'c (ksi)  [cracked section allowed]
    const frCoeff = ps3Exposure==='severe' ? 0.0948 : 0.19;

    return nodeList.map(node=>{
      const xPos = nodePositions[node]??0;
      const z = capZones.find(z=>xPos>=parseFloat(z.startX)-0.001&&xPos<parseFloat(z.endX)+0.001)
             || capZones[capZones.length-1];
      if (z?.type !== 'psconc') return null;

      const dc  = ps3DcLC  ? origRows.find(r=>r.load===ps3DcLC &&r.node===node) : null;
      const dw  = ps3DwLC  ? origRows.find(r=>r.load===ps3DwLC &&r.node===node) : null;
      const llp = origRows.find(r=>r.load===ps3LLposLC&&r.node===node);
      const lln = ps3LLnegLC ? origRows.find(r=>r.load===ps3LLnegLC&&r.node===node) : llp;
      if (!llp) return null;

      const Sb  = z.Sb || 0;   // in³ — bottom fiber section modulus
      const St  = z.St || 0;   // in³ — top fiber section modulus
      const fpe = z.fpe || 0;  // ksi — effective prestress at bottom fiber (compression +)
      const fc  = z.fc  || 5;  // ksi — concrete strength
      if (!Sb) return null;

      const fr  = +(frCoeff * Math.sqrt(fc)).toFixed(4); // ksi

      // Moments (ft-kips), signs: positive = sagging
      const MDC  = dc?.momentY  || 0;
      const MDW  = dw?.momentY  || 0;
      const MLLp = Math.max(0, llp?.momentY||0);  // positive envelope
      const MLLn = Math.abs(Math.min(0, lln?.momentY||0)); // negative envelope magnitude

      // Bottom fiber stresses (ksi) — tension positive convention
      // For positive moment: bottom in tension
      const fDCbot  = -(MDC * 12) / Sb;   // prestress opposes tension, so sagging MDC is tension at bottom → negative
      const fDWbot  = -(MDW * 12) / Sb;
      const fLLbot  = -(MLLp * 12) / Sb;

      // Net bottom fiber stress (tension +, compression -)
      // With prestress: σ_bot = -fpe + fDCbot + fDWbot + γ_LL·fLLbot
      // Limit: σ_bot ≤ fr (tension limit)
      // RF = (fr + fpe + fDCbot + fDWbot) / (ps3GamLL · |fLLbot|)
      // Where fDCbot,fDWbot are already negative for sagging (tension at bottom)
      // More carefully: tensile demand = fDCbot + fDWbot + γ_LL·fLLbot (each negative = compressive, positive = tensile)
      // Available tension resistance = fr + fpe
      const demandBot = -(fDCbot + fDWbot); // tension demand from DC+DW (positive = tension)
      const fLLdemand = -fLLbot;            // LL tension demand per unit γ
      const rfPos = fLLdemand > 0.001
        ? +((fr + fpe - demandBot) / (ps3GamLL * fLLdemand)).toFixed(4)
        : null;

      // Top fiber check for negative moment (continuous spans)
      const rfNeg = St > 0 && MLLn > 0.001 ? (()=>{
        const fDCtop  = +(MDC * 12) / St;  // hogging → tension at top
        const fDWtop  = +(MDW * 12) / St;
        const fLLtop  = +(MLLn* 12) / St;
        const frTop   = +(frCoeff * Math.sqrt(fc)).toFixed(4);
        const fpeTTop = z.fpeTop || 0;  // effective prestress at top fiber if any
        const dTop    = fDCtop + fDWtop;
        return dTop+ps3GamLL*fLLtop > 0.001
          ? +((frTop + fpeTTop - dTop) / (ps3GamLL * fLLtop)).toFixed(4)
          : null;
      })() : null;

      const rfGov = [rfPos,rfNeg].filter(v=>v!=null&&isFinite(v)).length
        ? Math.min(...[rfPos,rfNeg].filter(v=>v!=null&&isFinite(v)))
        : null;
      if (rfGov===null) return null;

      return {
        node, pos:xPos,
        Sb:+Sb.toFixed(1), St:+St.toFixed(1), fc, fpe:+fpe.toFixed(3), fr:+fr.toFixed(4),
        MDC:+MDC.toFixed(1), MDW:+MDW.toFixed(1),
        MLLpos:+MLLp.toFixed(1), MLLneg:+MLLn.toFixed(1),
        fDCbot:+fDCbot.toFixed(4), fDWbot:+fDWbot.toFixed(4), fLLbot:+fLLbot.toFixed(4),
        demandBot:+demandBot.toFixed(4), fLLdemand:+fLLdemand.toFixed(4),
        rfPos, rfNeg, rfGov:+rfGov.toFixed(4),
        governs: rfNeg!=null&&rfPos!=null&&rfNeg<rfPos ? 'Top (neg.)' : 'Bottom (pos.)',
        limit:+(fr+fpe).toFixed(4),
      };
    }).filter(Boolean);
  },[origRows, capZones, nodePositions, ps3DcLC, ps3DwLC, ps3LLposLC, ps3LLnegLC,
     ps3GamLL, ps3Exposure]);

  const govPS3 = psServiceIIIData.length
    ? psServiceIIIData.reduce((a,b)=>a.rfGov<b.rfGov?a:b, psServiceIIIData[0])
    : null;

  // ── AREMA Chapter 15 ASD Rating ───────────────────────────────────────────
  // RF = (F_allow × Sx/12 − M_DL) / (M_LL × (1+I) × DF)
  // Normal: uses Fb_N, Ft_N, Fs_N (Standard load case, 100% allowable)
  // Maximum: uses Fb_M, Ft_M, Fs_M (Modified load case, K=0.8Fy)

  // Resolve AREMA section at a given position:
  // prefers a cap zone with type='arema', then cfg.aremaSection zone overrides, then cfg.aremaSection base
  // Global section loss toggle: when on, as-inspected properties are used for rating capacity
  const aremaApplyLoss = cfg?.aremaSection?.applyLoss === true;

  const resolveAremaCap = (xPos) => {
    const as = cfg.aremaSection;
    if (as?.enabled) {
      const library = as.sectionLibrary || [];
      if (library.length) {
        let zDef = {...as, ...library[0]};
        if (as.zonesEnabled && as.sectionZones?.length) {
          const zone = as.sectionZones.find(z => xPos>=+(z.startX||0) && xPos<=+(z.endX||0));
          if (zone?.sectionId) {
            const libSec = library.find(s => s.id===zone.sectionId);
            if (libSec) zDef = {...as, ...libSec};
          }
        }
        // Use inspected section for capacity when global toggle + per-section toggle are on
        const useInsp = aremaApplyLoss && (zDef.sectionLossEnabled === true);
        const sec  = computeAremaSection(zDef, useInsp);
        const allo = aremaAllowables(zDef, sec);
        return { _arema:sec, _allow:allo, _zone:zDef, _useInspected:useInsp,
                 MnPos:Math.min(sec.SxTopG*allo.Fb_N/12, sec.SxBotN*allo.Ft_N/12),
                 MnNeg:sec.SxTopG*allo.Fb_N/12, Vn:sec.Aw*allo.Fs_N,
                 SxPos:sec.SxBotN, SxNeg:sec.SxTopG };
      }
    }
    return capAt(xPos);
  };

  const hasAremaAnywhere = capZones.some(z=>z.type==='arema') || !!(cfg.aremaSection?.enabled);

  // Helper: extract AREMA params from cfg.rating (single source of truth)
  const _aremaParams = (()=>{
    const R2 = cfg?.rating||{};
    const span    = +(R2.arema_span    ?? (totalBridgeLen||50));
    const impAuto = R2.arema_imp_auto !== false;
    const impMan  = +(R2.arema_imp_man ?? 0.25);
    const DF      = +(R2.arema_DF      ?? 0.5);
    const gauge   = +(R2.arema_gauge   ?? 56.5);   // inches
    const axle    = +(R2.arema_axle    ?? 40);      // kips
    const eNum    = +(R2.arema_eNum    ?? 80);
    const dcLC    = R2.arema_dcLC  || ratingDcLC  || '';
    const llLC    = R2.arema_llLC  || ratingLLposLC || '';
    const dlFactor = +(R2.arema_dlFactor ?? 1.0);   // DL factor — multiplies all dead load results (default 1.0)
    const iAuto   = span<80 ? Math.max(0,(40-3*span*span/1600)/100)  // AREMA §1.3.1: quadratic for L≤80
                          : span<=175 ? (16+600/Math.max(span-30,1))/100   // L 80–175 ft
                          : 16/100;                                          // L>175: use 16% minimum
    const ballastDeck = R2.arema_ballast ?? false;
    const ballastF    = ballastDeck ? 0.9 : 1.0;   // AREMA §1.3.5: 0.9 factor for ballast deck
    const iBase       = impAuto ? iAuto : impMan;
    // Note: f1pI computed below after S_gird is known (rocking addition depends on girder spacing)

    // ── Bridge cross-section geometry ──────────────────────────────────────
    const n_gird  = Math.max(2, Math.round(+(R2.arema_n      ?? 2)));   // number of girders
    const S_gird  = Math.max(0.1, +(R2.arema_S      ?? 6.0));          // girder c-c spacing (ft)
    const h_rail  = Math.max(0,   +(R2.arema_h_rail ?? 1.5));          // top of rail above top flange (ft)

    // Rocking impact addition (AREMA §1.3.6): applied as impact, not lateral moment
    // I_rock = 0.20 × gauge_ft / girder_spacing  (dimensionless, added to impact)
    const I_rock  = (S_gird>0) ? 0.20 * (gauge/12) / S_gird : 0;
    const f1pI    = 1 + ballastF * (iBase + I_rock); // total (1+I): ballast factor applies to both impact and rocking

    // Girder group: equally spaced, compute Ix_group and max eccentricity
    const gPos    = Array.from({length:n_gird}, (_,i) => i * S_gird);
    const gCent   = gPos.reduce((s,p)=>s+p, 0) / n_gird;
    const gd      = gPos.map(p => p - gCent);           // eccentricities (ft)
    const Ix_grp  = gd.reduce((s,d)=>s+d*d, 0);        // Σd² (ft²)
    const d_max   = Math.max(...gd.map(Math.abs));       // governing eccentricity (ft)

    // ── AREMA-specified heights above top of rail ───────────────────────────
    // (code values — not user input)
    // Wind on LL : 8 ft above top of rail  (AREMA §1.3.7)
    // CF          : 6 ft above top of rail  (AREMA §1.3.4)
    const H_wind  = h_rail + 8;   // arm from top of girder flange to wind-on-LL resultant (ft)
    const H_CF    = h_rail + 6;   // arm from top of girder flange to CF resultant (ft)

    // ── Wind on LL: 0.200 k/ft uniform horizontal load ─────────────────────
    // Converted to additional vertical UDL on governing girder via overturning couple:
    //   q_V = w_H × H_wind × d_max / Ix_grp   (k/ft added to governing girder)
    //   M_wind = q_V × L²/8
    const q_wind  = (Ix_grp>0) ? 0.200 * H_wind * d_max / Ix_grp : 0;  // k/ft vertical
    const M_wind  = q_wind * span * span / 8;    // ft-kips

    // ── Rocking: now treated as additional impact, not lateral moment ─────────
    // I_rock = 0.20 × gauge_ft / S_gird (computed above, added to f1pI)
    // No separate M_rock in the lateral effects denominator.
    const gauge_ft = gauge / 12;
    const R_rock   = 0;   // rocking moment removed from lateral — now in f1pI
    const M_rock   = 0;   // rocking handled via I_rock impact addition

    // ── Centrifugal force (curved track) ───────────────────────────────────
    // C/W = 0.00117×V²/R  (dimensionless CF ratio per AREMA §1.3.4)
    // Horizontal CF force per governing axle: F_CF = C/W × axle
    // Distributed via overturning couple: R_CF = F_CF × H_CF × d_max / Ix_grp
    // Moment (axle at midspan): M_CF = R_CF × span/4
    const curveR  = +(R2.arema_curveR ?? 0);
    const curveV  = +(R2.arema_curveV ?? 0);
    const CF_CW   = curveR>0 ? 0.00117*curveV*curveV/curveR : 0;   // C/W ratio
    const F_CF    = CF_CW * axle;                                   // kips horizontal
    const R_CF    = (Ix_grp>0 && curveR>0) ? F_CF * H_CF * d_max / Ix_grp : 0;  // kips vertical
    const M_CF    = R_CF * span / 4;   // ft-kips

    // ── Longitudinal (braking/traction) — AREMA §1.3.3 ──────────────────
    // AREMA formulas for single track, kips:
    //   Braking:   F_B = 45 + 1.2L
    //   Traction:  F_T = 25√L
    //   Governing: max(F_B, F_T)
    //
    // The MIDAS longitudinal LC was built with loads for a reference span L_ref.
    // Multiplier = F_gov(L_actual) / F_gov(L_ref) scales the LC results
    // to the correct magnitude for the actual span being rated.
    const longLC     = R2.arema_longLC     || '';
    const long_L_ref = Math.max(1, +(R2.arema_long_L_ref ?? span));  // reference span in MIDAS LC (ft)

    // Compute braking and traction for actual span
    const F_brake_act  = 45 + 1.2 * span;                   // kips
    const F_tract_act  = 25 * Math.sqrt(Math.max(0, span)); // kips
    const F_long_act   = Math.max(F_brake_act, F_tract_act);
    const long_governs_act = F_brake_act >= F_tract_act ? 'Braking' : 'Traction';

    // Compute braking and traction for reference span
    const F_brake_ref  = 45 + 1.2 * long_L_ref;
    const F_tract_ref  = 25 * Math.sqrt(Math.max(0, long_L_ref));
    const F_long_ref   = Math.max(F_brake_ref, F_tract_ref);

    // Scale factor applied to longLC moments/shears
    // Always computed from AREMA force ratio — when no LC selected, M_long_node=0 anyway
    const long_mult    = F_long_ref>0 ? F_long_act / F_long_ref : 1;

    // M/V from longLC are multiplied by long_mult in aremaAsdData per node
    const M_brake = F_brake_act;  // for display (kips)
    const M_tract = F_tract_act;  // for display (kips)
    const M_long  = 0;            // global placeholder; actual per-node after scaling

    // ── Lateral shear effects ──────────────────────────────────────────────
    // The overturning couple adds vertical reactions that also produce shear
    // on the governing girder. Max shear from each lateral source:
    //   Wind (UDL):     V_wind_lat = q_V × L/2          (max shear at support from UDL)
    //   Rocking (conc): V_rock_lat = R_rock              (concentrated load)
    //   CF (conc):      V_CF_lat   = R_CF                (concentrated load)
    const V_wind_lat = q_wind * span / 2;   // kips (from wind UDL on governing girder)
    const V_rock_lat = 0;                   // rocking now in impact, not lateral shear
    const V_CF_lat   = R_CF;               // kips (CF concentrated vertical)

    // M_CF : in Normal, Maximum AND Modified denominators
    // M_extra (wind + rock): Modified ONLY
    const M_extra = M_wind + M_rock + M_long;
    const M_mod   = M_CF + M_extra;     // global Modified M (longitudinal added per-node)
    const M_lat   = M_mod;

    // ── Distribution Factor Calculator ────────────────────────────────────
    // Lever rule / moment distribution for single track on n equally spaced girders
    // Track offset e_track (ft) from bridge CL (positive toward governing girder)
    // DF = 1/n + e_track × d_max / Ix_grp
    // For centered track: DF = 1/n (symmetric)
    const e_track  = +(R2.arema_track_offset ?? 0);   // ft offset from CL
    const DF_calc  = Ix_grp>0 ? Math.max(0, 1/n_gird + e_track * d_max / Ix_grp) : DF;

    // Fatigue detail category
    const fatCat   = R2.arema_fatCat  || 'D';
    const SFT      = AREMA_SFT[fatCat] ?? 6;
    const fatAlpha = +(R2.arema_fatAlpha ?? 0.85);  // live load reduction (≤12 ksi condition)
    const fatBeta  = +(R2.arema_fatBeta  ?? 0.15);  // fatigue impact factor (AREMA Table 15-7-1)
    const I_fat    = 1 + fatBeta * ballastF * (iBase + I_rock); // fatigue (1+I): β and ballast factor both apply

    return {span,impAuto,impMan,DF,gauge,axle,eNum,dcLC,llLC,longLC,iAuto,iBase,I_rock,ballastDeck,ballastF,f1pI,
            n_gird,S_gird,h_rail,Ix_grp,d_max,H_wind,H_CF,
            q_wind,R_rock,R_CF,CF_CW,F_CF,gauge_ft,
            V_wind_lat,V_rock_lat,V_CF_lat,
            M_wind,M_brake,M_tract,M_long,M_rock,M_CF,M_extra,M_mod,M_lat,
            longLC,long_L_ref,F_brake_act,F_tract_act,F_long_act,long_governs_act,
            F_brake_ref,F_tract_ref,F_long_ref,long_mult,
            e_track,DF_calc,
            curveR,curveV,fatCat,SFT,fatAlpha,fatBeta,I_fat,dlFactor,ballastF};
  })();

  const aremaAsdData = useMemo(()=>{
    const {dcLC,llLC,longLC,long_mult,f1pI,DF,M_CF,M_mod,
           V_wind_lat,V_rock_lat,V_CF_lat,SFT,fatAlpha,I_fat,dlFactor} = _aremaParams;
    if (!llLC || !origRows.length || !hasAremaAnywhere) return [];

    const nodeList = [...new Set(origRows.map(r=>r.node).filter(Boolean))]
      .filter(n=>nodePositions[n]!==undefined).sort((a,b)=>nodePositions[a]-nodePositions[b]);

    // For each node, collect ALL rows (I-end + J-end of adjacent elements) and take worst case
    const nvA = (load, node) => {
      if (!load) return null;
      const m = origRows.filter(r=>r.load===load&&r.node===node);
      if (!m.length) return null;
      return {
        momentY: m.reduce((b,r)=>Math.abs(r.momentY||0)>Math.abs(b)?(r.momentY||0):b, 0),
        shearZ:  m.reduce((b,r)=>Math.abs(r.shearZ||0) >b?Math.abs(r.shearZ||0):b,   0),
      };
    };

    return nodeList.map(node=>{
      const xPos = nodePositions[node]??0;
      const cap  = resolveAremaCap(xPos);
      if (!cap._arema) return null;
      const sec=cap._arema, allo=cap._allow;

      const dc   = nvA(dcLC,  node);
      const llp  = nvA(llLC,  node);
      const longp= nvA(longLC, node);
      if (!llp) return null;

      const MDL = Math.abs(dc?.momentY||0) * dlFactor;   // DL factor accounts for unknown elements
      const VDL = (dc?.shearZ||0) * dlFactor;
      const MLL = Math.max(0, llp?.momentY||0);
      const VLL = llp?.shearZ||0;

      // Longitudinal from selected MIDAS LC — scaled by span multiplier
      const M_long_node = longp ? Math.abs(longp.momentY||0) * long_mult : 0;
      const V_long_node = longp ? longp.shearZ * long_mult : 0;

      const dM  = MLL>0.001 ? MLL*f1pI*DF : null;
      const dV  = VLL>0.001 ? VLL*f1pI*DF : null;

      // ── Moment denominators ───────────────────────────────────────────
      // Only DL subtracted from capacity; LL + all other effects in denominator
      const denomN   = dM!=null ? dM + M_CF : null;
      const denomMod = dM!=null ? dM + M_CF + _aremaParams.M_extra + M_long_node : null;

      // ── Shear denominators ────────────────────────────────────────────
      // Lateral overturning couple adds shear to the governing girder
      const dV_N   = dV!=null ? dV + V_CF_lat                                          : null;
      const dV_mod = dV!=null ? dV + V_CF_lat + V_wind_lat + V_rock_lat + V_long_node  : null;

      // Capacities
      const McN=sec.SxTopG*allo.Fb_N/12, MtN=sec.SxBotN*allo.Ft_N/12, VnN=sec.Aw*allo.Fs_N;
      const McX=sec.SxTopG*allo.Fb_X/12, MtX=sec.SxBotN*allo.Ft_X/12, VnX=sec.Aw*allo.Fs_X;

      // Rating factors — correct lateral shear in each case
      const rfcN=denomN?(McN-MDL)/denomN:null, rftN=denomN?(MtN-MDL)/denomN:null;
      const rfvN=dV_N?(VnN-VDL)/dV_N:null;

      const rfcX=denomN?(McX-MDL)/denomN:null, rftX=denomN?(MtX-MDL)/denomN:null;
      const rfvX=dV_N?(VnX-VDL)/dV_N:null;

      const rfcM=denomMod?(McX-MDL)/denomMod:null, rftM=denomMod?(MtX-MDL)/denomMod:null;
      const rfvM=dV_mod?(VnX-VDL)/dV_mod:null;

      // Fatigue RF — AREMA §1.7
      // I_fat = 1 + β×(iBase+I_rock); dM_fat = α×(dM/f1pI×I_fat + M_CF)
      const dM_fat      = (dM && f1pI) ? fatAlpha * ((dM/f1pI)*I_fat + M_CF) : null;
      const SR_no_alpha = (dM && f1pI && sec?.SxBotN)
        ? ((dM/f1pI)*I_fat + M_CF) * 12 / sec.SxBotN : null;  // SR without α, for flag
      const fatAlphaFlag = SR_no_alpha != null && SR_no_alpha > 12;  // α used where SR>12 ksi
      const rfFat = dM_fat ? (SFT*sec.SxBotN/12)/dM_fat : null;

      const flt = v=>v!=null&&isFinite(v);
      const gN=Math.min(...[rfcN,rftN,rfvN].filter(flt));
      const gX=Math.min(...[rfcX,rftX,rfvX].filter(flt));
      const gM=Math.min(...[rfcM,rftM,rfvM].filter(flt));
      const govOf=(c,t,v,g)=>c!=null&&c<=g+1e-4?'Comp':t!=null&&t<=g+1e-4?'Tens':'Shear';
      const govN=govOf(rfcN,rftN,rfvN,gN);
      const govX=govOf(rfcX,rftX,rfvX,gX);
      const govM=govOf(rfcM,rftM,rfvM,gM);

      return {node,pos:xPos, MDL,VDL,MLL,VLL,
              dM,dV,dV_N,dV_mod, denomN,denomMod,
              M_long_node, V_long_node,
              McN,MtN,VnN, McX,MtX,VnX,
              rfcN,rftN,rfvN,gN,govN,
              rfcX,rftX,rfvX,gX,govX,
              rfcM,rftM,rfvM,gM,govM,
              rfFat, dM_fat, SR_no_alpha, fatAlphaFlag, sec, allo};
    }).filter(Boolean);
  },[origRows,capZones,nodePositions,cfg,ratingDcLC,ratingLLposLC]);

  const govAsdN   = aremaAsdData.length ? aremaAsdData.reduce((a,b)=>a.gN<b.gN?a:b,aremaAsdData[0]) : null;
  const govAsdX   = aremaAsdData.length ? aremaAsdData.reduce((a,b)=>a.gX<b.gX?a:b,aremaAsdData[0]) : null;
  const govAsdM   = aremaAsdData.length ? aremaAsdData.reduce((a,b)=>a.gM<b.gM?a:b,aremaAsdData[0]) : null;
  const govAsdFat = (()=>{
    const fatRows = aremaAsdData.filter(p=>p.rfFat!=null&&isFinite(p.rfFat));
    return fatRows.length ? fatRows.reduce((a,b)=>a.rfFat<b.rfFat?a:b, fatRows[0]) : null;
  })();

  const aremaMultiData = useMemo(()=>{
    const {dcLC,f1pI,DF,M_CF,M_mod,SFT,fatAlpha,fatBeta,I_fat,dlFactor} = _aremaParams;
    if (!origRows.length || !hasAremaAnywhere) return [];

    const vehicles = (cfg?.selectedVehicles||[]).map(vn=>{
      const veh = ALL_VEHICLES.find(v=>v.name===vn);
      const lc  = vehicleLCMap[vn]||{};
      return {name:vn, label:veh?.label||vn, gvwKips:veh?.gvwKips||0, tons:VEHICLE_TONS[vn]||0, ...lc};
    }).filter(v=>v.posLC);

    const nodeList = [...new Set(origRows.map(r=>r.node).filter(Boolean))]
      .filter(n=>nodePositions[n]!==undefined).sort((a,b)=>nodePositions[a]-nodePositions[b]);

    // Collect worst-case values across ALL rows (I-end + J-end) for a node+loadcase
    const nodeValsA = (rows, load, node) => {
      const m = rows.filter(r=>r.load===load&&r.node===node);
      if (!m.length) return null;
      return {
        momentY: m.reduce((best,r)=>Math.abs(r.momentY||0)>Math.abs(best)?(r.momentY||0):best, 0),
        shearZ:  m.reduce((best,r)=>Math.abs(r.shearZ||0) >best?Math.abs(r.shearZ||0):best,   0),
      };
    };

    return vehicles.map(veh=>{
      const nodeRes = nodeList.map(node=>{
        const xPos = nodePositions[node]??0;
        const cap  = resolveAremaCap(xPos);
        if (!cap._arema) return null;
        const sec=cap._arema, allo=cap._allow;

        const dc  = dcLC ? nodeValsA(origRows,dcLC,node) : null;
        const llp = nodeValsA(origRows,veh.posLC,node);
        const lln = veh.negLC ? nodeValsA(origRows,veh.negLC,node) : llp;
        if (!llp) return null;

        const MDL = Math.abs(dc?.momentY||0) * dlFactor;   // DL factor
        const VDL = (dc?.shearZ||0) * dlFactor;
        const MLL = Math.max(0, llp?.momentY||0);
        const VLL = Math.max(llp?.shearZ||0, lln?.shearZ||0);

        const dM = MLL>0.001 ? MLL*f1pI*DF : null;
        const dV = VLL>0.001 ? VLL*f1pI*DF : null;
        const denomN   = dM!=null ? dM + M_CF  : null;
        const denomMod = dM!=null ? dM + M_mod  : null;

        const MtN=sec.SxBotN*allo.Ft_N/12, McN=sec.SxTopG*allo.Fb_N/12, VnN=sec.Aw*allo.Fs_N;
        const MtX=sec.SxBotN*allo.Ft_X/12, McX=sec.SxTopG*allo.Fb_X/12, VnX=sec.Aw*allo.Fs_X;

        const flt=v=>v!=null&&isFinite(v);
        const rfcN=denomN?(McN-MDL)/denomN:null, rftN=denomN?(MtN-MDL)/denomN:null, rfvN=dV?(VnN-VDL)/dV:null;
        const rfcX=denomN?(McX-MDL)/denomN:null, rftX=denomN?(MtX-MDL)/denomN:null, rfvX=dV?(VnX-VDL)/dV:null;
        const rfcM=denomMod?(McX-MDL)/denomMod:null, rftM=denomMod?(MtX-MDL)/denomMod:null, rfvM=dV?(VnX-VDL)/dV:null;
        const rN=[rfcN,rftN,rfvN].filter(flt);
        const rX=[rfcX,rftX,rfvX].filter(flt);
        const rM=[rfcM,rftM,rfvM].filter(flt);
        // Fatigue RF — use dM_fat (α×β adjusted) to match aremaAsdData formula
        const dM_fat_v = (dM && f1pI) ? fatAlpha * ((dM/f1pI)*I_fat + M_CF) : null;
        const rF = dM_fat_v ? (SFT*sec.SxBotN/12)/dM_fat_v : null;
        if (!rN.length&&!rM.length) return null;

        const gN=rN.length?Math.min(...rN):null, gX=rX.length?Math.min(...rX):null, gM=rM.length?Math.min(...rM):null;
        // Store all individual RFs for summary table interpolation
        return {node, pos:xPos, gN, gX, gM, rfFat:rF,
          rfcN, rftN, rfvN, rfcX, rftX, rfvX, rfcM, rftM, rfvM};
      }).filter(Boolean);

      if (!nodeRes.length) return null;
      const govN   = nodeRes.reduce((a,b)=>(a.gN??Infinity)<(b.gN??Infinity)?a:b, nodeRes[0]);
      const govX   = nodeRes.reduce((a,b)=>(a.gX??Infinity)<(b.gX??Infinity)?a:b, nodeRes[0]);
      const govM   = nodeRes.reduce((a,b)=>(a.gM??Infinity)<(b.gM??Infinity)?a:b, nodeRes[0]);
      const fatRows = nodeRes.filter(r=>r.rfFat!=null&&isFinite(r.rfFat));
      const govF   = fatRows.length ? fatRows.reduce((a,b)=>a.rfFat<b.rfFat?a:b, fatRows[0]) : null;

      return {
        name:veh.name, label:veh.label, tons:veh.tons, posLC:veh.posLC, gvwKips:veh.gvwKips,
        rfN: govN.gN!=null&&isFinite(govN.gN) ? +govN.gN.toFixed(3) : null, nodeN:govN.node, posN:govN.pos,
        rfX: govX.gX!=null&&isFinite(govX.gX) ? +govX.gX.toFixed(3) : null, nodeX:govX.node, posX:govX.pos,
        rfM: govM.gM!=null&&isFinite(govM.gM) ? +govM.gM.toFixed(3) : null, nodeM:govM.node, posM:govM.pos,
        rfFat:govF?.rfFat!=null&&isFinite(govF.rfFat)?+govF.rfFat.toFixed(3):null, nodeFat:govF?.node,
        allNodeRes: nodeRes,   // full per-node data for summary table interpolation
      };
    }).filter(Boolean);
  },[origRows,capZones,nodePositions,vehicleLCMap,cfg?.selectedVehicles,cfg,ratingDcLC]);

  // ── Multi-vehicle rating table ────────────────────────────────────────────
  // ── Multi-vehicle rating — uses ACTUAL result rows per vehicle ────────────
  const multiVehicleData = useMemo(()=>{
    if (!capZones.length || !origRows.length) return [];

    const vehicles = (cfg?.selectedVehicles||[]).map(vn=>{
      const tons = VEHICLE_TONS[vn];
      const veh  = ALL_VEHICLES.find(v=>v.name===vn);
      const lcAssign = vehicleLCMap[vn] || {};
      return { name:vn, label:veh?.label||vn, tons:tons||0, ...lcAssign };
    });

    const ratable = vehicles.filter(v=>v.posLC);

    const nodeList = [...new Set(origRows.map(r=>r.node).filter(Boolean))]
      .filter(n=>nodePositions[n]!==undefined)
      .sort((a,b)=>nodePositions[a]-nodePositions[b]);

    return ratable.map(veh=>{
      // Use per-vehicle gamLL if defined, otherwise fall back to global
      const vGamLLinv = veh.gamLLinv != null ? veh.gamLLinv : gamLL;
      const vGamLLop  = veh.gamLLop  != null ? veh.gamLLop  : gamLL_op;

      const nodeResults = nodeList.map(node=>{
        const xPos = nodePositions[node]??0;
        const dc  = ratingDcLC ? origRows.find(r=>r.load===ratingDcLC &&r.node===node) : null;
        const dw  = ratingDwLC ? origRows.find(r=>r.load===ratingDwLC &&r.node===node) : null;
        const llp = origRows.find(r=>r.load===veh.posLC&&r.node===node);
        const lln = veh.negLC ? origRows.find(r=>r.load===veh.negLC&&r.node===node) : llp;
        if (!llp) return null;

        const Mdc = dc?.momentY||0, Mdw = dw?.momentY||0;
        const Vdc = Math.abs(dc?.shearZ||0), Vdw = Math.abs(dw?.shearZ||0);
        const Mllpos = Math.max(0, llp?.momentY||0);
        const Mllneg = Math.abs(Math.min(0, lln?.momentY||0));
        const Vll    = Math.max(Math.abs(llp?.shearZ||0), Math.abs(lln?.shearZ||0));

        const cap = capAt(xPos);
        const CmnPos = phiC * phiS * ratingPhiF * cap.MnPos;
        const CmnNeg = phiC * phiS * ratingPhiF * cap.MnNeg;
        const Cvn    = phiC * phiS * ratingPhiV * cap.Vn;

        const p = { Mdc, Mdw, Vdc, Vdw, Mllpos, Mllneg, Vll, CmnPos, CmnNeg, Cvn };
        const inv = computeNodeRF(p, gamDC, gamDW, vGamLLinv, ratingLLScale);
        const op  = computeNodeRF(p, gamDC, gamDW, vGamLLop,  ratingLLScale);
        return { node, pos:xPos, inv, op, CmnPos:+CmnPos.toFixed(1), CmnNeg:+CmnNeg.toFixed(1), Cvn:+Cvn.toFixed(1) };
      }).filter(Boolean);

      if (!nodeResults.length) return null;

      const govInv = nodeResults.reduce((a,b)=>a.inv.rfGov<b.inv.rfGov?a:b, nodeResults[0]);
      const govOp  = nodeResults.reduce((a,b)=>a.op.rfGov<b.op.rfGov?a:b,  nodeResults[0]);
      const tons = veh.tons || null;

      return {
        name:veh.name, label:veh.label, tons,
        posLC: veh.posLC, negLC: veh.negLC,
        category: veh.category||'Design',
        gamLLinv: vGamLLinv, gamLLop: vGamLLop,
        invRF:    +govInv.inv.rfGov.toFixed(3),
        invTons:  tons ? +(govInv.inv.rfGov * tons).toFixed(1) : null,
        invGoverns: govInv.inv.governs,
        invNode: govInv.node, invPos: govInv.pos,
        opRF:     +govOp.op.rfGov.toFixed(3),
        opTons:   tons ? +(govOp.op.rfGov * tons).toFixed(1) : null,
        opGoverns: govOp.op.governs,
        opNode: govOp.node, opPos: govOp.pos,
        nodeCount: nodeResults.length,
      };
    }).filter(Boolean);
  },[origRows, vehicleLCMap, cfg?.selectedVehicles, ratingDcLC, ratingDwLC,
     capZones, nodePositions, phiC, phiS, ratingPhiF, ratingPhiV,
     gamDC, gamDW, gamLL, gamLL_op, ratingLLScale]);

  // Push rating state up so App can include it in the report
  useEffect(()=>{
    if (!onReportState) return;
    onReportState({
      ratingData, nodePositions, govRating,
      ratingMethod, ratingLimitState, ratingLevel, ratingCategory,
      gamDC, gamDW, gamLL, ratingLLScale, ratingEta,
      phiC, phiS, ratingPhiF, ratingPhiV,
      ratingDcLC, ratingDwLC, ratingLLposLC, ratingLLnegLC,
      ratingVehicleTon, ratingVehicleName,
      capAt,
    });
  },[ratingData, nodePositions]);

  // ── helpers ───────────────────────────────────────────────────────────────
  const toggleEnvLC  = lc => setEnvelopeLCs(p=>p.includes(lc)?p.filter(x=>x!==lc):[...p,lc]);
  const toggleDlLC   = lc => setDlLCs(p=>p.includes(lc)?p.filter(x=>x!==lc):[...p,lc]);
  const toggleEnvCh  = k  => setEnvelopeCh(p=>p.includes(k)?(p.length>1?p.filter(x=>x!==k):p):[...p,k]);
  const staticLCs    = groupedLCs.Static||[];
  const movingMaxLCs = groupedLCs['Moving (max)']||[];

  const downloadAllCSV = () => downloadResultsCSV(rows,selectedLoad,nodePositions,CHANNELS.filter(ch=>activeChannels.includes(ch.key)),effectiveScale);

  // ── handlers ──────────────────────────────────────────────────────────────
  const handleParse = () => {
    setParseErr('');
    const parsed = parseBeamResults(rawText);
    if (!parsed.length) { setParseErr('No valid data found. Paste tab-separated MIDAS beam force output.'); return; }
    setRows(parsed);
    setCfgSnap(cfgSnapFields);  // snapshot the cfg at parse time
    setStaleAcknowledged(false);
    const lcs = [...new Set(parsed.map(r=>r.load))];
    if (!selectedLoad || !lcs.includes(selectedLoad)) setSelectedLoad(lcs[0]||'');
    setMode('view');
  };
  const handleClear = () => {
    setRows([]); setRawText(''); setMode('paste');
    setSelectedLoad(''); setParseErr(''); setQueryDist('');
    setCfgSnap(null); setStaleAcknowledged(false);
  };
  const toggleChannel = key => setActiveChannels(prev =>
    prev.includes(key) ? (prev.length>1 ? prev.filter(k=>k!==key) : prev) : [...prev,key]);
  const updateFactor = (id,field,val) => setFactors(prev=>prev.map(f=>f.id===id?{...f,[field]:val}:f));

  // ── style helpers ─────────────────────────────────────────────────────────
  const tagBtn = (active, color) => ({
    padding:'5px 11px', borderRadius:'99px', fontSize:'11.5px', fontWeight:'500', cursor:'pointer',
    border:`1.5px solid ${active?color:'#e5e7eb'}`,
    background: active?color+'18':'#fff', color: active?color:'#9ca3af',
    transition:'all 0.12s',
  });
  const panelHdr = (open, label, badge) => (
    <button onClick={()=>open[1](v=>!v)} style={{width:'100%',display:'flex',alignItems:'center',
      gap:'8px',background:'none',border:'none',cursor:'pointer',padding:'10px 0',textAlign:'left'}}>
      <span style={{fontSize:'11.5px',fontWeight:'600',color:'#374151'}}>{label}</span>
      {badge&&<span style={{fontSize:'10px',fontFamily:'monospace',background:'#eff6ff',color:'#1d4ed8',
        padding:'1px 6px',borderRadius:'99px',border:'1px solid #bfdbfe'}}>{badge}</span>}
      <span style={{marginLeft:'auto',fontSize:'12px',color:'#9ca3af'}}>{open[0]?'▲':'▼'}</span>
    </button>
  );

  // ─────────────────────────────────────────────────────────────────────────
  if (mode === 'paste') return (
    <div>
      <StepHeader icon="📊" title="Results Viewer" sub="Paste MIDAS beam force output — supports all 6 force/moment channels"/>
      <div style={{maxWidth:'720px'}}>
        {origRows.length>0&&(
          <div style={{marginBottom:'12px',padding:'8px 14px',background:'#fffbeb',border:'1px solid #fde68a',
            borderRadius:'6px',display:'flex',alignItems:'center',gap:'10px',fontSize:'12px',color:'#92400e'}}>
            <span>⚠</span>
            <span><strong>{origRows.length} existing data rows</strong> loaded. Paste new data below to replace, or</span>

  // ── VIEW MODE ─────────────────────────────────────────────────────────────
  return (
    <div>

        <div style={{marginLeft:'auto',display:'flex',gap:'8px'}}>
          <button onClick={()=>setMode('paste')} style={{background:'#fff',border:'1px solid #d1d5db',

            ✏ Update Data
          </button>
          <button onClick={handleClear} title="Clear all results" style={{background:'#fff',border:'1px solid #fecaca',
            borderRadius:'6px',color:'#dc2626',padding:'7px 14px',cursor:'pointer',fontSize:'12px'}}>

          </button>
        </div>
      </div>

      {/* Stale results warning */}
      {isStale&&(
        <div style={{marginBottom:'14px',padding:'10px 16px',background:'#fffbeb',border:'1px solid #fcd34d',
          borderRadius:'8px',display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap'}}>
          <span style={{fontSize:'16px'}}>⚠️</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:'12.5px',fontWeight:'600',color:'#92400e'}}>Results may be out of date</div>
            <div style={{fontSize:'11px',color:'#b45309',fontFamily:'monospace',marginTop:'1px'}}>

              Charts and rating factors reflect the <em>previous</em> model configuration.
            </div>
          </div>
          <div style={{display:'flex',gap:'7px',flexShrink:0}}>
            <button onClick={()=>setMode('paste')} style={{background:'#d97706',border:'none',borderRadius:'5px',

              ✏ Re-paste Results
            </button>
            <button onClick={()=>setStaleAcknowledged(true)} style={{background:'#fff',border:'1px solid #fcd34d',

            </button>
          </div>
        </div>
      )}

      {/* Tab bar — only shown in Results mode */}
      {ratingMode==='results'&&(
      <div style={{display:'flex',gap:'2px',marginBottom:'16px',background:'#f3f4f6',borderRadius:'8px',padding:'3px',flexWrap:'wrap'}}>

          {id:'charts',   label:'📈 Per Load Case'},
          {id:'envelope', label:'📉 Envelope'},
          {id:'deadload', label:'⬇ Dead Load Sum'},
          {id:'combos',   label:`🔗 Combos${combos.length>0?' ('+combos.length+')':''}`},

            fontWeight:viewTab===tab.id?'600':'400',fontSize:'12px',

      {/* AASHTO Rating step header */}
      {ratingMode==='aashto'&&(

          borderLeft:'4px solid #7c3aed',borderRadius:'8px',marginBottom:'16px',

          <span style={{fontSize:'18px'}}>⚖</span>

      {ratingMode==='results'&&viewTab==='charts'&&(<div>
        {/* Controls */}

            <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:'5px'}}>Load Case</div>
            <select value={selectedLoad} onChange={e=>setSelectedLoad(e.target.value)} style={{...INP,fontSize:'12.5px'}}>
              {Object.entries(groupedLCs).map(([grp,lcs])=>lcs.length>0?(

          </button>

            <div style={{padding:'12px 16px'}}>

                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:'11.5px',fontWeight:'500',color:'#111827'}}>{f.label}</div>
                      <div style={{fontSize:'9.5px',color:'#9ca3af',fontFamily:'monospace'}}>{f.hint}</div>

                    <div style={{display:'flex',alignItems:'center',gap:'3px'}}>
                      <input type="number" step={f.isPercent?1:0.01} style={{...INP,width:'68px',padding:'4px 6px',fontSize:'12px',
                        textAlign:'right',opacity:f.enabled?1:0.4}}

                        onChange={e=>updateFactor(f.id,'value',parseFloat(e.target.value)||0)}/>

                    </div>

                <span>Effective multiplier:</span>
                <strong>×{effectiveScale.toFixed(4)}</strong>
                <span style={{color:'#93c5fd'}}>= {factors.filter(f=>f.enabled).map(f=>f.id==='im'?`(1+${f.value}/100)`:f.value).join(' × ')||'1'}</span>
                <button onClick={()=>setFactors(DEFAULT_FACTORS)} style={{marginLeft:'auto',background:'none',border:'none',color:'#9ca3af',cursor:'pointer',fontSize:'11px'}}>reset</button>
              </div>
            </div>
          )}
        </div>

        {/* Query Point Panel */}
        {Object.keys(nodePositions).length>0&&(

              {panelHdr([queryOpen,setQueryOpen],'📍 Query Point',queryResult?`${queryResult.dist.toFixed(2)} ft interpolated`:null)}
            </div>
            {queryOpen&&(
              <div style={{padding:'14px 16px'}}>
                <div style={{display:'flex',gap:'10px',alignItems:'center',marginBottom:'12px'}}>

                    value={queryDist} onChange={e=>setQueryDist(e.target.value)} placeholder={`0 – ${totalBridgeLen.toFixed(2)} ft`}/>
                  <span style={{fontSize:'12px',color:'#6b7280',fontFamily:'monospace'}}>ft</span>
                  {queryDist!==''&&<button onClick={()=>setQueryDist('')} title="Clear query point" style={{background:'none',border:'none',color:'#9ca3af',cursor:'pointer',fontSize:'12px'}}>✕</button>}
                </div>
                {queryResult&&(
                  <div>
                    <div style={{fontSize:'10.5px',color:'#6b7280',fontFamily:'monospace',marginBottom:'8px'}}>
                      Interpolated between Node {queryResult.n1} ({queryResult.x1} ft) and Node {queryResult.n2} ({queryResult.x2} ft) · t={queryResult.t.toFixed(4)}
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:'8px'}}>
                      {CHANNELS.map(ch=>{
                        const r=queryResult[ch.key]; const showSc=Math.abs(effectiveScale-1)>0.001;
                        return <div key={ch.key} style={{padding:'8px 12px',background:'#f9fafb',border:`1px solid ${activeChannels.includes(ch.key)?ch.color+'40':'#e5e7eb'}`,borderRadius:'6px'}}>
                          <div style={{fontSize:'10px',fontFamily:'monospace',color:ch.color,fontWeight:'600',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:'2px'}}>{ch.label}</div>
                          <div style={{fontSize:'14px',fontWeight:'700',color:'#111827',fontFamily:'monospace'}}>{showSc?r.scaled.toFixed(3):r.raw.toFixed(3)}</div>
                          {showSc&&<div style={{fontSize:'10px',color:'#9ca3af',fontFamily:'monospace'}}>raw: {r.raw.toFixed(3)}</div>}
                          <div style={{fontSize:'10px',color:'#9ca3af',fontFamily:'monospace'}}>{ch.unit}</div>
                        </div>;
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {/* Charts */}
        <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
          {CHANNELS.filter(ch=>activeChannels.includes(ch.key)).map(ch=>{
            const cid=`lc_${ch.key}`;
            const vals=rows.filter(r=>r.load===selectedLoad).map(r=>r[ch.key]*effectiveScale);
            const maxV=vals.length?Math.max(...vals.map(Math.abs)):0;
            return <ChartCard key={ch.key} title={ch.label} unit={ch.unit} color={ch.color}
              isPrimary={ch.primary} load={selectedLoad} chartId={cid}
              onCsvClick={()=>downloadResultsCSV(rows,selectedLoad,nodePositions,[ch],effectiveScale)}>
              {maxV>0&&<div style={{fontSize:'10px',fontFamily:'monospace',color:ch.color,fontWeight:'500',
                marginBottom:'4px',textAlign:'right'}}>peak: {maxV.toFixed(2)}</div>}
              <BeamChart rows={rows} load={selectedLoad} field={ch.key} label={`${ch.label} (${ch.unit})`}
                unit={ch.unit} color={ch.color} scaleVal={effectiveScale} nodePositions={nodePositions}/>
            </ChartCard>;
          })}
        </div>

        {/* Summary stats */}
        {selectedLoad&&(
          <div style={{marginTop:'16px'}}>
            <div style={{fontSize:'10px',fontFamily:'monospace',color:'#9ca3af',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'8px'}}>

            <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
              {CHANNELS.filter(ch=>activeChannels.includes(ch.key)).map(ch=>{
                const vals=rows.filter(r=>r.load===selectedLoad).map(r=>r[ch.key]*effectiveScale);
                if(!vals.length) return null;
                return <div key={ch.key} style={{background:'#fff',border:`1px solid ${ch.color}30`,borderRadius:'7px',
                  padding:'8px 12px',minWidth:'130px',boxShadow:'0 1px 3px rgba(0,0,0,0.04)',borderTop:`3px solid ${ch.color}`}}>
                  <div style={{fontSize:'9.5px',fontFamily:'monospace',color:ch.color,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:'4px',fontWeight:'600'}}>{ch.label}</div>
                  <div style={{fontSize:'12px',fontWeight:'700',color:'#111827',fontFamily:'monospace'}}>↑ {Math.max(...vals).toFixed(2)}</div>
                  <div style={{fontSize:'12px',fontWeight:'700',color:'#374151',fontFamily:'monospace'}}>↓ {Math.min(...vals).toFixed(2)}</div>
                  <div style={{fontSize:'9px',color:'#9ca3af',fontFamily:'monospace',marginTop:'2px'}}>{ch.unit}</div>
                </div>;
              })}
            </div>
          </div>
        )}
      </div>)}

      {/* ── TAB: ENVELOPE ──────────────────────────────────────────────────── */}
      {ratingMode==='results'&&viewTab==='envelope'&&(<div>
        <div style={{display:'flex',gap:'16px',flexWrap:'wrap',marginBottom:'16px'}}>
          {/* LC selector */}
          <div style={{flex:'1',minWidth:'320px',background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px'}}>
            <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151',marginBottom:'10px'}}>
              Select Load Cases for Envelope
              <span style={{marginLeft:'8px',fontSize:'10px',fontFamily:'monospace',color:'#9ca3af'}}>{envelopeLCs.length} selected</span>
            </div>
            {Object.entries(groupedLCs).map(([grp,lcs])=>
              lcs.length>0?<LcCheckGrid key={grp} lcs={lcs} selected={envelopeLCs} toggle={toggleEnvLC} label={grp}/>:null
            )}
            <div style={{display:'flex',gap:'6px',marginTop:'6px'}}>
              <button onClick={()=>setEnvelopeLCs(movingMaxLCs)} style={{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:'4px',padding:'4px 10px',cursor:'pointer',fontSize:'11px',color:'#1d4ed8'}}>All Moving(max)</button>
              <button onClick={()=>setEnvelopeLCs(loadCases)} style={{background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:'4px',padding:'4px 10px',cursor:'pointer',fontSize:'11px',color:'#374151'}}>All LCs</button>
              <button onClick={()=>setEnvelopeLCs([])} style={{background:'none',border:'none',padding:'4px 8px',cursor:'pointer',fontSize:'11px',color:'#9ca3af'}}>Clear</button>
            </div>

          <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px',minWidth:'220px'}}>

            <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
              {CHANNELS.map(ch=>(
                <label key={ch.key} style={{display:'flex',alignItems:'center',gap:'8px',cursor:'pointer'}}>
                  <input type="checkbox" checked={envelopeCh.includes(ch.key)} onChange={()=>toggleEnvCh(ch.key)}
                    style={{accentColor:ch.color,width:'14px',height:'14px'}}/>
                  <span style={{fontSize:'12px',color:envelopeCh.includes(ch.key)?ch.color:'#6b7280',fontWeight:envelopeCh.includes(ch.key)?'600':'400'}}>{ch.label}</span>
                  <span style={{fontSize:'10px',fontFamily:'monospace',color:'#9ca3af'}}>{ch.unit}</span>
                </label>
              ))}
            </div>
          </div>
        </div>

        {envelopeLCs.length===0&&(
          <div style={{padding:'32px',textAlign:'center',color:'#9ca3af',fontSize:'13px',background:'#f9fafb',borderRadius:'8px',border:'1px dashed #e5e7eb'}}>

          </div>
        )}

        {/* Envelope charts */}
        <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
          {CHANNELS.filter(ch=>envelopeCh.includes(ch.key)).map(ch=>{
            const envPts=envelopeData[ch.key];
            if (!envPts?.length) return null;
            const cid=`env_${ch.key}`;
            const pkMax=Math.max(...envPts.map(p=>p.max));
            const pkMin=Math.min(...envPts.map(p=>p.min));
            return <ChartCard key={ch.key} title={`${ch.label} Envelope`} unit={ch.unit} color={ch.color}
              isPrimary={ch.primary} chartId={cid}
              onCsvClick={()=>{
                const headers=['Node','Position (ft)','Max '+ch.label,'Min '+ch.label];

                const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));

              }}>
              <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',marginBottom:'4px',textAlign:'right'}}>
                {envelopeLCs.length} LCs · ↑{pkMax.toFixed(2)} ↓{pkMin.toFixed(2)} {ch.unit}

              <EnvelopeChart envData={envPts} unit={ch.unit} nodePositions={nodePositions}/>

      {ratingMode==='results'&&viewTab==='deadload'&&(<div>
        <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px',marginBottom:'16px'}}>
          <div style={{fontSize:'11.5px',fontWeight:'600',color:'#374151',marginBottom:'10px'}}>

                      <div style={{display:'flex',alignItems:'center',gap:'3px'}}>

                          onChange={e=>setRatingLLFactors(prev=>prev.map(x=>x.id===f.id?{...x,value:parseFloat(e.target.value)||0}:x))}/>
                        <span style={{fontSize:'10px',color:'#9ca3af',fontFamily:'monospace',minWidth:'16px'}}>

                  <span>LL scale:</span>
                  <strong>×{ratingLLScale.toFixed(4)}</strong>
                  <span style={{color:'#93c5fd'}}>= {ratingLLFactors.filter(f=>f.enabled).map(f=>f.id==='im'?`(1+${f.value}/100)`:f.value).join(' × ')||'1'}</span>

                    reset

              </div>

            {/* ── Factoring status helper ── */}
            {(()=>{
              // Classify a load case name as raw or already-factored
              const getLcInfo = (lcName) => {
                if (!lcName) return null;
                const combo = combos.find(c=>c.name===lcName);
                if (combo) {
                  const hasNonUnit = combo.terms?.some(t=>t.factor!==1 && t.factor!==0);
                  const formula = (combo.terms||[]).filter(t=>t.lc)
                    .map(t=>`${t.factor!==1?t.factor+'×':''}[${t.lc.replace(/_[^_]+$/,'').slice(0,20)}]`)
                    .join(' + ');
                  return { type:'combo', factored:hasNonUnit, formula, comboName:lcName };

                const grp = Object.entries(groupedLCs).find(([,lcs])=>lcs.includes(lcName))?.[0];
                if (grp==='Static') return { type:'static', factored:false };
                if (grp?.startsWith('Moving')) return { type:'moving', factored:false };
                if (grp==='Combinations') return { type:'combination', factored:true };
                return { type:'unknown', factored:false };
              };

              const dwInfo  = getLcInfo(ratingDwLC);
              const llInfo  = getLcInfo(ratingLLposLC);

              const doubleDC = dcInfo?.factored && gamDC !== 1.0;

                  </div>

                if (info.type==='moving') return (
                  <div style={{display:'flex',alignItems:'center',gap:'5px',marginTop:'3px',fontSize:'10px',fontFamily:'monospace'}}>
                    <span style={{color:'#059669',fontWeight:'600'}}>✓ Unfactored</span>
                    <span style={{color:'#9ca3af'}}>— raw moving load envelope · apply {gamLabel} = {gam}</span>
                  </div>
                );
                if (info.type==='combo') return (
                  <div style={{marginTop:'4px',padding:'5px 8px',borderRadius:'4px',
                    background:info.factored?'#fffbeb':'#f0fdf4',
                    border:`1px solid ${info.factored?'#fde68a':'#bbf7d0'}`}}>
                    <div style={{fontSize:'10px',fontFamily:'monospace',color:info.factored?'#92400e':'#166534',fontWeight:'600'}}>
                      {info.factored ? '⚠ Pre-factored combination' : '✓ Unfactored combination (all ×1.0)'}
                    </div>
                    {info.formula&&<div style={{fontSize:'9.5px',fontFamily:'monospace',color:'#6b7280',marginTop:'1px',
                      overflowX:'auto',whiteSpace:'nowrap'}}>{info.formula}</div>}
                    {info.factored&&<div style={{fontSize:'9.5px',fontFamily:'monospace',color:'#b45309',marginTop:'2px'}}>
                      → Set {gamLabel} = 1.0 to avoid double-factoring
                    </div>}
                  </div>
                );
                if (info.type==='combination') return (
                  <div style={{marginTop:'4px',padding:'5px 8px',borderRadius:'4px',
                    background:'#fffbeb',border:'1px solid #fde68a'}}>
                    <div style={{fontSize:'10px',fontFamily:'monospace',color:'#92400e',fontWeight:'600'}}>
                      ⚠ MCT load combination — likely pre-factored
                    </div>
                    <div style={{fontSize:'9.5px',fontFamily:'monospace',color:'#b45309',marginTop:'1px'}}>
                      Verify factors in Step 6 and set {gamLabel} = 1.0 if already factored
                    </div>
                  </div>
                );
                return null;
              };

              return (<>
                {/* Overall double-factor warning banner */}
                {anyDouble&&(
                  <div style={{marginBottom:'12px',padding:'9px 12px',background:'#fef2f2',
                    border:'1px solid #fca5a5',borderRadius:'6px'}}>
                    <div style={{fontSize:'12px',fontWeight:'700',color:'#dc2626',marginBottom:'4px'}}>
                      ⚠ Possible Double-Factoring Detected
                    </div>
                    <div style={{fontSize:'10.5px',fontFamily:'monospace',color:'#b91c1c',lineHeight:'1.6'}}>
                      {doubleDC&&<div>• DC load case appears pre-factored — and γ_DC = {gamDC} (≠ 1.0)</div>}
                      {doubleDW&&<div>• DW load case appears pre-factored — and γ_DW = {gamDW} (≠ 1.0)</div>}
                      {doubleLL&&<div>• LL load case appears pre-factored — and γ_LL = {gamLL} (≠ 1.0)</div>}
                    </div>
                    <div style={{fontSize:'10px',color:'#b91c1c',fontFamily:'monospace',marginTop:'5px',
                      paddingTop:'5px',borderTop:'1px solid #fecaca'}}>
                      RF = (C − <strong>γ_DC·DC</strong> − <strong>γ_DW·DW</strong>) / (<strong>γ_LL·LL</strong>·scale) — if DC/DW/LL are already factored results,
                      set the corresponding γ = 1.0 above.
                    </div>
                  </div>
                )}

                {/* Per-selector rows */}
                {[
                  {label:'Dead Load DC (structural)',hint:'Selfweight + DC1 + DC2 dead loads (unfactored)',
                   val:ratingDcLC, set:setRatingDcLC, info:dcInfo, gam:gamDC, gamLabel:'γ_DC', color:'#374151'},
                  {label:'Dead Load DW (wearing surface)',hint:'Wearing surface / utilities (unfactored)',
                   val:ratingDwLC, set:setRatingDwLC, info:dwInfo, gam:gamDW, gamLabel:'γ_DW', color:'#6b7280', optional:true},
                  {label:'Live Load — max (pos. moment)',hint:'Moving load (max) envelope — unfactored',
                   val:ratingLLposLC, set:setRatingLLposLC, info:llInfo, gam:gamLL, gamLabel:'γ_LL', color:'#1d4ed8'},
                  {label:'Live Load — min (neg. moment)',hint:'Moving load (min) — for continuous spans',
                   val:ratingLLnegLC, set:setRatingLLnegLC, info:getLcInfo(ratingLLnegLC), gam:gamLL, gamLabel:'γ_LL', color:'#7c3aed', optional:true},
                ].map(({label,hint,val,set:setter,info,gam,gamLabel,color,optional})=>(
                  <div key={label} style={{marginBottom:'12px'}}>
                    <div style={{fontSize:'10px',fontFamily:'monospace',color,marginBottom:'3px',fontWeight:'500'}}>
                      {label}{optional&&<span style={{color:'#d1d5db'}}> (optional)</span>}
                    </div>
                    <select style={{...INP,fontSize:'12px',
                      borderColor:info?.factored?'#fca5a5':info?.type==='static'||info?.type==='moving'?'#bbf7d0':'#e5e7eb'}}

                      <option value="">{optional?'— none —':'— select —'}</option>
                      {Object.entries(groupedLCs).map(([grp,lcs])=>lcs.length>0?(
                        <optgroup key={grp} label={grp}>{lcs.map(lc=><option key={lc} value={lc}>{lc}</option>)}</optgroup>
                      ):null)}
                    </select>
                    <LcStatus info={info} lcName={val} gam={gam} gamLabel={gamLabel}/>
                  </div>
                ))}
              </>);
            })()}

          {/* Resistance factors */}
          <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px',flex:'1',minWidth:'280px'}}>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'10px'}}>
              {/* Condition factor */}
              <div style={{gridColumn:'1/-1'}}>

                <select style={{...INP,fontSize:'12px'}} value={ratingCondKey} onChange={e=>setRatingCondKey(e.target.value)}>

              </div>
              {/* System factor */}
              <div style={{gridColumn:'1/-1'}}>
                <div style={{fontSize:'10px',fontFamily:'monospace',color:'#6b7280',marginBottom:'3px'}}>φ_s — System Factor (MBE Table 6A.4.2.3-1)</div>

                    <option key={k} value={k}>{k}{v!==null?' → φ_s = '+v:''}</option>
                  ))}

                                      <td style={{padding:'3px 6px',border:'1px solid #e5e7eb',textAlign:'right',fontWeight:'600'}}>{(it.grossA*dist).toFixed(3)}</td>
                                    </tr>

                                  <td colSpan="3" style={{padding:'3px 6px',border:'1px solid #e5e7eb',textAlign:'right'}}>Z<sub>x</sub> = </td>

                              </tfoot>
                            </table>
                          </div>
                        </details>
                      </div>
                    </div>);
                  })()}

                        <span style={{color:'#9ca3af'}}> &nbsp;(Sx_top={sec.SxTopG.toFixed(1)} · Sx_bot_net={sec.SxBotN.toFixed(1)} in³)</span>

        {((!ratingDcLC&&!ratingDwLC)||!ratingLLposLC||!capZones.length)?(

            Select at least one Dead Load case, a Live Load (max) case, and add at least one Capacity Zone above to compute rating factors.

        ):ratingData.length>0&&(<div>

          {/* ── Governing Summary Cards ── */}
          {govRating&&(
            <div style={{display:'flex',gap:'10px',flexWrap:'wrap',marginBottom:'14px'}}>
              {[
                {label:'Governing Location', value:`Node ${govRating.node} · ${govRating.pos.toFixed(2)} ft`,  color:'#374151'},
                {label:'Controls',           value:govRating.governs==='M+'?'M⁺ Flexure':govRating.governs==='M-'?'M⁻ Flexure':'Shear', color:'#1d4ed8'},
                {label:'AASHTO Rating RF',   value:govRating.rfGov.toFixed(3),  color:govRating.rfGov>=1?'#059669':govRating.rfGov>=0.3?'#d97706':'#dc2626'},
                {label:'Rating Tonnage',     value:`${govRating.rfTons.toFixed(1)} tons`, color:govRating.rfGov>=1?'#059669':'#dc2626'},
                {label:'Status',             value:govRating.rfGov>=1?'✓ Adequate':'❌ Posting Required', color:govRating.rfGov>=1?'#059669':'#dc2626'},
                {label:'φ_c · φ_s',         value:`${phiC} · ${phiS} = ${(phiC*phiS).toFixed(2)}`,         color:'#374151'},
                {label:'φMn⁺ (gov. node)',   value:`${govRating.CmnPos} ft·k`,  color:'#1d4ed8'},
                {label:'φVn (gov. node)',     value:`${govRating.Cvn} kips`,     color:'#dc2626'},
              ].map(({label,value,color})=>(
                <div key={label} style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'7px',padding:'8px 14px',boxShadow:'0 1px 3px rgba(0,0,0,0.04)',flex:'1',minWidth:'130px'}}>
                  <div style={{fontSize:'9.5px',fontFamily:'monospace',color:'#9ca3af',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:'2px'}}>{label}</div>
                  <div style={{fontSize:'13.5px',fontWeight:'700',color,fontFamily:'monospace'}}>{value}</div>

              ))}

          )}

          {/* ── RF Diagram ── */}
          <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',padding:'14px 16px',marginBottom:'14px',boxShadow:'0 1px 3px rgba(0,0,0,0.04)'}}>
            <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'8px',flexWrap:'wrap'}}>
              <span style={{fontSize:'13px',fontWeight:'600',color:'#111827'}}>Rating Factor RF Along Beam</span>
              <span style={{fontSize:'10px',fontFamily:'monospace',color:'#9ca3af'}}>{ratingMethod} · {ratingLimitState} · {ratingLevel} · γ_LL={gamLL} · LL×{ratingLLScale.toFixed(3)}</span>
              <div style={{marginLeft:'auto',display:'flex',gap:'8px',fontSize:'10px',fontFamily:'monospace'}}>
                <span style={{color:'#059669'}}>● M⁺</span>
                <span style={{color:'#7c3aed'}}>● M⁻</span>
                <span style={{color:'#dc2626'}}>● V</span>
                <span style={{color:'#d97706'}}>— RF=1.0</span>
              </div>
              <button onClick={()=>{
                const h=['Node','Pos (ft)','φMn+ (ft·k)','φMn- (ft·k)','φVn (kips)','RF M+','RF M-','RF V','RF Gov','Rating Tons','Controls'];
                const d=ratingData.map(r=>[r.node,r.pos.toFixed(2),r.CmnPos,r.CmnNeg,r.Cvn,r.rfMpos??'—',r.rfMneg??'—',r.rfV??'—',r.rfGov,r.rfTons,r.governs]);
                const csv=[h,...d].map(r=>r.join(',')).join('\n');
                const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rating_factors.csv';a.click();
              }} style={{background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:'4px',padding:'3px 8px',cursor:'pointer',fontSize:'11px',color:'#6b7280'}}>↓ CSV</button>
            </div>

            {/* Y-axis cap control */}
            <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px',
              padding:'6px 10px',background:'#f9fafb',borderRadius:'5px',border:'1px solid #e5e7eb',flexWrap:'wrap'}}>
              <span style={{fontSize:'10.5px',color:'#6b7280',fontFamily:'monospace'}}>Y-axis cap:</span>
              {[1.5, 2, 3, 5, null].map(v=>(
                <button key={v??'auto'} onClick={()=>setRfYMax(v)}
                  style={{padding:'3px 10px',borderRadius:'4px',border:`1px solid ${rfYMax===v?'#1d4ed8':'#e5e7eb'}`,
                    background:rfYMax===v?'#eff6ff':'#fff',
                    color:rfYMax===v?'#1d4ed8':'#6b7280',
                    fontSize:'11px',fontFamily:'monospace',cursor:'pointer',fontWeight:rfYMax===v?'700':'400'}}>
                  {v??'Auto'}
                </button>
              ))}
              <div style={{display:'flex',alignItems:'center',gap:'4px',marginLeft:'4px'}}>
                <span style={{fontSize:'10px',color:'#9ca3af',fontFamily:'monospace'}}>Custom:</span>
                <input type="number" min="1" max="20" step="0.5"
                  value={rfYMax??''} placeholder="auto"
                  onChange={e=>{
                    const v=parseFloat(e.target.value);
                    setRfYMax(isNaN(v)||v<=0 ? null : v);
                  }}
                  style={{...INP2,width:'64px',textAlign:'right',fontFamily:'monospace',fontSize:'11px'}}/>
              </div>
              {rfYMax!=null&&(()=>{
                const nClipped=ratingData.filter(p=>[p.rfMpos,p.rfMneg,p.rfV,p.rfGov].some(v=>v!=null&&v>rfYMax)).length;
                return nClipped>0?(
                  <span style={{fontSize:'10px',fontFamily:'monospace',color:'#d97706',
                    background:'#fffbeb',padding:'2px 7px',borderRadius:'99px',border:'1px solid #fde68a'}}>
                    {nClipped} value{nClipped!==1?'s':''} clipped — see tooltip for raw values
                  </span>
                ):null;
              })()}
              {rfYMax===null&&(
                <span style={{fontSize:'10px',fontFamily:'monospace',color:'#9ca3af',fontStyle:'italic'}}>
                  showing full range
                </span>
              )}
            </div>

            <div data-chartid="rating-chart" style={{height:'280px'}}>
              <RatingChart ratingData={ratingData} operatingData={operatingData} nodePositions={nodePositions} yMax={rfYMax}/>
            </div>
          </div>

          {/* ── Posting Check ── */}
          {govRating&&govRating.rfGov<1&&(()=>{
            // Per MBE §6A.8: posting RF for each vehicle must use that vehicle's own LL demands.
            // Since we only have one LL result case (from the rated vehicle), we scale LL demand
            // proportionally by gross weight: LL_v ≈ LL_rated × (W_v / W_rated).
            // RF_v = (C − γDC·DC − γDW·DW) / (γLL · LL_v · LLscale)
            // This is an approximation valid when vehicle geometry is similar; note accordingly.
            const POSTING_VEHICLES = [
              {label:'Type 3',   W:25},
              {label:'Type 3-3', W:40},
              {label:'Type 3S2', W:36},
            ];
            const W_rated = ratingVehicleTon || 36;

            // Per-node posting RFs (take governing node's demands)
            const gn = govRating;
            // Rebuild numerator for governing node (consistent with RF formula)
            // RF_rated = num / (gamLL * LL_rated * LLscale)  → num = RF_rated * gamLL * LL_rated * LLscale
            // RF_v = num / (gamLL * LL_v * LLscale) = RF_rated * LL_rated / LL_v = RF_rated * W_rated / W_v
            // → posting tons = RF_v * W_v = RF_rated * W_rated  (same for all! — the constant is C-DC-DW work)
            // More accurately for individual vehicles, also recompute per-node worst:
            const computePostRF = (W_v) => {
              if (!ratingData.length || W_rated<=0) return null;
              // Scale LL demands by weight ratio at each node, find governing RF
              const scaled = ratingData.map(p=>{
                const ratio = W_v / W_rated;
                const MllposV = p.Mllpos * ratio;
                const MllnegV = p.Mllneg * ratio;
                const VllV    = p.Vll    * ratio;
                const rfMpos = MllposV>0.001 ? (p.CmnPos - gamDC*Math.abs(p.Mdc) - gamDW*Math.abs(p.Mdw)) / (gamLL*MllposV*ratingLLScale) : null;
                const rfMneg = MllnegV>0.001 ? (p.CmnNeg - gamDC*Math.abs(p.Mdc) - gamDW*Math.abs(p.Mdw)) / (gamLL*MllnegV*ratingLLScale) : null;
                const rfV    = VllV>0.001    ? (p.Cvn    - gamDC*Math.abs(p.Vdc||0) - gamDW*Math.abs(p.Vdw||0)) / (gamLL*VllV*ratingLLScale) : null;
                return Math.min(...[rfMpos,rfMneg,rfV].filter(v=>v!==null&&isFinite(v)));
              }).filter(isFinite);
              return scaled.length ? Math.min(...scaled) : null;
            };

            return (
              <div style={{background:'#fef2f2',border:'2px solid #fca5a5',borderRadius:'8px',padding:'14px 16px',marginBottom:'14px'}}>
                <div style={{fontSize:'13px',fontWeight:'700',color:'#dc2626',marginBottom:'4px'}}>⚠ Load Posting Required — MBE Section 6A.8</div>
                <div style={{fontSize:'10.5px',color:'#dc2626',fontFamily:'monospace',marginBottom:'10px',opacity:0.8}}>
                  Operating rating RF and tonnage computed for each posting vehicle by scaling LL demands proportionally to gross weight.
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(165px,1fr))',gap:'8px'}}>
                  {POSTING_VEHICLES.map(({label,W})=>{
                    const rfV = computePostRF(W);
                    const postTons = rfV!==null ? rfV*W : null;
                    return (
                      <div key={label} style={{background:'#fff',border:'1px solid #fecaca',borderRadius:'6px',padding:'8px 12px'}}>
                        <div style={{fontSize:'10px',fontFamily:'monospace',color:'#9ca3af',marginBottom:'2px'}}>{label} · {W} T GVW</div>
                        <div style={{fontSize:'18px',fontWeight:'700',color:postTons!==null&&postTons>=W?'#059669':'#dc2626',fontFamily:'monospace'}}>
                          {postTons!==null?postTons.toFixed(1)+' T':'—'}
                        </div>
                        <div style={{fontSize:'9px',color:'#9ca3af',fontFamily:'monospace',marginTop:'1px'}}>
                          RF={rfV!==null?rfV.toFixed(3):'—'} · {postTons!==null&&postTons>=W?'✓ Adequate':'❌ Post'}
                        </div>
                      </div>
                    );
                  })}
                  {/* Also show rated vehicle for reference */}
                  <div style={{background:'#fff',border:'1px dashed #fca5a5',borderRadius:'6px',padding:'8px 12px'}}>
                    <div style={{fontSize:'10px',fontFamily:'monospace',color:'#9ca3af',marginBottom:'2px'}}>
                      {ratingVehicleName?.replace('AASHTO ','').slice(0,22)||'Rated Vehicle'} (rated)
                    </div>
                    <div style={{fontSize:'18px',fontWeight:'700',color:'#dc2626',fontFamily:'monospace'}}>
                      {govRating.rfTons.toFixed(1)} T
                    </div>
                    <div style={{fontSize:'9px',color:'#9ca3af',fontFamily:'monospace',marginTop:'1px'}}>
                      RF={govRating.rfGov.toFixed(3)} · {W_rated} T GVW
                    </div>
                  </div>
                </div>
                <div style={{marginTop:'8px',fontSize:'10.5px',color:'#92400e',fontFamily:'monospace',
                  background:'#fffbeb',padding:'6px 10px',borderRadius:'4px',border:'1px solid #fde68a'}}>
                  ⚠ Posting based on proportional LL scaling from rated vehicle demands. For definitive posting values,
                  run separate MIDAS analyses with each posting vehicle as the live load case.
                </div>
              </div>
            );
          })()}

          {/* ── Top Locations Table ── */}
          <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',overflow:'hidden'}}>
            <div style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 14px',background:'#f9fafb',borderBottom:'1px solid #e5e7eb'}}>
              <span style={{fontSize:'11.5px',fontWeight:'600',color:'#374151'}}>Critical Locations — Bottom 10 by RF (Governing)</span>
              <span style={{fontSize:'10px',fontFamily:'monospace',color:'#9ca3af',marginLeft:'auto'}}>
                Moment ft·k · Shear kips · γ_DC={gamDC} · γ_DW={gamDW} · γ_LL={gamLL}
              </span>
              <button onClick={()=>{
                const h=['Node','Pos (ft)',
                  'M_DC (ft·k)','M_DW (ft·k)','M_LL+ (ft·k)','M_LL- (ft·k)',
                  'V_DC (k)','V_DW (k)','V_LL (k)',
                  'φMn+','φMn-','φVn',
                  'RF M+','RF M-','RF Shear','RF Gov','Tons','Controls'];
                const d=[...ratingData].sort((a,b)=>a.rfGov-b.rfGov).slice(0,10).map(p=>[
                  p.node, p.pos.toFixed(2),
                  p.Mdc.toFixed(2), p.Mdw.toFixed(2), p.Mllpos.toFixed(2), p.Mllneg.toFixed(2),
                  p.Vdc.toFixed(2), p.Vdw.toFixed(2), p.Vll.toFixed(2),
                  p.CmnPos, p.CmnNeg, p.Cvn,
                  p.rfMpos?.toFixed(3)??'—', p.rfMneg?.toFixed(3)??'—', p.rfV?.toFixed(3)??'—',
                  p.rfGov.toFixed(3), p.rfTons.toFixed(1), p.governs,
                ]);
                const csv=[h,...d].map(r=>r.join(',')).join('\n');
                const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='critical_locations.csv';a.click();
              }} style={{background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:'4px',padding:'3px 8px',cursor:'pointer',fontSize:'11px',color:'#6b7280'}}>↓ CSV</button>
            </div>
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:'11px',fontFamily:'monospace'}}>
                <thead>
                  {/* Group header row */}
                  <tr style={{background:'#f9fafb'}}>
                    <th colSpan="2" style={{padding:'5px 8px',borderBottom:'1px solid #e5e7eb',borderRight:'1px solid #e5e7eb'}}/>
                    <th colSpan="4" style={{padding:'5px 8px',textAlign:'center',fontWeight:'600',color:'#374151',fontSize:'10px',background:'#f0f9ff',borderBottom:'1px solid #bfdbfe',borderRight:'1px solid #e5e7eb'}}>
                      Dead Load Moment (ft·k)
                    </th>
                    <th colSpan="3" style={{padding:'5px 8px',textAlign:'center',fontWeight:'600',color:'#374151',fontSize:'10px',background:'#fff7ed',borderBottom:'1px solid #fed7aa',borderRight:'1px solid #e5e7eb'}}>
                      Dead Load Shear (k)
                    </th>
                    <th colSpan="3" style={{padding:'5px 8px',textAlign:'center',fontWeight:'600',color:'#374151',fontSize:'10px',background:'#f0fdf4',borderBottom:'1px solid #bbf7d0',borderRight:'1px solid #e5e7eb'}}>
                      Capacity (φR_n)
                    </th>
                    <th colSpan="4" style={{padding:'5px 8px',textAlign:'center',fontWeight:'600',color:'#374151',fontSize:'10px',background:'#fdf4ff',borderBottom:'1px solid #e9d5ff',borderRight:'1px solid #e5e7eb'}}>
                      Rating Factor
                    </th>
                    <th colSpan="3" style={{padding:'5px 8px',borderBottom:'1px solid #e5e7eb'}}/>
                  </tr>
                  {/* Column header row */}
                  <tr style={{background:'#f9fafb'}}>
                    {[
                      {h:'Node',    bg:'#fff',  br:false},
                      {h:'Pos (ft)',bg:'#fff',  br:true},
                      {h:'M_DC',    bg:'#f0f9ff',br:false},
                      {h:'M_DW',    bg:'#f0f9ff',br:false},
                      {h:'M_LL⁺',   bg:'#f0f9ff',br:false},
                      {h:'M_LL⁻',   bg:'#f0f9ff',br:true},
                      {h:'V_DC',    bg:'#fff7ed',br:false},
                      {h:'V_DW',    bg:'#fff7ed',br:false},
                      {h:'V_LL',    bg:'#fff7ed',br:true},
                      {h:'φMn⁺',    bg:'#f0fdf4',br:false},
                      {h:'φMn⁻',    bg:'#f0fdf4',br:false},
                      {h:'φVn',     bg:'#f0fdf4',br:true},
                      {h:'RF M⁺',   bg:'#fdf4ff',br:false},
                      {h:'RF M⁻',   bg:'#fdf4ff',br:false},
                      {h:'RF V',    bg:'#fdf4ff',br:false},
                      {h:'RF Gov',  bg:'#fdf4ff',br:true},
                      {h:'Tons',    bg:'#fff',  br:false},
                      {h:'Controls',bg:'#fff',  br:false},
                      {h:'Status',  bg:'#fff',  br:false},
                    ].map(({h,bg,br})=>(
                      <th key={h} style={{padding:'5px 8px',textAlign:'left',fontWeight:'500',
                        color:'#6b7280',fontSize:'9.5px',borderBottom:'2px solid #e5e7eb',
                        whiteSpace:'nowrap',background:bg,
                        borderRight:br?'1px solid #e5e7eb':'none'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {[...ratingData].sort((a,b)=>a.rfGov-b.rfGov).slice(0,10).map(p=>{
                    const col=p.rfGov>=1?'#059669':p.rfGov>=0.3?'#d97706':'#dc2626';
                    const bg =p.rfGov>=1?'#f0fdf4':p.rfGov>=0.3?'#fffbeb':'#fef2f2';
                    const rfCol = v=>v!==null?(v<1?'#dc2626':'#059669'):'#d1d5db';
                    return <tr key={p.node} style={{borderBottom:'1px solid #f3f4f6',background:bg}}>
                      {/* Identity */}
                      <td style={{padding:'6px 8px',fontWeight:'600',color:'#111827'}}>{p.node}</td>
                      <td style={{padding:'6px 8px',borderRight:'1px solid #e5e7eb'}}>{p.pos.toFixed(2)}</td>
                      {/* Dead load moments */}
                      <td style={{padding:'6px 8px',background:'#f8fcff',color:'#374151'}}>{p.Mdc.toFixed(1)}</td>
                      <td style={{padding:'6px 8px',background:'#f8fcff',color:'#374151'}}>{p.Mdw.toFixed(1)}</td>
                      <td style={{padding:'6px 8px',background:'#f8fcff',color:'#059669',fontWeight:'500'}}>{p.Mllpos.toFixed(1)}</td>
                      <td style={{padding:'6px 8px',background:'#f8fcff',color:'#7c3aed',fontWeight:'500',borderRight:'1px solid #e5e7eb'}}>{p.Mllneg>0.01?p.Mllneg.toFixed(1):'—'}</td>
                      {/* Dead load shears */}
                      <td style={{padding:'6px 8px',background:'#fffaf5',color:'#374151'}}>{p.Vdc.toFixed(1)}</td>
                      <td style={{padding:'6px 8px',background:'#fffaf5',color:'#374151'}}>{p.Vdw.toFixed(1)}</td>
                      <td style={{padding:'6px 8px',background:'#fffaf5',color:'#059669',fontWeight:'500',borderRight:'1px solid #e5e7eb'}}>{p.Vll.toFixed(1)}</td>
                      {/* Capacity */}
                      <td style={{padding:'6px 8px',color:'#1d4ed8',background:'#f8fff8'}}>{p.CmnPos}</td>
                      <td style={{padding:'6px 8px',color:'#7c3aed',background:'#f8fff8'}}>{p.CmnNeg}</td>
                      <td style={{padding:'6px 8px',color:'#dc2626',background:'#f8fff8',borderRight:'1px solid #e5e7eb'}}>{p.Cvn}</td>
                      {/* RF */}
                      <td style={{padding:'6px 8px',color:rfCol(p.rfMpos),background:'#fdf8ff'}}>{p.rfMpos?.toFixed(3)??'—'}</td>
                      <td style={{padding:'6px 8px',color:rfCol(p.rfMneg),background:'#fdf8ff'}}>{p.rfMneg?.toFixed(3)??'—'}</td>
                      <td style={{padding:'6px 8px',color:rfCol(p.rfV),background:'#fdf8ff'}}>{p.rfV?.toFixed(3)??'—'}</td>
                      <td style={{padding:'6px 8px',fontWeight:'700',color:col,background:'#fdf8ff',borderRight:'1px solid #e5e7eb'}}>{p.rfGov.toFixed(3)}</td>
                      {/* Summary */}
                      <td style={{padding:'6px 8px',fontWeight:'600',color:col}}>{p.rfTons.toFixed(1)}</td>
                      <td style={{padding:'6px 8px',color:'#374151'}}>{p.governs==='M+'?'M⁺':p.governs==='M-'?'M⁻':'V'}</td>
                      <td style={{padding:'6px 8px'}}>
                        <span style={{fontSize:'9.5px',fontWeight:'600',color:col,background:'#fff',
                          padding:'2px 7px',borderRadius:'99px',border:`1px solid ${col}30`,whiteSpace:'nowrap'}}>
                          {p.rfGov>=1?'✓ OK':p.rfGov>=0.3?'⚠ Post':'❌ Critical'}
                        </span>
                      </td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>
            {/* Legend */}
            <div style={{padding:'6px 14px',background:'#f9fafb',borderTop:'1px solid #e5e7eb',
              fontSize:'9.5px',fontFamily:'monospace',color:'#9ca3af',display:'flex',gap:'16px',flexWrap:'wrap'}}>
              <span>M_DC = Dead Load DC moment</span>
              <span>M_DW = Dead Load DW moment</span>
              <span>M_LL = Live load envelope moment</span>
              <span>V = Shear counterparts</span>
              <span>All unfactored raw forces · φR_n = factored capacity</span>
            </div>
          </div>
        </div>)}
      </div>)}

            {/* ════ SUB-TAB: SUMMARY ════ */}
            {ratingSubTab==='summary'&&(<div>
              {/* ── Limit State Summary Table ── */}
              <div style={{background:'#fff',border:'1px solid #e5e7eb',borderRadius:'8px',
                overflow:'hidden',marginBottom:'14px'}}>
